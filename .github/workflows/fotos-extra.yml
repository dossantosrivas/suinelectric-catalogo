name: Fotos extra (diagnóstico)
on:
  push:
    branches: [fotos-extra]
    paths: ["scripts/fotos-extra*", ".github/workflows/fotos-extra.yml"]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --no-save playwright@1.48.2
      - run: xvfb-run -a node scripts/fotos-extra.js
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f salida; git commit -m "salida fotos extra" || exit 0
          git push origin HEAD:fotos-extra
