name: Automatroni (prueba)
on:
  push:
    branches: [automatroni-prueba]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install axios cheerio --no-save
      - run: DEPURAR=1 node scraper-automatroni.js --paginas 1
