name: Automatroni (diagnóstico)
on:
  push:
    branches: [automatroni-prueba]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install axios cheerio --no-save
      - run: node scripts/automatroni-diagnostico.js
