name: Actualizar catálogo diario

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Correr el scraper (catálogo completo)
        run: node scraper.js

      - name: Subir existencias reales a Supabase (solo las ven admins y clientes con permiso)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node subir-existencias.js

      - name: Registrar el scraping (historial de lo que bajó de existencias)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node registrar-scraping.js

      - name: Guardar productos.json y categorias.json (con reintentos)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Guardamos los archivos recién generados aparte. Sin importar qué
          # haya cambiado en el repo mientras el scraper trabajaba, siempre
          # vamos a partir de la versión más reciente de GitHub y pegar estos
          # dos archivos encima — así no hay nada que "mezclar" ni que pueda
          # generar un conflicto real.
          cp productos.json /tmp/productos.json
          cp categorias.json /tmp/categorias.json

          intentos=0
          maximo=5
          while [ $intentos -lt $maximo ]; do
            intentos=$((intentos + 1))

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/productos.json productos.json
            cp /tmp/categorias.json categorias.json

            # Catálogo liviano para la tienda + fotos en tu propio dominio.
            # La primera vez descarga todas las fotos (unos minutos); después
            # solo las nuevas (las ya bajadas siguen en la carpeta aunque
            # se haga el reset de arriba, porque aún no están en git).
            node generar-catalogo-tienda.js

            # Vistas previas para WhatsApp y redes (/p/… y /c/…), con la
            # tienda.html más reciente y los productos nuevos.
            node generar-vistas-previas.js

            git add productos.json categorias.json catalogo-tienda.json imagenes/productos imagenes/familias p c sitemap.xml

            if git diff --staged --quiet; then
              echo "Sin cambios que subir."
              break
            fi

            git commit -m "Actualización automática del catálogo $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git push origin HEAD:main; then
              echo "Subido correctamente en el intento $intentos."
              break
            fi

            echo "Push rechazado (intento $intentos de $maximo). Reintentando..."
            sleep 5
          done

      - name: Subir catálogo del asistente del chat a Supabase (sin precios)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node subir-catalogo-asistente.js

      - name: Avisar por Telegram si algo falló
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Sin secretos de Telegram: no se envía aviso."; exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Falló la actualización diaria del catálogo de la tienda. La tienda sigue con los datos de ayer. Detalles: ${ENLACE}" \
            -o /dev/null
