<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
// Una sola dirección para la tienda: la sesión se guarda por dominio, así que
// www.suinelectric.com o la dirección vieja de Netlify serían "otra tienda" sin sesión.
(function(){ var h = location.hostname;
  if (h === 'www.suinelectric.com' || /\.netlify\.app$/.test(h))
    location.replace('https://suinelectric.com' + location.pathname + location.search + location.hash);
})();
// Tema del panel (claro / oscuro / automático) antes de pintar, para que no parpadee.
(function(){ try { var t = localStorage.getItem('suin_admin_tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t); } catch (e) {} })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel web | Suinelectric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ================= Tema ================= */
  :root{
    --tinta:#0e2a3b; --tinta-2:#133649; --tinta-3:#1c4760;
    --azul:#0089af; --azul-texto:#006d8c; --azul-suave:#e6f4f8; --azul-borde:#a9d6e4;
    --amarillo:#ffc20e; --amarillo-suave:#fff4d6; --amarillo-texto:#8a5a00; --amarillo-borde:#f2d27a;
    --indigo-suave:#eef0ff; --indigo-texto:#3b44a8; --indigo-borde:#c9cff5;
    --fondo:#f2f4f6; --superficie:#ffffff; --superficie-2:#f8fafb; --campo:#ffffff;
    --linea:#dde3e8; --linea-suave:#edf0f3;
    --texto:#14222c; --texto-2:#475866; --texto-3:#6c7b87; --titulo:#0e2a3b;
    --enfasis:#0e2a3b; --enfasis-hover:#1c4760; --enfasis-texto:#ffffff; --enfasis-num:#ffc20e;
    --ok:#1b7f3b; --ok-suave:#e4f4e9; --ok-borde:#b4dcc1; --off:#b3261e; --off-suave:#fbe9e7; --off-borde:#efc0bb;
    --side:#0e2a3b; --side-activo:#1c4760;
    --radio:12px; --radio-chico:8px;
    --sombra:0 1px 2px rgba(14,42,59,.06), 0 1px 1px rgba(14,42,59,.03);
    --sombra-media:0 4px 14px rgba(14,42,59,.08);
    --sombra-alta:0 16px 40px rgba(14,42,59,.22);
    --velo:rgba(14,42,59,.42);
    --sans:'IBM Plex Sans','Segoe UI',Roboto,Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-tema="claro"]){
      --azul:#22a6cc; --azul-texto:#6fcfe9; --azul-suave:rgba(34,166,204,.15); --azul-borde:rgba(34,166,204,.4);
      --amarillo-suave:rgba(255,194,14,.13); --amarillo-texto:#ffd45e; --amarillo-borde:rgba(255,194,14,.4);
      --indigo-suave:rgba(129,140,248,.15); --indigo-texto:#a5b0ff; --indigo-borde:rgba(129,140,248,.4);
      --fondo:#0a141b; --superficie:#101e28; --superficie-2:#142532; --campo:#0c1922;
      --linea:#22394a; --linea-suave:#1a2e3c;
      --texto:#e3eaef; --texto-2:#b0bfca; --texto-3:#8597a4; --titulo:#f1f5f8;
      --enfasis:#ffc20e; --enfasis-hover:#ffd34d; --enfasis-texto:#0e2a3b; --enfasis-num:#0e2a3b;
      --ok:#4cc77a; --ok-suave:rgba(76,199,122,.14); --ok-borde:rgba(76,199,122,.4); --off:#ff8a80; --off-suave:rgba(255,138,128,.13); --off-borde:rgba(255,138,128,.4);
      --side:#08111a; --side-activo:#16303f;
      --sombra:0 1px 2px rgba(0,0,0,.3); --sombra-media:0 4px 14px rgba(0,0,0,.35); --sombra-alta:0 16px 40px rgba(0,0,0,.55);
      --velo:rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-tema="oscuro"]{
    --azul:#22a6cc; --azul-texto:#6fcfe9; --azul-suave:rgba(34,166,204,.15); --azul-borde:rgba(34,166,204,.4);
    --amarillo-suave:rgba(255,194,14,.13); --amarillo-texto:#ffd45e; --amarillo-borde:rgba(255,194,14,.4);
    --indigo-suave:rgba(129,140,248,.15); --indigo-texto:#a5b0ff; --indigo-borde:rgba(129,140,248,.4);
    --fondo:#0a141b; --superficie:#101e28; --superficie-2:#142532; --campo:#0c1922;
    --linea:#22394a; --linea-suave:#1a2e3c;
    --texto:#e3eaef; --texto-2:#b0bfca; --texto-3:#8597a4; --titulo:#f1f5f8;
    --enfasis:#ffc20e; --enfasis-hover:#ffd34d; --enfasis-texto:#0e2a3b; --enfasis-num:#0e2a3b;
    --ok:#4cc77a; --ok-suave:rgba(76,199,122,.14); --ok-borde:rgba(76,199,122,.4); --off:#ff8a80; --off-suave:rgba(255,138,128,.13); --off-borde:rgba(255,138,128,.4);
    --side:#08111a; --side-activo:#16303f;
    --sombra:0 1px 2px rgba(0,0,0,.3); --sombra-media:0 4px 14px rgba(0,0,0,.35); --sombra-alta:0 16px 40px rgba(0,0,0,.55);
    --velo:rgba(0,0,0,.55);
    color-scheme:dark;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:var(--sans); background:var(--fondo); color:var(--texto); font-size:14.5px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  button{ font:inherit; }
  a{ color:var(--azul-texto); }
  [hidden]{ display:none !important; }
  :focus-visible{ outline:2px solid var(--azul); outline-offset:2px; }
  ::selection{ background:var(--amarillo); color:#0e2a3b; }

  /* ================= Estructura ================= */
  .app{ display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; }
  .side{ background:var(--side); color:#fff; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:18px 12px 14px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.15) transparent; }
  .marca{ display:flex; align-items:center; gap:11px; padding:4px 10px 20px; }
  .marca-logo{ width:36px; height:36px; border-radius:9px; background:var(--amarillo); color:#0e2a3b; display:grid; place-items:center; font-weight:700; font-size:18px; flex:none; box-shadow:inset 0 -3px 0 rgba(0,0,0,.12); }
  .enlace-gestion{ display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:18px; border:1px solid var(--azul-borde); background:var(--azul-suave); border-radius:var(--radio-chico); color:var(--titulo); text-decoration:none; }
  .enlace-gestion:hover{ border-color:var(--azul); }
  .enlace-gestion svg{ width:18px; height:18px; color:var(--azul-texto); flex:none; }
  .enlace-gestion strong{ display:block; font-size:14px; }
  .enlace-gestion small{ display:block; color:var(--texto-3); font-size:12.5px; }
  .marca-img{ width:40px; height:40px; border-radius:50%; flex:none; }
  .apps{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin:0 2px 14px; padding:4px; background:rgba(255,255,255,.06); border-radius:10px; }
  .apps a{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px; border-radius:7px; color:rgba(255,255,255,.7); text-decoration:none; font-weight:600; font-size:12px; line-height:1.15; text-align:center; }
  .apps a svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .apps a:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .apps a.on{ background:var(--amarillo); color:#0e2a3b; }
  .marca-txt strong{ display:block; font-size:15px; letter-spacing:1.4px; }
  .marca-txt span{ font-size:11.5px; opacity:.6; letter-spacing:.2px; }
  .nav{ display:flex; flex-direction:column; gap:1px; }
  .nav-grupo{ font-size:10.5px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; color:rgba(255,255,255,.38); padding:16px 12px 6px; }
  .nav-grupo:first-child{ padding-top:2px; }
  .nav button, .nav a{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:none; color:rgba(255,255,255,.7); padding:9px 12px; border-radius:8px; cursor:pointer; font-weight:500; font-size:14.5px; transition:background .12s, color .12s; }
  .nav a{ text-decoration:none; }
  .nav button svg, .nav a svg{ width:18px; height:18px; flex:none; opacity:.8; }
  .nav button:hover, .nav a:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .nav button.activa, .nav a.activa{ background:var(--side-activo); color:#fff; box-shadow:inset 3px 0 0 var(--amarillo); }
  .nav button.activa svg, .nav a.activa svg{ opacity:1; color:var(--amarillo); }
  .nav .badge{ margin-left:auto; background:var(--amarillo); color:#0e2a3b; font-size:11.5px; font-weight:700; border-radius:10px; padding:1px 8px; min-width:22px; text-align:center; }
  .side-pie{ margin-top:auto; padding:14px 4px 0; font-size:12.5px; }
  .yo{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px; background:rgba(255,255,255,.05); margin-bottom:8px; }
  .yo .avatar{ width:32px; height:32px; font-size:12px; background:var(--amarillo); color:#0e2a3b; }
  .yo div{ min-width:0; }
  .yo strong{ display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .yo span{ display:block; opacity:.55; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side-pie .acciones{ display:grid; grid-template-columns:1fr 1fr auto; gap:6px; }
  .side-pie a, .side-pie button{ display:inline-flex; align-items:center; justify-content:center; gap:6px; color:#fff; background:rgba(255,255,255,.08); border:none; border-radius:8px; padding:8px 10px; font-size:13px; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .side-pie a svg, .side-pie button svg{ width:15px; height:15px; }
  .side-pie a:hover, .side-pie button:hover{ background:rgba(255,255,255,.16); }
  .contenido{ padding:30px 36px 64px; max-width:1260px; width:100%; }
  .cab{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; margin-bottom:22px; }
  .cab > div:first-child{ min-width:0; flex:1 1 380px; }
  .cab h1{ font-size:26px; margin:0; letter-spacing:-.4px; color:var(--titulo); line-height:1.2; }
  .cab p{ margin:6px 0 0; color:var(--texto-3); font-size:14px; max-width:72ch; line-height:1.5; }
  .cab .acc{ display:flex; gap:8px; flex-wrap:wrap; }

  /* Barra superior y menú en celular */
  .topbar{ display:none; }
  .velo-menu{ display:none; }

  /* ================= Piezas ================= */
  .caja{ background:var(--superficie); border:1px solid var(--linea); border-radius:var(--radio); box-shadow:var(--sombra); padding:20px 22px; margin-bottom:18px; }
  .caja-cab{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .caja h2{ font-size:16px; margin:0; color:var(--titulo); letter-spacing:-.1px; }
  .caja h2 small{ font-weight:600; color:var(--texto-3); font-size:12px; margin-left:6px; background:var(--linea-suave); border-radius:10px; padding:1px 8px; vertical-align:2px; }
  .caja .sub{ margin:-8px 0 14px; color:var(--texto-3); font-size:13.5px; }
  .grid-2{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:18px; align-items:start; }
  .grid-2 > .caja{ margin-bottom:0; }
  .apilar > * + *{ margin-top:16px; }
  .fila{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  label.campo{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:600; color:var(--texto-2); }
  input, select, textarea{ font:inherit; font-size:14.5px; height:40px; padding:0 12px; border:1px solid var(--linea); border-radius:var(--radio-chico); background:var(--campo); color:var(--texto); min-width:0; width:100%; transition:border-color .12s, box-shadow .12s; }
  textarea{ height:auto; padding:9px 12px; resize:vertical; line-height:1.45; }
  input::placeholder, textarea::placeholder{ color:var(--texto-3); opacity:.8; }
  input:hover, select:hover, textarea:hover{ border-color:color-mix(in srgb, var(--linea) 60%, var(--texto-3)); }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--azul); box-shadow:0 0 0 3px color-mix(in srgb, var(--azul) 18%, transparent); }
  input[readonly]{ background:var(--superficie-2); color:var(--texto-2); }
  .buscar{ position:relative; }
  .buscar svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--texto-3); pointer-events:none; }
  .buscar input{ padding-left:34px; min-width:240px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:600; font-size:14px; height:40px; padding:0 15px; border-radius:var(--radio-chico); border:1px solid var(--linea); background:var(--superficie); color:var(--texto); cursor:pointer; white-space:nowrap; text-decoration:none; transition:background .12s, border-color .12s, color .12s; }
  .btn svg{ width:16px; height:16px; flex:none; }
  .btn:hover{ border-color:var(--azul); color:var(--azul-texto); }
  .btn.prim{ background:var(--enfasis); color:var(--enfasis-texto); border-color:var(--enfasis); }
  .btn.prim:hover{ background:var(--enfasis-hover); border-color:var(--enfasis-hover); color:var(--enfasis-texto); }
  .btn.acento{ background:var(--amarillo); border-color:var(--amarillo); color:#0e2a3b; }
  .btn.peligro{ color:var(--off); }
  .btn.peligro:hover{ border-color:var(--off); color:var(--off); background:var(--off-suave); }
  .btn.peligro-lleno{ background:var(--off); border-color:var(--off); color:#fff; }
  .btn.peligro-lleno:hover{ filter:brightness(1.08); color:#fff; }
  .btn.chico{ height:32px; padding:0 11px; font-size:13px; }
  .btn.icono{ width:32px; padding:0; }
  .btn.fantasma{ border-color:transparent; background:none; }
  .btn.fantasma:hover{ background:var(--linea-suave); color:var(--texto); }
  .btn:disabled{ opacity:.5; cursor:default; }

  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; border-radius:20px; padding:2px 10px; background:var(--linea-suave); color:var(--texto-2); white-space:nowrap; }
  .pill.azul{ background:var(--azul-suave); color:var(--azul-texto); }
  .pill.verde{ background:var(--ok-suave); color:var(--ok); }
  .pill.rojo{ background:var(--off-suave); color:var(--off); }
  .pill.amar{ background:var(--amarillo-suave); color:var(--amarillo-texto); }
  .pill.indigo{ background:var(--indigo-suave); color:var(--indigo-texto); }
  .pill.tinta{ background:var(--enfasis); color:var(--enfasis-texto); }
  .pill .punto{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .muted{ color:var(--texto-3); font-size:13px; }
  .mono{ font-family:var(--mono); font-size:13px; }
  .error{ color:var(--off); font-size:13.5px; min-height:1em; margin:8px 0 0; }
  .ayuda{ font-size:13.5px; color:var(--texto-2); background:var(--superficie-2); border:1px solid var(--linea-suave); border-radius:var(--radio-chico); padding:11px 13px; margin:0 0 14px; line-height:1.55; }
  .aviso{ display:flex; gap:10px; align-items:flex-start; background:var(--amarillo-suave); color:var(--amarillo-texto); border-radius:var(--radio-chico); padding:11px 13px; font-size:13.5px; line-height:1.5; margin-bottom:14px; }
  .aviso.azul{ background:var(--azul-suave); color:var(--azul-texto); }
  /* Resumen: lo pendiente en Gestión */
  .aviso.hoy{ align-items:center; flex-wrap:wrap; gap:4px 12px; text-decoration:none; border:1px solid var(--amarillo-borde); font-size:14px; }
  .aviso.hoy strong{ font-size:15.5px; color:var(--titulo); }
  .aviso.hoy .ir{ margin-left:auto; font-weight:600; color:var(--azul-texto); }
  .aviso.hoy:hover{ border-color:var(--amarillo); }
  .aviso svg{ width:18px; height:18px; flex:none; margin-top:1px; }
  .vacio{ text-align:center; padding:36px 10px; color:var(--texto-3); }
  .vacio svg{ width:34px; height:34px; opacity:.4; display:block; margin:0 auto 10px; }

  /* Chips de filtro */
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ border:1px solid var(--linea); background:var(--superficie); color:var(--texto-2); border-radius:20px; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; gap:7px; align-items:center; transition:background .12s, border-color .12s; }
  .chip b{ font-weight:700; color:var(--texto-3); font-size:12px; }
  .chip:hover{ border-color:var(--azul); }
  .chip.activo{ background:var(--enfasis); border-color:var(--enfasis); color:var(--enfasis-texto); }
  .chip.activo b{ color:var(--enfasis-num); }
  .chip svg{ flex:none; }

  /* Tablas */
  .tabla-wrap{ overflow-x:auto; margin:0 -22px; padding:0 22px; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--texto-3); font-weight:600; padding:9px 10px; background:var(--superficie-2); border-top:1px solid var(--linea-suave); border-bottom:1px solid var(--linea); white-space:nowrap; }
  th:first-child{ border-top-left-radius:6px; } th:last-child{ border-top-right-radius:6px; }
  td{ padding:11px 10px; border-bottom:1px solid var(--linea-suave); vertical-align:middle; }
  tbody tr{ transition:background .1s; }
  tbody tr:hover td{ background:var(--superficie-2); }
  tbody tr:last-child td{ border-bottom:none; }
  tr.inactivo td:not(:last-child){ opacity:.5; }
  td.acciones{ text-align:right; white-space:nowrap; }
  .persona{ display:flex; align-items:center; gap:11px; min-width:210px; }
  .avatar{ width:36px; height:36px; border-radius:50%; background:var(--azul-suave); color:var(--azul-texto); display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; letter-spacing:.3px; }
  .avatar svg{ width:18px; height:18px; }
  .avatar.admin{ background:var(--tinta); color:var(--amarillo); }
  .persona strong{ display:block; font-weight:600; }
  .persona span{ color:var(--texto-3); font-size:12.5px; }

  /* Interruptor */
  .switch{ display:flex; align-items:flex-start; gap:12px; cursor:pointer; }
  .switch input{ position:absolute; opacity:0; width:1px; height:1px; }
  .sw{ width:40px; height:23px; border-radius:20px; background:color-mix(in srgb, var(--texto-3) 45%, var(--linea)); position:relative; flex:none; transition:background .15s; margin-top:1px; }
  .sw::after{ content:''; position:absolute; top:3px; left:3px; width:17px; height:17px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s; }
  .switch input:checked + .sw{ background:var(--ok); }
  .switch input:checked + .sw::after{ transform:translateX(17px); }
  .switch input:focus-visible + .sw{ box-shadow:0 0 0 3px color-mix(in srgb, var(--azul) 35%, transparent); }
  .switch input:disabled + .sw{ opacity:.55; }
  .sw-txt strong{ display:block; font-size:14px; font-weight:600; color:var(--texto); }
  .sw-txt small{ display:block; font-size:12.5px; color:var(--texto-3); margin-top:1px; }
  .switch.solo{ align-items:center; }

  /* KPIs */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi{ background:var(--superficie); border:1px solid var(--linea); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px 18px 15px; display:flex; flex-direction:column; gap:3px; cursor:default; text-align:left; font:inherit; color:inherit; position:relative; overflow:hidden; min-width:0; }
  button.kpi{ cursor:pointer; transition:border-color .12s, transform .12s, box-shadow .12s; }
  button.kpi:hover{ border-color:var(--azul); box-shadow:var(--sombra-media); transform:translateY(-1px); }
  .kpi .k-cab{ display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--texto-3); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; line-height:1.3; }
  .kpi .k-cab svg{ width:30px; height:30px; padding:6px; border-radius:8px; background:var(--azul-suave); color:var(--azul-texto); flex:none; }
  .kpi .k-num{ font-size:28px; font-weight:700; color:var(--titulo); letter-spacing:-.6px; line-height:1.15; margin-top:4px; font-variant-numeric:tabular-nums; }

  .lista-simple{ list-style:none; margin:0; padding:0; }
  .lista-simple li{ display:flex; align-items:center; gap:12px; padding:11px 8px; margin:0 -8px; border-bottom:1px solid var(--linea-suave); border-radius:8px; }
  .lista-simple li:last-child{ border-bottom:none; }
  .lista-simple li[data-ver-pedido]:hover, .lista-simple li[data-ver-cliente]:hover{ background:var(--superficie-2); }
  .lista-simple .der{ margin-left:auto; text-align:right; }

  /* Embudo de pedidos (Resumen) */
  .embudo{ display:flex; height:12px; border-radius:7px; overflow:hidden; background:var(--linea-suave); gap:2px; }
  .embudo i{ display:block; height:100%; min-width:6px; }
  .embudo-ley{ display:flex; flex-wrap:wrap; gap:8px 6px; margin-top:12px; }
  .embudo-ley button{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--linea); background:var(--superficie); color:var(--texto-2); border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; }
  .embudo-ley button:hover{ border-color:var(--azul); }
  .embudo-ley button i{ width:9px; height:9px; border-radius:3px; }
  .embudo-ley button b{ color:var(--titulo); font-variant-numeric:tabular-nums; }
  .c-enviado{ background:var(--amarillo); } .c-cotizado{ background:var(--azul); } .c-aprobado{ background:#6d78e0; }
  .c-pagado{ background:#3b44a8; } .c-entregado{ background:var(--ok); } .c-cancelado{ background:var(--off); }

  /* Pedidos */
  .pedidos{ display:flex; flex-direction:column; gap:12px; }
  .pedido{ background:var(--superficie); border:1px solid var(--linea); border-left:4px solid var(--linea); border-radius:var(--radio); box-shadow:var(--sombra); overflow:hidden; }
  .pedido.e-enviado{ border-left-color:var(--amarillo); }
  .pedido.e-cotizado{ border-left-color:var(--azul); }
  .pedido.e-aprobado{ border-left-color:#6d78e0; }
  .pedido.e-pagado{ border-left-color:#3b44a8; }
  .pedido.e-entregado{ border-left-color:var(--ok); }
  .pedido.e-cancelado{ border-left-color:var(--off); }
  .pd-cab{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid var(--linea-suave); flex-wrap:wrap; }
  .pd-cab .persona{ min-width:0; flex:1 1 260px; }
  .pd-cab .persona > div:last-child{ min-width:0; }
  .pd-cab .persona span{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pd-num{ display:flex; align-items:center; gap:10px; }
  .pd-num strong{ font-size:16px; color:var(--titulo); font-variant-numeric:tabular-nums; }
  .pd-total{ font-size:20px; font-weight:700; color:var(--titulo); font-variant-numeric:tabular-nums; text-align:right; line-height:1.15; }
  .pd-total small{ display:block; font-size:12px; font-weight:500; color:var(--texto-3); }
  .pd-cuerpo{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); }
  .pd-cuerpo > div{ padding:14px 18px; min-width:0; }
  .pd-cuerpo > div + div{ border-left:1px solid var(--linea-suave); background:var(--superficie-2); }
  .items{ margin:0; padding:0; list-style:none; font-size:13.5px; }
  .items li{ display:flex; gap:10px; padding:5px 0; border-bottom:1px dashed var(--linea-suave); align-items:baseline; }
  .items li:last-child{ border-bottom:none; }
  .items .can{ color:var(--texto-3); min-width:30px; font-variant-numeric:tabular-nums; }
  .items .mono{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .items .pre{ margin-left:auto; white-space:nowrap; color:var(--texto-2); font-variant-numeric:tabular-nums; }
  .estado-sel{ font-weight:600; height:32px; font-size:13px; width:auto; padding:0 28px 0 10px; border-radius:20px; }
  .estado-sel.e-enviado{ background-color:var(--amarillo-suave); border-color:var(--amarillo-borde); color:var(--amarillo-texto); }
  .estado-sel.e-cotizado{ background-color:var(--azul-suave); border-color:var(--azul-borde); color:var(--azul-texto); }
  .estado-sel.e-aprobado, .estado-sel.e-pagado{ background-color:var(--indigo-suave); border-color:var(--indigo-borde); color:var(--indigo-texto); }
  .estado-sel.e-entregado{ background-color:var(--ok-suave); border-color:var(--ok-borde); color:var(--ok); }
  .estado-sel.e-cancelado{ background-color:var(--off-suave); border-color:var(--off-borde); color:var(--off); }
  .estado-sel option{ background:var(--superficie); color:var(--texto); }
  .nota-wrap{ display:flex; flex-direction:column; gap:8px; }
  .nota-wrap textarea{ min-height:62px; font-size:13.5px; }
  .nota-fila{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pd-pie{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:10px 18px; border-top:1px solid var(--linea-suave); }
  .pd-pie .der{ margin-left:auto; display:flex; gap:6px; }
  .pd-acciones .btn svg, .pd-pie .btn svg{ width:15px; height:15px; }
  .pedido.archivado{ opacity:.85; }
  .pd-num .abrir{ background:none; border:none; padding:0; cursor:pointer; font:inherit; color:var(--titulo); }
  .pd-num .abrir strong{ text-decoration:underline; text-decoration-color:var(--linea); text-underline-offset:3px; }
  .pd-num .abrir:hover strong{ color:var(--azul-texto); text-decoration-color:currentColor; }
  .items li.mas{ color:var(--azul-texto); cursor:pointer; border-bottom:none; font-weight:600; }
  .chip.sep{ margin-left:6px; }
  .nota-cli{ margin-top:10px; font-size:13px; color:var(--texto-2); background:var(--amarillo-suave); border-radius:8px; padding:8px 11px; line-height:1.5; }
  .nota-cli strong{ color:var(--amarillo-texto); }

  /* Actividad por cliente */
  .ranking li.clic{ cursor:pointer; }
  /* Visitantes */
  .tabla-vis tr.clic{ cursor:pointer; }
  .tabla-vis td{ vertical-align:top; font-size:13.5px; }
  .tabla-vis tr.clic:hover td:first-child strong{ color:var(--azul-texto); }
  .vis-act .pill{ margin:0 3px 3px 0; }
  .vis-cabv{ font-weight:500; color:var(--texto-3); font-size:12.5px; margin-top:2px; text-transform:none; letter-spacing:0; }
  .vis-tarj{ margin-top:4px; font-size:12.5px; }
  .vis-tarj summary{ cursor:pointer; color:var(--azul-texto); }
  .vis-tarj a.mono{ display:inline-block; margin:3px 8px 0 0; }
  .vis-modelos{ display:flex; flex-wrap:wrap; gap:6px 12px; font-size:13px; }
  .vis-modelos a.mono{ text-decoration:none; }
  .vis-modelos b{ color:var(--texto-3); font-size:12px; }
  .ranking li.clic:hover .nom strong{ color:var(--azul-texto); }
  .ranking .nom strong{ font-weight:600; }
  .act-linea{ list-style:none; margin:0; padding:0; }
  .act-dia{ font-size:12px; font-weight:700; color:var(--texto-3); padding:16px 0 6px; border-bottom:1px solid var(--linea); text-transform:uppercase; letter-spacing:.4px; }
  .act-dia:first-child{ padding-top:0; }
  .act-ev{ display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:10px; align-items:start; padding:8px 0; border-bottom:1px dashed var(--linea-suave); font-size:13.5px; }
  .act-ev svg{ width:16px; height:16px; color:var(--texto-3); margin-top:2px; }
  .act-ev.t-agregar_carrito svg, .act-ev.t-cotizar_whatsapp svg, .act-ev.t-pedido_whatsapp svg{ color:var(--ok); }
  .act-ev time{ color:var(--texto-3); font-size:12.5px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .act-ev a.mono{ text-decoration:none; font-weight:500; }

  /* Detalle del pedido (panel lateral ancho) */
  .panel.ancho{ width:min(760px,100%); }
  .panel .kpis{ grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; }
  .det-datos{ display:grid; grid-template-columns:1fr 1fr; gap:12px 18px; font-size:14px; }
  .det-datos div span{ display:block; font-size:11px; color:var(--texto-3); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
  .det-items{ list-style:none; margin:0; padding:0; }
  .det-items li{ display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:12px; padding:12px 0; border-bottom:1px solid var(--linea-suave); align-items:start; }
  .det-items li:last-child{ border-bottom:none; }
  .det-img{ width:56px; height:56px; border:1px solid var(--linea); border-radius:8px; background:#fff; display:grid; place-items:center; overflow:hidden; color:#6c7b87; }
  .det-img img{ width:100%; height:100%; object-fit:contain; }
  .det-img svg{ width:22px; height:22px; opacity:.5; }
  .det-mod{ font-family:var(--mono); font-size:13.5px; font-weight:500; }
  .det-mod a{ text-decoration:none; }
  .det-mod a:hover{ text-decoration:underline; }
  .det-desc{ font-size:13.5px; color:var(--texto-2); margin-top:3px; line-height:1.45; }
  .det-cat{ font-size:12px; color:var(--texto-3); margin-top:4px; }
  .det-num{ text-align:right; font-size:13.5px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .det-num strong{ display:block; font-size:15px; color:var(--titulo); }
  .det-num small{ display:block; color:var(--texto-3); font-size:12px; }
  .det-total{ display:flex; justify-content:space-between; align-items:baseline; border-top:2px solid var(--titulo); margin-top:6px; padding-top:12px; }
  .det-total strong{ font-size:22px; color:var(--titulo); font-variant-numeric:tabular-nums; }
  @media (max-width:560px){
    .det-datos{ grid-template-columns:1fr; }
    .det-items li{ grid-template-columns:44px minmax(0,1fr); }
    .det-img{ width:44px; height:44px; }
    .det-num{ grid-column:2; text-align:left; }
  }

  /* Descuentos */
  .paso{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--enfasis); color:var(--enfasis-texto); font-size:11.5px; margin-right:6px; }
  .resumen{ margin-top:14px; padding:12px 14px; border-left:4px solid var(--azul); background:var(--azul-suave); border-radius:6px; font-size:14px; line-height:1.6; }
  .resumen:empty{ display:none; }
  .prueba-res{ font-size:14.5px; margin-top:14px; line-height:1.5; }
  .prueba-res:not(:empty){ padding:14px; border-radius:var(--radio-chico); background:var(--superficie-2); border:1px solid var(--linea-suave); }
  .prueba-res .precio{ font-size:28px; font-weight:700; color:var(--titulo); display:block; margin:4px 0; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }

  /* Existencias */
  .muestras{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .muestra{ border:1px solid var(--linea); border-radius:var(--radio); padding:14px 16px; }
  .muestra.con-permiso{ border-color:var(--ok-borde); background:var(--ok-suave); }
  .muestra.con-permiso h3{ color:var(--ok); }
  .muestra h3{ margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--texto-3); display:flex; align-items:center; gap:8px; }
  .muestra h3 svg{ width:16px; height:16px; }
  .muestra ul{ list-style:none; margin:0; padding:0; font-size:13.5px; }
  .muestra li{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--linea-suave); }
  .muestra li:last-child{ border-bottom:none; }
  .muestra li span:first-child{ color:var(--texto-3); }
  .estado-stock{ font-weight:600; font-size:12.5px; border-radius:6px; padding:2px 8px; }
  .estado-stock.ok{ background:var(--ok-suave); color:var(--ok); }
  .estado-stock.off{ background:var(--off-suave); color:var(--off); }
  .permisos li{ padding:13px 8px; }
  .tarjeta-sync{ display:flex; align-items:center; gap:14px; }
  a.lnk{ color:var(--azul-texto); text-decoration:none; border-bottom:1px dotted color-mix(in srgb, var(--azul-texto) 45%, transparent); }
  a.lnk:hover{ border-bottom-style:solid; }
  strong a.lnk{ font-weight:inherit; }
  a.ir-prod{ display:inline-grid; place-items:center; width:22px; height:22px; border-radius:6px; color:var(--azul-texto); vertical-align:-5px; margin-left:2px; }
  a.ir-prod:hover{ background:var(--azul-suave); }
  a.ir-prod svg{ width:14px; height:14px; }
  .tarjeta-sync .icono{ width:44px; height:44px; border-radius:11px; display:grid; place-items:center; background:var(--ok-suave); color:var(--ok); flex:none; }
  .tarjeta-sync .icono.mal{ background:var(--amarillo-suave); color:var(--amarillo-texto); }
  .tarjeta-sync .icono svg{ width:22px; height:22px; }

  /* Gráficos */
  .grafico{ display:flex; align-items:flex-end; gap:3px; height:180px; padding:10px 0 0; border-bottom:1px solid var(--linea);
    background-image:linear-gradient(to top, var(--linea-suave) 1px, transparent 1px); background-size:100% 25%; background-position:0 100%; }
  .grafico .col{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:stretch; height:100%; position:relative; min-width:4px; border-radius:4px 4px 0 0; }
  .grafico .col:hover{ background:color-mix(in srgb, var(--azul) 7%, transparent); }
  .grafico .b1{ background:color-mix(in srgb, var(--azul) 28%, var(--superficie)); border-radius:4px 4px 0 0; position:relative; transition:background .12s; }
  .grafico .b2{ background:var(--azul); border-radius:3px 3px 0 0; position:absolute; bottom:0; left:24%; right:24%; }
  .grafico .col:hover .b1{ background:color-mix(in srgb, var(--azul) 45%, var(--superficie)); }
  .grafico .col[data-tip]:hover::after{ content:attr(data-tip); position:absolute; bottom:calc(100% + 4px); left:50%; transform:translateX(-50%); background:var(--tinta); color:#fff; font-size:12px; font-weight:500; padding:5px 9px; border-radius:6px; white-space:nowrap; pointer-events:none; z-index:2; box-shadow:var(--sombra-media); }
  .grafico .col[data-tip]:first-child:hover::after, .grafico .col[data-tip]:nth-child(2):hover::after{ left:0; transform:none; }
  .grafico .col[data-tip]:last-child:hover::after, .grafico .col[data-tip]:nth-last-child(2):hover::after{ left:auto; right:0; transform:none; }
  .grafico-ejes{ display:flex; gap:3px; font-size:11px; color:var(--texto-3); margin-top:6px; font-variant-numeric:tabular-nums; }
  .grafico-ejes span{ flex:1; text-align:center; min-width:4px; overflow:visible; white-space:nowrap; }
  .leyenda{ display:flex; gap:16px; font-size:12.5px; color:var(--texto-2); flex-wrap:wrap; }
  .leyenda i{ display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .ranking{ list-style:none; margin:0; padding:0; }
  .ranking li{ display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--linea-suave); font-size:14px; }
  .ranking li:last-child{ border-bottom:none; }
  .ranking .pos{ color:var(--texto-3); font-size:12px; text-align:right; font-variant-numeric:tabular-nums; }
  .ranking .nom{ overflow:hidden; }
  .ranking .nom a{ text-decoration:none; font-weight:600; }
  .ranking .nom small{ display:block; color:var(--texto-3); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ranking .barra{ height:4px; background:var(--linea-suave); border-radius:3px; margin-top:6px; }
  .ranking .barra i{ display:block; height:100%; background:var(--azul); border-radius:3px; }
  .ranking .num{ font-weight:700; color:var(--titulo); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ranking .num small{ display:block; font-weight:500; color:var(--texto-3); font-size:11.5px; }

  /* Panel lateral */
  .velo{ position:fixed; inset:0; background:var(--velo); z-index:20; opacity:0; pointer-events:none; transition:opacity .18s; }
  .velo.ver{ opacity:1; pointer-events:auto; }
  .panel{ position:fixed; top:0; right:0; bottom:0; width:min(480px,100%); background:var(--superficie); z-index:21; transform:translateX(100%); visibility:hidden; transition:transform .22s ease, visibility 0s linear .22s; display:flex; flex-direction:column; }
  .panel.ver{ transform:none; visibility:visible; box-shadow:var(--sombra-alta); transition:transform .22s ease; }
  .panel-cab{ padding:18px 22px; border-bottom:1px solid var(--linea); display:flex; align-items:center; gap:12px; }
  .panel-cab h2{ margin:0; font-size:17px; color:var(--titulo); }
  .panel-cab .cerrar{ margin-left:auto; }
  .panel-cuerpo{ padding:20px 22px; overflow-y:auto; flex:1; }
  .panel-pie{ padding:14px 22px; border-top:1px solid var(--linea); display:flex; gap:8px; flex-wrap:wrap; background:var(--superficie-2); }
  .seccion{ margin-bottom:24px; }
  .seccion h3{ font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--texto-3); margin:0 0 10px; }
  .campos{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .campos .ancho{ grid-column:1 / -1; }
  .interruptores{ display:flex; flex-direction:column; gap:14px; background:var(--superficie-2); border:1px solid var(--linea-suave); border-radius:var(--radio-chico); padding:14px; }
  .zona-peligro{ border:1px solid var(--off-borde); border-radius:var(--radio-chico); padding:14px; }

  /* Diálogo de confirmación */
  .dialogo{ position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:16px; background:var(--velo); animation:aparecer .15s ease; }
  .dialogo-caja{ background:var(--superficie); border:1px solid var(--linea); border-radius:14px; box-shadow:var(--sombra-alta); width:min(440px,100%); padding:22px; animation:subir .18s ease; }
  .dialogo-caja .d-icono{ width:42px; height:42px; border-radius:11px; display:grid; place-items:center; background:var(--azul-suave); color:var(--azul-texto); margin-bottom:14px; }
  .dialogo-caja .d-icono.peligro{ background:var(--off-suave); color:var(--off); }
  .dialogo-caja .d-icono svg{ width:22px; height:22px; }
  .dialogo-caja h2{ margin:0 0 8px; font-size:18px; color:var(--titulo); }
  .dialogo-caja p{ margin:0 0 6px; color:var(--texto-2); font-size:14px; line-height:1.55; white-space:pre-line; }
  .dialogo-caja label.campo{ margin-top:14px; }
  .dialogo-pie{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; flex-wrap:wrap; }
  @keyframes aparecer{ from{ opacity:0; } }
  @keyframes subir{ from{ opacity:0; transform:translateY(8px) scale(.98); } }

  /* Entrada */
  .entrada{ min-height:100vh; display:grid; place-items:center; padding:20px; background:radial-gradient(1200px 600px at 20% -10%, #1c4760 0%, transparent 60%), linear-gradient(160deg, #0e2a3b 0%, #08161f 100%); }
  .entrada .caja{ width:min(420px,100%); padding:30px; border:none; box-shadow:var(--sombra-alta); }
  .entrada .caja h2{ color:var(--titulo); }
  .entrada .marca{ padding:0 0 20px; color:var(--titulo); }
  .entrada .marca-txt span{ opacity:1; color:var(--texto-3); }
  .entrada form{ display:flex; flex-direction:column; gap:12px; }

  #toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--tinta); color:#fff; padding:11px 18px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:60; box-shadow:var(--sombra-alta); border:1px solid rgba(255,255,255,.08); max-width:calc(100vw - 32px); }
  #toast.ver{ opacity:1; transform:translateX(-50%); }

  /* Cargando: esqueleto animado */
  .cargando{ padding:0; color:transparent; font-size:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:14px; }
  .cargando::before, .cargando::after{ content:''; height:112px; border-radius:var(--radio); background:linear-gradient(90deg, var(--linea-suave) 0%, var(--superficie-2) 50%, var(--linea-suave) 100%); background-size:200% 100%; animation:brillo 1.2s linear infinite; }
  .cargando::after{ grid-column:1 / -1; height:240px; }

/* Diálogo de confirmación con el estilo del panel (en vez de confirm/prompt del navegador).
   confirmar({ titulo, texto, boton, peligro, escribir }) → Promise<boolean> */
function confirmar(o){
  return new Promise(res => {
    const d = document.createElement('div');
    d.className = 'dialogo'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
    d.innerHTML = '<form class="dialogo-caja"><div class="d-icono' + (o.peligro ? ' peligro' : '') + '">' + (o.peligro ? ICO.alerta : ICO.info) + '</div>' +
      '<h2>' + esc(o.titulo) + '</h2>' + (o.texto ? '<p>' + esc(o.texto) + '</p>' : '') +
      (o.escribir ? '<label class="campo">Escribe ' + esc(o.escribir) + ' para confirmar<input name="conf" autocomplete="off" autocapitalize="characters"></label>' : '') +
      '<div class="dialogo-pie"><button type="button" class="btn" data-no>Cancelar</button><button class="btn ' + (o.peligro ? 'peligro-lleno' : 'prim') + '"' + (o.escribir ? ' disabled' : '') + '>' + esc(o.boton || 'Aceptar') + '</button></div></form>';
    document.body.appendChild(d);
    const f = d.querySelector('form'), ok = f.querySelector('button:not([data-no])');
    const fin = (v) => { document.removeEventListener('keydown', tecla, true); d.remove(); res(v); };
    const tecla = (e) => { if (e.key === 'Escape'){ e.stopPropagation(); fin(false); } };
    document.addEventListener('keydown', tecla, true);
    d.onclick = (e) => { if (e.target === d) fin(false); };
    f.querySelector('[data-no]').onclick = () => fin(false);
    if (o.escribir){ const i = f.elements.conf; i.oninput = () => { ok.disabled = i.value.trim().toUpperCase() !== o.escribir; }; setTimeout(() => i.focus(), 30); }
    else setTimeout(() => ok.focus(), 30);
    f.onsubmit = (e) => { e.preventDefault(); if (!ok.disabled) fin(true); };
  });
}

   /admin                     → Resumen

const BASE = '/admin';
const urlDe = (t, det) => BASE + (t && t !== 'resumen' ? '/' + t : '') + (det != null && det !== '' ? '/' + encodeURIComponent(det) : '');
function leerRuta(){
  const partes = location.pathname.replace(/\.html$/, '').slice(BASE.length).split('/').filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  const t = VISTAS.some(v => v[0] === partes[0]) ? partes[0] : 'resumen';
  return { tab: t, det: partes[1] || '' };
}
// Cambia la dirección sin recargar (push = nueva entrada para el botón Atrás)
function ponerUrl(url, push){
  if (location.pathname + location.search === url) return;
  try { history[push ? 'pushState' : 'replaceState'](null, '', url); } catch (e) {}
}
function abrirDetalle(t, det){

/* ---------- Productos (para marcas, modelos y probar precios) ---------- */
async function cargarProductos(){
  try {
    // Normalmente un solo archivo liviano (catalogo-tienda.json); si no existe, los originales.
    let a, b;
    const cat = await fetch('/catalogo-tienda.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
    if (cat){ a = { productos: cat.productos || [] }; b = { productos: cat.manuales || [] }; infoCatalogo = { generado: cat.generado }; }
    else {
      [a, b] = await Promise.all([
        fetch('/productos.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({ productos: [] })),
        fetch('/productos_manuales.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({ productos: [] })),
      ]);
      infoCatalogo = { generado: a.generado };
    }
    const man = (b.productos || []).filter(p => p.modelo !== 'EJEMPLO-BORRAR').map(p => Object.assign(p, { _manual: true }));
    const set = new Set(man.map(p => p.modelo));
    productos = man.concat((a.productos || []).filter(p => !set.has(p.modelo)));
  } catch (e){ productos = []; }
}
const marcas = () => [...new Set(productos.map(p => (p.marca || '').toUpperCase()).filter(Boolean))].sort();

      '<button class="btn prim" id="b-salir2" style="width:100%">Entrar con el correo de administrador</button></div></div>';
    $('b-salir2').onclick = async () => { await sb.auth.signOut({ scope: 'local' }); location.reload(); };

/* ---------- Resumen ---------- */
function vistaResumen(){
  const nuevos = pedidos.filter(p => p.estado === 'enviado' && !p.archivado);
  const ahora = new Date(), mes = new Date(ahora.getFullYear(), ahora.getMonth(), 1);
  const delMes = pedidos.filter(p => new Date(p.creado) >= mes && p.estado !== 'cancelado');
  const totalMes = delMes.reduce((s, p) => s + Number(p.total || 0), 0);
  const activos = clientes.filter(c => c.activo !== false && !c.es_admin);
  const entraron = activos.filter(c => c.user_id).length;
  const veStock = clientes.filter(motivoStock).length;
  const kpi = (id, icono, titulo, num, pie, extra) => '<' + (id ? 'button data-ir="' + id + '"' : 'div') + ' class="kpi' + (extra || '') + '"><div class="k-cab">' + titulo + icono + '</div><div class="k-num">' + num + '</div><div class="k-pie">' + pie + '</div></' + (id ? 'button' : 'div') + '>';
  const stockPie = estadoStock && !estadoStock.error && estadoStock.actualizado ? 'Existencias al ' + fecha(estadoStock.actualizado) : 'Existencias sin sincronizar';

  $('main').innerHTML = cabecera('Hola' + (yo.nombre ? ', ' + esc(yo.nombre.split(' ')[0]) : ''), 'Así va la tienda hoy, ' + new Date().toLocaleDateString('es-VE', { weekday: 'long', day: 'numeric', month: 'long' }) + '.',
      '<a class="btn" href="/ventas">' + ICO.externo + 'Gestión</a><a class="btn" href="/tienda" target="_blank" rel="noopener">' + ICO.tienda + 'Ver tienda</a>') +
    (ofertasAbiertas && ofertasAbiertas.length ? '<a class="aviso hoy" href="/ventas/ofertas/lista" title="Abrir en Gestión">' + ICO.info +
      '<strong>' + ofertasAbiertas.length + ' oferta' + (ofertasAbiertas.length === 1 ? '' : 's') + ' pendiente' + (ofertasAbiertas.length === 1 ? '' : 's') + ' de respuesta</strong>' +
      '<span>' + esc(ofertasAbiertas.slice(0, 6).map(o => (o.numero ? o.numero + ' ' : '') + (o.cliente || '')).join(' · ')) + (ofertasAbiertas.length > 6 ? ' · y ' + (ofertasAbiertas.length - 6) + ' más' : '') + '</span><span class="ir">Gestión →</span></a>' : '') +
    '<div class="kpis">' +
      kpi('pedidos', ICO.pedidos, 'Por atender', nuevos.length, nuevos.length ? 'Toca para revisarlos' : 'Todo al día', nuevos.length ? ' destacado' : '') +
      kpi('pedidos', ICO.caja, 'Pedidos del mes', delMes.length, money(totalMes) + ' en total (sin cancelados)') +
      kpi('clientes', ICO.clientes, 'Clientes', activos.length, entraron + ' ya entraron a la tienda') +
      kpi('existencias', ICO.existencias, 'Ven existencias', veStock, veStock === 1 ? 'persona' : 'personas') +
      kpi('descuentos', ICO.descuentos, 'Descuentos', reglas.filter(r => r.activo).length, 'reglas activas de ' + reglas.length) +
      kpi(null, ICO.tienda, 'Productos', productos.length.toLocaleString('es-VE'), infoCatalogo && infoCatalogo.generado ? 'Catálogo al ' + fecha(infoCatalogo.generado) : stockPie) +
    '</div>' +
    embudoPedidos() +
    '<div class="grid-2"><div class="caja"><div class="caja-cab"><h2>Últimos pedidos</h2><button class="btn chico" data-ir="pedidos">Ver todos →</button></div>' +
      (pedidos.length ? '<ul class="lista-simple">' + pedidos.filter(p => !p.archivado).slice(0, 6).map(pd => {
        const c = clientes.find(x => x.email === pd.cliente_email) || { email: pd.cliente_email };
        const n = (Array.isArray(pd.items) ? pd.items : []).reduce((s, it) => s + Number(it.cantidad || 0), 0);
        return '<li data-ver-pedido="' + pd.id + '" style="cursor:pointer"><div class="avatar">' + esc(iniciales(c)) + '</div><div><strong>#' + pd.id + ' · ' + esc(c.nombre || c.empresa || c.email) + '</strong><div class="muted">' + fecha(pd.creado) + ' · ' + n + ' unid.</div></div>' +
          '<div class="der"><strong>' + money(pd.total) + '</strong><br>' + pillEstado(pd.estado) + '</div></li>';
      }).join('') + '</ul>' : '<div class="vacio">' + ICO.pedidos + 'Todavía no hay pedidos.</div>') +
    '</div><div class="caja"><div class="caja-cab"><h2>Clientes nuevos</h2><button class="btn chico" data-ir="clientes">Ver todos →</button></div>' +
      (activos.length ? '<ul class="lista-simple">' + activos.slice(0, 6).map(c =>
        '<li data-ver-cliente="' + esc(c.email) + '" style="cursor:pointer"><div class="avatar">' + esc(iniciales(c)) + '</div><div><strong>' + esc(c.nombre || c.empresa || '—') + '</strong><div class="muted">' + esc(c.email) + ' · ' + haceCuanto(c.creado) + '</div></div>' +
        '<div class="der"><span class="pill azul">' + esc(nombreTipo(c.tipo_id)) + '</span></div></li>').join('') + '</ul>' : '<div class="vacio">' + ICO.clientes + 'Aún no hay clientes.</div>') +
    '</div></div>';
  document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { if (b.dataset.ir === 'pedidos' && nuevos.length && b.classList.contains('destacado')) filtroEstado = 'enviado'; irA(b.dataset.ir); });
  document.querySelectorAll('[data-ver-pedido]').forEach(li => li.onclick = () => abrirPedido(li.dataset.verPedido));
  document.querySelectorAll('[data-ver-cliente]').forEach(li => li.onclick = () => abrirCliente(clientes.find(c => c.email === li.dataset.verCliente)));
  document.querySelectorAll('[data-embudo]').forEach(b => b.onclick = () => { filtroEstado = b.dataset.embudo; irA('pedidos'); });
}
// Barra con los pedidos activos repartidos por estado (Resumen)
function embudoPedidos(){
  const act = pedidos.filter(p => !p.archivado);
  if (!act.length) return '';
  const n = (e) => act.filter(p => p.estado === e).length;
  return '<div class="caja"><div class="caja-cab" style="margin-bottom:12px"><h2>Pedidos por estado <small>' + act.length + '</small></h2><span class="muted">Sin contar los archivados · toca un estado para verlos</span></div>' +
    '<div class="embudo">' + ESTADOS.filter(e => n(e[0])).map(e => '<i class="c-' + e[0] + '" style="flex:' + n(e[0]) + '" title="' + e[1] + ': ' + n(e[0]) + '"></i>').join('') + '</div>' +
    '<div class="embudo-ley">' + ESTADOS.map(e => '<button data-embudo="' + e[0] + '"><i class="c-' + e[0] + '"></i>' + e[1] + ' <b>' + n(e[0]) + '</b></button>').join('') + '</div></div>';
}
const pillEstado = (e) => {
  const cls = { enviado: 'amar', cotizado: 'azul', aprobado: 'indigo', pagado: 'indigo', entregado: 'verde', cancelado: 'rojo' }[e] || '';
  return '<span class="pill ' + cls + '"><span class="punto"></span>' + esc(nombreEstado(e)) + '</span>';
};

/* ---------- Pedidos ---------- */
let filtroEstado = '', buscaPed = '';
const ARCH = 'archivados';
const itemsDe = (pd) => Array.isArray(pd.items) ? pd.items : [];
const clienteDe = (pd) => clientes.find(x => x.email === pd.cliente_email) || { email: pd.cliente_email };
const productoDe = (modelo) => productos.find(p => p.modelo === modelo);
const rutaImagen = (src) => !src ? '' : /^(https?:)?\/\//.test(src) || src.startsWith('/') ? src : '/' + src;
const linkWhatsApp = (tel) => {
  let d = String(tel || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('0')) d = '58' + d.slice(1);       // 0414… → 58414…
  return 'https://wa.me/' + d;
};

function vistaPedidos(){
  const activos = pedidos.filter(p => !p.archivado);
  const cuenta = (e) => activos.filter(p => !e || p.estado === e).length;
  const nArch = pedidos.length - activos.length;
  $('main').innerHTML = cabecera('Pedidos', 'Los pedidos que los clientes con cuenta envían por WhatsApp. Ábrelos para ver el detalle, cambia el estado y deja un comentario: el cliente lo ve en "Mi cuenta".',
      '<button class="btn" id="p-recargar">' + ICO.sync + 'Actualizar</button>') +
    '<div class="caja"><div class="caja-cab" style="margin-bottom:0"><div class="chips" id="p-chips">' +
      '<button class="chip' + (!filtroEstado ? ' activo' : '') + '" data-f="">Todos <b>' + cuenta('') + '</b></button>' +
      ESTADOS.map(e => '<button class="chip' + (filtroEstado === e[0] ? ' activo' : '') + '" data-f="' + e[0] + '">' + e[1] + ' <b>' + cuenta(e[0]) + '</b></button>').join('') +
      '<button class="chip sep' + (filtroEstado === ARCH ? ' activo' : '') + '" data-f="' + ARCH + '">' + ICO.archivar.replace('<svg', '<svg width="14" height="14"') + 'Archivados <b>' + nArch + '</b></button>' +
    '</div><div class="buscar">' + ICO.buscar + '<input id="p-busca" placeholder="Buscar cliente, # o modelo" value="' + esc(buscaPed) + '"></div></div></div>' +
    '<div class="pedidos" id="p-lista"></div>';
  document.querySelectorAll('#p-chips .chip').forEach(ch => ch.onclick = () => { filtroEstado = ch.dataset.f; vistaPedidos(); });
  $('p-busca').oninput = (e) => { buscaPed = e.target.value; pintarPedidos(); };
  $('p-recargar').onclick = async () => { const err = await cargarPedidos(); if (err) toast('Error: ' + mensajeError(err)); pintarBadges(); vistaPedidos(); };
  pintarPedidos();
}
function pintarPedidos(){
  const q = buscaPed.trim().toLowerCase();
  const verArch = filtroEstado === ARCH;
  const lista = pedidos.filter(pd => {
    if (!!pd.archivado !== verArch) return false;
    if (!verArch && filtroEstado && pd.estado !== filtroEstado) return false;
    if (!q) return true;
    const c = clienteDe(pd);
    return ['#' + pd.id, String(pd.id), pd.cliente_email, c.nombre, c.empresa, c.rif].concat(itemsDe(pd).map(it => it.modelo)).join(' ').toLowerCase().includes(q);
  });
  if (!lista.length){
    $('p-lista').innerHTML = '<div class="caja vacio">' + (verArch ? ICO.archivar + 'No hay pedidos archivados.' : ICO.pedidos + (pedidos.length ? 'No hay pedidos con este filtro.' : 'Todavía no hay pedidos.')) + '</div>';
    return;
  }
  const MAX = 5;
  $('p-lista').innerHTML = lista.map(pd => {
    const c = clienteDe(pd);
    const items = itemsDe(pd);
    const unid = items.reduce((t, it) => t + Number(it.cantidad || 0), 0);
    const wa = linkWhatsApp(c.telefono);
    return '<article class="pedido e-' + pd.estado + (pd.archivado ? ' archivado' : '') + '">' +
      '<div class="pd-cab"><div class="pd-num"><button class="abrir" data-ver-pedido="' + pd.id + '" title="Ver detalle"><strong>#' + pd.id + '</strong></button>' +
          '<select class="estado-sel e-' + pd.estado + '" data-estado="' + pd.id + '" aria-label="Estado del pedido">' +
          ESTADOS.map(e => '<option value="' + e[0] + '"' + (pd.estado === e[0] ? ' selected' : '') + '>' + e[1] + '</option>').join('') + '</select>' +
          (pd.archivado ? '<span class="pill">Archivado</span>' : '') + '</div>' +
        '<div class="persona"><div class="avatar">' + esc(iniciales(c)) + '</div><div><strong>' + esc(c.nombre || c.empresa || c.email) + (c.nombre && c.empresa ? ' <span class="muted" style="display:inline">· ' + esc(c.empresa) + '</span>' : '') + '</strong>' +
          '<span>' + esc(pd.cliente_email) + (c.telefono ? ' · ' + esc(c.telefono) : '') + '</span></div></div>' +
        '<div class="pd-total">' + money(pd.total) + '<small title="' + esc(fecha(pd.creado)) + '">' + haceCuanto(pd.creado) + ' · ' + unid + ' unid.</small></div></div>' +
      '<div class="pd-cuerpo"><div><ul class="items">' + items.slice(0, MAX).map(it => '<li><span class="can">' + esc(it.cantidad) + '×</span><span class="mono">' + esc(it.modelo) + '</span><span class="pre">' + money(it.precio_unit) + '</span></li>').join('') +
          (items.length > MAX ? '<li class="mas" data-ver-pedido="' + pd.id + '">+ ' + (items.length - MAX) + ' producto' + (items.length - MAX > 1 ? 's' : '') + ' más · ver detalle</li>' : '') + '</ul>' +
          (pd.nota_cliente ? '<div class="nota-cli"><strong>Nota del cliente:</strong> ' + esc(pd.nota_cliente) + '</div>' : '') + '</div>' +
        '<div class="nota-wrap"><label class="campo">Comentario para el cliente<textarea rows="2" data-nota="' + pd.id + '" placeholder="Ej. Listo para retirar">' + esc(pd.nota_admin || '') + '</textarea></label>' +
          '<div class="nota-fila"><button class="btn chico" data-guardar-nota="' + pd.id + '">' + ICO.guardar + 'Guardar comentario</button><span class="muted">Lo ve en "Mi cuenta"</span></div></div></div>' +
      '<div class="pd-pie pd-acciones">' +
        '<button class="btn chico" data-ver-pedido="' + pd.id + '">' + ICO.ojo + 'Ver detalle</button>' +
        (wa ? '<a class="btn chico" href="' + wa + '" target="_blank" rel="noopener">' + ICO.whatsapp + 'WhatsApp</a>' : '') +
        '<div class="der"><button class="btn chico" data-archivar="' + pd.id + '" title="' + (pd.archivado ? 'Desarchivar' : 'Archivar') + '">' + ICO.archivar + '<span class="txt">' + (pd.archivado ? 'Desarchivar' : 'Archivar') + '</span></button>' +
        '<button class="btn chico icono peligro" data-borrar="' + pd.id + '" title="Eliminar pedido" aria-label="Eliminar pedido">' + ICO.borrar + '</button></div>' +
      '</div>' +
    '</article>';
  }).join('');
  document.querySelectorAll('#p-lista [data-estado]').forEach(s => s.onchange = () => guardarEstado(s.dataset.estado, s.value, s));
  document.querySelectorAll('#p-lista [data-guardar-nota]').forEach(b => b.onclick = () =>
    guardarNota(b.dataset.guardarNota, document.querySelector('#p-lista [data-nota="' + b.dataset.guardarNota + '"]').value));
  document.querySelectorAll('#p-lista [data-ver-pedido]').forEach(b => b.onclick = () => abrirPedido(b.dataset.verPedido));
  document.querySelectorAll('#p-lista [data-archivar]').forEach(b => b.onclick = () => archivarPedido(b.dataset.archivar));
  document.querySelectorAll('#p-lista [data-borrar]').forEach(b => b.onclick = () => eliminarPedido(b.dataset.borrar));
}

/* Acciones sobre un pedido (se usan desde la lista y desde el detalle) */
const pedidoPorId = (id) => pedidos.find(p => String(p.id) === String(id));
function refrescarDetrasDelPanel(){
  if (tab === 'pedidos') vistaPedidos();
  else if (tab === 'resumen') vistaResumen();
  pintarBadges();
}
async function guardarEstado(id, estado, sel){
  const { error } = await sb.from('pedidos').update({ estado }).eq('id', id);
  if (error){ toast('Error: ' + mensajeError(error)); if (sel) sel.value = (pedidoPorId(id) || {}).estado; return; }
  const pd = pedidoPorId(id); if (pd) pd.estado = estado;
  document.querySelectorAll('[data-estado="' + id + '"]').forEach(s => { s.value = estado; s.className = 'estado-sel e-' + estado;
    const art = s.closest('.pedido'); if (art) art.className = art.className.replace(/\be-\w+/, 'e-' + estado); });
  pintarBadges(); toast('Estado: ' + nombreEstado(estado));
}
async function guardarNota(id, texto){
  const nota = String(texto || '').trim() || null;
  const { error } = await sb.from('pedidos').update({ nota_admin: nota }).eq('id', id);
  if (error) return toast('Error: ' + mensajeError(error));
  const pd = pedidoPorId(id); if (pd) pd.nota_admin = nota;
  document.querySelectorAll('[data-nota="' + id + '"]').forEach(t => { t.value = nota || ''; });
  toast('Comentario guardado');
}
async function archivarPedido(id){
  const pd = pedidoPorId(id); if (!pd) return;
  const archivar = !pd.archivado;
  const { error } = await sb.from('pedidos').update({ archivado: archivar, archivado_en: archivar ? new Date().toISOString() : null }).eq('id', id);
  if (error) return toast('Error: ' + mensajeError(error));
  pd.archivado = archivar; pd.archivado_en = archivar ? new Date().toISOString() : null;
  toast('Pedido #' + id + (archivar ? ' archivado' : ' vuelve a la lista'));
  if ($('panel').classList.contains('ver') && $('panel').dataset.pedido === String(id)) abrirPedido(id);
  refrescarDetrasDelPanel();
}
async function eliminarPedido(id){
  const pd = pedidoPorId(id); if (!pd) return;
  const c = clienteDe(pd);
  if (!await confirmar({ titulo: '¿Eliminar el pedido #' + id + '?', peligro: true, boton: 'Eliminar pedido',
    texto: (c.nombre || c.empresa || c.email) + ' · ' + money(pd.total) + '\n\nSe borra para siempre, también de "Mi cuenta" del cliente. No se puede deshacer. Si solo quieres sacarlo de la lista, usa "Archivar".' })) return;
  const { data, error } = await sb.from('pedidos').delete().eq('id', id).select('id');
  if (error) return toast('Error: ' + mensajeError(error));
  if (!data || !data.length) return toast('No se pudo eliminar: ' + mensajeError({ message: 'permission denied' }));
  pedidos = pedidos.filter(p => String(p.id) !== String(id));
  if ($('panel').dataset.pedido === String(id)) cerrarPanel();
  toast('Pedido #' + id + ' eliminado');
  refrescarDetrasDelPanel();
}

/* Detalle de un pedido (panel lateral) */
function abrirPedido(id){
  const pd = pedidoPorId(id); if (!pd) return;
  ponerUrl(urlDe('pedidos', pd.id));
  const c = clienteDe(pd);
  const items = itemsDe(pd);
  const unidades = items.reduce((s, it) => s + Number(it.cantidad || 0), 0);
  const suma = items.reduce((s, it) => s + Number(it.precio_unit || 0) * Number(it.cantidad || 0), 0);
  const wa = linkWhatsApp(c.telefono);
  const dato = (t, v) => '<div><span>' + t + '</span>' + (v || '<span class="muted" style="text-transform:none;font-weight:400;letter-spacing:0;font-size:14px;color:var(--texto-3)">—</span>') + '</div>';

  const filas = items.map(it => {
    const p = productoDe(it.modelo);
    const desc = (p && p.descripcion) || it.descripcion || '';
    const img = rutaImagen(p && (p.imagen || (p.imagenes || [])[0]));
    const marca = it.marca || (p && p.marca) || '';
    const cat = p && (p.subcategoria || p.categoria_principal);
    const sub = Number(it.precio_unit || 0) * Number(it.cantidad || 0);
    const lista = it.precio_lista != null ? Number(it.precio_lista) : null;
    const dcto = lista && it.precio_unit != null && lista > 0 ? Math.round((1 - Number(it.precio_unit) / lista) * 100) : null;
    return '<li><div class="det-img">' + (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" onerror="this.remove()">' : ICO.caja) + '</div>' +
      '<div><div class="det-mod">' + (p ? '<a href="/p/' + slugDe(it.modelo) + '" target="_blank" rel="noopener">' + esc(it.modelo) + ' ↗</a>' : esc(it.modelo)) +
        (marca ? ' <span class="pill" style="font-family:var(--sans);margin-left:4px">' + esc(marca) + '</span>' : '') + '</div>' +
        (desc ? '<div class="det-desc">' + esc(desc) + '</div>' : '<div class="det-desc muted">Sin descripción</div>') +
        (cat ? '<div class="det-cat">' + esc(cat) + '</div>' : '') +
        (!p ? '<div class="det-cat" style="color:var(--amarillo-texto)">Ya no está en el catálogo actual</div>' : '') + '</div>' +
      '<div class="det-num"><strong>' + money(sub) + '</strong>' + esc(it.cantidad) + ' × ' + money(it.precio_unit) +
        (lista != null ? '<small>Lista ' + money(lista) + (dcto > 0 ? ' · −' + dcto + '%' : '') + '</small>' : '') + '</div></li>';
  }).join('');

  abrirPanel(
    '<div class="panel-cab"><h2>Pedido #' + pd.id + '</h2>' + pillEstado(pd.estado) + (pd.archivado ? '<span class="pill">Archivado</span>' : '') +
      '<button class="btn chico fantasma cerrar" id="d-cerrar" aria-label="Cerrar">' + ICO.cerrar + '</button></div>' +
    '<div class="panel-cuerpo">' +
      '<div class="seccion"><h3>Cliente</h3><div class="persona" style="margin-bottom:12px"><div class="avatar">' + esc(iniciales(c)) + '</div><div><strong>' + esc(c.nombre || c.empresa || c.email) + '</strong>' +
        (c.nombre && c.empresa ? '<span>' + esc(c.empresa) + '</span>' : '') + '</div></div>' +
        '<div class="det-datos">' +
          dato('Correo', '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>') +
          dato('Teléfono', c.telefono ? esc(c.telefono) + (wa ? ' · <a href="' + wa + '" target="_blank" rel="noopener">WhatsApp ↗</a>' : '') : '') +
          dato('RIF', c.rif ? esc(c.rif) : '') +
          dato('Tipo de cliente', c.tipo_id ? esc(nombreTipo(c.tipo_id)) : '') +
        '</div></div>' +
      '<div class="seccion"><h3>Pedido</h3><div class="det-datos">' +
        dato('Recibido', fecha(pd.creado)) +
        dato('Última actualización', fecha(pd.actualizado)) +
        dato('Estado', '<select class="estado-sel e-' + pd.estado + '" data-estado="' + pd.id + '" id="d-estado">' + ESTADOS.map(e => '<option value="' + e[0] + '"' + (pd.estado === e[0] ? ' selected' : '') + '>' + e[1] + '</option>').join('') + '</select>') +
        dato('Contenido', items.length + ' producto' + (items.length === 1 ? '' : 's') + ' · ' + unidades + ' unid.') +
      '</div>' +
      (pd.nota_cliente ? '<div class="ayuda" style="margin:14px 0 0"><strong>Nota del cliente:</strong> ' + esc(pd.nota_cliente) + '</div>' : '') + '</div>' +
      '<div class="seccion"><h3>Productos</h3>' +
        (items.length ? '<ul class="det-items">' + filas + '</ul>' : '<div class="vacio">Este pedido no tiene productos.</div>') +
        '<div class="det-total"><span class="muted">Total' + (pd.total != null && Math.abs(Number(pd.total) - suma) > 1 ? ' (registrado; la suma da ' + money(suma) + ')' : '') + '</span><strong>' + money(pd.total != null ? pd.total : suma) + '</strong></div>' +
      '</div>' +
      '<div class="seccion"><h3>Comentario para el cliente</h3><div class="nota-wrap"><textarea rows="3" data-nota="' + pd.id + '" id="d-nota" placeholder="Ej. Listo para retirar">' + esc(pd.nota_admin || '') + '</textarea>' +
        '<div><button class="btn chico" id="d-guardar-nota">Guardar comentario</button></div></div></div>' +
    '</div>' +
    '<div class="panel-pie">' +
      '<button class="btn" id="d-copiar">Copiar lista</button>' +

/* ---------- Descuentos ---------- */
let reglaDestinoInicial = '';
// Misma lógica que la tienda: gana la regla más específica.
const RANGO = { '00': 1, '01': 2, '02': 3, '10': 4, '20': 5, '11': 6, '21': 7, '12': 8, '22': 9 };
function reglaPara(p, email, tipo){
  const marca = String(p.marca || '').toUpperCase().trim(), modelo = String(p.modelo || '').toUpperCase().trim();
  let mejor = null, mr = 99;
  for (const r of reglas){
    if (!r.activo) continue;
    let quien, que;
    if (r.cliente_email){ if (r.cliente_email !== email) continue; quien = 0; }
    else if (r.tipo_id){ if (r.tipo_id !== tipo) continue; quien = 1; }
    else quien = 2;
    if (r.modelo){ if (String(r.modelo).toUpperCase().trim() !== modelo) continue; que = 0; }
    else if (r.marca){ if (String(r.marca).toUpperCase().trim() !== marca) continue; que = 1; }
    else que = 2;
    if (p._manual && que === 2) continue;
    const k = RANGO['' + que + quien];
    if (k < mr){ mejor = r; mr = k; }
  }
  return mejor;
}
function precioPara(p, email, tipo){
  const r = reglaPara(p, email, tipo);
  if (r && r.precio_fijo != null) return { precio: Number(r.precio_fijo), r };
  if (p.precio == null) return { precio: null, r };
  if (r) return { precio: Number(p.precio) * (1 - Number(r.descuento_pct) / 100), r };
  return { precio: Number(p.precio), r: null };
}
