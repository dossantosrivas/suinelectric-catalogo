<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
// Una sola dirección para la tienda: la sesión se guarda por dominio, así que
// www.suinelectric.com o la dirección vieja de Netlify serían "otra tienda" sin sesión.
(function(){ var h = location.hostname;
  if (h === 'www.suinelectric.com' || /\.netlify\.app$/.test(h))
    location.replace('https://suinelectric.com' + location.pathname + location.search + location.hash);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de administrador | Suinelectric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#0e2a3b; --tinta-2:#133649; --tinta-3:#1c4760;
    --azul:#0089af; --azul-texto:#006d8c; --azul-suave:#e6f4f8;
    --amarillo:#ffc20e; --amarillo-suave:#fff4d6; --amarillo-texto:#8a5a00;
    --fondo:#f3f5f7; --superficie:#ffffff; --linea:#dde3e8; --linea-suave:#edf0f3;
    --texto:#14222c; --texto-2:#475866; --texto-3:#6c7b87;
    --ok:#1b7f3b; --ok-suave:#e4f4e9; --off:#b3261e; --off-suave:#fbe9e7;
    --radio:10px; --radio-chico:7px;
    --sombra:0 1px 2px rgba(14,42,59,.06), 0 1px 1px rgba(14,42,59,.04);
    --sombra-alta:0 12px 32px rgba(14,42,59,.18);
    --sans:'IBM Plex Sans','Segoe UI',Roboto,Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:var(--sans); background:var(--fondo); color:var(--texto); font-size:14.5px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  button{ font:inherit; }
  a{ color:var(--azul-texto); }
  [hidden]{ display:none !important; }

  /* ---------- Estructura ---------- */
  .app{ display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100vh; }
  .side{ background:var(--tinta); color:#fff; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:20px 14px; }
  .marca{ display:flex; align-items:center; gap:10px; padding:4px 8px 22px; }
  .marca-logo{ width:36px; height:36px; border-radius:9px; background:var(--amarillo); color:var(--tinta); display:grid; place-items:center; font-weight:700; font-size:18px; flex:none; }
  .marca-txt strong{ display:block; font-size:15.5px; letter-spacing:.6px; }
  .marca-txt span{ font-size:12px; opacity:.65; }
  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav button{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:none; color:rgba(255,255,255,.72); padding:10px 12px; border-radius:8px; cursor:pointer; font-weight:500; font-size:14.5px; }
  .nav button svg{ width:18px; height:18px; flex:none; opacity:.85; }
  .nav button:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .nav button.activa{ background:var(--tinta-3); color:#fff; box-shadow:inset 3px 0 0 var(--amarillo); }
  .nav .badge{ margin-left:auto; background:var(--amarillo); color:var(--tinta); font-size:11.5px; font-weight:700; border-radius:10px; padding:1px 8px; }
  .side-pie{ margin-top:auto; border-top:1px solid rgba(255,255,255,.1); padding:14px 8px 0; font-size:12.5px; }
  .side-pie .quien{ opacity:.7; word-break:break-all; margin-bottom:10px; }
  .side-pie .acciones{ display:flex; gap:6px; }
  .side-pie a, .side-pie button{ flex:1; text-align:center; color:#fff; background:rgba(255,255,255,.1); border:none; border-radius:7px; padding:8px 10px; font-size:13px; cursor:pointer; text-decoration:none; }
  .side-pie a:hover, .side-pie button:hover{ background:rgba(255,255,255,.18); }
  .contenido{ padding:28px 34px 60px; max-width:1240px; width:100%; }
  .cab{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .cab h1{ font-size:25px; margin:0; letter-spacing:-.2px; color:var(--tinta); }
  .cab p{ margin:4px 0 0; color:var(--texto-3); font-size:14px; }
  .cab .acc{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- Piezas ---------- */
  .caja{ background:var(--superficie); border:1px solid var(--linea); border-radius:var(--radio); box-shadow:var(--sombra); padding:18px 20px; margin-bottom:18px; }
  .caja-cab{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .caja h2{ font-size:16.5px; margin:0; color:var(--tinta); }
  .caja h2 small{ font-weight:500; color:var(--texto-3); font-size:13.5px; margin-left:6px; }
  .caja .sub{ margin:-8px 0 14px; color:var(--texto-3); font-size:13.5px; }
  .grid-2{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:18px; align-items:start; }
  .grid-2 > .caja{ margin-bottom:0; }
  .apilar > * + *{ margin-top:18px; }
  .fila{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  label.campo{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--texto-2); }
  input, select, textarea{ font:inherit; font-size:14.5px; height:40px; padding:0 11px; border:1px solid var(--linea); border-radius:var(--radio-chico); background:#fff; color:var(--texto); min-width:0; width:100%; }
  textarea{ height:auto; padding:9px 11px; resize:vertical; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--azul); box-shadow:0 0 0 3px rgba(0,137,175,.14); }
  input[readonly]{ background:var(--fondo); color:var(--texto-2); }
  .buscar{ position:relative; }
  .buscar svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--texto-3); }
  .buscar input{ padding-left:34px; min-width:230px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:600; font-size:14px; height:40px; padding:0 15px; border-radius:var(--radio-chico); border:1px solid var(--linea); background:#fff; color:var(--texto); cursor:pointer; white-space:nowrap; text-decoration:none; }
  .btn svg{ width:16px; height:16px; }
  .btn:hover{ border-color:var(--azul); color:var(--azul-texto); }
  .btn.prim{ background:var(--tinta); color:#fff; border-color:var(--tinta); }
  .btn.prim:hover{ background:var(--tinta-3); color:#fff; }
  .btn.acento{ background:var(--amarillo); border-color:var(--amarillo); color:var(--tinta); }
  .btn.peligro{ color:var(--off); }
  .btn.peligro:hover{ border-color:var(--off); color:var(--off); background:var(--off-suave); }
  .btn.chico{ height:32px; padding:0 11px; font-size:13px; }
  .btn.fantasma{ border-color:transparent; background:none; }
  .btn:disabled{ opacity:.5; cursor:default; }

  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; border-radius:20px; padding:2px 10px; background:var(--linea-suave); color:var(--texto-2); white-space:nowrap; }
  .pill.azul{ background:var(--azul-suave); color:var(--azul-texto); }
  .pill.verde{ background:var(--ok-suave); color:var(--ok); }
  .pill.rojo{ background:var(--off-suave); color:var(--off); }
  .pill.amar{ background:var(--amarillo-suave); color:var(--amarillo-texto); }
  .pill.tinta{ background:var(--tinta); color:#fff; }
  .pill .punto{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .muted{ color:var(--texto-3); font-size:13px; }
  .mono{ font-family:var(--mono); font-size:13px; }
  .error{ color:var(--off); font-size:13.5px; min-height:1em; margin:8px 0 0; }
  .ayuda{ font-size:13.5px; color:var(--texto-2); background:var(--fondo); border-radius:var(--radio-chico); padding:11px 13px; margin:0 0 14px; line-height:1.55; }
  .aviso{ display:flex; gap:10px; align-items:flex-start; background:var(--amarillo-suave); color:#5c3d00; border-radius:var(--radio-chico); padding:11px 13px; font-size:13.5px; line-height:1.5; margin-bottom:14px; }
  .aviso.azul{ background:var(--azul-suave); color:#0b4a5d; }
  .aviso svg{ width:18px; height:18px; flex:none; margin-top:1px; }
  .vacio{ text-align:center; padding:34px 10px; color:var(--texto-3); }
  .vacio svg{ width:34px; height:34px; opacity:.45; display:block; margin:0 auto 8px; }

  /* Chips de filtro */
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ border:1px solid var(--linea); background:#fff; color:var(--texto-2); border-radius:20px; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; gap:7px; align-items:center; }
  .chip b{ font-weight:700; color:var(--texto-3); font-size:12px; }
  .chip:hover{ border-color:var(--azul); }
  .chip.activo{ background:var(--tinta); border-color:var(--tinta); color:#fff; }
  .chip.activo b{ color:var(--amarillo); }

  /* Tablas */
  .tabla-wrap{ overflow-x:auto; margin:0 -20px; padding:0 20px; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--texto-3); font-weight:600; padding:10px 10px; border-bottom:1px solid var(--linea); white-space:nowrap; }
  td{ padding:11px 10px; border-bottom:1px solid var(--linea-suave); vertical-align:middle; }
  tbody tr:hover td{ background:#fafbfc; }
  tbody tr:last-child td{ border-bottom:none; }
  tr.inactivo td:not(:last-child){ opacity:.5; }
  td.acciones{ text-align:right; white-space:nowrap; }
  .persona{ display:flex; align-items:center; gap:11px; min-width:210px; }
  .avatar{ width:36px; height:36px; border-radius:50%; background:var(--azul-suave); color:var(--azul-texto); display:grid; place-items:center; font-weight:700; font-size:13.5px; flex:none; }
  .avatar.admin{ background:var(--tinta); color:var(--amarillo); }
  .persona strong{ display:block; font-weight:600; }
  .persona span{ color:var(--texto-3); font-size:12.5px; }

  /* Interruptor */
  .switch{ display:flex; align-items:flex-start; gap:12px; cursor:pointer; }
  .switch input{ position:absolute; opacity:0; width:1px; height:1px; }
  .sw{ width:40px; height:23px; border-radius:20px; background:#c5ced6; position:relative; flex:none; transition:background .15s; margin-top:1px; }
  .sw::after{ content:''; position:absolute; top:3px; left:3px; width:17px; height:17px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s; }
  .switch input:checked + .sw{ background:var(--ok); }
  .switch input:checked + .sw::after{ transform:translateX(17px); }
  .switch input:focus-visible + .sw{ box-shadow:0 0 0 3px rgba(0,137,175,.3); }
  .switch input:disabled + .sw{ opacity:.55; }
  .sw-txt strong{ display:block; font-size:14px; font-weight:600; color:var(--texto); }
  .sw-txt small{ display:block; font-size:12.5px; color:var(--texto-3); margin-top:1px; }
  .switch.solo{ align-items:center; }

  /* Resumen */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi{ background:#fff; border:1px solid var(--linea); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px 18px; display:flex; flex-direction:column; gap:4px; cursor:default; text-align:left; font:inherit; color:inherit; }
  button.kpi{ cursor:pointer; }
  button.kpi:hover{ border-color:var(--azul); }
  .kpi .k-cab{ display:flex; align-items:center; justify-content:space-between; color:var(--texto-3); font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
  .kpi .k-cab svg{ width:18px; height:18px; color:var(--azul); }
  .kpi .k-num{ font-size:28px; font-weight:700; color:var(--tinta); letter-spacing:-.5px; line-height:1.15; }
  .kpi .k-pie{ font-size:13px; color:var(--texto-3); }
  .kpi.destacado{ background:var(--tinta); border-color:var(--tinta); color:#fff; }
  .kpi.destacado .k-num{ color:var(--amarillo); }
  .kpi.destacado .k-cab, .kpi.destacado .k-pie{ color:rgba(255,255,255,.7); }
  .kpi.destacado .k-cab svg{ color:var(--amarillo); }
  .lista-simple{ list-style:none; margin:0; padding:0; }
  .lista-simple li{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--linea-suave); }
  .lista-simple li:last-child{ border-bottom:none; }
  .lista-simple .der{ margin-left:auto; text-align:right; }

  /* Pedidos */
  .pedidos{ display:flex; flex-direction:column; gap:12px; }
  .pedido{ background:#fff; border:1px solid var(--linea); border-radius:var(--radio); box-shadow:var(--sombra); display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1fr); overflow:hidden; }
  .pedido > div{ padding:15px 18px; }
  .pedido > div + div{ border-left:1px solid var(--linea-suave); }
  .pd-num{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .pd-num strong{ font-size:17px; color:var(--tinta); }
  .pd-total{ font-size:20px; font-weight:700; color:var(--tinta); margin-top:8px; }
  .items{ margin:0; padding:0; list-style:none; font-size:13.5px; }
  .items li{ display:flex; gap:10px; padding:4px 0; border-bottom:1px dashed var(--linea-suave); }
  .items li:last-child{ border-bottom:none; }
  .items .can{ color:var(--texto-3); min-width:28px; }
  .items .pre{ margin-left:auto; white-space:nowrap; color:var(--texto-2); }
  .estado-sel{ font-weight:600; height:34px; font-size:13.5px; width:auto; padding-right:28px; }
  .estado-sel.e-enviado{ background:var(--amarillo-suave); border-color:#f2d27a; color:var(--amarillo-texto); }
  .estado-sel.e-cotizado{ background:var(--azul-suave); border-color:#a9d6e4; color:var(--azul-texto); }
  .estado-sel.e-aprobado, .estado-sel.e-pagado{ background:#eef0ff; border-color:#c9cff5; color:#3b44a8; }
  .estado-sel.e-entregado{ background:var(--ok-suave); border-color:#b4dcc1; color:var(--ok); }
  .estado-sel.e-cancelado{ background:var(--off-suave); border-color:#efc0bb; color:var(--off); }
  .nota-wrap{ display:flex; flex-direction:column; gap:8px; }
  .nota-wrap textarea{ min-height:64px; font-size:13.5px; }
  .pd-acciones{ display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:4px; }
  .pd-acciones .btn svg{ width:15px; height:15px; }
  .pedido.archivado{ background:#fafbfc; }
  .pedido.archivado > div:first-child{ opacity:.8; }
  .pd-num .abrir{ background:none; border:none; padding:0; cursor:pointer; font:inherit; color:var(--tinta); }
  .pd-num .abrir strong{ text-decoration:underline; text-decoration-color:var(--linea); text-underline-offset:3px; }
  .pd-num .abrir:hover strong{ color:var(--azul-texto); text-decoration-color:currentColor; }
  .items li.mas{ color:var(--azul-texto); cursor:pointer; border-bottom:none; }
  .chip.sep{ margin-left:6px; }

  /* Actividad por cliente */
  .ranking li.clic{ cursor:pointer; }
  /* Visitantes */
  .tabla-vis tr.clic{ cursor:pointer; }
  .tabla-vis td{ vertical-align:top; font-size:13.5px; }
  .tabla-vis tr.clic:hover td:first-child strong{ color:var(--azul-texto); }
  .vis-act .pill{ margin:0 3px 3px 0; }
  .vis-cabv{ font-weight:500; color:var(--texto-3); font-size:12.5px; margin-top:2px; }
  .vis-cabv::first-letter{ text-transform:none; }
  .vis-tarj{ margin-top:4px; font-size:12.5px; }
  .vis-tarj summary{ cursor:pointer; color:var(--azul-texto); }
  .vis-tarj a.mono{ display:inline-block; margin:3px 8px 0 0; }
  .vis-modelos{ display:flex; flex-wrap:wrap; gap:6px 12px; font-size:13px; }
  .vis-modelos a.mono{ text-decoration:none; }
  .vis-modelos b{ color:var(--texto-3); font-size:12px; }
  .ranking li.clic:hover .nom strong{ color:var(--azul-texto); }
  .ranking .nom strong{ font-weight:600; }
  .act-linea{ list-style:none; margin:0; padding:0; }
  .act-dia{ font-size:12px; font-weight:700; color:var(--texto-3); padding:14px 0 6px; border-bottom:1px solid var(--linea); }
  .act-dia::first-letter{ text-transform:uppercase; }
  .act-dia:first-child{ padding-top:0; }
  .act-ev{ display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:10px; align-items:start; padding:8px 0; border-bottom:1px dashed var(--linea-suave); font-size:13.5px; }
  .act-ev svg{ width:16px; height:16px; color:var(--texto-3); margin-top:2px; }
  .act-ev.t-agregar_carrito svg, .act-ev.t-cotizar_whatsapp svg, .act-ev.t-pedido_whatsapp svg{ color:var(--ok); }
  .act-ev time{ color:var(--texto-3); font-size:12.5px; white-space:nowrap; }
  .act-ev a.mono{ text-decoration:none; font-weight:500; }

  /* Detalle del pedido (panel lateral ancho) */
  .panel.ancho{ width:min(760px,100%); }
  .det-datos{ display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; font-size:14px; }
  .det-datos div span{ display:block; font-size:12px; color:var(--texto-3); font-weight:600; text-transform:uppercase; letter-spacing:.4px; margin-bottom:2px; }
  .det-items{ list-style:none; margin:0; padding:0; }
  .det-items li{ display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:12px; padding:12px 0; border-bottom:1px solid var(--linea-suave); align-items:start; }
  .det-items li:last-child{ border-bottom:none; }
  .det-img{ width:56px; height:56px; border:1px solid var(--linea); border-radius:8px; background:#fff; display:grid; place-items:center; overflow:hidden; color:var(--texto-3); }
  .det-img img{ width:100%; height:100%; object-fit:contain; }
  .det-img svg{ width:22px; height:22px; opacity:.5; }
  .det-mod{ font-family:var(--mono); font-size:13.5px; font-weight:500; }
  .det-mod a{ text-decoration:none; }
  .det-mod a:hover{ text-decoration:underline; }
  .det-desc{ font-size:13.5px; color:var(--texto-2); margin-top:3px; line-height:1.45; }
  .det-cat{ font-size:12px; color:var(--texto-3); margin-top:4px; }
  .det-num{ text-align:right; font-size:13.5px; white-space:nowrap; }
  .det-num strong{ display:block; font-size:15px; color:var(--tinta); }
  .det-num small{ display:block; color:var(--texto-3); font-size:12px; }
  .det-total{ display:flex; justify-content:space-between; align-items:baseline; border-top:2px solid var(--tinta); margin-top:6px; padding-top:12px; }
  .det-total strong{ font-size:22px; color:var(--tinta); }
  @media (max-width:560px){
    .det-datos{ grid-template-columns:1fr; }
    .det-items li{ grid-template-columns:44px minmax(0,1fr); }
    .det-img{ width:44px; height:44px; }
    .det-num{ grid-column:2; text-align:left; }
  }

  /* Descuentos */
  .paso{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--tinta); color:#fff; font-size:11.5px; margin-right:6px; }
  .resumen{ margin-top:14px; padding:12px 14px; border-left:4px solid var(--azul); background:var(--azul-suave); border-radius:6px; font-size:14px; line-height:1.55; }
  .resumen:empty{ display:none; }
  .prueba-res{ font-size:14.5px; margin-top:14px; line-height:1.5; }
  .prueba-res .precio{ font-size:26px; font-weight:700; color:var(--tinta); display:block; margin:4px 0; }

  /* Existencias */
  .muestras{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .muestra{ border:1px solid var(--linea); border-radius:var(--radio); padding:14px 16px; }
  .muestra h3{ margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.4px; color:var(--texto-3); display:flex; align-items:center; gap:8px; }
  .muestra h3 svg{ width:16px; height:16px; }
  .muestra ul{ list-style:none; margin:0; padding:0; font-size:13.5px; }
  .muestra li{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--linea-suave); }
  .muestra li:last-child{ border-bottom:none; }
  .muestra li span:first-child{ color:var(--texto-3); }
  .estado-stock{ font-weight:600; font-size:12.5px; border-radius:6px; padding:2px 8px; }
  .estado-stock.ok{ background:var(--ok-suave); color:var(--ok); }
  .estado-stock.off{ background:var(--off-suave); color:var(--off); }
  .permisos li{ padding:13px 0; }
  .tarjeta-sync{ display:flex; align-items:center; gap:14px; }

async function cargarProductos(){
  try {
    // Normalmente un solo archivo liviano (catalogo-tienda.json); si no existe, los originales.
    let a, b;
    const cat = await fetch('catalogo-tienda.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
    if (cat){ a = { productos: cat.productos || [] }; b = { productos: cat.manuales || [] }; infoCatalogo = { generado: cat.generado }; }
    else {
      [a, b] = await Promise.all([
        fetch('productos.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({ productos: [] })),
        fetch('productos_manuales.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({ productos: [] })),
      ]);
      infoCatalogo = { generado: a.generado };
    }
    const man = (b.productos || []).filter(p => p.modelo !== 'EJEMPLO-BORRAR').map(p => Object.assign(p, { _manual: true }));
    const set = new Set(man.map(p => p.modelo));
    productos = man.concat((a.productos || []).filter(p => !set.has(p.modelo)));
  } catch (e){ productos = []; }
}
const marcas = () => [...new Set(productos.map(p => (p.marca || '').toUpperCase()).filter(Boolean))].sort();

async function iniciar(){

  if ($('l-a-clave')) $('l-a-clave').onclick = () => { adminModo = 'clave'; pantallaLogin(); };

    sb.from('tipos_cliente').select('*').order('orden'),

const nombreTipo = (id) => (tipos.find(t => t.id === id) || {}).nombre || id || '—';
const nombreCliente = (email) => { const c = clientes.find(x => x.email === email); return c ? (c.nombre || c.empresa || email) : email; };

}

/* ---------- Pedidos ---------- */
let filtroEstado = '', buscaPed = '';
const ARCH = 'archivados';
const itemsDe = (pd) => Array.isArray(pd.items) ? pd.items : [];
const clienteDe = (pd) => clientes.find(x => x.email === pd.cliente_email) || { email: pd.cliente_email };
const productoDe = (modelo) => productos.find(p => p.modelo === modelo);
const rutaImagen = (src) => !src ? '' : /^(https?:)?\/\//.test(src) || src.startsWith('/') ? src : '/' + src;
const linkWhatsApp = (tel) => {
  let d = String(tel || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('0')) d = '58' + d.slice(1);       // 0414… → 58414…
  return 'https://wa.me/' + d;
};

function vistaPedidos(){
  const activos = pedidos.filter(p => !p.archivado);

  const nArch = pedidos.length - activos.length;
  $('main').innerHTML = cabecera('Pedidos', 'Los pedidos que los clientes con cuenta envían por WhatsApp. Ábrelos para ver el detalle, cambia el estado y deja un comentario: el cliente lo ve en "Mi cuenta".',
      '<button class="btn" id="p-recargar">' + ICO.sync + 'Actualizar</button>') +
    '<div class="caja"><div class="caja-cab" style="margin-bottom:0"><div class="chips" id="p-chips">' +
      '<button class="chip' + (!filtroEstado ? ' activo' : '') + '" data-f="">Todos <b>' + cuenta('') + '</b></button>' +
      ESTADOS.map(e => '<button class="chip' + (filtroEstado === e[0] ? ' activo' : '') + '" data-f="' + e[0] + '">' + e[1] + ' <b>' + cuenta(e[0]) + '</b></button>').join('') +
      '<button class="chip sep' + (filtroEstado === ARCH ? ' activo' : '') + '" data-f="' + ARCH + '">' + ICO.archivar.replace('<svg', '<svg width="14" height="14"') + 'Archivados <b>' + nArch + '</b></button>' +
    '</div><div class="buscar">' + ICO.buscar + '<input id="p-busca" placeholder="Buscar cliente, # o modelo" value="' + esc(buscaPed) + '"></div></div></div>' +
    '<div class="pedidos" id="p-lista"></div>';
  document.querySelectorAll('#p-chips .chip').forEach(ch => ch.onclick = () => { filtroEstado = ch.dataset.f; vistaPedidos(); });
  $('p-busca').oninput = (e) => { buscaPed = e.target.value; pintarPedidos(); };
  $('p-recargar').onclick = async () => { const err = await cargarPedidos(); if (err) toast('Error: ' + mensajeError(err)); pintarBadges(); vistaPedidos(); };
  pintarPedidos();

function pintarPedidos(){
  const q = buscaPed.trim().toLowerCase();
  const verArch = filtroEstado === ARCH;
  const lista = pedidos.filter(pd => {
    if (!!pd.archivado !== verArch) return false;
    if (!verArch && filtroEstado && pd.estado !== filtroEstado) return false;
    if (!q) return true;
    const c = clienteDe(pd);
    return ['#' + pd.id, String(pd.id), pd.cliente_email, c.nombre, c.empresa, c.rif].concat(itemsDe(pd).map(it => it.modelo)).join(' ').toLowerCase().includes(q);
  });
  if (!lista.length){
    $('p-lista').innerHTML = '<div class="caja vacio">' + (verArch ? ICO.archivar + 'No hay pedidos archivados.' : ICO.pedidos + (pedidos.length ? 'No hay pedidos con este filtro.' : 'Todavía no hay pedidos.')) + '</div>';
    return;
  }
  const MAX = 5;
  $('p-lista').innerHTML = lista.map(pd => {
    const c = clienteDe(pd);
    const items = itemsDe(pd);
    return '<article class="pedido' + (pd.archivado ? ' archivado' : '') + '">' +
      '<div><div class="pd-num"><button class="abrir" data-ver-pedido="' + pd.id + '" title="Ver detalle"><strong>#' + pd.id + '</strong></button><select class="estado-sel e-' + pd.estado + '" data-estado="' + pd.id + '" aria-label="Estado del pedido">' +
        ESTADOS.map(e => '<option value="' + e[0] + '"' + (pd.estado === e[0] ? ' selected' : '') + '>' + e[1] + '</option>').join('') + '</select>' +
        (pd.archivado ? '<span class="pill">Archivado</span>' : '') + '</div>' +
        '<div class="persona"><div class="avatar">' + esc(iniciales(c)) + '</div><div><strong>' + esc(c.nombre || '—') + '</strong>' +
        (c.empresa ? '<span>' + esc(c.empresa) + '</span><br>' : '') + '<span>' + esc(pd.cliente_email) + (c.telefono ? ' · ' + esc(c.telefono) : '') + '</span></div></div>' +
        '<div class="muted" style="margin-top:10px">' + fecha(pd.creado) + '</div>' +
        (pd.nota_cliente ? '<div class="ayuda" style="margin:10px 0 0"><strong>Nota del cliente:</strong> ' + esc(pd.nota_cliente) + '</div>' : '') + '</div>' +
      '<div><ul class="items">' + items.slice(0, MAX).map(it => '<li><span class="can">' + esc(it.cantidad) + '×</span><span class="mono">' + esc(it.modelo) + '</span><span class="pre">' + money(it.precio_unit) + '</span></li>').join('') +
        (items.length > MAX ? '<li class="mas" data-ver-pedido="' + pd.id + '">+ ' + (items.length - MAX) + ' producto' + (items.length - MAX > 1 ? 's' : '') + ' más · ver detalle</li>' : '') + '</ul>' +
        '<div class="pd-total">' + money(pd.total) + '</div></div>' +
      '<div class="nota-wrap"><label class="campo">Comentario para el cliente<textarea rows="2" data-nota="' + pd.id + '" placeholder="Ej. Listo para retirar">' + esc(pd.nota_admin || '') + '</textarea></label>' +
        '<div><button class="btn chico" data-guardar-nota="' + pd.id + '">Guardar comentario</button></div>' +
        '<div class="pd-acciones">' +
          '<button class="btn chico" data-ver-pedido="' + pd.id + '">' + ICO.ojo + 'Ver detalle</button>' +
          '<button class="btn chico" data-archivar="' + pd.id + '">' + ICO.archivar + (pd.archivado ? 'Desarchivar' : 'Archivar') + '</button>' +
          '<button class="btn chico peligro" data-borrar="' + pd.id + '" title="Eliminar pedido">' + ICO.borrar + 'Eliminar</button>' +
        '</div></div>' +
    '</article>';
  }).join('');
  document.querySelectorAll('#p-lista [data-estado]').forEach(s => s.onchange = () => guardarEstado(s.dataset.estado, s.value, s));
  document.querySelectorAll('#p-lista [data-guardar-nota]').forEach(b => b.onclick = () =>
    guardarNota(b.dataset.guardarNota, document.querySelector('#p-lista [data-nota="' + b.dataset.guardarNota + '"]').value));
  document.querySelectorAll('#p-lista [data-ver-pedido]').forEach(b => b.onclick = () => abrirPedido(b.dataset.verPedido));
  document.querySelectorAll('#p-lista [data-archivar]').forEach(b => b.onclick = () => archivarPedido(b.dataset.archivar));
  document.querySelectorAll('#p-lista [data-borrar]').forEach(b => b.onclick = () => eliminarPedido(b.dataset.borrar));
}

/* Acciones sobre un pedido (se usan desde la lista y desde el detalle) */
const pedidoPorId = (id) => pedidos.find(p => String(p.id) === String(id));
function refrescarDetrasDelPanel(){
  if (tab === 'pedidos') vistaPedidos();
  else if (tab === 'resumen') vistaResumen();
  pintarBadges();
}
async function guardarEstado(id, estado, sel){
  const { error } = await sb.from('pedidos').update({ estado }).eq('id', id);
  if (error){ toast('Error: ' + mensajeError(error)); if (sel) sel.value = (pedidoPorId(id) || {}).estado; return; }
  const pd = pedidoPorId(id); if (pd) pd.estado = estado;
  document.querySelectorAll('[data-estado="' + id + '"]').forEach(s => { s.value = estado; s.className = 'estado-sel e-' + estado; });
  pintarBadges(); toast('Estado: ' + nombreEstado(estado));
}
async function guardarNota(id, texto){
  const nota = String(texto || '').trim() || null;
  const { error } = await sb.from('pedidos').update({ nota_admin: nota }).eq('id', id);
  if (error) return toast('Error: ' + mensajeError(error));
  const pd = pedidoPorId(id); if (pd) pd.nota_admin = nota;
  document.querySelectorAll('[data-nota="' + id + '"]').forEach(t => { t.value = nota || ''; });
  toast('Comentario guardado');
}
async function archivarPedido(id){
  const pd = pedidoPorId(id); if (!pd) return;
  const archivar = !pd.archivado;
  const { error } = await sb.from('pedidos').update({ archivado: archivar, archivado_en: archivar ? new Date().toISOString() : null }).eq('id', id);
  if (error) return toast('Error: ' + mensajeError(error));
  pd.archivado = archivar; pd.archivado_en = archivar ? new Date().toISOString() : null;
  toast('Pedido #' + id + (archivar ? ' archivado' : ' vuelve a la lista'));
  if ($('panel').classList.contains('ver') && $('panel').dataset.pedido === String(id)) abrirPedido(id);
  refrescarDetrasDelPanel();
}
async function eliminarPedido(id){
  const pd = pedidoPorId(id); if (!pd) return;
  const c = clienteDe(pd);
  if (!confirm('¿Eliminar el pedido #' + id + ' de ' + (c.nombre || c.empresa || c.email) + ' (' + money(pd.total) + ')?\n\n' +
    'Se borra para siempre, también de "Mi cuenta" del cliente. No se puede deshacer.\n' +
    'Si solo quieres sacarlo de la lista, usa "Archivar".')) return;
  const { data, error } = await sb.from('pedidos').delete().eq('id', id).select('id');
  if (error) return toast('Error: ' + mensajeError(error));
  if (!data || !data.length) return toast('No se pudo eliminar: ' + mensajeError({ message: 'permission denied' }));
  pedidos = pedidos.filter(p => String(p.id) !== String(id));
  if ($('panel').dataset.pedido === String(id)) cerrarPanel();
  toast('Pedido #' + id + ' eliminado');
  refrescarDetrasDelPanel();
}

/* Detalle de un pedido (panel lateral) */
function abrirPedido(id){
  const pd = pedidoPorId(id); if (!pd) return;
  const c = clienteDe(pd);
  const items = itemsDe(pd);
  const unidades = items.reduce((s, it) => s + Number(it.cantidad || 0), 0);
  const suma = items.reduce((s, it) => s + Number(it.precio_unit || 0) * Number(it.cantidad || 0), 0);
  const wa = linkWhatsApp(c.telefono);
  const dato = (t, v) => '<div><span>' + t + '</span>' + (v || '<span class="muted" style="text-transform:none;font-weight:400;letter-spacing:0;font-size:14px;color:var(--texto-3)">—</span>') + '</div>';

  const filas = items.map(it => {
    const p = productoDe(it.modelo);
    const desc = (p && p.descripcion) || it.descripcion || '';
    const img = rutaImagen(p && (p.imagen || (p.imagenes || [])[0]));
    const marca = it.marca || (p && p.marca) || '';
    const cat = p && (p.subcategoria || p.categoria_principal);
    const sub = Number(it.precio_unit || 0) * Number(it.cantidad || 0);
    const lista = it.precio_lista != null ? Number(it.precio_lista) : null;
    const dcto = lista && it.precio_unit != null && lista > 0 ? Math.round((1 - Number(it.precio_unit) / lista) * 100) : null;
    return '<li><div class="det-img">' + (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" onerror="this.remove()">' : ICO.caja) + '</div>' +
      '<div><div class="det-mod">' + (p ? '<a href="/p/' + slugDe(it.modelo) + '" target="_blank" rel="noopener">' + esc(it.modelo) + ' ↗</a>' : esc(it.modelo)) +
        (marca ? ' <span class="pill" style="font-family:var(--sans);margin-left:4px">' + esc(marca) + '</span>' : '') + '</div>' +
        (desc ? '<div class="det-desc">' + esc(desc) + '</div>' : '<div class="det-desc muted">Sin descripción</div>') +
        (cat ? '<div class="det-cat">' + esc(cat) + '</div>' : '') +
        (!p ? '<div class="det-cat" style="color:var(--amarillo-texto)">Ya no está en el catálogo actual</div>' : '') + '</div>' +
      '<div class="det-num"><strong>' + money(sub) + '</strong>' + esc(it.cantidad) + ' × ' + money(it.precio_unit) +
        (lista != null ? '<small>Lista ' + money(lista) + (dcto > 0 ? ' · −' + dcto + '%' : '') + '</small>' : '') + '</div></li>';
  }).join('');

  abrirPanel(
    '<div class="panel-cab"><h2>Pedido #' + pd.id + '</h2>' + pillEstado(pd.estado) + (pd.archivado ? '<span class="pill">Archivado</span>' : '') +
      '<button class="btn chico fantasma cerrar" id="d-cerrar" aria-label="Cerrar">' + ICO.cerrar + '</button></div>' +
    '<div class="panel-cuerpo">' +
      '<div class="seccion"><h3>Cliente</h3><div class="persona" style="margin-bottom:12px"><div class="avatar">' + esc(iniciales(c)) + '</div><div><strong>' + esc(c.nombre || c.empresa || c.email) + '</strong>' +
        (c.nombre && c.empresa ? '<span>' + esc(c.empresa) + '</span>' : '') + '</div></div>' +
        '<div class="det-datos">' +
          dato('Correo', '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>') +
          dato('Teléfono', c.telefono ? esc(c.telefono) + (wa ? ' · <a href="' + wa + '" target="_blank" rel="noopener">WhatsApp ↗</a>' : '') : '') +
          dato('RIF', c.rif ? esc(c.rif) : '') +
          dato('Tipo de cliente', c.tipo_id ? esc(nombreTipo(c.tipo_id)) : '') +
        '</div></div>' +
      '<div class="seccion"><h3>Pedido</h3><div class="det-datos">' +
        dato('Recibido', fecha(pd.creado)) +
        dato('Última actualización', fecha(pd.actualizado)) +
        dato('Estado', '<select class="estado-sel e-' + pd.estado + '" data-estado="' + pd.id + '" id="d-estado">' + ESTADOS.map(e => '<option value="' + e[0] + '"' + (pd.estado === e[0] ? ' selected' : '') + '>' + e[1] + '</option>').join('') + '</select>') +
        dato('Contenido', items.length + ' producto' + (items.length === 1 ? '' : 's') + ' · ' + unidades + ' unid.') +
      '</div>' +
      (pd.nota_cliente ? '<div class="ayuda" style="margin:14px 0 0"><strong>Nota del cliente:</strong> ' + esc(pd.nota_cliente) + '</div>' : '') + '</div>' +
      '<div class="seccion"><h3>Productos</h3>' +
        (items.length ? '<ul class="det-items">' + filas + '</ul>' : '<div class="vacio">Este pedido no tiene productos.</div>') +
        '<div class="det-total"><span class="muted">Total' + (pd.total != null && Math.abs(Number(pd.total) - suma) > 1 ? ' (registrado; la suma da ' + money(suma) + ')' : '') + '</span><strong>' + money(pd.total != null ? pd.total : suma) + '</strong></div>' +
      '</div>' +
      '<div class="seccion"><h3>Comentario para el cliente</h3><div class="nota-wrap"><textarea rows="3" data-nota="' + pd.id + '" id="d-nota" placeholder="Ej. Listo para retirar">' + esc(pd.nota_admin || '') + '</textarea>' +
        '<div><button class="btn chico" id="d-guardar-nota">Guardar comentario</button></div></div></div>' +
    '</div>' +
    '<div class="panel-pie">' +
      '<button class="btn" id="d-copiar">Copiar lista</button>' +
      '<button class="btn" id="d-archivar">' + ICO.archivar + (pd.archivado ? 'Desarchivar' : 'Archivar') + '</button>' +
      '<button class="btn peligro" id="d-borrar">' + ICO.borrar + 'Eliminar</button>' +
      '<button class="btn prim" id="d-listo" style="margin-left:auto">Cerrar</button>' +
    '</div>', true);
  $('panel').dataset.pedido = String(pd.id);

  $('d-cerrar').onclick = $('d-listo').onclick = cerrarPanel;
  $('d-estado').onchange = async (e) => { await guardarEstado(pd.id, e.target.value, e.target); abrirPedido(pd.id); refrescarDetrasDelPanel(); };
  $('d-guardar-nota').onclick = () => guardarNota(pd.id, $('d-nota').value);
  $('d-archivar').onclick = () => archivarPedido(pd.id);
  $('d-borrar').onclick = () => eliminarPedido(pd.id);
  $('d-copiar').onclick = async () => {
    const texto = 'Pedido #' + pd.id + ' · ' + (c.nombre || c.empresa || c.email) + '\n' +
      items.map(it => it.cantidad + ' × ' + it.modelo + (it.descripcion ? ' — ' + it.descripcion : '') + ' — ' + money(it.precio_unit) + ' c/u').join('\n') +
      '\nTotal: ' + money(pd.total != null ? pd.total : suma);
    try { await navigator.clipboard.writeText(texto); toast('Lista copiada'); } catch (e) { toast('No se pudo copiar'); }
  };
}

function vistaClientes(){
  $('main').innerHTML = cabecera('Clientes', 'Crea clientes antes de que entren: cuando entren con ese correo verán sus precios automáticamente.',
      '<button class="btn" id="c-bloquear-correo">' + ICO.bloquear + 'Bloquear un correo</button><button class="btn prim" id="c-nuevo">' + ICO.mas + 'Nuevo cliente</button>') +
    '<div class="caja"><form id="c-form-bloq" class="fila" style="margin-bottom:16px" hidden><label class="campo" style="flex:1 1 260px">Correo a bloquear (aunque todavía no se haya registrado)<input name="email" type="email" required placeholder="correo@ejemplo.com"></label>' +
      '<button class="btn peligro">Bloquear</button><button type="button" class="btn" id="c-bloq-cancelar">Cancelar</button></form>' +
    '<div class="caja-cab"><div class="chips" id="c-chips">' + FILTROS_CLI.map(f => '<button class="chip' + (filtroCli === f[0] ? ' activo' : '') + '" data-f="' + f[0] + '">' + f[1] + ' <b>' + clientes.filter(f[2]).length + '</b></button>').join('') + '</div>' +
      '<div class="buscar">' + ICO.buscar + '<input id="c-busca" placeholder="Buscar nombre, correo, RIF…" value="' + esc(buscaCli) + '"></div></div>' +
    '<div class="tabla-wrap" id="c-tabla"></div></div>';
  $('c-busca').oninput = (e) => { buscaCli = e.target.value; pintarClientes(); };
  document.querySelectorAll('#c-chips .chip').forEach(ch => ch.onclick = () => { filtroCli = ch.dataset.f; vistaClientes(); });
  $('c-nuevo').onclick = () => abrirCliente({});
  $('c-bloquear-correo').onclick = () => { $('c-form-bloq').hidden = false; $('c-form-bloq').elements.email.focus(); };
  $('c-bloq-cancelar').onclick = () => { $('c-form-bloq').hidden = true; };
  $('c-form-bloq').onsubmit = async (e) => {
    e.preventDefault();
    const email = e.target.elements.email.value.trim().toLowerCase();
    if (email === yo.email) return toast('No puedes bloquear tu propia cuenta');
    const existe = clientes.some(c => c.email === email);
    const res = existe ? await sb.from('clientes').update({ activo: false }).eq('email', email)
                       : await sb.from('clientes').insert({ email, activo: false, tipo_id: null });
    if (res.error) return toast('Error: ' + mensajeError(res.error));
    await recargarBase(); toast(email + ' bloqueado'); vistaClientes();
  };
  pintarClientes();
}
function pintarClientes(){
  const q = buscaCli.toLowerCase();
  const f = (FILTROS_CLI.find(x => x[0] === filtroCli) || FILTROS_CLI[0])[2];
  const lista = clientes.filter(c => f(c) && (!q || [c.email, c.nombre, c.empresa, c.rif, c.telefono].join(' ').toLowerCase().includes(q)));
  if (!lista.length){ $('c-tabla').innerHTML = '<div class="vacio">' + ICO.clientes + 'No hay clientes aquí.</div>'; return; }
  $('c-tabla').innerHTML = '<table><thead><tr><th>Cliente</th><th>Tipo</th><th>Contacto</th><th>Acceso</th><th>Descuentos</th><th>Estado</th><th></th></tr></thead><tbody>' +
    lista.map(c => {
      const n = reglas.filter(r => r.cliente_email === c.email).length;
      const ms = motivoStock(c);
      return '<tr class="' + (c.activo === false ? 'inactivo' : '') + '"><td><div class="persona"><div class="avatar' + (c.es_admin ? ' admin' : '') + '">' + esc(iniciales(c)) + '</div><div><strong>' + esc(c.nombre || '—') + '</strong>' +
          (c.empresa ? '<span>' + esc(c.empresa) + '</span><br>' : '') + '<span>' + esc(c.email) + '</span></div></div></td>' +
        '<td>' + (c.tipo_id ? '<span class="pill azul">' + esc(nombreTipo(c.tipo_id)) + '</span>' : '<span class="muted">—</span>') + '</td>' +
        '<td class="muted">' + esc([c.rif, c.telefono].filter(Boolean).join(' · ') || '—') + '</td>' +
        '<td>' + (c.es_admin ? '<span class="pill tinta">Admin</span> ' : '') + (ms && !c.es_admin ? '<span class="pill verde" title="' + esc(ms) + '">' + ICO.ojo.replace('<svg', '<svg width="13" height="13"') + 'Existencias</span>' : '') + (!ms && !c.es_admin ? '<span class="muted">Estándar</span>' : '') + '</td>' +
        '<td>' + (n ? '<span class="pill amar">' + n + ' regla' + (n > 1 ? 's' : '') + '</span>' : '<span class="muted">—</span>') + '</td>' +
        '<td>' + (c.activo === false ? '<span class="pill rojo"><span class="punto"></span>Bloqueado</span>' : c.user_id ? '<span class="pill verde"><span class="punto"></span>Ya entró</span>' : '<span class="pill"><span class="punto"></span>Sin entrar</span>') + '</td>' +
        '<td class="acciones">' + (c.es_admin ? '' : '<button class="btn chico fantasma" data-act="' + esc(c.email) + '" title="Qué busca, mira y cotiza">' + ICO.grafica + 'Actividad</button> ') + '<button class="btn chico" data-edit="' + esc(c.email) + '">Editar</button></td></tr>';
    }).join('') + '</tbody></table>';
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => abrirCliente(clientes.find(c => c.email === b.dataset.edit)));
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => abrirActividad(b.dataset.act));
}

  $('panel').innerHTML = html; $('panel').scrollTop = 0; $('panel').classList.add('ver'); $('panel').setAttribute('aria-hidden', 'false'); $('velo').classList.add('ver');

    toast('Cliente borrado' + (data && data.pedidos_borrados ? ' (' + data.pedidos_borrados + ' pedidos)' : ''));
    pintarBadges(); vistaClientes();

    const d = {};
    ['email', 'nombre', 'empresa', 'rif', 'telefono', 'direccion', 'tipo_id'].forEach(k => d[k] = f.elements[k].value.trim() || null);

    await recargarBase(); cerrarPanel(); toast(nuevo ? 'Cliente creado' : 'Cambios guardados');
    if (tab === 'clientes') vistaClientes(); else mostrar();
  };
}

/* ---------- Descuentos ---------- */
let reglaDestinoInicial = '';
// Misma lógica que la tienda: gana la regla más específica.
const RANGO = { '00': 1, '01': 2, '02': 3, '10': 4, '20': 5, '11': 6, '21': 7, '12': 8, '22': 9 };
function reglaPara(p, email, tipo){
  const marca = String(p.marca || '').toUpperCase().trim(), modelo = String(p.modelo || '').toUpperCase().trim();
  let mejor = null, mr = 99;
  for (const r of reglas){
    if (!r.activo) continue;
    let quien, que;
    if (r.cliente_email){ if (r.cliente_email !== email) continue; quien = 0; }
    else if (r.tipo_id){ if (r.tipo_id !== tipo) continue; quien = 1; }
    else quien = 2;
    if (r.modelo){ if (String(r.modelo).toUpperCase().trim() !== modelo) continue; que = 0; }
    else if (r.marca){ if (String(r.marca).toUpperCase().trim() !== marca) continue; que = 1; }
    else que = 2;
    if (p._manual && que === 2) continue;
    const k = RANGO['' + que + quien];
    if (k < mr){ mejor = r; mr = k; }
  }
  return mejor;
}
function precioPara(p, email, tipo){
  const r = reglaPara(p, email, tipo);
  if (r && r.precio_fijo != null) return { precio: Number(r.precio_fijo), r };
  if (p.precio == null) return { precio: null, r };
  if (r) return { precio: Number(p.precio) * (1 - Number(r.descuento_pct) / 100), r };
  return { precio: Number(p.precio), r: null };
}
function describirQuien(r){ return r.cliente_email ? '<div class="persona" style="min-width:0"><div class="avatar" style="width:30px;height:30px;font-size:12px">' + esc(iniciales(clientes.find(c => c.email === r.cliente_email) || { email: r.cliente_email })) + '</div><div><strong>' + esc(nombreCliente(r.cliente_email)) + '</strong><span>' + esc(r.cliente_email) + '</span></div></div>' : r.tipo_id ? '<span class="pill azul">' + esc(nombreTipo(r.tipo_id)) + '</span>' : '<span class="pill tinta">Todos</span>'; }
function describirQue(r){ return r.modelo ? 'Modelo <span class="mono">' + esc(r.modelo) + '</span>' : r.marca ? 'Marca <strong>' + esc(r.marca) + '</strong>' : 'Todo el catálogo'; }

      '</select></label></div><div class="tabla-wrap" id="r-lista"></div></div>';

  const f = $('r-form');
  if (filtro) f.elements.destino.value = filtro.startsWith('c:') || filtro.startsWith('tp:') ? filtro : 't:';
  const leerForm = () => {
    const [k, v] = f.elements.destino.value.split(/:(.*)/s);
    const alc = f.elements.alcance.value;
    return {
      k, v, alc, forma: f.elements.forma.value, valor: Number(f.elements.valor.value),
      marca: alc === 'marca' ? f.elements.marca.value.toUpperCase() : null,
      modelo: alc === 'modelo' ? f.elements.modelo.value.trim() : null,
    };
  };
  const nombreDestino = (x) => x.k === 'c' ? nombreCliente(x.v) : x.k === 'tp' ? 'Los clientes tipo ' + nombreTipo(x.v) : 'Todos (visitantes y clientes)';
  const nombreAlcance = (x) => x.alc === 'marca' ? 'en ' + x.marca : x.alc === 'modelo' ? 'en el modelo ' + (x.modelo || '…') : 'en todos los productos';
  // Descuento que tiene HOY ese destino en esos productos (sin contar una regla idéntica que se vaya a reemplazar).
  const baseActual = (x) => {
    const email = x.k === 'c' ? x.v : null;
    const cli = email ? clientes.find(c => c.email === email) : null;
    const tipo = x.k === 'tp' ? x.v : (cli ? cli.tipo_id : null);
    const p = { marca: x.marca || '', modelo: x.modelo || '' };
    const guardadas = reglas;
    reglas = reglas.filter(r => !mismaClave(r, x));
    const r = reglaPara(p, email, tipo);
    reglas = guardadas;
    return r;
  };
  const mismaClave = (r, x) => (r.cliente_email || null) === (x.k === 'c' ? x.v : null) && (r.tipo_id || null) === (x.k === 'tp' ? x.v : null) &&
    (r.marca || null) === x.marca && String(r.modelo || '').toUpperCase() === String(x.modelo || '').toUpperCase();
  const pctTotal = (base, extra) => Math.round((100 - (100 - base) * (100 - extra) / 100) * 100) / 100;

  const sync = () => {
    const x = leerForm();
    $('r-marca-l').hidden = x.alc !== 'marca';
    $('r-modelo-l').hidden = x.alc !== 'modelo';
    const fijo = f.elements.forma.querySelector('[value=fijo]');
    fijo.disabled = x.alc !== 'modelo';
    if (fijo.disabled && f.elements.forma.value === 'fijo') f.elements.forma.value = 'adic';
    const forma = f.elements.forma.value;
    f.elements.valor.placeholder = forma === 'fijo' ? '180.00' : forma === 'adic' ? '10' : '65';
    const base = baseActual(x);
    const hoy = !base ? 'precio de lista (sin descuento)'
      : base.precio_fijo != null ? 'precio fijo de ' + money(base.precio_fijo)
      : Number(base.descuento_pct) + '% de descuento (' + (base.cliente_email ? 'regla propia' : base.tipo_id ? 'por ser ' + nombreTipo(base.tipo_id) : base.marca ? 'regla de ' + base.marca + ' para todos' : 'descuento general') + ')';
    let nuevo = '';
    if (x.valor > 0 || (forma !== 'adic' && f.elements.valor.value !== '')){
      if (forma === 'fijo') nuevo = 'precio fijo de <strong>' + money(x.valor) + '</strong>';
      else if (forma === 'pct') nuevo = '<strong>' + x.valor + '%</strong> de descuento total';
      else if (base && base.precio_fijo != null) nuevo = '<span style="color:var(--off)">no se puede sumar a un precio fijo; usa "Precio fijo"</span>';
      else { const b = base ? Number(base.descuento_pct) : 0; nuevo = '<strong>' + pctTotal(b, x.valor) + '%</strong> de descuento total (' + b + '% + ' + x.valor + '% adicional sobre su precio)'; }
    }
    $('r-resumen').innerHTML = '<strong>' + esc(nombreDestino(x)) + '</strong> ' + esc(nombreAlcance(x)) + ':<br>Hoy: ' + hoy +
      (nuevo ? '<br>Con esta regla: ' + nuevo : '');
  };
  ['destino', 'alcance', 'marca', 'forma'].forEach(n => f.elements[n].addEventListener('change', sync));
  ['modelo', 'valor'].forEach(n => f.elements[n].addEventListener('input', sync));
  sync();

  f.onsubmit = async (e) => {
    e.preventDefault();
    $('r-err').textContent = '';
    const x = leerForm();
    const d = { cliente_email: x.k === 'c' ? x.v : null, tipo_id: x.k === 'tp' ? x.v : null, marca: x.marca, modelo: x.modelo,
                descuento_pct: null, precio_fijo: null, nota: f.elements.nota.value.trim() || null };
    if (x.alc === 'modelo' && !d.modelo){ $('r-err').textContent = 'Escribe el modelo.'; return; }
    if (!(x.valor >= 0)){ $('r-err').textContent = 'Escribe el valor.'; return; }
    if (x.forma === 'fijo') d.precio_fijo = x.valor;
    else if (x.forma === 'pct'){
      if (x.valor > 100){ $('r-err').textContent = 'El descuento no puede pasar de 100%.'; return; }
      d.descuento_pct = x.valor;
    } else {
      const base = baseActual(x);
      if (base && base.precio_fijo != null){ $('r-err').textContent = 'Ese producto tiene precio fijo; usa "Precio fijo".'; return; }
      const b = base ? Number(base.descuento_pct) : 0;
      d.descuento_pct = pctTotal(b, x.valor);
      if (!d.nota) d.nota = b + '% + ' + x.valor + '% adicional';
    }
    const igual = reglas.find(r => mismaClave(r, x));
    const res = igual ? await sb.from('reglas_descuento').update(Object.assign({ activo: true }, d)).eq('id', igual.id)
                      : await sb.from('reglas_descuento').insert(d);
    if (res.error){ $('r-err').textContent = mensajeError(res.error); return; }
    await recargarBase(); toast(igual ? 'Regla actualizada' : 'Regla guardada');
    reglaDestinoInicial = f.elements.destino.value; vistaDescuentos();
  };

  const pintarLista = () => {
    const fil = $('r-filtro').value;
    const lista = reglas.filter(r => !fil || (fil === 't:' ? (!r.cliente_email && !r.tipo_id) : fil.startsWith('tp:') ? r.tipo_id === fil.slice(3) : r.cliente_email === fil.slice(2)));
    $('r-lista').innerHTML = !lista.length ? '<div class="vacio">' + ICO.descuentos + 'No hay reglas aquí.</div>' :
      '<table><thead><tr><th>A quién</th><th>Aplica a</th><th>Precio</th><th>Nota</th><th>Activa</th><th></th></tr></thead><tbody>' +
      lista.map(r => '<tr class="' + (r.activo ? '' : 'inactivo') + '"><td>' + describirQuien(r) + '</td><td>' + describirQue(r) + '</td>' +
        '<td><strong>' + (r.precio_fijo != null ? money(r.precio_fijo) + ' fijo' : Number(r.descuento_pct) + '% dto.') + '</strong></td>' +
        '<td class="muted">' + esc(r.nota || '') + '</td>' +
        '<td><label class="switch solo"><input type="checkbox" data-activa="' + r.id + '"' + (r.activo ? ' checked' : '') + ' aria-label="Regla activa"><span class="sw"></span></label></td>' +
        '<td class="acciones"><button class="btn chico peligro" data-borrar="' + r.id + '">Eliminar</button></td></tr>').join('') + '</tbody></table>';
    document.querySelectorAll('[data-activa]').forEach(ch => ch.onchange = async () => {
      const { error } = await sb.from('reglas_descuento').update({ activo: ch.checked }).eq('id', ch.dataset.activa);
      if (error) return toast('Error: ' + mensajeError(error));
      await recargarBase(); pintarLista(); toast(ch.checked ? 'Regla activada' : 'Regla desactivada');
    });
    document.querySelectorAll('[data-borrar]').forEach(b => b.onclick = async () => {
      if (!confirm('¿Eliminar esta regla?')) return;
      const { error } = await sb.from('reglas_descuento').delete().eq('id', b.dataset.borrar);
      if (error) return toast('Error: ' + mensajeError(error));
      await recargarBase(); pintarLista(); toast('Regla eliminada');
    });
  };
  $('r-filtro').onchange = () => { reglaDestinoInicial = $('r-filtro').value; pintarLista(); };
  pintarLista();

  const probar = () => {
    const m = $('pr-modelo').value.trim().toUpperCase();
    const p = productos.find(x => String(x.modelo || '').toUpperCase() === m);
    if (!m){ $('pr-res').innerHTML = ''; return; }
    if (!p){ $('pr-res').innerHTML = '<span class="muted">Modelo no encontrado en el catálogo.</span>'; return; }
    const email = $('pr-quien').value || null;
    const c = clientes.find(x => x.email === email);
    const { precio, r } = precioPara(p, email, c ? c.tipo_id : null);
    $('pr-res').innerHTML = '<span class="mono">' + esc(p.modelo) + '</span> · ' + esc(p.marca || '') + '<span class="precio">' + money(precio) + '</span>' +
      '<span class="muted">Lista ' + money(p.precio) + ' · ' +
      (r ? 'por la regla: ' + (r.cliente_email ? esc(nombreCliente(r.cliente_email)) : r.tipo_id ? esc(nombreTipo(r.tipo_id)) : 'Todos') + ' · ' + describirQue(r).replace(/<[^>]+>/g, '') + ' · ' + (r.precio_fijo != null ? 'precio fijo' : Number(r.descuento_pct) + '%') : (p._manual ? 'producto cargado a mano: precio de catálogo, sin regla.' : 'sin regla: precio de lista.')) + '</span>';
  };
  $('pr-modelo').oninput = probar; $('pr-quien').onchange = probar;
}

/* ---------- Estadísticas ---------- */
let diasEst = 30;
const slugDe = (x) => String(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
async function vistaEstadisticas(){
  const chips = '<div class="chips">' + [[7, '7 días'], [30, '30 días'], [90, '90 días']].map(([d, t]) => '<button class="chip' + (diasEst === d ? ' activo' : '') + '" data-dias="' + d + '">' + t + '</button>').join('') + '</div>';
  $('main').innerHTML = cabecera('Estadísticas', 'Qué buscan, qué miran y qué cotizan tus clientes. Abajo, cada cliente con cuenta por separado. No se cuenta lo que haces tú como administrador.', chips) + '<div class="cargando">Cargando…</div>';
  document.querySelectorAll('[data-dias]').forEach(b => b.onclick = () => { diasEst = Number(b.dataset.dias); vistaEstadisticas(); });
  const [{ data, error }, resCli] = await Promise.all([
    sb.rpc('resumen_estadisticas', { dias: diasEst }),
    sb.rpc('clientes_activos', { dias: diasEst }).then(r => r, e => ({ error: e })),
  ]);
  if (tab !== 'estadisticas') return;
  const cont = document.querySelector('#main .cargando');
  if (error || !data){
    cont.outerHTML = '<div class="caja"><div class="tarjeta-sync"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar las estadísticas en Supabase</strong><div class="muted">Corre <span class="mono">04_estadisticas.sql</span> en Supabase → SQL Editor. Desde ese momento la tienda empieza a anotar búsquedas, visitas y cotizaciones.</div></div></div></div>';
    return;
  }
  sb.rpc('limpiar_eventos').then(() => {}, () => {});
  const t = data.totales || {};
  const cotiza = (t.cotizar_whatsapp || 0) + (t.pedido_whatsapp || 0);
  const kpi = (icono, titulo, num, pie) => '<div class="kpi"><div class="k-cab">' + titulo + icono + '</div><div class="k-num">' + Number(num || 0).toLocaleString('es-VE') + '</div><div class="k-pie">' + pie + '</div></div>';
  const prod = (m) => productos.find(p => p.modelo === m);
  const nomProd = (m) => { const p = prod(m); return '<a href="/p/' + slugDe(m) + '" target="_blank" rel="noopener" class="mono">' + esc(m) + '</a><small>' + esc(p ? [p.marca, p.descripcion || p.nombre].filter(Boolean).join(' · ') : 'Ya no está en el catálogo') + '</small>'; };
  const ranking = (lista, fila, vacio) => !lista || !lista.length ? '<div class="vacio">' + ICO.grafica + vacio + '</div>' :
    '<ol class="ranking">' + lista.slice(0, 15).map((x, i) => fila(x, i, lista)).join('') + '</ol>';
  const barra = (v, max) => '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * v / (max || 1))) + '%"></i></div>';

  // Gráfico por día (completa los días sin datos)
  const porDia = {}; (data.por_dia || []).forEach(d => { porDia[d.dia] = d; });
  const dias = [];
  for (let i = diasEst - 1; i >= 0; i--){
    const f = new Date(Date.now() - i * 86400000);
    const k = f.toLocaleDateString('en-CA', { timeZone: 'America/Caracas' });
    dias.push({ k, f, v: (porDia[k] || {}).vistas || 0, c: (porDia[k] || {}).cotiza || 0 });
  }
  const maxV = Math.max(1, ...dias.map(d => Math.max(d.v, d.c)));
  const cada = diasEst <= 7 ? 1 : diasEst <= 30 ? 5 : 15;
  const grafico = '<div class="grafico">' + dias.map(d => '<div class="col" title="' + d.f.toLocaleDateString('es-VE', { weekday: 'short', day: 'numeric', month: 'short' }) + ': ' + d.v + ' vistas, ' + d.c + ' cotizaciones">' +
      '<div class="b1" style="height:' + (100 * d.v / maxV) + '%"></div><div class="b2" style="height:' + (100 * d.c / maxV) + '%"></div></div>').join('') + '</div>' +
    '<div class="grafico-ejes">' + dias.map((d, i) => '<span>' + ((dias.length - 1 - i) % cada === 0 ? d.f.getDate() : '') + '</span>').join('') + '</div>';

  const maxB = Math.max(1, ...(data.buscado || []).map(x => x.veces));
  const maxS = Math.max(1, ...(data.sin_resultados || []).map(x => x.veces));
  const maxVi = Math.max(1, ...(data.vistos || []).map(x => x.veces));
  const totalCot = (x) => x.whatsapp + x.carrito + x.pedidos;
  const maxC = Math.max(1, ...(data.cotizados || []).map(totalCot));

  cont.outerHTML =
    '<div class="kpis">' +
      kpi(ICO.buscar, 'Búsquedas', t.busqueda, 'veces que usaron el buscador') +
      kpi(ICO.ojo, 'Productos vistos', t.ver_producto, 'fichas de producto abiertas') +
      kpi(ICO.tienda, 'Agregados al pedido', t.agregar_carrito, 'productos puestos en el carrito') +
      kpi(ICO.pedidos, 'Cotizaciones por WhatsApp', cotiza, (t.pedido_whatsapp || 0) + ' desde el carrito · ' + (t.cotizar_whatsapp || 0) + ' de un producto') +
    '</div>' +
    '<div class="caja"><div class="caja-cab"><h2>Actividad por día</h2><div class="leyenda"><span><i style="background:var(--azul-suave)"></i>Productos vistos</span><span><i style="background:var(--azul)"></i>Cotizaciones y carrito</span></div></div>' + grafico + '</div>' +
    '<div class="grid-2" style="grid-template-columns:1fr 1fr;margin-bottom:18px">' +
      '<div class="caja"><div class="caja-cab"><h2>Lo más buscado</h2></div>' +
        ranking(data.buscado, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + esc(x.texto) + (x.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : '') + barra(x.veces, maxB) + '</span><span class="num">' + x.veces + '</span></li>', 'Todavía no hay búsquedas en este período.') + '</div>' +
      '<div class="caja"><div class="caja-cab"><h2>Buscan y no encuentran</h2></div><p class="sub">Oportunidades: productos que te piden y no están en la tienda (o están escritos distinto).</p>' +
        ranking(data.sin_resultados, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + esc(x.texto) + '<small>Última vez: ' + fecha(x.ultima) + '</small>' + barra(x.veces, maxS) + '</span><span class="num">' + x.veces + '</span></li>', 'Nadie se ha quedado sin resultados. 👍') + '</div>' +
    '</div>' +
    '<div class="grid-2" style="grid-template-columns:1fr 1fr">' +
      '<div class="caja"><div class="caja-cab"><h2>Productos más vistos</h2></div>' +
        ranking(data.vistos, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + nomProd(x.modelo) + barra(x.veces, maxVi) + '</span><span class="num">' + x.veces + '<small>vistas</small></span></li>', 'Todavía no hay visitas en este período.') + '</div>' +
      '<div class="caja"><div class="caja-cab"><h2>Productos más cotizados</h2></div>' +
        ranking(data.cotizados, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + nomProd(x.modelo) + barra(totalCot(x), maxC) + '</span><span class="num">' + totalCot(x) +
          '<small>' + [x.whatsapp ? x.whatsapp + ' WhatsApp' : '', x.carrito ? x.carrito + ' carrito' : '', x.pedidos ? x.pedidos + ' pedido' + (x.pedidos > 1 ? 's' : '') : ''].filter(Boolean).join(' · ') + (x.clientes ? ' · ' + x.clientes + ' con cuenta' : '') + '</small></span></li>', 'Todavía no hay cotizaciones en este período.') + '</div>' +
    '</div>' +
    '<div style="margin-top:18px">' + cajaClientesActivos(resCli) + '</div>';
  document.querySelectorAll('#main [data-actividad]').forEach(li => li.onclick = () => abrirActividad(li.dataset.actividad));
}

/* ---------- Actividad por cliente ---------- */
const DIAS_ACT = [[7, '7 días'], [30, '30 días'], [90, '90 días'], [365, '1 año']];
let diasAct = 90;
const faltaActividad = (err) => '<div class="tarjeta-sync" style="margin:6px 0"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar la actividad por cliente</strong><div class="muted">Corre <span class="mono">06_actividad_clientes.sql</span> en Supabase → SQL Editor (después de <span class="mono">04_estadisticas.sql</span>).' + (err ? '<br><small>' + esc(mensajeError(err)) + '</small>' : '') + '</div></div></div>';
const haceCuanto = (d) => {
  if (!d) return 'nunca';
  const min = Math.round((Date.now() - new Date(d)) / 60000);
  if (min < 2) return 'hace un momento';
  if (min < 60) return 'hace ' + min + ' min';
  const h = Math.round(min / 60); if (h < 24) return 'hace ' + h + ' h';
  const dd = Math.round(h / 24); if (dd < 31) return 'hace ' + dd + ' día' + (dd > 1 ? 's' : '');
  return fecha(d, false);
};
const linkProd = (m) => '<a href="/p/' + slugDe(m) + '" target="_blank" rel="noopener" class="mono">' + esc(m) + '</a>';
const descProd = (m) => { const p = productos.find(x => x.modelo === m); return p ? [p.marca, p.descripcion || p.nombre].filter(Boolean).join(' · ') : 'Ya no está en el catálogo'; };

// Caja "Clientes más activos" dentro de Estadísticas
function cajaClientesActivos(res){
  if (!res || res.error || !res.data) return '<div class="caja"><div class="caja-cab"><h2>Clientes más activos</h2></div>' + faltaActividad(res && res.error) + '</div>';
  const d = res.data, lista = d.clientes || [];
  const totalEv = (d.con_cuenta || 0) + (d.sin_cuenta || 0);
  const pct = totalEv ? Math.round(100 * (d.con_cuenta || 0) / totalEv) : 0;
  const max = Math.max(1, ...lista.map(x => x.total));
  return '<div class="caja"><div class="caja-cab"><h2>Clientes más activos <small>' + lista.length + '</small></h2><span class="muted">' + pct + '% de la actividad es de clientes con cuenta</span></div>' +
    (!lista.length ? '<div class="vacio">' + ICO.clientes + 'Ningún cliente con cuenta ha usado la tienda en este período.</div>' :
    '<ol class="ranking">' + lista.slice(0, 20).map((x, i) => {
      const c = clientes.find(y => y.email === x.email) || { email: x.email };
      const partes = [x.busquedas && x.busquedas + ' búsq.', x.vistas && x.vistas + ' vistos', x.carrito && x.carrito + ' al carrito', x.whatsapp && x.whatsapp + ' WhatsApp', x.pedidos && x.pedidos + ' pedido' + (x.pedidos > 1 ? 's' : '')].filter(Boolean).join(' · ');
      return '<li class="clic" data-actividad="' + esc(x.email) + '"><span class="pos">' + (i + 1) + '</span><span class="nom"><strong>' + esc(c.nombre || c.empresa || c.email) + '</strong>' + (c.nombre && c.empresa ? ' <span class="muted">· ' + esc(c.empresa) + '</span>' : '') +
        '<small>' + partes + ' · ' + haceCuanto(x.ultima) + '</small>' + '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * x.total / max)) + '%"></i></div></span>' +
        '<span class="num">' + x.dias_activos + '<small>día' + (x.dias_activos > 1 ? 's' : '') + ' activo</small></span></li>';
    }).join('') + '</ol>') + '</div>';
}

// Panel con la actividad de un cliente

  const cab = '<div class="panel-cab"><div class="avatar">' + esc(iniciales(c)) + '</div><div><h2>' + esc(c.nombre || c.empresa || c.email) + '</h2><div class="muted">' + esc([c.empresa && c.nombre ? c.empresa : '', c.email].filter(Boolean).join(' · ')) + '</div></div>' +
    '<button class="btn chico fantasma cerrar" id="a-cerrar" aria-label="Cerrar">' + ICO.cerrar + '</button></div>';
  const chips = '<div class="chips" style="margin-bottom:16px">' + DIAS_ACT.map(([d, t]) => '<button class="chip' + (diasAct === d ? ' activo' : '') + '" data-dias-act="' + d + '">' + t + '</button>').join('') + '</div>';
  abrirPanel(cab + '<div class="panel-cuerpo">' + chips + '<div class="cargando">Cargando actividad…</div></div>', true);
  $('panel').dataset.actividad = email;
  const enlazar = () => {
    $('a-cerrar').onclick = cerrarPanel;
    document.querySelectorAll('[data-dias-act]').forEach(b => b.onclick = () => { diasAct = Number(b.dataset.diasAct); abrirActividad(email); });
  };
  enlazar();
  const { data, error } = await sb.rpc('actividad_cliente', { p_email: email, dias: diasAct });
  if ($('panel').dataset.actividad !== email) return;       // se cerró o se abrió otro
  const cuerpo = document.querySelector('#panel .panel-cuerpo');
  if (error || !data){ cuerpo.innerHTML = chips + faltaActividad(error); enlazar(); return; }

  const t = data.totales || {};
  const susPedidos = pedidos.filter(p => p.cliente_email === email);
  const desde = Date.now() - diasAct * 86400000;
  const pedPer = susPedidos.filter(p => new Date(p.creado) >= desde);
  const montoPer = pedPer.filter(p => p.estado !== 'cancelado').reduce((s, p) => s + Number(p.total || 0), 0);
  const mini = (titulo, num, pie) => '<div class="kpi"><div class="k-cab">' + titulo + '</div><div class="k-num" style="font-size:23px">' + Number(num || 0).toLocaleString('es-VE') + '</div>' + (pie ? '<div class="k-pie">' + pie + '</div>' : '') + '</div>';
  const vacio = (txt) => '<div class="muted" style="padding:8px 0">' + txt + '</div>';
  const maxB = Math.max(1, ...(data.buscado || []).map(x => x.veces));
  const maxV = Math.max(1, ...(data.vistos || []).map(x => x.veces));
  const totC = (x) => x.carrito + x.whatsapp + x.pedidos;
  const maxC = Math.max(1, ...(data.cotizados || []).map(totC));
  const barra = (v, m) => '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * v / m)) + '%"></i></div>';

  // Línea de tiempo agrupada por día
  const TXT = {
    busqueda: (e) => 'Buscó <strong>“' + esc(e.texto) + '”</strong>' + (e.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : e.resultados != null ? ' <span class="muted">(' + e.resultados + ' resultados)</span>' : ''),
    ver_producto: (e) => 'Vio ' + linkProd(e.modelo),
    agregar_carrito: (e) => 'Agregó ' + (e.cantidad ? e.cantidad + ' × ' : '') + linkProd(e.modelo) + ' al carrito',
    cotizar_whatsapp: (e) => 'Pidió cotización por WhatsApp de ' + linkProd(e.modelo) + (e.origen === 'pagina' ? ' <span class="muted">(desde la página del producto)</span>' : ''),
    pedido_whatsapp: (e) => 'Envió por WhatsApp ' + (e.cantidad ? e.cantidad + ' × ' : '') + linkProd(e.modelo),
  };
  TXT.visita = () => 'Entró a la tienda';
  TXT.ver_tarjetas = (e) => 'Vio tarjetas de productos' + (e.texto ? ' en <strong>' + esc(e.texto) + '</strong>' : '');
  const ICO_EV = { busqueda: ICO.buscar, ver_producto: ICO.ojo, agregar_carrito: ICO.tienda, cotizar_whatsapp: ICO.whatsapp, pedido_whatsapp: ICO.pedidos, visita: ICO.tienda, ver_tarjetas: ICO.grafica };
  let diaAnt = '';
  const linea = (data.recientes || []).map(e => {

        '<small>' + haceCuanto(x.ultima) + '</small>' + barra(x.veces, maxB) + '</span><span class="num">' + x.veces + '</span></li>').join('') + '</ol>') + '</div>' +

/* ---------- Visitantes sin cuenta (10_visitantes.sql) ---------- */
let diasVis = 30, buscaVis = '', datosVis = null, cuantasVis = 25;
const DIAS_VIS = [[1, '24 horas'], [7, '7 días'], [30, '30 días'], [90, '90 días']];
const faltaVisitantes = (err) => '<div class="caja"><div class="tarjeta-sync"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar el registro de visitantes</strong><div class="muted">Corre <span class="mono">10_visitantes.sql</span> en Supabase → SQL Editor (después de <span class="mono">04_estadisticas.sql</span>). Desde ese momento la tienda anota cada visita: de dónde entran, con qué equipo, qué buscan y qué tarjetas de producto ven.' + (err ? '<br><small>' + esc(mensajeError(err)) + '</small>' : '') + '</div></div></div></div>';
let nombresPais = null;
try { nombresPais = new Intl.DisplayNames(['es'], { type: 'region' }); } catch (e) {}
const nomPais = (c) => {
  if (!c || c === 'XX') return 'Desconocido';
  if (c === 'T1') return 'Red Tor (oculto)';
  try { return (nombresPais && nombresPais.of(c)) || c; } catch (e) { return c; }
};
const bandera = (c) => /^[A-Z]{2}$/.test(c || '') && c !== 'XX' && c !== 'T1' ? String.fromCodePoint(...[...c].map(ch => 127397 + ch.charCodeAt(0))) + ' ' : '🌐 ';
const lugarDe = (x) => {
  const partes = [x.ciudad, x.region && x.region !== x.ciudad ? x.region : null].filter(Boolean);
  if (x.pais && x.pais !== 'VE') partes.push(nomPais(x.pais));
  return partes.length ? bandera(x.pais) + partes.join(', ') : x.pais ? bandera(x.pais) + nomPais(x.pais) : 'Lugar desconocido';
};
const ICO_DISP = { Celular: '📱', Tablet: '📱', Computadora: '💻' };
const equipoDe = (x) => x.dispositivo ? (ICO_DISP[x.dispositivo] || '') + ' ' + x.dispositivo + (x.sistema && x.sistema !== 'Otro' ? ' · ' + x.sistema : '') + (x.navegador && x.navegador !== 'Otro' ? ' · ' + x.navegador : '') : '—';
const origenDe = (r) => r || 'Directo / enlace';
const duracion = (seg) => {
  seg = Math.round(Number(seg) || 0);
  if (seg < 5) return 'un momento';
  if (seg < 60) return seg + ' s';
  const m = Math.round(seg / 60); if (m < 60) return m + ' min';
  return Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
};
const hora = (d) => new Date(d).toLocaleTimeString('es-VE', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Caracas' });
const diaLargo = (d) => new Date(d).toLocaleDateString('es-VE', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'America/Caracas' });
const codigoVis = (v) => String(v || '').replace(/-/g, '').slice(0, 6).toUpperCase();
const paginaBonita = (p) => {
  if (!p) return '—';
  if (/^\/p\//.test(p)) return 'Página de producto ' + p.slice(3);
  if (/^\/c\//.test(p)) return 'Página de categoría ' + p.slice(3).replace(/\//g, ' › ');
  const h = p.replace(/^\/(tienda)?(\.html)?/, '');
  if (!h || h === '#' || h === '#/') return 'Inicio de la tienda';
  const q = h.match(/buscar\?q=([^&]+)/); if (q) return 'Búsqueda “' + q[1] + '”';
  const pr = h.match(/[?&]p=([^&]+)/); if (pr) return 'Producto ' + pr[1];
  return 'Tienda ' + h.replace(/^#\/?/, '').replace(/\//g, ' › ');
};

// Mini gráfico de barras (horas del día, días de la semana)
function barrasSimples(valores, etiquetas, titulo){
  const max = Math.max(1, ...valores);
  return '<div class="grafico" style="height:120px">' + valores.map((v, i) => '<div class="col" title="' + esc(titulo(i, v)) + '"><div class="b1" style="height:' + (100 * v / max) + '%;' + (v === max && v > 0 ? 'background:var(--azul)' : '') + '"></div></div>').join('') + '</div>' +
    '<div class="grafico-ejes">' + etiquetas.map(t => '<span>' + t + '</span>').join('') + '</div>';
}

  $('main').innerHTML = cabecera('Visitantes', 'Quienes entran sin iniciar sesión: cuántos son, de dónde, cuándo, qué buscan y qué productos ven. Toca una visita para ver todo lo que hizo esa persona. No se cuenta lo que haces tú como administrador.', chips) + '<div class="cargando">Cargando…</div>';
  document.querySelectorAll('[data-dias-vis]').forEach(b => b.onclick = () => { diasVis = Number(b.dataset.diasVis); vistaVisitantes(); });
  const { data, error } = await sb.rpc('resumen_visitantes', { dias: diasVis });
  if (tab !== 'visitantes') return;
  const cont = document.querySelector('#main .cargando');

  const barra = (v, max) => '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * v / (max || 1))) + '%"></i></div>';
  const maxDe = (l, k) => Math.max(1, ...(l || []).map(x => x[k] || 0));
  const filaSimple = (nombre, v, max, sub) => '<li><span class="pos"></span><span class="nom"><strong>' + nombre + '</strong>' + (sub ? '<small>' + sub + '</small>' : '') + barra(v, max) + '</span><span class="num">' + v + '</span></li>';
  const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';

  // Visitas por día (completa los días sin datos)
  const porDia = {}; (data.por_dia || []).forEach(d => { porDia[d.dia] = d; });
  const dias = [];

      '<div class="b1" style="height:' + (100 * d.v / maxV) + '%"></div><div class="b2" style="height:' + (100 * d.p / maxV) + '%"></div></div>').join('') + '</div>' +
    '<div class="grafico-ejes">' + dias.map((d, i) => '<span>' + ((dias.length - 1 - i) % cada === 0 ? d.f.getDate() : '') + '</span>').join('') + '</div>';

  const horas = Array(24).fill(0); (data.por_hora || []).forEach(h => { horas[h.hora] = h.visitas; });
  const semana = Array(7).fill(0); (data.por_semana || []).forEach(d => { semana[d.dia - 1] = d.visitas; });
  const DSEM = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];

  const maxB = maxDe(data.buscado, 'veces'), maxT = maxDe(data.tarjetas, 'veces');
  const grupoMini = (titulo, lista, campo, nombre) => {

      '<ol class="ranking">' + lista.slice(0, 6).map(x => filaSimple(esc(nombre ? nombre(x[campo]) : (x[campo] || 'Desconocido')), x.visitas, max, pct(x.visitas, t.visitas) + ' de las visitas')).join('') + '</ol>') + '</div>';
  };

  cont.outerHTML =

      kpi(ICO.ojo, 'En la tienda ahora', data.ahora, 'activos en los últimos 15 minutos', data.ahora ? ' destacado' : '') +
      kpi(ICO.buscar, 'Búsquedas', t.busquedas, 'veces que usaron el buscador') +
      kpi(ICO.tienda, 'Tarjetas vistas', t.tarjetas, (t.fichas || 0) + ' fichas de producto abiertas') +
      kpi(ICO.whatsapp, 'Visitas con interés', t.con_interes, pct(t.con_interes, t.visitas) + ' agregó al pedido o escribió por WhatsApp') +
      kpi(ICO.sync, 'Tiempo promedio', t.duracion_media ? duracion(t.duracion_media) : '—', 'de las visitas que hicieron algo') +
    '</div>' +
    '<div class="caja"><div class="caja-cab"><h2>Visitas por día</h2><div class="leyenda"><span><i style="background:var(--azul-suave)"></i>Visitas</span><span><i style="background:var(--azul)"></i>Personas distintas</span></div></div>' + grafico + '</div>' +

        barrasSimples(horas, horas.map((_, h) => h % 3 === 0 ? (h % 12 || 12) + (h < 12 ? 'a' : 'p') : ''), (h, v) => hTxt(h) + ': ' + v + ' visitas') + '<p class="muted" style="margin:8px 0 0">Hora de Venezuela.</p></div>' +
      '<div class="caja"><div class="caja-cab"><h2>¿Qué días?</h2></div>' +
        barrasSimples(semana, DSEM.map(d => d.slice(0, 3)), (i, v) => DSEM[i] + ': ' + v + ' visitas') + '</div>' +
    '</div>' +
    '<div class="grid-2" style="grid-template-columns:1fr 1fr;margin-bottom:18px">' +

      '<div class="caja"><div class="caja-cab"><h2>¿De qué ciudad?</h2></div><p class="sub">Aproximado: se calcula por la conexión a internet (con datos móviles puede salir la ciudad de la antena).</p>' +
        ranking(data.ciudades, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom"><strong>' + esc(lugarDe(x)) + '</strong><small>' + x.visitantes + ' persona' + (x.visitantes === 1 ? '' : 's') + '</small>' + barra(x.visitas, maxCi) + '</span><span class="num">' + x.visitas + '</span></li>', 'Sin ciudades todavía.', 15) + '</div>' +
    '</div>' +
    '<div class="grid-2" style="grid-template-columns:1fr 1fr;margin-bottom:18px">' +
      '<div class="caja"><div class="caja-cab"><h2>¿Cómo llegan?</h2></div>' +
        ranking(data.origenes, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom"><strong>' + esc(origenDe(x.referencia)) + '</strong>' + (x.referencia ? '' : '<small>Escribieron la dirección, un marcador o un enlace de WhatsApp</small>') + barra(x.visitas, maxO) + '</span><span class="num">' + x.visitas + '<small>' + pct(x.visitas, t.visitas) + '</small></span></li>', 'Sin datos todavía.') +
        '<div class="seccion" style="margin:18px 0 0"><h3>Página por la que entraron</h3>' + (!(data.entradas || []).length ? '<div class="muted">Sin datos.</div>' :
          '<ol class="ranking">' + data.entradas.slice(0, 8).map(x => filaSimple(esc(paginaBonita(x.pagina)), x.visitas, maxE)).join('') + '</ol>') + '</div></div>' +
      '<div class="caja"><div class="caja-cab"><h2>¿Con qué equipo?</h2></div>' +
        grupoMini('Tipo de equipo', data.dispositivos, 'dispositivo') +
        grupoMini('Sistema', data.sistemas, 'sistema') +

function pintarVisitas(){
  const q = buscaVis.trim().toLowerCase();
  const lista = (datosVis && datosVis.visitas || []).filter(v => !q ||
    [lugarDe(v), nomPais(v.pais), v.proveedor, equipoDe(v), origenDe(v.referencia), v.buscado, paginaBonita(v.pagina), codigoVis(v.visitante)].join(' ').toLowerCase().includes(q));
  const el = $('vis-tabla');
  if (!el) return;
  if (!lista.length){ el.innerHTML = '<div class="vacio">' + ICO.clientes + (q ? 'Ninguna visita coincide con el filtro.' : 'Todavía no hay visitas en este período.') + '</div>'; return; }
  const act = (v) => [
    v.busquedas && '<span class="pill">' + v.busquedas + ' búsq.</span>',
    v.tarjetas && '<span class="pill">' + v.tarjetas + ' tarjetas</span>',
    v.fichas && '<span class="pill azul">' + v.fichas + ' fichas</span>',
    v.carrito && '<span class="pill verde">' + v.carrito + ' al pedido</span>',
    v.whatsapp && '<span class="pill verde">WhatsApp</span>',
  ].filter(Boolean).join(' ') || '<span class="muted">Solo entró</span>';
  el.innerHTML = '<table class="tabla-vis"><thead><tr><th>Cuándo</th><th>Desde dónde</th><th>Equipo</th><th>Llegó por</th><th>Qué hizo</th><th>Buscó</th></tr></thead><tbody>' +
    lista.slice(0, cuantasVis).map(v => '<tr class="clic" data-visitante="' + esc(v.visitante) + '">' +
      '<td><strong>' + haceCuanto(v.inicio) + '</strong><div class="muted">' + fecha(v.inicio) + (v.fin > v.inicio ? ' · ' + duracion((new Date(v.fin) - new Date(v.inicio)) / 1000) : '') + '</div>' +
        '<div style="margin-top:3px">' + (v.nuevo ? '<span class="pill amar">Nuevo</span>' : '<span class="pill tinta">Volvió</span>') + (v.visitas_periodo > 1 ? ' <span class="muted">' + v.visitas_periodo + ' visitas</span>' : '') + '</div></td>' +
      '<td>' + esc(lugarDe(v)) + (v.proveedor ? '<div class="muted">' + esc(v.proveedor) + '</div>' : '') + '</td>' +
      '<td>' + esc(equipoDe(v)) + '</td>' +
      '<td>' + esc(origenDe(v.referencia)) + '<div class="muted">' + esc(paginaBonita(v.pagina)) + '</div></td>' +
      '<td class="vis-act">' + act(v) + '</td>' +
      '<td>' + (v.buscado ? esc(v.buscado) : '<span class="muted">—</span>') + '</td></tr>').join('') +
    '</tbody></table>' +
    (lista.length > cuantasVis ? '<div style="text-align:center;padding:14px 0 4px"><button class="btn" id="vis-mas">Ver más visitas (' + (lista.length - cuantasVis) + ')</button></div>' : '');
  if ($('vis-mas')) $('vis-mas').onclick = () => { cuantasVis += 50; pintarVisitas(); };
