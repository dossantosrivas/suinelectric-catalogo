<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
// Una sola dirección para la tienda: la sesión se guarda por dominio, así que
// www.suinelectric.com o la dirección vieja de Netlify serían "otra tienda" sin sesión.
(function(){ var h = location.hostname;
  if (h === 'www.suinelectric.com' || /\.netlify\.app$/.test(h))
    location.replace('https://suinelectric.com' + location.pathname + location.search + location.hash);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de administrador | Suinelectric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#0e2a3b; --tinta-2:#133649; --tinta-3:#1c4760;
    --azul:#0089af; --azul-texto:#006d8c; --azul-suave:#e6f4f8;
    --amarillo:#ffc20e; --amarillo-suave:#fff4d6; --amarillo-texto:#8a5a00;
    --fondo:#f3f5f7; --superficie:#ffffff; --linea:#dde3e8; --linea-suave:#edf0f3;
    --texto:#14222c; --texto-2:#475866; --texto-3:#6c7b87;
    --ok:#1b7f3b; --ok-suave:#e4f4e9; --off:#b3261e; --off-suave:#fbe9e7;
    --radio:10px; --radio-chico:7px;
    --sombra:0 1px 2px rgba(14,42,59,.06), 0 1px 1px rgba(14,42,59,.04);
    --sombra-alta:0 12px 32px rgba(14,42,59,.18);
    --sans:'IBM Plex Sans','Segoe UI',Roboto,Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:var(--sans); background:var(--fondo); color:var(--texto); font-size:14.5px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  button{ font:inherit; }
  a{ color:var(--azul-texto); }
  [hidden]{ display:none !important; }

  /* ---------- Estructura ---------- */
  .app{ display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100vh; }
  .side{ background:var(--tinta); color:#fff; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:20px 14px; }
  .marca{ display:flex; align-items:center; gap:10px; padding:4px 8px 22px; }
  .marca-logo{ width:36px; height:36px; border-radius:9px; background:var(--amarillo); color:var(--tinta); display:grid; place-items:center; font-weight:700; font-size:18px; flex:none; }
  .marca-txt strong{ display:block; font-size:15.5px; letter-spacing:.6px; }
  .marca-txt span{ font-size:12px; opacity:.65; }
  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav button{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:none; color:rgba(255,255,255,.72); padding:10px 12px; border-radius:8px; cursor:pointer; font-weight:500; font-size:14.5px; }
  .nav button svg{ width:18px; height:18px; flex:none; opacity:.85; }
  .nav button:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .nav button.activa{ background:var(--tinta-3); color:#fff; box-shadow:inset 3px 0 0 var(--amarillo); }
  .nav .badge{ margin-left:auto; background:var(--amarillo); color:var(--tinta); font-size:11.5px; font-weight:700; border-radius:10px; padding:1px 8px; }
  .side-pie{ margin-top:auto; border-top:1px solid rgba(255,255,255,.1); padding:14px 8px 0; font-size:12.5px; }
  .side-pie .quien{ opacity:.7; word-break:break-all; margin-bottom:10px; }
  .side-pie .acciones{ display:flex; gap:6px; }
  .side-pie a, .side-pie button{ flex:1; text-align:center; color:#fff; background:rgba(255,255,255,.1); border:none; border-radius:7px; padding:8px 10px; font-size:13px; cursor:pointer; text-decoration:none; }
  .side-pie a:hover, .side-pie button:hover{ background:rgba(255,255,255,.18); }
  .contenido{ padding:28px 34px 60px; max-width:1240px; width:100%; }
  .cab{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .cab h1{ font-size:25px; margin:0; letter-spacing:-.2px; color:var(--tinta); }
  .cab p{ margin:4px 0 0; color:var(--texto-3); font-size:14px; }
  .cab .acc{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- Piezas ---------- */
  .caja{ background:var(--superficie); border:1px solid var(--linea); border-radius:var(--radio); box-shadow:var(--sombra); padding:18px 20px; margin-bottom:18px; }
  .caja-cab{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .caja h2{ font-size:16.5px; margin:0; color:var(--tinta); }
  .caja h2 small{ font-weight:500; color:var(--texto-3); font-size:13.5px; margin-left:6px; }
  .caja .sub{ margin:-8px 0 14px; color:var(--texto-3); font-size:13.5px; }
  .grid-2{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:18px; align-items:start; }
  .grid-2 > .caja{ margin-bottom:0; }
  .apilar > * + *{ margin-top:18px; }
  .fila{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  label.campo{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--texto-2); }
  input, select, textarea{ font:inherit; font-size:14.5px; height:40px; padding:0 11px; border:1px solid var(--linea); border-radius:var(--radio-chico); background:#fff; color:var(--texto); min-width:0; width:100%; }
  textarea{ height:auto; padding:9px 11px; resize:vertical; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--azul); box-shadow:0 0 0 3px rgba(0,137,175,.14); }
  input[readonly]{ background:var(--fondo); color:var(--texto-2); }
  .buscar{ position:relative; }
  .buscar svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--texto-3); }
  .buscar input{ padding-left:34px; min-width:230px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:600; font-size:14px; height:40px; padding:0 15px; border-radius:var(--radio-chico); border:1px solid var(--linea); background:#fff; color:var(--texto); cursor:pointer; white-space:nowrap; text-decoration:none; }
  .btn svg{ width:16px; height:16px; }
  .btn:hover{ border-color:var(--azul); color:var(--azul-texto); }
  .btn.prim{ background:var(--tinta); color:#fff; border-color:var(--tinta); }
  .btn.prim:hover{ background:var(--tinta-3); color:#fff; }
  .btn.acento{ background:var(--amarillo); border-color:var(--amarillo); color:var(--tinta); }
  .btn.peligro{ color:var(--off); }
  .btn.peligro:hover{ border-color:var(--off); color:var(--off); background:var(--off-suave); }
  .btn.chico{ height:32px; padding:0 11px; font-size:13px; }
  .btn.fantasma{ border-color:transparent; background:none; }
  .btn:disabled{ opacity:.5; cursor:default; }

  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; border-radius:20px; padding:2px 10px; background:var(--linea-suave); color:var(--texto-2); white-space:nowrap; }
  .pill.azul{ background:var(--azul-suave); color:var(--azul-texto); }
  .pill.verde{ background:var(--ok-suave); color:var(--ok); }
  .pill.rojo{ background:var(--off-suave); color:var(--off); }
  .pill.amar{ background:var(--amarillo-suave); color:var(--amarillo-texto); }
  .pill.tinta{ background:var(--tinta); color:#fff; }
  .pill .punto{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .muted{ color:var(--texto-3); font-size:13px; }
  .mono{ font-family:var(--mono); font-size:13px; }
  .error{ color:var(--off); font-size:13.5px; min-height:1em; margin:8px 0 0; }
  .ayuda{ font-size:13.5px; color:var(--texto-2); background:var(--fondo); border-radius:var(--radio-chico); padding:11px 13px; margin:0 0 14px; line-height:1.55; }
  .aviso{ display:flex; gap:10px; align-items:flex-start; background:var(--amarillo-suave); color:#5c3d00; border-radius:var(--radio-chico); padding:11px 13px; font-size:13.5px; line-height:1.5; margin-bottom:14px; }
  .aviso.azul{ background:var(--azul-suave); color:#0b4a5d; }
  .aviso svg{ width:18px; height:18px; flex:none; margin-top:1px; }
  .vacio{ text-align:center; padding:34px 10px; color:var(--texto-3); }
  .vacio svg{ width:34px; height:34px; opacity:.45; display:block; margin:0 auto 8px; }

  /* Chips de filtro */
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ border:1px solid var(--linea); background:#fff; color:var(--texto-2); border-radius:20px; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; gap:7px; align-items:center; }
  .chip b{ font-weight:700; color:var(--texto-3); font-size:12px; }
  .chip:hover{ border-color:var(--azul); }
  .chip.activo{ background:var(--tinta); border-color:var(--tinta); color:#fff; }
  .chip.activo b{ color:var(--amarillo); }

  /* Tablas */
  .tabla-wrap{ overflow-x:auto; margin:0 -20px; padding:0 20px; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--texto-3); font-weight:600; padding:10px 10px; border-bottom:1px solid var(--linea); white-space:nowrap; }
  td{ padding:11px 10px; border-bottom:1px solid var(--linea-suave); vertical-align:middle; }
  tbody tr:hover td{ background:#fafbfc; }
  tbody tr:last-child td{ border-bottom:none; }
  tr.inactivo td:not(:last-child){ opacity:.5; }
  td.acciones{ text-align:right; white-space:nowrap; }
  .persona{ display:flex; align-items:center; gap:11px; min-width:210px; }
  .avatar{ width:36px; height:36px; border-radius:50%; background:var(--azul-suave); color:var(--azul-texto); display:grid; place-items:center; font-weight:700; font-size:13.5px; flex:none; }
  .avatar.admin{ background:var(--tinta); color:var(--amarillo); }
  .persona strong{ display:block; font-weight:600; }
  .persona span{ color:var(--texto-3); font-size:12.5px; }

  /* Interruptor */
  .switch{ display:flex; align-items:flex-start; gap:12px; cursor:pointer; }
  .switch input{ position:absolute; opacity:0; width:1px; height:1px; }
  .sw{ width:40px; height:23px; border-radius:20px; background:#c5ced6; position:relative; flex:none; transition:background .15s; margin-top:1px; }
  .sw::after{ content:''; position:absolute; top:3px; left:3px; width:17px; height:17px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s; }
  .switch input:checked + .sw{ background:var(--ok); }
  .switch input:checked + .sw::after{ transform:translateX(17px); }
  .switch input:focus-visible + .sw{ box-shadow:0 0 0 3px rgba(0,137,175,.3); }
  .switch input:disabled + .sw{ opacity:.55; }
  .sw-txt strong{ display:block; font-size:14px; font-weight:600; color:var(--texto); }
  .sw-txt small{ display:block; font-size:12.5px; color:var(--texto-3); margin-top:1px; }
  .switch.solo{ align-items:center; }

  /* Resumen */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi{ background:#fff; border:1px solid var(--linea); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px 18px; display:flex; flex-direction:column; gap:4px; cursor:default; text-align:left; font:inherit; color:inherit; }
  button.kpi{ cursor:pointer; }
  button.kpi:hover{ border-color:var(--azul); }
  .kpi .k-cab{ display:flex; align-items:center; justify-content:space-between; color:var(--texto-3); font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
  .kpi .k-cab svg{ width:18px; height:18px; color:var(--azul); }
  .kpi .k-num{ font-size:28px; font-weight:700; color:var(--tinta); letter-spacing:-.5px; line-height:1.15; }
  .kpi .k-pie{ font-size:13px; color:var(--texto-3); }
  .kpi.destacado{ background:var(--tinta); border-color:var(--tinta); color:#fff; }
  .kpi.destacado .k-num{ color:var(--amarillo); }
  .kpi.destacado .k-cab, .kpi.destacado .k-pie{ color:rgba(255,255,255,.7); }
  .kpi.destacado .k-cab svg{ color:var(--amarillo); }
  .lista-simple{ list-style:none; margin:0; padding:0; }
  .lista-simple li{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--linea-suave); }
  .lista-simple li:last-child{ border-bottom:none; }
  .lista-simple .der{ margin-left:auto; text-align:right; }

  /* Pedidos */
  .pedidos{ display:flex; flex-direction:column; gap:12px; }
  .pedido{ background:#fff; border:1px solid var(--linea); border-radius:var(--radio); box-shadow:var(--sombra); display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1fr); overflow:hidden; }
  .pedido > div{ padding:15px 18px; }
  .pedido > div + div{ border-left:1px solid var(--linea-suave); }
  .pd-num{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .pd-num strong{ font-size:17px; color:var(--tinta); }
  .pd-total{ font-size:20px; font-weight:700; color:var(--tinta); margin-top:8px; }
  .items{ margin:0; padding:0; list-style:none; font-size:13.5px; }
  .items li{ display:flex; gap:10px; padding:4px 0; border-bottom:1px dashed var(--linea-suave); }
  .items li:last-child{ border-bottom:none; }
  .items .can{ color:var(--texto-3); min-width:28px; }
  .items .pre{ margin-left:auto; white-space:nowrap; color:var(--texto-2); }
  .estado-sel{ font-weight:600; height:34px; font-size:13.5px; width:auto; padding-right:28px; }
  .estado-sel.e-enviado{ background:var(--amarillo-suave); border-color:#f2d27a; color:var(--amarillo-texto); }
  .estado-sel.e-cotizado{ background:var(--azul-suave); border-color:#a9d6e4; color:var(--azul-texto); }
  .estado-sel.e-aprobado, .estado-sel.e-pagado{ background:#eef0ff; border-color:#c9cff5; color:#3b44a8; }
  .estado-sel.e-entregado{ background:var(--ok-suave); border-color:#b4dcc1; color:var(--ok); }
  .estado-sel.e-cancelado{ background:var(--off-suave); border-color:#efc0bb; color:var(--off); }
  .nota-wrap{ display:flex; flex-direction:column; gap:8px; }
  .nota-wrap textarea{ min-height:64px; font-size:13.5px; }

  /* Descuentos */
  .paso{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--tinta); color:#fff; font-size:11.5px; margin-right:6px; }
  .resumen{ margin-top:14px; padding:12px 14px; border-left:4px solid var(--azul); background:var(--azul-suave); border-radius:6px; font-size:14px; line-height:1.55; }
  .resumen:empty{ display:none; }
  .prueba-res{ font-size:14.5px; margin-top:14px; line-height:1.5; }
  .prueba-res .precio{ font-size:26px; font-weight:700; color:var(--tinta); display:block; margin:4px 0; }

  /* Existencias */
  .muestras{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .muestra{ border:1px solid var(--linea); border-radius:var(--radio); padding:14px 16px; }
  .muestra h3{ margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.4px; color:var(--texto-3); display:flex; align-items:center; gap:8px; }
  .muestra h3 svg{ width:16px; height:16px; }
  .muestra ul{ list-style:none; margin:0; padding:0; font-size:13.5px; }
  .muestra li{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--linea-suave); }
  .muestra li:last-child{ border-bottom:none; }
  .muestra li span:first-child{ color:var(--texto-3); }
  .estado-stock{ font-weight:600; font-size:12.5px; border-radius:6px; padding:2px 8px; }
  .estado-stock.ok{ background:var(--ok-suave); color:var(--ok); }
  .estado-stock.off{ background:var(--off-suave); color:var(--off); }
  .permisos li{ padding:13px 0; }
  .tarjeta-sync{ display:flex; align-items:center; gap:14px; }
  .tarjeta-sync .icono{ width:44px; height:44px; border-radius:11px; display:grid; place-items:center; background:var(--ok-suave); color:var(--ok); flex:none; }
  .tarjeta-sync .icono.mal{ background:var(--amarillo-suave); color:var(--amarillo-texto); }
  .tarjeta-sync .icono svg{ width:22px; height:22px; }

  /* Estadísticas */
  .grafico{ display:flex; align-items:flex-end; gap:4px; height:170px; padding:10px 0 0; border-bottom:1px solid var(--linea); }
  .grafico .col{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:stretch; height:100%; position:relative; min-width:6px; }
  .grafico .b1{ background:var(--azul-suave); border-radius:4px 4px 0 0; position:relative; }
  .grafico .b2{ background:var(--azul); border-radius:4px 4px 0 0; position:absolute; bottom:0; left:22%; right:22%; }
  .grafico .col:hover .b1{ background:#cce9f2; }
  .grafico-ejes{ display:flex; gap:4px; font-size:11px; color:var(--texto-3); margin-top:5px; }
  .grafico-ejes span{ flex:1; text-align:center; min-width:6px; overflow:hidden; }
  .leyenda{ display:flex; gap:16px; font-size:12.5px; color:var(--texto-2); }
  .leyenda i{ display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .ranking{ list-style:none; margin:0; padding:0; }
  .ranking li{ display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--linea-suave); font-size:14px; }
  .ranking li:last-child{ border-bottom:none; }
  .ranking .pos{ color:var(--texto-3); font-size:12.5px; text-align:right; }
  .ranking .nom{ overflow:hidden; }
  .ranking .nom a{ text-decoration:none; font-weight:600; }
  .ranking .nom small{ display:block; color:var(--texto-3); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ranking .barra{ height:4px; background:var(--linea-suave); border-radius:3px; margin-top:5px; }
  .ranking .barra i{ display:block; height:100%; background:var(--azul); border-radius:3px; }
  .ranking .num{ font-weight:700; color:var(--tinta); text-align:right; white-space:nowrap; }
  .ranking .num small{ display:block; font-weight:500; color:var(--texto-3); font-size:11.5px; }

  /* Panel lateral (editar cliente) */
  .velo{ position:fixed; inset:0; background:rgba(14,42,59,.38); z-index:20; opacity:0; pointer-events:none; transition:opacity .18s; }
  .velo.ver{ opacity:1; pointer-events:auto; }
  .panel{ position:fixed; top:0; right:0; bottom:0; width:min(480px,100%); background:#fff; z-index:21; transform:translateX(100%); visibility:hidden; transition:transform .22s ease, visibility 0s linear .22s; display:flex; flex-direction:column; }
  .panel.ver{ transform:none; visibility:visible; box-shadow:var(--sombra-alta); transition:transform .22s ease; }
  .panel-cab{ padding:18px 22px; border-bottom:1px solid var(--linea); display:flex; align-items:center; gap:12px; }
  .panel-cab h2{ margin:0; font-size:17px; color:var(--tinta); }
  .panel-cab .cerrar{ margin-left:auto; }
  .panel-cuerpo{ padding:18px 22px; overflow-y:auto; flex:1; }
  .panel-pie{ padding:14px 22px; border-top:1px solid var(--linea); display:flex; gap:8px; flex-wrap:wrap; }
  .seccion{ margin-bottom:22px; }
  .seccion h3{ font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--texto-3); margin:0 0 10px; }
  .campos{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .campos .ancho{ grid-column:1 / -1; }
  .interruptores{ display:flex; flex-direction:column; gap:14px; background:var(--fondo); border-radius:var(--radio-chico); padding:14px; }

  /* Entrada */
  .entrada{ min-height:100vh; display:grid; place-items:center; padding:20px; background:linear-gradient(160deg, var(--tinta) 0%, var(--tinta-3) 100%); }
  .entrada .caja{ width:min(420px,100%); padding:28px; border:none; box-shadow:var(--sombra-alta); }
  .entrada .marca{ padding:0 0 18px; color:var(--tinta); }
  .entrada .marca-txt span{ opacity:1; color:var(--texto-3); }
  .entrada form{ display:flex; flex-direction:column; gap:12px; }

  #toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--tinta); color:#fff; padding:11px 18px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:40; box-shadow:var(--sombra-alta); }
  #toast.ver{ opacity:1; transform:translateX(-50%); }
  .cargando{ padding:40px; text-align:center; color:var(--texto-3); }

  @media (max-width:1000px){

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://yqnlxhbjassrkudnhvpr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LOYjM5sqvQbBLIkH4KJTKQ_UfxrpTeC';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  // Misma sesión que la tienda: si ya entraste en la tienda con tu correo de administrador, el panel abre directo.

try { localStorage.removeItem('suinelectric-admin-auth'); } catch (e) {}

/* ---------- Utilidades ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money = (n) => n == null ? '—' : '$' + Math.ceil(Number(n)).toLocaleString('en-US');
const fecha = (d, conHora) => d ? new Date(d).toLocaleString('es-VE', conHora === false ? { dateStyle: 'medium' } : { dateStyle: 'short', timeStyle: 'short' }) : '—';
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('ver'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('ver'), 2400); }
function mensajeError(err){
  const m = (err && err.message) || String(err);
  if (/ver_existencias|existencias_reales|estado_existencias/i.test(m))
    return 'Falta instalar la parte de existencias: corre 03_existencias.sql en Supabase (SQL Editor).';
  if (/row-level security|permission denied|JWT/i.test(m))
    return 'Tu sesión de administrador no está activa. Pulsa "Salir" y vuelve a entrar con tu correo de administrador.';
  return m;
}
const iniciales = (c) => {
  const base = (c.nombre || c.empresa || c.email || '?').replace(/@.*/, '').trim();
  const partes = base.split(/[\s._-]+/).filter(Boolean);
  return ((partes[0] || '?')[0] + (partes[1] ? partes[1][0] : '')).toUpperCase();
};

/* Íconos (trazo simple) */
const I = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const ICO = {

  pedidos:   I('<path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>'),
  clientes:  I('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.7.8 2.7 2.5 3 5.2"/>'),
  descuentos:I('<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>'),
  grafica:   I('<path d="M3 3v18h18"/><path d="M7 15v-4M12 15V7M17 15v-7"/>'),

  mas:       I('<path d="M12 5v14M5 12h14"/>'),
  cerrar:    I('<path d="M18 6 6 18M6 6l12 12"/>'),
  ojo:       I('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  candado:   I('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  ok:        I('<path d="M20 6 9 17l-5-5"/>'),
  alerta:    I('<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/>'),
  info:      I('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/>'),
  sync:      I('<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>'),
  tienda:    I('<path d="M3 9 4.5 4h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/>'),
  bloquear:  I('<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>'),
  caja:      I('<path d="M3 7h18v13H3z"/><path d="M3 7 5 3h14l2 4M9 11h6"/>'),
};

const ESTADOS = [['enviado','Nuevo'],['cotizado','Cotizado'],['aprobado','Aprobado'],['pagado','Pagado'],['entregado','Entregado'],['cancelado','Cancelado']];
const nombreEstado = (e) => (ESTADOS.find(x => x[0] === e) || [e, e])[1];
const VISTAS = [
  ['resumen', 'Resumen', ICO.resumen],
  ['pedidos', 'Pedidos', ICO.pedidos],
  ['estadisticas', 'Estadísticas', ICO.grafica],
  ['clientes', 'Clientes', ICO.clientes],
  ['descuentos', 'Descuentos', ICO.descuentos],
  ['existencias', 'Existencias', ICO.existencias],
  ['tipos', 'Tipos de cliente', ICO.tipos],
];

let yo = null, tab = 'resumen';
let tipos = [], clientes = [], reglas = [], productos = [], pedidos = [];
let infoCatalogo = null, estadoStock = null;
let emailPendiente = '';

/* ---------- Productos (para marcas, modelos y probar precios) ---------- */
async function cargarProductos(){
  try {
    // Normalmente un solo archivo liviano (catalogo-tienda.json); si no existe, los originales.
    let a, b;
    const cat = await fetch('catalogo-tienda.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
    if (cat){ a = { productos: cat.productos || [] }; b = { productos: cat.manuales || [] }; infoCatalogo = { generado: cat.generado }; }
    else {
      [a, b] = await Promise.all([
        fetch('productos.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({ productos: [] })),
        fetch('productos_manuales.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({ productos: [] })),
      ]);
      infoCatalogo = { generado: a.generado };
    }
    const man = (b.productos || []).filter(p => p.modelo !== 'EJEMPLO-BORRAR').map(p => Object.assign(p, { _manual: true }));
    const set = new Set(man.map(p => p.modelo));
    productos = man.concat((a.productos || []).filter(p => !set.has(p.modelo)));
  } catch (e){ productos = []; }
}
const marcas = () => [...new Set(productos.map(p => (p.marca || '').toUpperCase()).filter(Boolean))].sort();

/* ---------- Acceso ---------- */
async function iniciar(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ pantallaLogin(); return; }
  const email = String(session.user.email || '').toLowerCase();
  const { data: cli } = await sb.from('clientes').select('*').eq('email', email).maybeSingle();
  if (!cli || !cli.es_admin){
    $('raiz').innerHTML = '<div class="entrada"><div class="caja">' + marcaHTML() +
      '<h2 style="margin:0 0 8px">Sin acceso</h2><p>Estás conectado como <strong>' + esc(email) + '</strong>, que no es una cuenta de administrador.</p>' +
      '<button class="btn prim" id="b-salir2" style="width:100%">Entrar con el correo de administrador</button></div></div>';
    $('b-salir2').onclick = async () => { await sb.auth.signOut({ scope: 'local' }); location.reload(); };
    return;
  }
  yo = cli;
  armarApp();
  await Promise.all([cargarProductos(), recargarBase(), cargarPedidos(), cargarEstadoStock()]);
  pintarBadges();
  mostrar();
}
const marcaHTML = () => '<div class="marca"><div class="marca-logo">S</div><div class="marca-txt"><strong>SUINELECTRIC</strong><span>Panel de administrador</span></div></div>';

let adminModo = 'clave';
function pantallaLogin(){
  let cuerpo;
  if (emailPendiente){
    cuerpo = '<div class="aviso azul">' + ICO.info + '<div>Te enviamos un correo a <strong>' + esc(emailPendiente) + '</strong>. Escribe el código o toca el enlace.</div></div>' +
      '<form id="f-cod"><label class="campo">Código<input id="l-cod" inputmode="numeric" autocomplete="one-time-code"></label><button class="btn prim">Entrar</button></form>';
  } else if (adminModo === 'codigo'){
    cuerpo = '<form id="f-email"><label class="campo">Correo del administrador<input type="email" id="l-email" required autocomplete="email"></label><button class="btn prim">Enviar código</button></form>' +
      '<p style="margin:14px 0 0"><button type="button" class="btn chico fantasma" id="l-a-clave">← Entrar con clave</button></p>';
  } else {
    cuerpo = '<form id="f-clave">' +
      '<label class="campo">Correo<input type="email" id="l-email2" required autocomplete="email"></label>' +
      '<label class="campo">Clave<input type="password" id="l-clave" required autocomplete="current-password"></label>' +
      '<button class="btn prim">Entrar</button></form>' +
      '<p class="muted" style="margin:16px 0 0;line-height:1.6">¿No tienes clave o la olvidaste? <button type="button" class="btn chico" id="l-a-codigo">Entrar con un código</button><br>' +
      'Luego puedes crear tu clave en la tienda: Mi cuenta → Mis datos → Mi clave.</p>';
  }
  $('raiz').innerHTML = '<div class="entrada"><div class="caja">' + marcaHTML() + '<h2 style="margin:0 0 16px;font-size:19px">Entrar al panel</h2>' + cuerpo + '<p class="error" id="l-err"></p></div></div>';
  const fe = $('f-email'), fc = $('f-cod'), fk = $('f-clave');
  if ($('l-a-codigo')) $('l-a-codigo').onclick = () => { adminModo = 'codigo'; pantallaLogin(); };
  if ($('l-a-clave')) $('l-a-clave').onclick = () => { adminModo = 'clave'; pantallaLogin(); };
  if (fk) fk.onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $('l-email2').value.trim().toLowerCase(), password: $('l-clave').value });
    if (error){ $('l-err').textContent = /invalid/i.test(error.message) ? 'Correo o clave incorrectos. Si nunca creaste una clave, entra con un código.' : error.message; return; }
    iniciar();
  };
  if (fe) fe.onsubmit = async (e) => {
    e.preventDefault();
    const email = $('l-email').value.trim().toLowerCase();
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split('#')[0] } });
    if (error){ $('l-err').textContent = error.message; return; }
    emailPendiente = email; pantallaLogin();
  };
  if (fc) fc.onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.verifyOtp({ email: emailPendiente, token: $('l-cod').value.trim(), type: 'email' });
    if (error){ $('l-err').textContent = 'Código no válido o vencido.'; return; }
    iniciar();
  };
}
sb.auth.onAuthStateChange((ev, ses) => {
  if (ev === 'SIGNED_IN' && !yo) setTimeout(iniciar, 0);
  // Si la sesión cambia a otra cuenta (o se cierra), recargamos para no trabajar sin permisos.
  if (yo && (ev === 'SIGNED_OUT' || (ses && String(ses.user.email || '').toLowerCase() !== yo.email))) location.reload();
});

/* ---------- Estructura de la app ---------- */
function armarApp(){
  $('raiz').innerHTML = '<div class="app"><aside class="side">' + marcaHTML() +
    '<nav class="nav" id="nav">' + VISTAS.map(v => '<button data-tab="' + v[0] + '">' + v[2] + '<span>' + v[1] + '</span><span class="badge" data-badge="' + v[0] + '" hidden></span></button>').join('') + '</nav>' +
    '<div class="side-pie"><div class="quien">' + esc(yo.email) + '</div><div class="acciones"><a href="tienda.html" target="_blank" rel="noopener">Ver tienda ↗</a><button id="salir">Salir</button></div></div>' +
    '</aside><main class="contenido" id="main"></main></div>';
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => irA(b.dataset.tab));
  $('salir').onclick = async () => { await sb.auth.signOut({ scope: 'local' }); location.reload(); };
}
function irA(t){ tab = t; mostrar(); window.scrollTo(0, 0); }
function mostrar(){
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('activa', x.dataset.tab === tab));
  cerrarPanel();
  ({ resumen: vistaResumen, pedidos: vistaPedidos, estadisticas: vistaEstadisticas, clientes: vistaClientes, descuentos: vistaDescuentos, existencias: vistaExistencias, tipos: vistaTipos }[tab] || vistaResumen)();
}
function pintarBadges(){
  const nuevos = pedidos.filter(p => p.estado === 'enviado').length;
  const b = document.querySelector('[data-badge=pedidos]');
  if (b){ b.textContent = nuevos; b.hidden = !nuevos; }
}
const cabecera = (titulo, sub, acciones) => '<div class="cab"><div><h1>' + titulo + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + (acciones ? '<div class="acc">' + acciones + '</div>' : '') + '</div>';

async function recargarBase(){
  const [t, c, r] = await Promise.all([
    sb.from('tipos_cliente').select('*').order('orden'),
    sb.from('clientes').select('*').order('creado', { ascending: false }),
    sb.from('reglas_descuento').select('*').order('creado', { ascending: false }),
  ]);
  tipos = t.data || []; clientes = c.data || []; reglas = r.data || [];
}
async function cargarPedidos(){
  const { data, error } = await sb.from('pedidos').select('*').order('creado', { ascending: false }).limit(500);
  pedidos = error ? [] : (data || []);
  return error;
}
async function cargarEstadoStock(){
  const { data, error } = await sb.rpc('estado_existencias');
  estadoStock = error ? { error: mensajeError(error) } : (data || { modelos: 0 });
}
const nombreTipo = (id) => (tipos.find(t => t.id === id) || {}).nombre || id || '—';
const nombreCliente = (email) => { const c = clientes.find(x => x.email === email); return c ? (c.nombre || c.empresa || email) : email; };
const tipoVeStock = (id) => !!(tipos.find(t => t.id === id) || {}).ver_existencias;
// Motivo por el que alguien ve las cantidades reales (o null si no las ve).
function motivoStock(c){
  if (!c || c.activo === false) return null;
  if (c.es_admin) return 'Administrador';
  if (c.ver_existencias) return 'Permiso propio';
  if (tipoVeStock(c.tipo_id)) return 'Por ser ' + nombreTipo(c.tipo_id);
  return null;
}

/* ---------- Resumen ---------- */
function vistaResumen(){
  const nuevos = pedidos.filter(p => p.estado === 'enviado');
  const ahora = new Date(), mes = new Date(ahora.getFullYear(), ahora.getMonth(), 1);
  const delMes = pedidos.filter(p => new Date(p.creado) >= mes && p.estado !== 'cancelado');
  const totalMes = delMes.reduce((s, p) => s + Number(p.total || 0), 0);
  const activos = clientes.filter(c => c.activo !== false && !c.es_admin);
  const entraron = activos.filter(c => c.user_id).length;
  const veStock = clientes.filter(motivoStock).length;
  const kpi = (id, icono, titulo, num, pie, extra) => '<' + (id ? 'button data-ir="' + id + '"' : 'div') + ' class="kpi' + (extra || '') + '"><div class="k-cab">' + titulo + icono + '</div><div class="k-num">' + num + '</div><div class="k-pie">' + pie + '</div></' + (id ? 'button' : 'div') + '>';
  const stockPie = estadoStock && !estadoStock.error && estadoStock.actualizado ? 'Existencias al ' + fecha(estadoStock.actualizado) : 'Existencias sin sincronizar';

  $('main').innerHTML = cabecera('Hola' + (yo.nombre ? ', ' + esc(yo.nombre.split(' ')[0]) : ''), 'Así va la tienda hoy, ' + new Date().toLocaleDateString('es-VE', { weekday: 'long', day: 'numeric', month: 'long' }) + '.',
      '<a class="btn" href="tienda.html" target="_blank" rel="noopener">' + ICO.tienda + 'Ver tienda</a>') +
    '<div class="kpis">' +
      kpi('pedidos', ICO.pedidos, 'Pedidos por atender', nuevos.length, nuevos.length ? 'Toca para revisarlos' : 'Todo al día', nuevos.length ? ' destacado' : '') +
      kpi('pedidos', ICO.caja, 'Pedidos del mes', delMes.length, money(totalMes) + ' en total (sin cancelados)') +
      kpi('clientes', ICO.clientes, 'Clientes', activos.length, entraron + ' ya entraron a la tienda') +
      kpi('existencias', ICO.existencias, 'Ven existencias reales', veStock, veStock === 1 ? 'persona' : 'personas') +
      kpi('descuentos', ICO.descuentos, 'Reglas de descuento', reglas.filter(r => r.activo).length, 'activas de ' + reglas.length) +
      kpi(null, ICO.tienda, 'Productos', productos.length.toLocaleString('es-VE'), infoCatalogo && infoCatalogo.generado ? 'Catálogo al ' + fecha(infoCatalogo.generado) : stockPie) +
    '</div>' +
    '<div class="grid-2"><div class="caja"><div class="caja-cab"><h2>Últimos pedidos</h2><button class="btn chico" data-ir="pedidos">Ver todos →</button></div>' +
      (pedidos.length ? '<ul class="lista-simple">' + pedidos.slice(0, 6).map(pd => {
        const c = clientes.find(x => x.email === pd.cliente_email) || { email: pd.cliente_email };
        const n = (Array.isArray(pd.items) ? pd.items : []).reduce((s, it) => s + Number(it.cantidad || 0), 0);
        return '<li><div class="avatar">' + esc(iniciales(c)) + '</div><div><strong>#' + pd.id + ' · ' + esc(c.nombre || c.empresa || c.email) + '</strong><div class="muted">' + fecha(pd.creado) + ' · ' + n + ' unid.</div></div>' +
          '<div class="der"><strong>' + money(pd.total) + '</strong><br>' + pillEstado(pd.estado) + '</div></li>';
      }).join('') + '</ul>' : '<div class="vacio">' + ICO.pedidos + 'Todavía no hay pedidos.</div>') +
    '</div><div class="caja"><div class="caja-cab"><h2>Clientes nuevos</h2><button class="btn chico" data-ir="clientes">Ver todos →</button></div>' +
      (activos.length ? '<ul class="lista-simple">' + activos.slice(0, 6).map(c =>
        '<li><div class="avatar">' + esc(iniciales(c)) + '</div><div><strong>' + esc(c.nombre || c.empresa || '—') + '</strong><div class="muted">' + esc(c.email) + '</div></div>' +
        '<div class="der"><span class="pill azul">' + esc(nombreTipo(c.tipo_id)) + '</span></div></li>').join('') + '</ul>' : '<div class="vacio">' + ICO.clientes + 'Aún no hay clientes.</div>') +
    '</div></div>';
  document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { if (b.dataset.ir === 'pedidos' && nuevos.length && b.classList.contains('destacado')) filtroEstado = 'enviado'; irA(b.dataset.ir); });
}
const pillEstado = (e) => {
  const cls = { enviado: 'amar', cotizado: 'azul', entregado: 'verde', cancelado: 'rojo' }[e] || '';
  return '<span class="pill ' + cls + '"><span class="punto"></span>' + esc(nombreEstado(e)) + '</span>';
};

/* ---------- Pedidos ---------- */
let filtroEstado = '', buscaPed = '';
function vistaPedidos(){
  const cuenta = (e) => pedidos.filter(p => !e || p.estado === e).length;
  $('main').innerHTML = cabecera('Pedidos', 'Los pedidos que los clientes con cuenta envían por WhatsApp. Cambia el estado y deja un comentario: el cliente lo ve en "Mi cuenta".',
      '<button class="btn" id="p-recargar">' + ICO.sync + 'Actualizar</button>') +
    '<div class="caja"><div class="caja-cab" style="margin-bottom:0"><div class="chips" id="p-chips">' +
      '<button class="chip' + (!filtroEstado ? ' activo' : '') + '" data-f="">Todos <b>' + cuenta('') + '</b></button>' +

let reglaDestinoInicial = '';
// Misma lógica que la tienda: gana la regla más específica.
const RANGO = { '00': 1, '01': 2, '02': 3, '10': 4, '20': 5, '11': 6, '21': 7, '12': 8, '22': 9 };
function reglaPara(p, email, tipo){
  const marca = String(p.marca || '').toUpperCase().trim(), modelo = String(p.modelo || '').toUpperCase().trim();
  let mejor = null, mr = 99;
  for (const r of reglas){
    if (!r.activo) continue;
    let quien, que;
    if (r.cliente_email){ if (r.cliente_email !== email) continue; quien = 0; }
    else if (r.tipo_id){ if (r.tipo_id !== tipo) continue; quien = 1; }
    else quien = 2;
    if (r.modelo){ if (String(r.modelo).toUpperCase().trim() !== modelo) continue; que = 0; }
    else if (r.marca){ if (String(r.marca).toUpperCase().trim() !== marca) continue; que = 1; }
    else que = 2;
    if (p._manual && que === 2) continue;
    const k = RANGO['' + que + quien];
    if (k < mr){ mejor = r; mr = k; }
  }
  return mejor;
}
function precioPara(p, email, tipo){
  const r = reglaPara(p, email, tipo);
  if (r && r.precio_fijo != null) return { precio: Number(r.precio_fijo), r };
  if (p.precio == null) return { precio: null, r };
  if (r) return { precio: Number(p.precio) * (1 - Number(r.descuento_pct) / 100), r };
  return { precio: Number(p.precio), r: null };
}

    '<div class="fila" style="margin-top:14px"><button class="btn prim">Guardar regla</button></div><p class="error" id="r-err"></p>' +
    '<datalist id="dl-modelos">' + productos.slice(0, 5000).map(p => '<option value="' + esc(p.modelo) + '">').join('') + '</datalist></form>' +

    '<div class="caja"><div class="caja-cab"><h2>Probar un precio</h2></div><p class="sub">Mira qué precio ve un cliente en un modelo.</p>' +
      '<div class="apilar"><label class="campo">Como<select id="pr-quien"><option value="">Visitante sin cuenta</option>' + clientes.map(c => '<option value="' + esc(c.email) + '">' + esc(c.nombre || c.empresa || c.email) + ' (' + esc(nombreTipo(c.tipo_id)) + ')</option>').join('') + '</select></label>' +
      '<label class="campo">Modelo<input id="pr-modelo" list="dl-modelos" placeholder="Escribe un modelo"></label></div>' +
    '<div class="prueba-res" id="pr-res"></div></div>' +
    '</div>' +

    '<div class="caja" style="margin-top:18px"><div class="caja-cab"><h2>Reglas <small>' + reglas.length + '</small></h2>' +
      '<label class="campo" style="flex-direction:row;align-items:center;gap:8px">Mostrar<select id="r-filtro" style="width:auto"><option value="">Todas</option><option value="t:"' + (filtro === 't:' ? ' selected' : '') + '>Para todos</option>' +
      tipos.map(t => '<option value="tp:' + t.id + '"' + (filtro === 'tp:' + t.id ? ' selected' : '') + '>' + esc(t.nombre) + '</option>').join('') +
      clientes.filter(c => reglas.some(r => r.cliente_email === c.email)).map(c => '<option value="c:' + esc(c.email) + '"' + (filtro === 'c:' + c.email ? ' selected' : '') + '>' + esc(c.nombre || c.email) + '</option>').join('') +
      '</select></label></div><div class="tabla-wrap" id="r-lista"></div></div>';

  const f = $('r-form');
  if (filtro) f.elements.destino.value = filtro.startsWith('c:') || filtro.startsWith('tp:') ? filtro : 't:';
  const leerForm = () => {
    const [k, v] = f.elements.destino.value.split(/:(.*)/s);
    const alc = f.elements.alcance.value;
    return {
      k, v, alc, forma: f.elements.forma.value, valor: Number(f.elements.valor.value),
      marca: alc === 'marca' ? f.elements.marca.value.toUpperCase() : null,
      modelo: alc === 'modelo' ? f.elements.modelo.value.trim() : null,
    };
  };
  const nombreDestino = (x) => x.k === 'c' ? nombreCliente(x.v) : x.k === 'tp' ? 'Los clientes tipo ' + nombreTipo(x.v) : 'Todos (visitantes y clientes)';
  const nombreAlcance = (x) => x.alc === 'marca' ? 'en ' + x.marca : x.alc === 'modelo' ? 'en el modelo ' + (x.modelo || '…') : 'en todos los productos';
  // Descuento que tiene HOY ese destino en esos productos (sin contar una regla idéntica que se vaya a reemplazar).
  const baseActual = (x) => {
    const email = x.k === 'c' ? x.v : null;
    const cli = email ? clientes.find(c => c.email === email) : null;
    const tipo = x.k === 'tp' ? x.v : (cli ? cli.tipo_id : null);
    const p = { marca: x.marca || '', modelo: x.modelo || '' };
    const guardadas = reglas;
    reglas = reglas.filter(r => !mismaClave(r, x));
    const r = reglaPara(p, email, tipo);
    reglas = guardadas;
    return r;
  };
  const mismaClave = (r, x) => (r.cliente_email || null) === (x.k === 'c' ? x.v : null) && (r.tipo_id || null) === (x.k === 'tp' ? x.v : null) &&
    (r.marca || null) === x.marca && String(r.modelo || '').toUpperCase() === String(x.modelo || '').toUpperCase();
  const pctTotal = (base, extra) => Math.round((100 - (100 - base) * (100 - extra) / 100) * 100) / 100;

  const sync = () => {
    const x = leerForm();
    $('r-marca-l').hidden = x.alc !== 'marca';
    $('r-modelo-l').hidden = x.alc !== 'modelo';
    const fijo = f.elements.forma.querySelector('[value=fijo]');
    fijo.disabled = x.alc !== 'modelo';
    if (fijo.disabled && f.elements.forma.value === 'fijo') f.elements.forma.value = 'adic';
    const forma = f.elements.forma.value;
    f.elements.valor.placeholder = forma === 'fijo' ? '180.00' : forma === 'adic' ? '10' : '65';
    const base = baseActual(x);
    const hoy = !base ? 'precio de lista (sin descuento)'
      : base.precio_fijo != null ? 'precio fijo de ' + money(base.precio_fijo)
      : Number(base.descuento_pct) + '% de descuento (' + (base.cliente_email ? 'regla propia' : base.tipo_id ? 'por ser ' + nombreTipo(base.tipo_id) : base.marca ? 'regla de ' + base.marca + ' para todos' : 'descuento general') + ')';
    let nuevo = '';
    if (x.valor > 0 || (forma !== 'adic' && f.elements.valor.value !== '')){
      if (forma === 'fijo') nuevo = 'precio fijo de <strong>' + money(x.valor) + '</strong>';
      else if (forma === 'pct') nuevo = '<strong>' + x.valor + '%</strong> de descuento total';
      else if (base && base.precio_fijo != null) nuevo = '<span style="color:var(--off)">no se puede sumar a un precio fijo; usa "Precio fijo"</span>';
      else { const b = base ? Number(base.descuento_pct) : 0; nuevo = '<strong>' + pctTotal(b, x.valor) + '%</strong> de descuento total (' + b + '% + ' + x.valor + '% adicional sobre su precio)'; }
    }
    $('r-resumen').innerHTML = '<strong>' + esc(nombreDestino(x)) + '</strong> ' + esc(nombreAlcance(x)) + ':<br>Hoy: ' + hoy +
      (nuevo ? '<br>Con esta regla: ' + nuevo : '');
  };
  ['destino', 'alcance', 'marca', 'forma'].forEach(n => f.elements[n].addEventListener('change', sync));
  ['modelo', 'valor'].forEach(n => f.elements[n].addEventListener('input', sync));
  sync();

  f.onsubmit = async (e) => {
    e.preventDefault();
    $('r-err').textContent = '';
    const x = leerForm();
    const d = { cliente_email: x.k === 'c' ? x.v : null, tipo_id: x.k === 'tp' ? x.v : null, marca: x.marca, modelo: x.modelo,
                descuento_pct: null, precio_fijo: null, nota: f.elements.nota.value.trim() || null };
    if (x.alc === 'modelo' && !d.modelo){ $('r-err').textContent = 'Escribe el modelo.'; return; }
    if (!(x.valor >= 0)){ $('r-err').textContent = 'Escribe el valor.'; return; }
    if (x.forma === 'fijo') d.precio_fijo = x.valor;
    else if (x.forma === 'pct'){
      if (x.valor > 100){ $('r-err').textContent = 'El descuento no puede pasar de 100%.'; return; }
      d.descuento_pct = x.valor;
    } else {
      const base = baseActual(x);
      if (base && base.precio_fijo != null){ $('r-err').textContent = 'Ese producto tiene precio fijo; usa "Precio fijo".'; return; }
      const b = base ? Number(base.descuento_pct) : 0;
      d.descuento_pct = pctTotal(b, x.valor);
      if (!d.nota) d.nota = b + '% + ' + x.valor + '% adicional';
    }
    const igual = reglas.find(r => mismaClave(r, x));
    const res = igual ? await sb.from('reglas_descuento').update(Object.assign({ activo: true }, d)).eq('id', igual.id)
                      : await sb.from('reglas_descuento').insert(d);
    if (res.error){ $('r-err').textContent = mensajeError(res.error); return; }
    await recargarBase(); toast(igual ? 'Regla actualizada' : 'Regla guardada');
    reglaDestinoInicial = f.elements.destino.value; vistaDescuentos();
  };

  const pintarLista = () => {
    const fil = $('r-filtro').value;
    const lista = reglas.filter(r => !fil || (fil === 't:' ? (!r.cliente_email && !r.tipo_id) : fil.startsWith('tp:') ? r.tipo_id === fil.slice(3) : r.cliente_email === fil.slice(2)));
    $('r-lista').innerHTML = !lista.length ? '<div class="vacio">' + ICO.descuentos + 'No hay reglas aquí.</div>' :
      '<table><thead><tr><th>A quién</th><th>Aplica a</th><th>Precio</th><th>Nota</th><th>Activa</th><th></th></tr></thead><tbody>' +
      lista.map(r => '<tr class="' + (r.activo ? '' : 'inactivo') + '"><td>' + describirQuien(r) + '</td><td>' + describirQue(r) + '</td>' +
        '<td><strong>' + (r.precio_fijo != null ? money(r.precio_fijo) + ' fijo' : Number(r.descuento_pct) + '% dto.') + '</strong></td>' +
        '<td class="muted">' + esc(r.nota || '') + '</td>' +
        '<td><label class="switch solo"><input type="checkbox" data-activa="' + r.id + '"' + (r.activo ? ' checked' : '') + ' aria-label="Regla activa"><span class="sw"></span></label></td>' +
        '<td class="acciones"><button class="btn chico peligro" data-borrar="' + r.id + '">Eliminar</button></td></tr>').join('') + '</tbody></table>';
    document.querySelectorAll('[data-activa]').forEach(ch => ch.onchange = async () => {
      const { error } = await sb.from('reglas_descuento').update({ activo: ch.checked }).eq('id', ch.dataset.activa);
      if (error) return toast('Error: ' + mensajeError(error));
      await recargarBase(); pintarLista(); toast(ch.checked ? 'Regla activada' : 'Regla desactivada');
    });
    document.querySelectorAll('[data-borrar]').forEach(b => b.onclick = async () => {
      if (!confirm('¿Eliminar esta regla?')) return;
      const { error } = await sb.from('reglas_descuento').delete().eq('id', b.dataset.borrar);
      if (error) return toast('Error: ' + mensajeError(error));
      await recargarBase(); pintarLista(); toast('Regla eliminada');
    });
  };
  $('r-filtro').onchange = () => { reglaDestinoInicial = $('r-filtro').value; pintarLista(); };
  pintarLista();

  const probar = () => {
    const m = $('pr-modelo').value.trim().toUpperCase();
    const p = productos.find(x => String(x.modelo || '').toUpperCase() === m);
    if (!m){ $('pr-res').innerHTML = ''; return; }
    if (!p){ $('pr-res').innerHTML = '<span class="muted">Modelo no encontrado en el catálogo.</span>'; return; }
    const email = $('pr-quien').value || null;
    const c = clientes.find(x => x.email === email);
    const { precio, r } = precioPara(p, email, c ? c.tipo_id : null);
    $('pr-res').innerHTML = '<span class="mono">' + esc(p.modelo) + '</span> · ' + esc(p.marca || '') + '<span class="precio">' + money(precio) + '</span>' +
      '<span class="muted">Lista ' + money(p.precio) + ' · ' +
      (r ? 'por la regla: ' + (r.cliente_email ? esc(nombreCliente(r.cliente_email)) : r.tipo_id ? esc(nombreTipo(r.tipo_id)) : 'Todos') + ' · ' + describirQue(r).replace(/<[^>]+>/g, '') + ' · ' + (r.precio_fijo != null ? 'precio fijo' : Number(r.descuento_pct) + '%') : (p._manual ? 'producto cargado a mano: precio de catálogo, sin regla.' : 'sin regla: precio de lista.')) + '</span>';
  };
  $('pr-modelo').oninput = probar; $('pr-quien').onchange = probar;
}

/* ---------- Estadísticas ---------- */
let diasEst = 30;
const slugDe = (x) => String(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
async function vistaEstadisticas(){
  const chips = '<div class="chips">' + [[7, '7 días'], [30, '30 días'], [90, '90 días']].map(([d, t]) => '<button class="chip' + (diasEst === d ? ' activo' : '') + '" data-dias="' + d + '">' + t + '</button>').join('') + '</div>';
  $('main').innerHTML = cabecera('Estadísticas', 'Qué buscan, qué miran y qué cotizan tus clientes. No se cuenta lo que haces tú como administrador.', chips) + '<div class="cargando">Cargando…</div>';
  document.querySelectorAll('[data-dias]').forEach(b => b.onclick = () => { diasEst = Number(b.dataset.dias); vistaEstadisticas(); });
  const { data, error } = await sb.rpc('resumen_estadisticas', { dias: diasEst });
  if (tab !== 'estadisticas') return;
  const cont = document.querySelector('#main .cargando');
  if (error || !data){
    cont.outerHTML = '<div class="caja"><div class="tarjeta-sync"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar las estadísticas en Supabase</strong><div class="muted">Corre <span class="mono">04_estadisticas.sql</span> en Supabase → SQL Editor. Desde ese momento la tienda empieza a anotar búsquedas, visitas y cotizaciones.</div></div></div></div>';
    return;
  }
  sb.rpc('limpiar_eventos').then(() => {}, () => {});
  const t = data.totales || {};
  const cotiza = (t.cotizar_whatsapp || 0) + (t.pedido_whatsapp || 0);
  const kpi = (icono, titulo, num, pie) => '<div class="kpi"><div class="k-cab">' + titulo + icono + '</div><div class="k-num">' + Number(num || 0).toLocaleString('es-VE') + '</div><div class="k-pie">' + pie + '</div></div>';
  const prod = (m) => productos.find(p => p.modelo === m);
  const nomProd = (m) => { const p = prod(m); return '<a href="/p/' + slugDe(m) + '" target="_blank" rel="noopener" class="mono">' + esc(m) + '</a><small>' + esc(p ? [p.marca, p.descripcion || p.nombre].filter(Boolean).join(' · ') : 'Ya no está en el catálogo') + '</small>'; };
  const ranking = (lista, fila, vacio) => !lista || !lista.length ? '<div class="vacio">' + ICO.grafica + vacio + '</div>' :
    '<ol class="ranking">' + lista.slice(0, 15).map((x, i) => fila(x, i, lista)).join('') + '</ol>';
  const barra = (v, max) => '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * v / (max || 1))) + '%"></i></div>';

  // Gráfico por día (completa los días sin datos)
  const porDia = {}; (data.por_dia || []).forEach(d => { porDia[d.dia] = d; });
  const dias = [];
  for (let i = diasEst - 1; i >= 0; i--){
    const f = new Date(Date.now() - i * 86400000);
    const k = f.toLocaleDateString('en-CA', { timeZone: 'America/Caracas' });
    dias.push({ k, f, v: (porDia[k] || {}).vistas || 0, c: (porDia[k] || {}).cotiza || 0 });
  }
  const maxV = Math.max(1, ...dias.map(d => Math.max(d.v, d.c)));
  const cada = diasEst <= 7 ? 1 : diasEst <= 30 ? 5 : 15;
  const grafico = '<div class="grafico">' + dias.map(d => '<div class="col" title="' + d.f.toLocaleDateString('es-VE', { weekday: 'short', day: 'numeric', month: 'short' }) + ': ' + d.v + ' vistas, ' + d.c + ' cotizaciones">' +
      '<div class="b1" style="height:' + (100 * d.v / maxV) + '%"></div><div class="b2" style="height:' + (100 * d.c / maxV) + '%"></div></div>').join('') + '</div>' +
    '<div class="grafico-ejes">' + dias.map((d, i) => '<span>' + ((dias.length - 1 - i) % cada === 0 ? d.f.getDate() : '') + '</span>').join('') + '</div>';

  const maxB = Math.max(1, ...(data.buscado || []).map(x => x.veces));
  const maxS = Math.max(1, ...(data.sin_resultados || []).map(x => x.veces));
  const maxVi = Math.max(1, ...(data.vistos || []).map(x => x.veces));
  const totalCot = (x) => x.whatsapp + x.carrito + x.pedidos;
  const maxC = Math.max(1, ...(data.cotizados || []).map(totalCot));

  cont.outerHTML =
    '<div class="kpis">' +
      kpi(ICO.buscar, 'Búsquedas', t.busqueda, 'veces que usaron el buscador') +
      kpi(ICO.ojo, 'Productos vistos', t.ver_producto, 'fichas de producto abiertas') +
      kpi(ICO.tienda, 'Agregados al pedido', t.agregar_carrito, 'productos puestos en el carrito') +
      kpi(ICO.pedidos, 'Cotizaciones por WhatsApp', cotiza, (t.pedido_whatsapp || 0) + ' desde el carrito · ' + (t.cotizar_whatsapp || 0) + ' de un producto') +
    '</div>' +
    '<div class="caja"><div class="caja-cab"><h2>Actividad por día</h2><div class="leyenda"><span><i style="background:var(--azul-suave)"></i>Productos vistos</span><span><i style="background:var(--azul)"></i>Cotizaciones y carrito</span></div></div>' + grafico + '</div>' +
    '<div class="grid-2" style="grid-template-columns:1fr 1fr;margin-bottom:18px">' +
      '<div class="caja"><div class="caja-cab"><h2>Lo más buscado</h2></div>' +
        ranking(data.buscado, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + esc(x.texto) + (x.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : '') + barra(x.veces, maxB) + '</span><span class="num">' + x.veces + '</span></li>', 'Todavía no hay búsquedas en este período.') + '</div>' +
      '<div class="caja"><div class="caja-cab"><h2>Buscan y no encuentran</h2></div><p class="sub">Oportunidades: productos que te piden y no están en la tienda (o están escritos distinto).</p>' +
        ranking(data.sin_resultados, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + esc(x.texto) + '<small>Última vez: ' + fecha(x.ultima) + '</small>' + barra(x.veces, maxS) + '</span><span class="num">' + x.veces + '</span></li>', 'Nadie se ha quedado sin resultados. 👍') + '</div>' +
    '</div>' +
    '<div class="grid-2" style="grid-template-columns:1fr 1fr">' +
      '<div class="caja"><div class="caja-cab"><h2>Productos más vistos</h2></div>' +
        ranking(data.vistos, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + nomProd(x.modelo) + barra(x.veces, maxVi) + '</span><span class="num">' + x.veces + '<small>vistas</small></span></li>', 'Todavía no hay visitas en este período.') + '</div>' +
      '<div class="caja"><div class="caja-cab"><h2>Productos más cotizados</h2></div>' +
        ranking(data.cotizados, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + nomProd(x.modelo) + barra(totalCot(x), maxC) + '</span><span class="num">' + totalCot(x) +
          '<small>' + [x.whatsapp ? x.whatsapp + ' WhatsApp' : '', x.carrito ? x.carrito + ' carrito' : '', x.pedidos ? x.pedidos + ' pedido' + (x.pedidos > 1 ? 's' : '') : ''].filter(Boolean).join(' · ') + (x.clientes ? ' · ' + x.clientes + ' con cuenta' : '') + '</small></span></li>', 'Todavía no hay cotizaciones en este período.') + '</div>' +
    '</div>';
}

/* ---------- Existencias ---------- */
function vistaExistencias(){
  const faltaSQL = estadoStock && estadoStock.error;
  const admins = clientes.filter(c => c.es_admin && c.activo !== false);
  const conPermiso = clientes.filter(c => !c.es_admin && c.ver_existencias);
  const porTipo = clientes.filter(c => !c.es_admin && !c.ver_existencias && c.activo !== false && tipoVeStock(c.tipo_id));
  const total = clientes.filter(motivoStock).length;

  let sync;
  if (faltaSQL) sync = '<div class="tarjeta-sync"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar esta función en Supabase</strong><div class="muted">Corre <span class="mono">03_existencias.sql</span> en Supabase → SQL Editor. Mientras tanto, todos ven "+10 disponibles".</div></div></div>';
  else if (!estadoStock || !estadoStock.modelos) sync = '<div class="tarjeta-sync"><div class="icono mal">' + ICO.sync + '</div><div><strong>Todavía no se han subido las cantidades reales</strong><div class="muted">Se suben solas cada día con la actualización del catálogo. Revisa que GitHub tenga los secrets <span class="mono">SUPABASE_URL</span> y <span class="mono">SUPABASE_SECRET_KEY</span>.</div></div></div>';
  else sync = '<div class="tarjeta-sync"><div class="icono">' + ICO.ok + '</div><div><strong>' + Number(estadoStock.modelos).toLocaleString('es-VE') + ' modelos con cantidad real</strong><div class="muted">Última actualización: ' + fecha(estadoStock.actualizado) + ' · se actualiza cada día con el catálogo.</div></div></div>';

  $('main').innerHTML = cabecera('Existencias', 'Elige quién ve las cantidades exactas. Los demás ven un rango, y las cantidades reales nunca se publican en la web.') +
    '<div class="caja">' + sync + '</div>' +
    '<div class="caja"><div class="caja-cab"><h2>Qué ve cada quien</h2></div><div class="muestras">' +
      '<div class="muestra"><h3>' + ICO.candado + 'Visitantes y clientes</h3><ul>' +
        '<li><span>Más de 10 unidades</span><span class="estado-stock ok">+10 disponibles</span></li>' +
        '<li><span>De 1 a 10 unidades</span><span class="estado-stock ok">Últimas unidades</span></li>' +
        '<li><span>Sin unidades</span><span class="estado-stock off">Agotado</span></li></ul></div>' +
      '<div class="muestra" style="border-color:#b4dcc1;background:#f7fcf8"><h3 style="color:var(--ok)">' + ICO.ojo + 'Con permiso</h3><ul>' +
        '<li><span>Más de 10 unidades</span><span class="estado-stock ok">252 disponibles</span></li>' +
        '<li><span>De 1 a 10 unidades</span><span class="estado-stock ok">3 disponibles</span></li>' +
        '<li><span>Sin unidades</span><span class="estado-stock off">Agotado</span></li></ul></div>' +
    '</div></div>' +
    '<div class="grid-2">' +
      '<div class="caja"><div class="caja-cab"><h2>Clientes con permiso <small>' + total + ' en total</small></h2></div>' +
        '<form id="e-dar" class="fila" style="margin-bottom:12px"><label class="campo" style="flex:1 1 240px">Dar permiso a un cliente<select name="email"><option value="">Elige un cliente…</option>' +
          clientes.filter(c => !c.es_admin && !c.ver_existencias).map(c => '<option value="' + esc(c.email) + '">' + esc(c.nombre || c.empresa || c.email) + ' · ' + esc(c.email) + '</option>').join('') +
        '</select></label><button class="btn prim">' + ICO.ojo + 'Dar permiso</button></form>' +
        '<ul class="lista-simple permisos">' +
          admins.map(c => filaPermiso(c, 'Administrador · siempre', null)).join('') +
          conPermiso.map(c => filaPermiso(c, 'Permiso propio' + (c.activo === false ? ' · cuenta bloqueada' : ''), 'cli')).join('') +
          porTipo.map(c => filaPermiso(c, 'Por ser ' + nombreTipo(c.tipo_id), 'tipo')).join('') +
        '</ul>' +
        (!conPermiso.length && !porTipo.length ? '<p class="muted" style="margin:8px 0 0">Por ahora solo los administradores ven las cantidades reales.</p>' : '') +
      '</div>' +
      '<div class="caja"><div class="caja-cab"><h2>Por tipo de cliente</h2></div><p class="sub">Todos los clientes del tipo verán las cantidades reales.</p>' +
        '<div class="interruptores">' + tipos.map(t => {
          const n = clientes.filter(c => c.tipo_id === t.id).length;
          return '<label class="switch"><input type="checkbox" data-tipo-stock="' + t.id + '"' + (t.ver_existencias ? ' checked' : '') + (faltaSQL ? ' disabled' : '') + '><span class="sw"></span><span class="sw-txt"><strong>' + esc(t.nombre) + '</strong><small>' + n + ' cliente' + (n === 1 ? '' : 's') + '</small></span></label>';
        }).join('') + '</div>' +
      '</div>' +
    '</div>';

  $('e-dar').onsubmit = async (e) => {
    e.preventDefault();
    const email = e.target.elements.email.value;
    if (!email) return toast('Elige un cliente');
    await cambiarPermiso(email, true);
  };
  document.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => cambiarPermiso(b.dataset.quitar, false));
  document.querySelectorAll('[data-tipo-stock]').forEach(ch => ch.onchange = async () => {
    const { error } = await sb.from('tipos_cliente').update({ ver_existencias: ch.checked }).eq('id', ch.dataset.tipoStock);
    if (error){ ch.checked = !ch.checked; return toast('Error: ' + mensajeError(error)); }
    await recargarBase(); toast(nombreTipo(ch.dataset.tipoStock) + (ch.checked ? ': ven existencias reales' : ': ven el rango')); vistaExistencias();
  });
}
function filaPermiso(c, motivo, quitable){
  return '<li><div class="avatar' + (c.es_admin ? ' admin' : '') + '">' + esc(iniciales(c)) + '</div><div><strong>' + esc(c.nombre || c.empresa || c.email) + '</strong><div class="muted">' + esc(c.email) + '</div></div>' +
    '<div class="der">' + (quitable === 'cli' ? '<span class="pill verde" style="margin-right:6px">' + esc(motivo) + '</span><button class="btn chico peligro" data-quitar="' + esc(c.email) + '">Quitar</button>'
      : '<span class="pill ' + (c.es_admin ? 'tinta' : 'azul') + '">' + esc(motivo) + '</span>') + '</div></li>';
}
async function cambiarPermiso(email, dar){
  const { error } = await sb.from('clientes').update({ ver_existencias: dar }).eq('email', email);
  if (error) return toast('Error: ' + mensajeError(error));
  await recargarBase();
  const c = clientes.find(x => x.email === email);
  toast(dar ? nombreCliente(email) + ' ya ve las existencias reales'
            : (c && tipoVeStock(c.tipo_id) ? 'Permiso propio quitado (sigue viéndolas por su tipo)' : 'Permiso quitado'));
  vistaExistencias();
}

/* ---------- Tipos de cliente ---------- */
function vistaTipos(){
  $('main').innerHTML = cabecera('Tipos de cliente', 'Agrupa a tus clientes para darles descuentos y permisos en bloque.') +
    '<div class="caja"><div class="tabla-wrap"><table><thead><tr><th>Nombre</th><th>Clientes</th><th>Reglas</th><th>Ve existencias reales</th><th></th></tr></thead><tbody>' +
    tipos.map(t => '<tr><td style="min-width:200px"><input data-nombre="' + t.id + '" value="' + esc(t.nombre) + '"></td>' +
      '<td>' + clientes.filter(c => c.tipo_id === t.id).length + '</td><td>' + reglas.filter(r => r.tipo_id === t.id).length + '</td>' +
      '<td><label class="switch solo"><input type="checkbox" data-tipo-stock="' + t.id + '"' + (t.ver_existencias ? ' checked' : '') + ' aria-label="Ve existencias reales"><span class="sw"></span></label></td>' +
      '<td class="acciones"><button class="btn chico" data-guardar="' + t.id + '">Guardar</button> <button class="btn chico peligro" data-borrar="' + t.id + '">Eliminar</button></td></tr>').join('') +
    '</tbody></table></div><form id="t-form" class="fila" style="margin-top:16px"><label class="campo" style="flex:1 1 240px">Nuevo tipo<input name="nombre" required placeholder="Ej. Integrador"></label><button class="btn prim">' + ICO.mas + 'Agregar</button></form><p class="error" id="t-err"></p></div>';
  document.querySelectorAll('[data-guardar]').forEach(b => b.onclick = async () => {
    const nombre = document.querySelector('[data-nombre="' + b.dataset.guardar + '"]').value.trim();
    const { error } = await sb.from('tipos_cliente').update({ nombre }).eq('id', b.dataset.guardar);
    if (error) return toast('Error: ' + mensajeError(error));
    await recargarBase(); toast('Guardado');
  });
  document.querySelectorAll('[data-tipo-stock]').forEach(ch => ch.onchange = async () => {
    const { error } = await sb.from('tipos_cliente').update({ ver_existencias: ch.checked }).eq('id', ch.dataset.tipoStock);
    if (error){ ch.checked = !ch.checked; return toast('Error: ' + mensajeError(error)); }
    await recargarBase(); toast(ch.checked ? 'Este tipo ve existencias reales' : 'Este tipo ve el rango');
  });
  document.querySelectorAll('[data-borrar]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Eliminar este tipo? Sus reglas se borran y sus clientes quedan sin tipo.')) return;
    const { error } = await sb.from('tipos_cliente').delete().eq('id', b.dataset.borrar);
    if (error) return toast('Error: ' + mensajeError(error));
    await recargarBase(); vistaTipos(); toast('Tipo eliminado');
  });
  $('t-form').onsubmit = async (e) => {
    e.preventDefault();
    const nombre = e.target.elements.nombre.value.trim();
    const id = nombre.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const { error } = await sb.from('tipos_cliente').insert({ id, nombre, orden: tipos.length + 1 });
    if (error){ $('t-err').textContent = error.code === '23505' ? 'Ese tipo ya existe.' : mensajeError(error); return; }
    await recargarBase(); vistaTipos(); toast('Tipo agregado');
  };
}

iniciar();
</script>

</html>
