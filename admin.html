}

// Panel con todo lo que hizo un visitante (todas sus visitas)
async function abrirVisitante(id){
  const cab = '<div class="panel-cab"><div class="avatar">' + esc(codigoVis(id).slice(0, 2)) + '</div><div><h2>Visitante ' + esc(codigoVis(id)) + '</h2><div class="muted">Sin cuenta · identificado por su navegador</div></div>' +
    '<button class="btn chico fantasma cerrar" id="v-cerrar" aria-label="Cerrar">' + ICO.cerrar + '</button></div>';
  const chips = '<div class="chips" style="margin-bottom:16px">' + DIAS_ACT.map(([d, t]) => '<button class="chip' + (diasAct === d ? ' activo' : '') + '" data-dias-vact="' + d + '">' + t + '</button>').join('') + '</div>';
  abrirPanel(cab + '<div class="panel-cuerpo">' + chips + '<div class="cargando">Cargando…</div></div>', true);
  $('panel').dataset.actividad = 'v:' + id;
  const enlazar = () => {
    $('v-cerrar').onclick = cerrarPanel;
    document.querySelectorAll('[data-dias-vact]').forEach(b => b.onclick = () => { diasAct = Number(b.dataset.diasVact); abrirVisitante(id); });
  };
  enlazar();
  const { data, error } = await sb.rpc('actividad_visitante', { p_visitante: id, dias: diasAct });
  if ($('panel').dataset.actividad !== 'v:' + id) return;
  const cuerpo = document.querySelector('#panel .panel-cuerpo');
  if (error || !data){ cuerpo.innerHTML = chips + faltaVisitantes(error); enlazar(); return; }

  const t = data.totales || {};
  const visitas = data.visitas || [];
  const ult = visitas[0] || {};
  const mini = (titulo, num, pie) => '<div class="kpi"><div class="k-cab">' + titulo + '</div><div class="k-num" style="font-size:23px">' + Number(num || 0).toLocaleString('es-VE') + '</div>' + (pie ? '<div class="k-pie">' + pie + '</div>' : '') + '</div>';
  const vacio = (txt) => '<div class="muted" style="padding:8px 0">' + txt + '</div>';
  const barra = (v, m) => '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * v / m)) + '%"></i></div>';
  const maxB = Math.max(1, ...(data.buscado || []).map(x => x.veces));
  const maxV = Math.max(1, ...(data.vistos || []).map(x => x.veces));
  const correos = data.correos || [];

  // Paso a paso, agrupado por visita
  const infoVisita = {}; visitas.forEach(v => { infoVisita[v.visita] = v; });
  const TXT = {
    visita: (e) => 'Entró' + (e.pagina ? ' por <strong>' + esc(paginaBonita(e.pagina)) + '</strong>' : ''),
    busqueda: (e) => 'Buscó <strong>“' + esc(e.texto) + '”</strong>' + (e.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : e.resultados != null ? ' <span class="muted">(' + e.resultados + ' resultados)</span>' : ''),
    ver_producto: (e) => 'Abrió la ficha de ' + linkProd(e.modelo) + (e.origen === 'pagina' ? ' <span class="muted">(página del producto)</span>' : ''),
    ver_tarjetas: (e) => {
      const l = e.modelos || [];
      return 'Vio ' + l.length + ' tarjeta' + (l.length === 1 ? '' : 's') + (e.texto ? ' en <strong>' + esc(e.texto) + '</strong>' : '') +
        '<details class="vis-tarj"><summary>Ver cuáles</summary>' + l.map(m => linkProd(m)).join(' ') + '</details>';
    },
    agregar_carrito: (e) => 'Agregó ' + (e.cantidad ? e.cantidad + ' × ' : '') + linkProd(e.modelo) + ' al pedido',
    cotizar_whatsapp: (e) => 'Pidió precio por WhatsApp de ' + linkProd(e.modelo) + (e.origen === 'pagina' ? ' <span class="muted">(página del producto)</span>' : ''),
    pedido_whatsapp: (e) => 'Envió por WhatsApp ' + (e.cantidad ? e.cantidad + ' × ' : '') + linkProd(e.modelo),
  };
  const ICO_EV = { visita: ICO.tienda, busqueda: ICO.buscar, ver_producto: ICO.ojo, ver_tarjetas: ICO.grafica, agregar_carrito: ICO.tienda, cotizar_whatsapp: ICO.whatsapp, pedido_whatsapp: ICO.pedidos };
  let visAnt = null;
  const linea = (data.recientes || []).map(e => {
    let cabV = '';
    if (e.visita !== visAnt){
      visAnt = e.visita;
      const v = infoVisita[e.visita] || {};
      cabV = '<li class="act-dia">' + (v.inicio ? diaLargo(v.inicio) + ' · ' + hora(v.inicio) : diaLargo(e.creado)) +
        '<div class="vis-cabv">' + [esc(lugarDe(v)), esc(equipoDe(v)), 'llegó por ' + esc(origenDe(v.referencia)), v.fin > v.inicio ? 'estuvo ' + duracion((new Date(v.fin) - new Date(v.inicio)) / 1000) : ''].filter(Boolean).join(' · ') + '</div></li>';
    }
    return cabV + '<li class="act-ev t-' + e.tipo + '">' + (ICO_EV[e.tipo] || '') + '<span>' + (TXT[e.tipo] || (() => esc(e.tipo)))(e) +
      (e.cliente_email ? ' <span class="pill azul">con su cuenta</span>' : '') + '</span><time>' + hora(e.creado) + '</time></li>';
  }).join('');

  cuerpo.innerHTML = chips +
    (correos.length ? '<div class="aviso azul">' + ICO.info + '<div>Este navegador también entró con cuenta: ' + correos.map(c => '<a href="#" data-act-email="' + esc(c) + '"><strong>' + esc(nombreCliente(c)) + '</strong></a>' + (nombreCliente(c) !== c ? ' <span class="muted">(' + esc(c) + ')</span>' : '')).join(', ') + '.</div></div>' : '') +
    '<div class="det-datos" style="margin-bottom:16px">' +
      '<div><span>Última visita</span>' + (data.ultima ? haceCuanto(data.ultima) + ' <small class="muted">· ' + fecha(data.ultima) + '</small>' : '—') + '</div>' +
      '<div><span>Primera vez</span>' + (data.primera ? fecha(data.primera) : '—') + '</div>' +
      '<div><span>Desde dónde</span>' + esc(lugarDe(ult)) + (ult.proveedor ? ' <small class="muted">· ' + esc(ult.proveedor) + '</small>' : '') + '</div>' +
      '<div><span>Equipo</span>' + esc(equipoDe(ult)) + '</div>' +
    '</div>' +
    '<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px">' +
      mini('Visitas', visitas.length) +
      mini('Búsquedas', t.busqueda) +
      mini('Tarjetas', data.n_tarjetas) +
      mini('Fichas', t.ver_producto) +
      mini('Al pedido', t.agregar_carrito) +
      mini('WhatsApp', (t.cotizar_whatsapp || 0) + (t.pedido_whatsapp || 0)) +
    '</div>' +
    '<div class="seccion"><h3>Lo que buscó</h3>' + (!(data.buscado || []).length ? vacio('No buscó nada en este período.') :
      '<ol class="ranking">' + data.buscado.slice(0, 15).map((x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + esc(x.texto) + (x.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : '') +
        '<small>' + haceCuanto(x.ultima) + '</small>' + barra(x.veces, maxB) + '</span><span class="num">' + x.veces + '</span></li>').join('') + '</ol>') + '</div>' +
    '<div class="seccion"><h3>Fichas de producto que abrió</h3>' + (!(data.vistos || []).length ? vacio('No abrió fichas de producto en este período.') :
      '<ol class="ranking">' + data.vistos.slice(0, 15).map((x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + linkProd(x.modelo) + '<small>' + esc(descProd(x.modelo)) + '</small>' + barra(x.veces, maxV) + '</span><span class="num">' + x.veces + '<small>' + haceCuanto(x.ultima) + '</small></span></li>').join('') + '</ol>') + '</div>' +
    '<div class="seccion"><h3>Tarjetas que tuvo en pantalla <small class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">(' + (data.tarjetas || []).length + ' productos distintos)</small></h3>' + (!(data.tarjetas || []).length ? vacio('No hay tarjetas vistas en este período.') :
      '<div class="vis-modelos">' + data.tarjetas.map(x => '<span title="' + esc(descProd(x.modelo)) + '">' + linkProd(x.modelo) + (x.veces > 1 ? ' <b>×' + x.veces + '</b>' : '') + '</span>').join('') + '</div>') + '</div>' +
    '<div class="seccion"><h3>Paso a paso <small class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">(lo más reciente primero)</small></h3>' + (linea ? '<ul class="act-linea">' + linea + '</ul>' : vacio('Sin actividad en este período.')) + '</div>' +
    '<p class="muted" style="font-size:12.5px">Si la persona borra los datos del navegador o entra desde otro equipo, aparece como un visitante nuevo. El lugar es aproximado.</p>';
  cuerpo.insertAdjacentHTML('afterend', '<div class="panel-pie"><button class="btn prim" id="v-listo" style="margin-left:auto">Cerrar</button></div>');
  enlazar();
  $('v-listo').onclick = cerrarPanel;
  cuerpo.querySelectorAll('[data-act-email]').forEach(a => a.onclick = (e) => { e.preventDefault(); abrirActividad(a.dataset.actEmail); });
}

/* ---------- Existencias ---------- */

  const faltaSQL = estadoStock && estadoStock.error;
  const admins = clientes.filter(c => c.es_admin && c.activo !== false);
  const conPermiso = clientes.filter(c => !c.es_admin && c.ver_existencias);
  const porTipo = clientes.filter(c => !c.es_admin && !c.ver_existencias && c.activo !== false && tipoVeStock(c.tipo_id));
  const total = clientes.filter(motivoStock).length;

  let sync;
  if (faltaSQL) sync = '<div class="tarjeta-sync"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar esta función en Supabase</strong><div class="muted">Corre <span class="mono">03_existencias.sql</span> en Supabase → SQL Editor. Mientras tanto, todos ven "+10 disponibles".</div></div></div>';
  else if (!estadoStock || !estadoStock.modelos) sync = '<div class="tarjeta-sync"><div class="icono mal">' + ICO.sync + '</div><div><strong>Todavía no se han subido las cantidades reales</strong><div class="muted">Se suben solas cada día con la actualización del catálogo. Revisa que GitHub tenga los secrets <span class="mono">SUPABASE_URL</span> y <span class="mono">SUPABASE_SECRET_KEY</span>.</div></div></div>';
  else sync = '<div class="tarjeta-sync"><div class="icono">' + ICO.ok + '</div><div><strong>' + Number(estadoStock.modelos).toLocaleString('es-VE') + ' modelos con cantidad real</strong><div class="muted">Última actualización: ' + fecha(estadoStock.actualizado) + ' · se actualiza cada día con el catálogo.</div></div></div>';

  $('main').innerHTML = cabecera('Existencias', 'Elige quién ve las cantidades exactas. Los demás ven un rango, y las cantidades reales nunca se publican en la web.') +
    '<div class="caja">' + sync + '</div>' +
    '<div class="caja"><div class="caja-cab"><h2>Qué ve cada quien</h2></div><div class="muestras">' +
      '<div class="muestra"><h3>' + ICO.candado + 'Visitantes y clientes</h3><ul>' +
        '<li><span>Más de 10 unidades</span><span class="estado-stock ok">+10 disponibles</span></li>' +
        '<li><span>De 1 a 10 unidades</span><span class="estado-stock ok">Últimas unidades</span></li>' +
        '<li><span>Sin unidades</span><span class="estado-stock off">Agotado</span></li></ul></div>' +
      '<div class="muestra" style="border-color:#b4dcc1;background:#f7fcf8"><h3 style="color:var(--ok)">' + ICO.ojo + 'Con permiso</h3><ul>' +
        '<li><span>Más de 10 unidades</span><span class="estado-stock ok">252 disponibles</span></li>' +
        '<li><span>De 1 a 10 unidades</span><span class="estado-stock ok">3 disponibles</span></li>' +
        '<li><span>Sin unidades</span><span class="estado-stock off">Agotado</span></li></ul></div>' +
    '</div></div>' +
    '<div class="grid-2">' +
      '<div class="caja"><div class="caja-cab"><h2>Clientes con permiso <small>' + total + ' en total</small></h2></div>' +
        '<form id="e-dar" class="fila" style="margin-bottom:12px"><label class="campo" style="flex:1 1 240px">Dar permiso a un cliente<select name="email"><option value="">Elige un cliente…</option>' +
          clientes.filter(c => !c.es_admin && !c.ver_existencias).map(c => '<option value="' + esc(c.email) + '">' + esc(c.nombre || c.empresa || c.email) + ' · ' + esc(c.email) + '</option>').join('') +
        '</select></label><button class="btn prim">' + ICO.ojo + 'Dar permiso</button></form>' +
        '<ul class="lista-simple permisos">' +
          admins.map(c => filaPermiso(c, 'Administrador · siempre', null)).join('') +
          conPermiso.map(c => filaPermiso(c, 'Permiso propio' + (c.activo === false ? ' · cuenta bloqueada' : ''), 'cli')).join('') +
          porTipo.map(c => filaPermiso(c, 'Por ser ' + nombreTipo(c.tipo_id), 'tipo')).join('') +
        '</ul>' +
        (!conPermiso.length && !porTipo.length ? '<p class="muted" style="margin:8px 0 0">Por ahora solo los administradores ven las cantidades reales.</p>' : '') +
      '</div>' +
      '<div class="caja"><div class="caja-cab"><h2>Por tipo de cliente</h2></div><p class="sub">Todos los clientes del tipo verán las cantidades reales.</p>' +
        '<div class="interruptores">' + tipos.map(t => {
          const n = clientes.filter(c => c.tipo_id === t.id).length;
          return '<label class="switch"><input type="checkbox" data-tipo-stock="' + t.id + '"' + (t.ver_existencias ? ' checked' : '') + (faltaSQL ? ' disabled' : '') + '><span class="sw"></span><span class="sw-txt"><strong>' + esc(t.nombre) + '</strong><small>' + n + ' cliente' + (n === 1 ? '' : 's') + '</small></span></label>';
        }).join('') + '</div>' +
      '</div>' +
    '</div>';

  $('e-dar').onsubmit = async (e) => {
    e.preventDefault();
    const email = e.target.elements.email.value;
    if (!email) return toast('Elige un cliente');
    await cambiarPermiso(email, true);
  };
  document.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => cambiarPermiso(b.dataset.quitar, false));
  document.querySelectorAll('[data-tipo-stock]').forEach(ch => ch.onchange = async () => {
    const { error } = await sb.from('tipos_cliente').update({ ver_existencias: ch.checked }).eq('id', ch.dataset.tipoStock);
    if (error){ ch.checked = !ch.checked; return toast('Error: ' + mensajeError(error)); }
    await recargarBase(); toast(nombreTipo(ch.dataset.tipoStock) + (ch.checked ? ': ven existencias reales' : ': ven el rango')); vistaExistencias();
  });
}
function filaPermiso(c, motivo, quitable){
  return '<li><div class="avatar' + (c.es_admin ? ' admin' : '') + '">' + esc(iniciales(c)) + '</div><div><strong>' + esc(c.nombre || c.empresa || c.email) + '</strong><div class="muted">' + esc(c.email) + '</div></div>' +
    '<div class="der">' + (quitable === 'cli' ? '<span class="pill verde" style="margin-right:6px">' + esc(motivo) + '</span><button class="btn chico peligro" data-quitar="' + esc(c.email) + '">Quitar</button>'
      : '<span class="pill ' + (c.es_admin ? 'tinta' : 'azul') + '">' + esc(motivo) + '</span>') + '</div></li>';
}
async function cambiarPermiso(email, dar){
  const { error } = await sb.from('clientes').update({ ver_existencias: dar }).eq('email', email);
  if (error) return toast('Error: ' + mensajeError(error));
  await recargarBase();
  const c = clientes.find(x => x.email === email);
  toast(dar ? nombreCliente(email) + ' ya ve las existencias reales'
            : (c && tipoVeStock(c.tipo_id) ? 'Permiso propio quitado (sigue viéndolas por su tipo)' : 'Permiso quitado'));
  vistaExistencias();
}

/* ---------- Scraping (historial de existencias) ---------- */
let diasScr = 30, buscaScr = '', tipoScr = 'bajo', datosScr = null, movsScr = [], cuantosScr = 50;
const DIAS_SCR = [[7, '7 días'], [30, '30 días'], [90, '90 días'], [365, '1 año']];
const TIPOS_SCR = [['bajo', 'Se restaron'], ['subio', 'Subieron'], ['nuevo', 'Nuevos'], ['desaparecio', 'Desaparecieron'], ['', 'Todos']];
const faltaScraping = (err) => '<div class="caja"><div class="tarjeta-sync"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar el historial del scraping</strong><div class="muted">Corre <span class="mono">11_historial_scraping.sql</span> en Supabase → SQL Editor. Desde el siguiente scraping diario se guarda la foto inicial, y a partir del otro se anota qué productos bajaron, cuánto y cuándo.' + (err ? '<br><small>' + esc(mensajeError(err)) + '</small>' : '') + '</div></div></div></div>';
const numScr = (n) => Number(n || 0).toLocaleString('es-VE');
const difHTML = (m) => m.diferencia == null ? '<span class="muted">—</span>'
  : '<strong style="color:' + (m.diferencia < 0 ? 'var(--off)' : 'var(--ok)') + '">' + (m.diferencia > 0 ? '+' : '') + numScr(m.diferencia) + '</strong>';
const pillTipoScr = (t) => ({ bajo: '<span class="pill rojo">Bajó</span>', subio: '<span class="pill verde">Subió</span>', nuevo: '<span class="pill azul">Nuevo</span>', desaparecio: '<span class="pill amar">Ya no está</span>' }[t] || esc(t));
const cantScr = (v) => v == null ? '<span class="muted">—</span>' : (v === 0 ? '<span class="estado-stock off">0</span>' : numScr(v));

async function vistaScraping(){
  const chips = '<div class="chips">' + DIAS_SCR.map(([d, t]) => '<button class="chip' + (diasScr === d ? ' activo' : '') + '" data-dias-scr="' + d + '">' + t + '</button>').join('') + '</div>';
  $('main').innerHTML = cabecera('Scraping', 'Cada vez que se actualiza el catálogo de grupo-electricos.com se comparan las existencias con la corrida anterior: aquí ves qué productos se restaron, cuántas unidades y cuándo. Solo productos del scraper (no los manuales).', chips) + '<div class="cargando">Cargando…</div>';
  document.querySelectorAll('[data-dias-scr]').forEach(b => b.onclick = () => { diasScr = Number(b.dataset.diasScr); vistaScraping(); });
  const [r, m] = await Promise.all([
    sb.rpc('resumen_scraping', { dias: diasScr }),
    sb.rpc('movimientos_scraping', { dias: diasScr, p_tipo: tipoScr || null, limite: 5000 }),
  ]);
  if (tab !== 'scraping') return;
  const cont = document.querySelector('#main .cargando');
  if (r.error || !r.data){ cont.outerHTML = faltaScraping(r.error); return; }
  datosScr = r.data; movsScr = m.data || []; cuantosScr = 50;
  const t = datosScr.totales || {};
  const ejec = datosScr.ejecuciones || [];
  const ult = ejec.find(e => !e.nota) || null;
  const kpi = (icono, titulo, valor, pie, extra) => '<div class="kpi' + (extra || '') + '"><div class="k-cab">' + titulo + icono + '</div><div class="k-num">' + valor + '</div><div class="k-pie">' + pie + '</div></div>';

  let aviso = '';
  if (!ejec.length) aviso = '<div class="caja"><div class="tarjeta-sync"><div class="icono">' + ICO.sync + '</div><div><strong>Todavía no hay corridas registradas en este período</strong><div class="muted">El scraping corre solo cada día. La primera corrida guarda el punto de partida; desde la segunda verás lo que bajó.</div></div></div></div>';
  else if (ejec.length === 1 && ejec[0].primera) aviso = '<div class="caja"><div class="tarjeta-sync"><div class="icono">' + ICO.ok + '</div><div><strong>Punto de partida guardado</strong><div class="muted">El ' + fecha(ejec[0].fecha) + ' se guardaron ' + numScr(ejec[0].productos) + ' productos. En el próximo scraping empezarás a ver qué se restó.</div></div></div></div>';

  const maxR = Math.max(1, ...(datosScr.mas_restados || []).map(x => x.unidades));
  const ranking = (datosScr.mas_restados || []).length ? '<ol class="ranking">' + datosScr.mas_restados.slice(0, 15).map(x =>
    '<li class="clic" data-modelo-scr="' + esc(x.modelo) + '"><span class="pos"></span><span class="nom"><strong class="mono">' + esc(x.modelo) + '</strong><small>' + esc([x.marca, x.nombre].filter(Boolean).join(' · ') || '—') + ' · quedan ' + (x.queda == null ? '—' : numScr(x.queda)) + '</small>' +
    '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * x.unidades / maxR)) + '%"></i></div></span><span class="num">−' + numScr(x.unidades) + '<small>' + x.veces + (x.veces === 1 ? ' vez' : ' veces') + '</small></span></li>').join('') + '</ol>'
    : '<div class="vacio">' + ICO.existencias + 'Nada se ha restado en este período.</div>';

  const tablaEjec = ejec.length ? '<table class="tabla-vis"><thead><tr><th>Cuándo</th><th>Productos</th><th>Bajaron</th><th>Unid. restadas</th><th>Subieron</th><th>Nuevos</th><th>Ya no están</th></tr></thead><tbody>' +
    ejec.map(e => e.nota
      ? '<tr><td style="white-space:nowrap"><strong>' + fecha(e.fecha) + '</strong></td><td>' + numScr(e.productos) + '</td><td colspan="5"><span class="pill amar">Omitido</span> <span class="muted">' + esc(String(e.nota).replace(/^Omitido:\s*/, '')) + '</span></td></tr>'
      : e.primera
      ? '<tr><td style="white-space:nowrap"><strong>' + fecha(e.fecha) + '</strong></td><td>' + numScr(e.productos) + '</td><td colspan="5"><span class="pill azul">Punto de partida</span></td></tr>'
      : '<tr class="clic" data-ejec-scr="' + e.id + '"><td style="white-space:nowrap"><strong>' + fecha(e.fecha) + '</strong></td><td>' + numScr(e.productos) + '</td><td>' + numScr(e.bajaron) + (e.agotados ? ' <small class="muted">(' + e.agotados + ' agotados)</small>' : '') + '</td>' +
        '<td><strong style="color:var(--off)">' + (e.unidades_restadas ? '−' + numScr(e.unidades_restadas) : '0') + '</strong></td><td>' + numScr(e.subieron) + (e.unidades_sumadas ? ' <small class="muted">(+' + numScr(e.unidades_sumadas) + ')</small>' : '') + '</td><td>' + numScr(e.nuevos) + '</td><td>' + numScr(e.desaparecidos) + '</td></tr>').join('') +
    '</tbody></table>' : '<div class="vacio">' + ICO.sync + 'Sin corridas en este período.</div>';

  cont.outerHTML = aviso +
    '<div class="kpis">' +
      kpi(ICO.existencias, 'Unidades restadas', '−' + numScr(t.unidades_restadas), 'en ' + numScr(t.bajaron) + ' bajas de productos', ' destacado') +
      kpi(ICO.bloquear, 'Se agotaron', numScr(t.agotados), 'llegaron a 0 en el período') +
      kpi(ICO.mas, 'Unidades sumadas', '+' + numScr(t.unidades_sumadas), 'reposiciones del proveedor') +
      kpi(ICO.sync, 'Corridas', numScr(t.corridas), ult ? 'Última: ' + fecha(ult.fecha) : 'Ninguna todavía') +
    '</div>' +
    '<div class="caja"><div class="caja-cab"><h2>Cada scraping</h2><small class="muted">Toca una corrida para ver el detalle</small></div><div class="tabla-wrap">' + tablaEjec + '</div></div>' +
    '<div class="caja"><div class="caja-cab"><h2>Lo que más se restó</h2><small class="muted">Toca un producto para ver su historial</small></div>' + ranking + '</div>' +
    '<div class="caja"><div class="caja-cab"><h2>Movimientos del período</h2><div class="fila" style="align-items:center">' +
      '<div class="chips" id="scr-tipos">' + TIPOS_SCR.map(([k, n]) => '<button class="chip' + (tipoScr === k ? ' activo' : '') + '" data-tipo-scr="' + k + '">' + n + '</button>').join('') + '</div>' +
      '<div class="buscar">' + ICO.buscar + '<input id="scr-busca" placeholder="Buscar modelo, marca…" value="' + esc(buscaScr) + '"></div>' +
      '<button class="btn chico" id="scr-csv">Descargar CSV</button></div></div>' +
      '<div class="tabla-wrap" id="scr-tabla"></div></div>';

  document.querySelectorAll('[data-ejec-scr]').forEach(tr => tr.onclick = () => abrirEjecucionScr(Number(tr.dataset.ejecScr)));
  document.querySelectorAll('[data-modelo-scr]').forEach(li => li.onclick = () => abrirModeloScr(li.dataset.modeloScr));
  document.querySelectorAll('[data-tipo-scr]').forEach(b => b.onclick = () => { tipoScr = b.dataset.tipoScr; vistaScraping(); });
  $('scr-busca').oninput = (e) => { buscaScr = e.target.value; cuantosScr = 50; pintarMovsScr(); };
  $('scr-csv').onclick = () => descargarCSVScr(filtrarMovsScr(), 'scraping-movimientos-' + diasScr + 'd.csv');
  pintarMovsScr();
}
function filtrarMovsScr(){
  const q = buscaScr.trim().toLowerCase();
  return !q ? movsScr : movsScr.filter(m => [m.modelo, m.marca, m.nombre].some(v => v && String(v).toLowerCase().includes(q)));
}
function tablaMovsScr(lista, conFecha){
  return '<table class="tabla-vis"><thead><tr>' + (conFecha ? '<th>Cuándo</th>' : '') + '<th>Modelo</th><th>Marca</th><th>Antes</th><th>Después</th><th>Diferencia</th><th></th></tr></thead><tbody>' +
    lista.map(m => '<tr class="clic" data-modelo-scr="' + esc(m.modelo) + '">' + (conFecha ? '<td>' + fecha(m.fecha) + '</td>' : '') +
      '<td><strong class="mono">' + esc(m.modelo) + '</strong>' + (m.nombre ? '<div class="muted" style="font-size:12px">' + esc(m.nombre) + '</div>' : '') + '</td>' +
      '<td>' + esc(m.marca || '—') + '</td><td>' + cantScr(m.antes) + '</td><td>' + cantScr(m.despues) + '</td><td>' + difHTML(m) + '</td><td>' + pillTipoScr(m.tipo) + '</td></tr>').join('') +
    '</tbody></table>';
}
function pintarMovsScr(){
  const el = $('scr-tabla'); if (!el) return;
  const lista = filtrarMovsScr();
  if (!lista.length){ el.innerHTML = '<div class="vacio">' + ICO.existencias + (buscaScr ? 'Nada coincide con la búsqueda.' : 'Sin movimientos de este tipo en el período.') + '</div>'; return; }
  const restadas = lista.reduce((s, m) => s + (m.diferencia < 0 ? -m.diferencia : 0), 0);
  el.innerHTML = '<p class="muted" style="margin:0 0 8px">' + numScr(lista.length) + ' movimiento' + (lista.length === 1 ? '' : 's') + (restadas ? ' · ' + numScr(restadas) + ' unidades restadas' : '') + (movsScr.length >= 5000 ? ' · se muestran los 5.000 más recientes' : '') + '</p>' +
    tablaMovsScr(lista.slice(0, cuantosScr), true) +
    (lista.length > cuantosScr ? '<div style="text-align:center;margin-top:12px"><button class="btn chico" id="scr-mas">Ver más (' + numScr(lista.length - cuantosScr) + ' restantes)</button></div>' : '');
  el.querySelectorAll('[data-modelo-scr]').forEach(tr => tr.onclick = () => abrirModeloScr(tr.dataset.modeloScr));
  if ($('scr-mas')) $('scr-mas').onclick = () => { cuantosScr += 100; pintarMovsScr(); };
}
function descargarCSVScr(lista, nombre){
  if (!lista.length) return toast('No hay movimientos para descargar');
  const c = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const filas = [['Fecha', 'Modelo', 'Marca', 'Nombre', 'Antes', 'Después', 'Diferencia', 'Tipo', 'Precio proveedor']]
    .concat(lista.map(m => [new Date(m.fecha).toLocaleString('es-VE'), m.modelo, m.marca, m.nombre, m.antes, m.despues, m.diferencia, m.tipo, m.precio]));
  const blob = new Blob(['﻿' + filas.map(f => f.map(c).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const cabPanelScr = (titulo, sub) => '<div class="panel-cab"><div class="avatar">' + ICO.existencias + '</div><div><h2>' + titulo + '</h2><div class="muted">' + sub + '</div></div>' +
  '<button class="btn chico fantasma cerrar" id="scr-cerrar" aria-label="Cerrar">' + ICO.cerrar + '</button></div>';

// Detalle de una corrida
async function abrirEjecucionScr(id, tipo){
  const e = ((datosScr && datosScr.ejecuciones) || []).find(x => x.id === id) || { id };
  tipo = tipo == null ? 'bajo' : tipo;
  const chips = '<div class="chips" style="margin-bottom:14px">' + TIPOS_SCR.map(([k, n]) => '<button class="chip' + (tipo === k ? ' activo' : '') + '" data-tipo-ej="' + k + '">' + n + '</button>').join('') + '</div>';
  abrirPanel(cabPanelScr('Scraping del ' + fecha(e.fecha), numScr(e.productos) + ' productos · ' + numScr(e.bajaron) + ' bajaron (−' + numScr(e.unidades_restadas) + ' unid.)') +
    '<div class="panel-cuerpo">' + chips + '<div class="cargando">Cargando…</div></div>', true);
  $('panel').dataset.actividad = 'scr:' + id;
  $('scr-cerrar').onclick = cerrarPanel;
  document.querySelectorAll('[data-tipo-ej]').forEach(b => b.onclick = () => abrirEjecucionScr(id, b.dataset.tipoEj));
  const { data, error } = await sb.rpc('movimientos_scraping', { p_ejecucion: id, p_tipo: tipo || null, limite: 5000 });
  if ($('panel').dataset.actividad !== 'scr:' + id) return;
  const cont = document.querySelector('#panel .cargando');
  if (error){ cont.outerHTML = '<p class="error">' + esc(mensajeError(error)) + '</p>'; return; }
  const lista = data || [];
  cont.outerHTML = !lista.length ? '<div class="vacio">' + ICO.existencias + 'Sin movimientos de este tipo.</div>'
    : '<div style="text-align:right;margin-bottom:8px"><button class="btn chico" id="scr-csv-ej">Descargar CSV</button></div><div class="tabla-wrap">' + tablaMovsScr(lista, false) + '</div>';
  if ($('scr-csv-ej')) $('scr-csv-ej').onclick = () => descargarCSVScr(lista, 'scraping-' + new Date(e.fecha || Date.now()).toISOString().slice(0, 10) + '.csv');
  document.querySelectorAll('#panel [data-modelo-scr]').forEach(tr => tr.onclick = () => abrirModeloScr(tr.dataset.modeloScr));
}

// Historial de un producto
async function abrirModeloScr(modelo){
  abrirPanel(cabPanelScr('<span class="mono">' + esc(modelo) + '</span>', 'Historial de existencias en el scraping') + '<div class="panel-cuerpo"><div class="cargando">Cargando…</div></div>', true);
  $('panel').dataset.actividad = 'scrm:' + modelo;
  $('scr-cerrar').onclick = cerrarPanel;
  const { data, error } = await sb.rpc('movimientos_scraping', { p_modelo: modelo, limite: 1000 });
  if ($('panel').dataset.actividad !== 'scrm:' + modelo) return;
  const cont = document.querySelector('#panel .cargando');
  if (error){ cont.outerHTML = '<p class="error">' + esc(mensajeError(error)) + '</p>'; return; }
  const lista = data || [];
  const p = lista[0] || {};
  const restadas = lista.reduce((s, m) => s + (m.diferencia < 0 ? -m.diferencia : 0), 0);
  const sumadas = lista.reduce((s, m) => s + (m.diferencia > 0 ? m.diferencia : 0), 0);
  const mini = (titulo, v) => '<div class="kpi"><div class="k-cab">' + titulo + '</div><div class="k-num" style="font-size:23px">' + v + '</div></div>';
  cont.outerHTML = (p.marca || p.nombre ? '<p style="margin:0 0 14px"><strong>' + esc(p.marca || '') + '</strong> ' + esc(p.nombre || '') + (p.precio ? ' · <span class="muted">precio proveedor ' + money(p.precio) + '</span>' : '') + '</p>' : '') +
    '<div class="kpis">' + mini('Existencia actual', p.despues == null ? '—' : numScr(p.despues)) + mini('Unidades restadas', '−' + numScr(restadas)) + mini('Unidades sumadas', '+' + numScr(sumadas)) + '</div>' +
    (lista.length ? '<div class="tabla-wrap"><table class="tabla-vis"><thead><tr><th>Cuándo</th><th>Antes</th><th>Después</th><th>Diferencia</th><th></th></tr></thead><tbody>' +
      lista.map(m => '<tr><td>' + fecha(m.fecha) + '</td><td>' + cantScr(m.antes) + '</td><td>' + cantScr(m.despues) + '</td><td>' + difHTML(m) + '</td><td>' + pillTipoScr(m.tipo) + '</td></tr>').join('') +
      '</tbody></table></div>' : '<div class="vacio">' + ICO.existencias + 'Este producto no ha cambiado desde que se empezó a registrar.</div>');
}

/* ---------- Tipos de cliente ---------- */
function vistaTipos(){
  $('main').innerHTML = cabecera('Tipos de cliente', 'Agrupa a tus clientes para darles descuentos y permisos en bloque.') +
    '<div class="caja"><div class="tabla-wrap"><table><thead><tr><th>Nombre</th><th>Clientes</th><th>Reglas</th><th>Ve existencias reales</th><th></th></tr></thead><tbody>' +
    tipos.map(t => '<tr><td style="min-width:200px"><input data-nombre="' + t.id + '" value="' + esc(t.nombre) + '"></td>' +
      '<td>' + clientes.filter(c => c.tipo_id === t.id).length + '</td><td>' + reglas.filter(r => r.tipo_id === t.id).length + '</td>' +
      '<td><label class="switch solo"><input type="checkbox" data-tipo-stock="' + t.id + '"' + (t.ver_existencias ? ' checked' : '') + ' aria-label="Ve existencias reales"><span class="sw"></span></label></td>' +
      '<td class="acciones"><button class="btn chico" data-guardar="' + t.id + '">Guardar</button> <button class="btn chico peligro" data-borrar="' + t.id + '">Eliminar</button></td></tr>').join('') +
    '</tbody></table></div><form id="t-form" class="fila" style="margin-top:16px"><label class="campo" style="flex:1 1 240px">Nuevo tipo<input name="nombre" required placeholder="Ej. Integrador"></label><button class="btn prim">' + ICO.mas + 'Agregar</button></form><p class="error" id="t-err"></p></div>';
  document.querySelectorAll('[data-guardar]').forEach(b => b.onclick = async () => {
    const nombre = document.querySelector('[data-nombre="' + b.dataset.guardar + '"]').value.trim();
    const { error } = await sb.from('tipos_cliente').update({ nombre }).eq('id', b.dataset.guardar);
    if (error) return toast('Error: ' + mensajeError(error));
    await recargarBase(); toast('Guardado');
  });
  document.querySelectorAll('[data-tipo-stock]').forEach(ch => ch.onchange = async () => {
    const { error } = await sb.from('tipos_cliente').update({ ver_existencias: ch.checked }).eq('id', ch.dataset.tipoStock);
    if (error){ ch.checked = !ch.checked; return toast('Error: ' + mensajeError(error)); }
    await recargarBase(); toast(ch.checked ? 'Este tipo ve existencias reales' : 'Este tipo ve el rango');
  });
  document.querySelectorAll('[data-borrar]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Eliminar este tipo? Sus reglas se borran y sus clientes quedan sin tipo.')) return;
    const { error } = await sb.from('tipos_cliente').delete().eq('id', b.dataset.borrar);
    if (error) return toast('Error: ' + mensajeError(error));
    await recargarBase(); vistaTipos(); toast('Tipo eliminado');
  });
  $('t-form').onsubmit = async (e) => {
    e.preventDefault();
    const nombre = e.target.elements.nombre.value.trim();
    const id = nombre.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const { error } = await sb.from('tipos_cliente').insert({ id, nombre, orden: tipos.length + 1 });
    if (error){ $('t-err').textContent = error.code === '23505' ? 'Ese tipo ya existe.' : mensajeError(error); return; }
    await recargarBase(); vistaTipos(); toast('Tipo agregado');
  };
}

iniciar();
</script>
</body>
</html>
