      '<div class="apilar"><label class="campo">Como<select id="pr-quien"><option value="">Visitante sin cuenta</option>' + clientes.map(c => '<option value="' + esc(c.email) + '">' + esc(c.nombre || c.empresa || c.email) + ' (' + esc(nombreTipo(c.tipo_id)) + ')</option>').join('') + '</select></label>' +
      '<label class="campo">Modelo<input id="pr-modelo" list="dl-modelos" placeholder="Escribe un modelo"></label></div>' +
    '<div class="prueba-res" id="pr-res"></div></div>' +
    '</div>' +

    '<div class="caja" style="margin-top:18px"><div class="caja-cab"><h2>Reglas <small>' + reglas.length + '</small></h2>' +
      '<label class="campo" style="flex-direction:row;align-items:center;gap:8px">Mostrar<select id="r-filtro" style="width:auto"><option value="">Todas</option><option value="t:"' + (filtro === 't:' ? ' selected' : '') + '>Para todos</option>' +
      tipos.map(t => '<option value="tp:' + t.id + '"' + (filtro === 'tp:' + t.id ? ' selected' : '') + '>' + esc(t.nombre) + '</option>').join('') +
      clientes.filter(c => reglas.some(r => r.cliente_email === c.email)).map(c => '<option value="c:' + esc(c.email) + '"' + (filtro === 'c:' + c.email ? ' selected' : '') + '>' + esc(c.nombre || c.email) + '</option>').join('') +
      '</select></label></div><div class="tabla-wrap" id="r-lista"></div></div>';

  const f = $('r-form');
  if (filtro) f.elements.destino.value = filtro.startsWith('c:') || filtro.startsWith('tp:') ? filtro : 't:';
  const leerForm = () => {
    const [k, v] = f.elements.destino.value.split(/:(.*)/s);
    const alc = f.elements.alcance.value;
    return {
      k, v, alc, forma: f.elements.forma.value, valor: Number(f.elements.valor.value),
      marca: alc === 'marca' ? f.elements.marca.value.toUpperCase() : null,
      modelo: alc === 'modelo' ? f.elements.modelo.value.trim() : null,
    };
  };
  const nombreDestino = (x) => x.k === 'c' ? nombreCliente(x.v) : x.k === 'tp' ? 'Los clientes tipo ' + nombreTipo(x.v) : 'Todos (visitantes y clientes)';
  const nombreAlcance = (x) => x.alc === 'marca' ? 'en ' + x.marca : x.alc === 'modelo' ? 'en el modelo ' + (x.modelo || '…') : 'en todos los productos';
  // Descuento que tiene HOY ese destino en esos productos (sin contar una regla idéntica que se vaya a reemplazar).
  const baseActual = (x) => {
    const email = x.k === 'c' ? x.v : null;
    const cli = email ? clientes.find(c => c.email === email) : null;
    const tipo = x.k === 'tp' ? x.v : (cli ? cli.tipo_id : null);
    const p = { marca: x.marca || '', modelo: x.modelo || '' };
    const guardadas = reglas;
    reglas = reglas.filter(r => !mismaClave(r, x));
    const r = reglaPara(p, email, tipo);
    reglas = guardadas;
    return r;
  };
  const mismaClave = (r, x) => (r.cliente_email || null) === (x.k === 'c' ? x.v : null) && (r.tipo_id || null) === (x.k === 'tp' ? x.v : null) &&
    (r.marca || null) === x.marca && String(r.modelo || '').toUpperCase() === String(x.modelo || '').toUpperCase();
  const pctTotal = (base, extra) => Math.round((100 - (100 - base) * (100 - extra) / 100) * 100) / 100;

  const sync = () => {
    const x = leerForm();
    $('r-marca-l').hidden = x.alc !== 'marca';
    $('r-modelo-l').hidden = x.alc !== 'modelo';
    const fijo = f.elements.forma.querySelector('[value=fijo]');
    fijo.disabled = x.alc !== 'modelo';
    if (fijo.disabled && f.elements.forma.value === 'fijo') f.elements.forma.value = 'adic';
    const forma = f.elements.forma.value;
    f.elements.valor.placeholder = forma === 'fijo' ? '180.00' : forma === 'adic' ? '10' : '65';
    const base = baseActual(x);
    const hoy = !base ? 'precio de lista (sin descuento)'
      : base.precio_fijo != null ? 'precio fijo de ' + money(base.precio_fijo)
      : Number(base.descuento_pct) + '% de descuento (' + (base.cliente_email ? 'regla propia' : base.tipo_id ? 'por ser ' + nombreTipo(base.tipo_id) : base.marca ? 'regla de ' + base.marca + ' para todos' : 'descuento general') + ')';
    let nuevo = '';
    if (x.valor > 0 || (forma !== 'adic' && f.elements.valor.value !== '')){
      if (forma === 'fijo') nuevo = 'precio fijo de <strong>' + money(x.valor) + '</strong>';
      else if (forma === 'pct') nuevo = '<strong>' + x.valor + '%</strong> de descuento total';
      else if (base && base.precio_fijo != null) nuevo = '<span style="color:var(--off)">no se puede sumar a un precio fijo; usa "Precio fijo"</span>';
      else { const b = base ? Number(base.descuento_pct) : 0; nuevo = '<strong>' + pctTotal(b, x.valor) + '%</strong> de descuento total (' + b + '% + ' + x.valor + '% adicional sobre su precio)'; }
    }
    $('r-resumen').innerHTML = '<strong>' + esc(nombreDestino(x)) + '</strong> ' + esc(nombreAlcance(x)) + ':<br>Hoy: ' + hoy +
      (nuevo ? '<br>Con esta regla: ' + nuevo : '');
  };
  ['destino', 'alcance', 'marca', 'forma'].forEach(n => f.elements[n].addEventListener('change', sync));
  ['modelo', 'valor'].forEach(n => f.elements[n].addEventListener('input', sync));
  sync();

  f.onsubmit = async (e) => {
    e.preventDefault();
    $('r-err').textContent = '';
    const x = leerForm();
    const d = { cliente_email: x.k === 'c' ? x.v : null, tipo_id: x.k === 'tp' ? x.v : null, marca: x.marca, modelo: x.modelo,
                descuento_pct: null, precio_fijo: null, nota: f.elements.nota.value.trim() || null };
    if (x.alc === 'modelo' && !d.modelo){ $('r-err').textContent = 'Escribe el modelo.'; return; }
    if (!(x.valor >= 0)){ $('r-err').textContent = 'Escribe el valor.'; return; }
    if (x.forma === 'fijo') d.precio_fijo = x.valor;
    else if (x.forma === 'pct'){
      if (x.valor > 100){ $('r-err').textContent = 'El descuento no puede pasar de 100%.'; return; }
      d.descuento_pct = x.valor;
    } else {
      const base = baseActual(x);
      if (base && base.precio_fijo != null){ $('r-err').textContent = 'Ese producto tiene precio fijo; usa "Precio fijo".'; return; }
      const b = base ? Number(base.descuento_pct) : 0;
      d.descuento_pct = pctTotal(b, x.valor);
      if (!d.nota) d.nota = b + '% + ' + x.valor + '% adicional';
    }
    const igual = reglas.find(r => mismaClave(r, x));
    const res = igual ? await sb.from('reglas_descuento').update(Object.assign({ activo: true }, d)).eq('id', igual.id)
                      : await sb.from('reglas_descuento').insert(d);
    if (res.error){ $('r-err').textContent = mensajeError(res.error); return; }
    await recargarBase(); toast(igual ? 'Regla actualizada' : 'Regla guardada');
    reglaDestinoInicial = f.elements.destino.value; vistaDescuentos();
  };

  const pintarLista = () => {
    const fil = $('r-filtro').value;
    const lista = reglas.filter(r => !fil || (fil === 't:' ? (!r.cliente_email && !r.tipo_id) : fil.startsWith('tp:') ? r.tipo_id === fil.slice(3) : r.cliente_email === fil.slice(2)));
    $('r-lista').innerHTML = !lista.length ? '<div class="vacio">' + ICO.descuentos + 'No hay reglas aquí.</div>' :
      '<table><thead><tr><th>A quién</th><th>Aplica a</th><th>Precio</th><th>Nota</th><th>Activa</th><th></th></tr></thead><tbody>' +
      lista.map(r => '<tr class="' + (r.activo ? '' : 'inactivo') + '"><td>' + describirQuien(r) + '</td><td>' + describirQue(r) + '</td>' +
        '<td><strong>' + (r.precio_fijo != null ? money(r.precio_fijo) + ' fijo' : Number(r.descuento_pct) + '% dto.') + '</strong></td>' +
        '<td class="muted">' + esc(r.nota || '') + '</td>' +
        '<td><label class="switch solo"><input type="checkbox" data-activa="' + r.id + '"' + (r.activo ? ' checked' : '') + ' aria-label="Regla activa"><span class="sw"></span></label></td>' +
        '<td class="acciones"><button class="btn chico peligro" data-borrar="' + r.id + '">Eliminar</button></td></tr>').join('') + '</tbody></table>';
    document.querySelectorAll('[data-activa]').forEach(ch => ch.onchange = async () => {
      const { error } = await sb.from('reglas_descuento').update({ activo: ch.checked }).eq('id', ch.dataset.activa);
      if (error) return toast('Error: ' + mensajeError(error));
      await recargarBase(); pintarLista(); toast(ch.checked ? 'Regla activada' : 'Regla desactivada');
    });
    document.querySelectorAll('[data-borrar]').forEach(b => b.onclick = async () => {
      if (!await confirmar({ titulo: '¿Eliminar esta regla de descuento?', peligro: true, boton: 'Eliminar', texto: 'Los clientes afectados vuelven a ver el precio de la siguiente regla que les aplique.' })) return;
      const { error } = await sb.from('reglas_descuento').delete().eq('id', b.dataset.borrar);
      if (error) return toast('Error: ' + mensajeError(error));
      await recargarBase(); pintarLista(); toast('Regla eliminada');
    });
  };
  $('r-filtro').onchange = () => { reglaDestinoInicial = $('r-filtro').value; pintarLista(); };
  pintarLista();

  const probar = () => {
    const m = $('pr-modelo').value.trim().toUpperCase();
    const p = productos.find(x => String(x.modelo || '').toUpperCase() === m);
    if (!m){ $('pr-res').innerHTML = ''; return; }
    if (!p){ $('pr-res').innerHTML = '<span class="muted">Modelo no encontrado en el catálogo.</span>'; return; }
    const email = $('pr-quien').value || null;
    const c = clientes.find(x => x.email === email);
    const { precio, r } = precioPara(p, email, c ? c.tipo_id : null);
    $('pr-res').innerHTML = '<span class="mono">' + esc(p.modelo) + '</span> · ' + esc(p.marca || '') + '<span class="precio">' + money(precio) + '</span>' +
      '<span class="muted">Lista ' + money(p.precio) + ' · ' +
      (r ? 'por la regla: ' + (r.cliente_email ? esc(nombreCliente(r.cliente_email)) : r.tipo_id ? esc(nombreTipo(r.tipo_id)) : 'Todos') + ' · ' + describirQue(r).replace(/<[^>]+>/g, '') + ' · ' + (r.precio_fijo != null ? 'precio fijo' : Number(r.descuento_pct) + '%') : (p._manual ? 'producto cargado a mano: precio de catálogo, sin regla.' : 'sin regla: precio de lista.')) + '</span>';
  };
  $('pr-modelo').oninput = probar; $('pr-quien').onchange = probar;
}

/* ---------- Estadísticas ---------- */
let diasEst = 30;
const slugDe = (x) => String(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
async function vistaEstadisticas(){
  const chips = '<div class="chips">' + [[7, '7 días'], [30, '30 días'], [90, '90 días']].map(([d, t]) => '<button class="chip' + (diasEst === d ? ' activo' : '') + '" data-dias="' + d + '">' + t + '</button>').join('') + '</div>';
  $('main').innerHTML = cabecera('Estadísticas', 'Qué buscan, qué miran y qué cotizan tus clientes. Abajo, cada cliente con cuenta por separado. No se cuenta lo que haces tú como administrador.', chips) + '<div class="cargando">Cargando…</div>';
  document.querySelectorAll('[data-dias]').forEach(b => b.onclick = () => { diasEst = Number(b.dataset.dias); vistaEstadisticas(); });
  const [{ data, error }, resCli] = await Promise.all([
    sb.rpc('resumen_estadisticas', { dias: diasEst }),
    sb.rpc('clientes_activos', { dias: diasEst }).then(r => r, e => ({ error: e })),
  ]);
  if (tab !== 'estadisticas') return;
  const cont = document.querySelector('#main .cargando');
  if (error || !data){
    cont.outerHTML = '<div class="caja"><div class="tarjeta-sync"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar las estadísticas en Supabase</strong><div class="muted">Corre <span class="mono">04_estadisticas.sql</span> en Supabase → SQL Editor. Desde ese momento la tienda empieza a anotar búsquedas, visitas y cotizaciones.</div></div></div></div>';
    return;
  }
  sb.rpc('limpiar_eventos').then(() => {}, () => {});
  const t = data.totales || {};
  const cotiza = (t.cotizar_whatsapp || 0) + (t.pedido_whatsapp || 0);
  const kpi = (icono, titulo, num, pie) => '<div class="kpi"><div class="k-cab">' + titulo + icono + '</div><div class="k-num">' + Number(num || 0).toLocaleString('es-VE') + '</div><div class="k-pie">' + pie + '</div></div>';
  const prod = (m) => productos.find(p => p.modelo === m);
  const nomProd = (m) => { const p = prod(m); return '<a href="/p/' + slugDe(m) + '" target="_blank" rel="noopener" class="mono">' + esc(m) + '</a><small>' + esc(p ? [p.marca, p.descripcion || p.nombre].filter(Boolean).join(' · ') : 'Ya no está en el catálogo') + '</small>'; };
  const ranking = (lista, fila, vacio) => !lista || !lista.length ? '<div class="vacio">' + ICO.grafica + vacio + '</div>' :
    '<ol class="ranking">' + lista.slice(0, 15).map((x, i) => fila(x, i, lista)).join('') + '</ol>';
  const barra = (v, max) => '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * v / (max || 1))) + '%"></i></div>';

  // Gráfico por día (completa los días sin datos)
  const porDia = {}; (data.por_dia || []).forEach(d => { porDia[d.dia] = d; });
  const dias = [];
  for (let i = diasEst - 1; i >= 0; i--){
    const f = new Date(Date.now() - i * 86400000);
    const k = f.toLocaleDateString('en-CA', { timeZone: 'America/Caracas' });
    dias.push({ k, f, v: (porDia[k] || {}).vistas || 0, c: (porDia[k] || {}).cotiza || 0 });
  }
  const maxV = Math.max(1, ...dias.map(d => Math.max(d.v, d.c)));
  const cada = diasEst <= 7 ? 1 : diasEst <= 30 ? 5 : 15;
  const grafico = '<div class="grafico">' + dias.map(d => '<div class="col" data-tip="' + d.f.toLocaleDateString('es-VE', { weekday: 'short', day: 'numeric', month: 'short' }) + ': ' + d.v + ' vistas · ' + d.c + ' cotiz.">' +
      '<div class="b1" style="height:' + (100 * d.v / maxV) + '%"></div><div class="b2" style="height:' + (100 * d.c / maxV) + '%"></div></div>').join('') + '</div>' +
    '<div class="grafico-ejes">' + dias.map((d, i) => '<span>' + ((dias.length - 1 - i) % cada === 0 ? d.f.getDate() : '') + '</span>').join('') + '</div>';

  const maxB = Math.max(1, ...(data.buscado || []).map(x => x.veces));
  const maxS = Math.max(1, ...(data.sin_resultados || []).map(x => x.veces));
  const maxVi = Math.max(1, ...(data.vistos || []).map(x => x.veces));
  const totalCot = (x) => x.whatsapp + x.carrito + x.pedidos;
  const maxC = Math.max(1, ...(data.cotizados || []).map(totalCot));

  cont.outerHTML =
    '<div class="kpis">' +
      kpi(ICO.buscar, 'Búsquedas', t.busqueda, 'veces que usaron el buscador') +
      kpi(ICO.ojo, 'Productos vistos', t.ver_producto, 'fichas de producto abiertas') +
      kpi(ICO.tienda, 'Agregados al pedido', t.agregar_carrito, 'productos puestos en el carrito') +
      kpi(ICO.pedidos, 'Cotizaciones por WhatsApp', cotiza, (t.pedido_whatsapp || 0) + ' desde el carrito · ' + (t.cotizar_whatsapp || 0) + ' de un producto') +
    '</div>' +
    '<div class="caja"><div class="caja-cab"><h2>Actividad por día</h2><div class="leyenda"><span><i style="background:var(--azul-suave)"></i>Productos vistos</span><span><i style="background:var(--azul)"></i>Cotizaciones y carrito</span></div></div>' + grafico + '</div>' +
    '<div class="grid-2" style="grid-template-columns:1fr 1fr;margin-bottom:18px">' +
      '<div class="caja"><div class="caja-cab"><h2>Lo más buscado</h2></div>' +
        ranking(data.buscado, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + linkBusq(x.texto) + (x.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : '') + barra(x.veces, maxB) + '</span><span class="num">' + x.veces + '</span></li>', 'Todavía no hay búsquedas en este período.') + '</div>' +
      '<div class="caja"><div class="caja-cab"><h2>Buscan y no encuentran</h2></div><p class="sub">Oportunidades: productos que te piden y no están en la tienda (o están escritos distinto).</p>' +
        ranking(data.sin_resultados, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + linkBusq(x.texto) + '<small>Última vez: ' + fecha(x.ultima) + '</small>' + barra(x.veces, maxS) + '</span><span class="num">' + x.veces + '</span></li>', 'Nadie se ha quedado sin resultados. 👍') + '</div>' +
    '</div>' +
    '<div class="grid-2" style="grid-template-columns:1fr 1fr">' +
      '<div class="caja"><div class="caja-cab"><h2>Productos más vistos</h2></div>' +
        ranking(data.vistos, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + nomProd(x.modelo) + barra(x.veces, maxVi) + '</span><span class="num">' + x.veces + '<small>vistas</small></span></li>', 'Todavía no hay visitas en este período.') + '</div>' +
      '<div class="caja"><div class="caja-cab"><h2>Productos más cotizados</h2></div>' +
        ranking(data.cotizados, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + nomProd(x.modelo) + barra(totalCot(x), maxC) + '</span><span class="num">' + totalCot(x) +
          '<small>' + [x.whatsapp ? x.whatsapp + ' WhatsApp' : '', x.carrito ? x.carrito + ' carrito' : '', x.pedidos ? x.pedidos + ' pedido' + (x.pedidos > 1 ? 's' : '') : ''].filter(Boolean).join(' · ') + (x.clientes ? ' · ' + x.clientes + ' con cuenta' : '') + '</small></span></li>', 'Todavía no hay cotizaciones en este período.') + '</div>' +
    '</div>' +
    '<div style="margin-top:18px">' + cajaClientesActivos(resCli) + '</div>';
  document.querySelectorAll('#main [data-actividad]').forEach(li => li.onclick = () => abrirActividad(li.dataset.actividad));
}

/* ---------- Actividad por cliente ---------- */
const DIAS_ACT = [[7, '7 días'], [30, '30 días'], [90, '90 días'], [365, '1 año']];
let diasAct = 90;
const faltaActividad = (err) => '<div class="tarjeta-sync" style="margin:6px 0"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar la actividad por cliente</strong><div class="muted">Corre <span class="mono">06_actividad_clientes.sql</span> en Supabase → SQL Editor (después de <span class="mono">04_estadisticas.sql</span>).' + (err ? '<br><small>' + esc(mensajeError(err)) + '</small>' : '') + '</div></div></div>';
const haceCuanto = (d) => {
  if (!d) return 'nunca';
  const min = Math.round((Date.now() - new Date(d)) / 60000);
  if (min < 2) return 'hace un momento';
  if (min < 60) return 'hace ' + min + ' min';
  const h = Math.round(min / 60); if (h < 24) return 'hace ' + h + ' h';
  const dd = Math.round(h / 24); if (dd < 31) return 'hace ' + dd + ' día' + (dd > 1 ? 's' : '');
  return fecha(d, false);
};
const linkProd = (m) => '<a href="/p/' + slugDe(m) + '" target="_blank" rel="noopener" class="mono">' + esc(m) + '</a>';
/* Enlaces a la tienda: búsquedas, marcas, categorías y páginas (abren en otra pestaña) */
const TIENDA = '/tienda.html';
const aWeb = (href, texto, titulo) => '<a class="lnk" href="' + esc(href) + '" target="_blank" rel="noopener"' + (titulo ? ' title="' + esc(titulo) + '"' : '') + '>' + texto + '</a>';
const linkBusq = (q) => q ? aWeb(TIENDA + '#/buscar?q=' + encodeURIComponent(q), esc(q), 'Ver esta búsqueda en la tienda') : '';
const linkMarca = (m) => aWeb(TIENDA + '#/marca/' + slugDe(m), esc(m), 'Ver la marca en la tienda');
const linkRuta = (partes) => partes.map((x, i) => aWeb(TIENDA + '#/c/' + partes.slice(0, i + 1).map(slugDe).join('/'), esc(x), 'Ver la categoría en la tienda')).join(' › ');
// Convierte el texto de "dónde estaba" (Búsqueda: x · Marca X · Cat › Sub · Ficha de M) en enlaces.
function enlaceContexto(t){
  t = String(t || '').trim();
  if (!t) return '';
  let m;
  if ((m = t.match(/^Ficha de (.+)$/))) return 'la ficha de ' + linkProd(m[1]);
  if ((m = t.match(/^Búsqueda:\s*(.+)$/i))) return 'la búsqueda “' + linkBusq(m[1]) + '”';
  if (t === 'Inicio') return aWeb(TIENDA, 'Inicio');
  if (t === 'Catálogos') return aWeb(TIENDA + '#/catalogos', 'Catálogos');
  if (t === 'Todo el catálogo') return aWeb(TIENDA + '#/todo', 'Todo el catálogo');
  return t.split(' · ').map(p => (m = p.match(/^Marca (.+)$/)) ? 'marca ' + linkMarca(m[1]) : p.includes(' › ') || /^[^:]+$/.test(p) ? linkRuta(p.split(' › ')) : esc(p)).join(' · ');
}
// Una página registrada (/tienda#/…, /p/…, /c/…, /links) como enlace con su nombre legible.
const linkPagina = (p) => p ? aWeb(p.replace(/^\/tienda(?=#|$)/, TIENDA), esc(paginaBonita(p)), 'Abrir esta página') : '—';
const descProd = (m) => { const p = productos.find(x => x.modelo === m); return p ? [p.marca, p.descripcion || p.nombre].filter(Boolean).join(' · ') : 'Ya no está en el catálogo'; };

// Caja "Clientes más activos" dentro de Estadísticas
function cajaClientesActivos(res){
  if (!res || res.error || !res.data) return '<div class="caja"><div class="caja-cab"><h2>Clientes más activos</h2></div>' + faltaActividad(res && res.error) + '</div>';
  const d = res.data, lista = d.clientes || [];
  const totalEv = (d.con_cuenta || 0) + (d.sin_cuenta || 0);
  const pct = totalEv ? Math.round(100 * (d.con_cuenta || 0) / totalEv) : 0;
  const max = Math.max(1, ...lista.map(x => x.total));
  return '<div class="caja"><div class="caja-cab"><h2>Clientes más activos <small>' + lista.length + '</small></h2><span class="muted">' + pct + '% de la actividad es de clientes con cuenta</span></div>' +
    (!lista.length ? '<div class="vacio">' + ICO.clientes + 'Ningún cliente con cuenta ha usado la tienda en este período.</div>' :
    '<ol class="ranking">' + lista.slice(0, 20).map((x, i) => {
      const c = clientes.find(y => y.email === x.email) || { email: x.email };
      const partes = [x.busquedas && x.busquedas + ' búsq.', x.vistas && x.vistas + ' vistos', x.carrito && x.carrito + ' al carrito', x.whatsapp && x.whatsapp + ' WhatsApp', x.pedidos && x.pedidos + ' pedido' + (x.pedidos > 1 ? 's' : '')].filter(Boolean).join(' · ');
      return '<li class="clic" data-actividad="' + esc(x.email) + '"><span class="pos">' + (i + 1) + '</span><span class="nom"><strong>' + esc(c.nombre || c.empresa || c.email) + '</strong>' + (c.nombre && c.empresa ? ' <span class="muted">· ' + esc(c.empresa) + '</span>' : '') +
        '<small>' + partes + ' · ' + haceCuanto(x.ultima) + '</small>' + '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * x.total / max)) + '%"></i></div></span>' +
        '<span class="num">' + x.dias_activos + '<small>día' + (x.dias_activos > 1 ? 's' : '') + ' activo</small></span></li>';
    }).join('') + '</ol>') + '</div>';
}

// Panel con la actividad de un cliente
async function abrirActividad(email){
  const c = clientes.find(x => x.email === email) || { email };
  const cab = '<div class="panel-cab"><div class="avatar">' + esc(iniciales(c)) + '</div><div><h2>' + esc(c.nombre || c.empresa || c.email) + '</h2><div class="muted">' + esc([c.empresa && c.nombre ? c.empresa : '', c.email].filter(Boolean).join(' · ')) + '</div></div>' +
    '<button class="btn chico fantasma cerrar" id="a-cerrar" aria-label="Cerrar">' + ICO.cerrar + '</button></div>';
  const chips = '<div class="chips" style="margin-bottom:16px">' + DIAS_ACT.map(([d, t]) => '<button class="chip' + (diasAct === d ? ' activo' : '') + '" data-dias-act="' + d + '">' + t + '</button>').join('') + '</div>';
  abrirPanel(cab + '<div class="panel-cuerpo">' + chips + '<div class="cargando">Cargando actividad…</div></div>', true);
  $('panel').dataset.actividad = email;
  const enlazar = () => {
    $('a-cerrar').onclick = cerrarPanel;
    document.querySelectorAll('[data-dias-act]').forEach(b => b.onclick = () => { diasAct = Number(b.dataset.diasAct); abrirActividad(email); });
  };
  enlazar();
  const { data, error } = await sb.rpc('actividad_cliente', { p_email: email, dias: diasAct });
  if ($('panel').dataset.actividad !== email) return;       // se cerró o se abrió otro
  const cuerpo = document.querySelector('#panel .panel-cuerpo');
  if (error || !data){ cuerpo.innerHTML = chips + faltaActividad(error); enlazar(); return; }

  const t = data.totales || {};
  const susPedidos = pedidos.filter(p => p.cliente_email === email);
  const desde = Date.now() - diasAct * 86400000;
  const pedPer = susPedidos.filter(p => new Date(p.creado) >= desde);
  const montoPer = pedPer.filter(p => p.estado !== 'cancelado').reduce((s, p) => s + Number(p.total || 0), 0);
  const mini = (titulo, num, pie) => '<div class="kpi"><div class="k-cab">' + titulo + '</div><div class="k-num" style="font-size:23px">' + Number(num || 0).toLocaleString('es-VE') + '</div>' + (pie ? '<div class="k-pie">' + pie + '</div>' : '') + '</div>';
  const vacio = (txt) => '<div class="muted" style="padding:8px 0">' + txt + '</div>';
  const maxB = Math.max(1, ...(data.buscado || []).map(x => x.veces));
  const maxV = Math.max(1, ...(data.vistos || []).map(x => x.veces));
  const totC = (x) => x.carrito + x.whatsapp + x.pedidos;
  const maxC = Math.max(1, ...(data.cotizados || []).map(totC));
  const barra = (v, m) => '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * v / m)) + '%"></i></div>';

  // Línea de tiempo agrupada por día
  const TXT = {
    busqueda: (e) => 'Buscó <strong>“' + linkBusq(e.texto) + '”</strong>' + (e.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : e.resultados != null ? ' <span class="muted">(' + e.resultados + ' resultados)</span>' : ''),
    ver_producto: (e) => 'Vio ' + linkProd(e.modelo),
    agregar_carrito: (e) => 'Agregó ' + (e.cantidad ? e.cantidad + ' × ' : '') + linkProd(e.modelo) + ' al carrito',
    cotizar_whatsapp: (e) => 'Pidió cotización por WhatsApp de ' + linkProd(e.modelo) + (e.origen === 'pagina' ? ' <span class="muted">(desde la página del producto)</span>' : ''),
    pedido_whatsapp: (e) => 'Envió por WhatsApp ' + (e.cantidad ? e.cantidad + ' × ' : '') + linkProd(e.modelo),
  };
  TXT.visita = () => 'Entró a la tienda';
  TXT.clic_enlace = (e) => 'Tocó <strong>' + esc(e.texto || 'un botón') + '</strong> en la página de enlaces';
  TXT.ver_tarjetas = (e) => 'Vio tarjetas de productos' + (e.texto ? ' en <strong>' + enlaceContexto(e.texto) + '</strong>' : '') +

  const ICO_EV = { busqueda: ICO.buscar, ver_producto: ICO.ojo, agregar_carrito: ICO.tienda, cotizar_whatsapp: ICO.whatsapp, pedido_whatsapp: ICO.pedidos, visita: ICO.tienda, ver_tarjetas: ICO.grafica };
  let diaAnt = '';
  const linea = (data.recientes || []).map(e => {
    const dia = new Date(e.creado).toLocaleDateString('es-VE', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'America/Caracas' });
    const cabDia = dia !== diaAnt ? '<li class="act-dia">' + dia + '</li>' : '';
    diaAnt = dia;
    return cabDia + '<li class="act-ev t-' + e.tipo + '">' + (ICO_EV[e.tipo] || '') + '<span>' + (TXT[e.tipo] || (() => esc(e.tipo)))(e) + '</span><time>' +
      new Date(e.creado).toLocaleTimeString('es-VE', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Caracas' }) + '</time></li>';

      '<div><span>Cliente desde</span>' + (data.primera ? fecha(data.primera, false) : c.creado ? fecha(c.creado, false) : '—') + ' · ' + esc(nombreTipo(c.tipo_id)) + '</div>' +
    '</div>' +
    '<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px">' +
      mini('Días activo', data.dias_activos) +

      mini('Vistos', t.ver_producto) +
      mini('Al carrito', t.agregar_carrito) +
      mini('WhatsApp', (t.cotizar_whatsapp || 0) + (data.envios || 0), (data.envios || 0) + ' carrito · ' + (t.cotizar_whatsapp || 0) + ' producto') +
      mini('Pedidos', pedPer.length, money(montoPer)) +
    '</div>' +
    '<div class="seccion"><h3>Lo que buscó</h3>' + (!(data.buscado || []).length ? vacio('No buscó nada en este período.') :
      '<ol class="ranking">' + data.buscado.slice(0, 15).map((x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + linkBusq(x.texto) + (x.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : '') +

      '<ol class="ranking">' + data.cotizados.slice(0, 15).map((x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + linkProd(x.modelo) + '<small>' + esc(descProd(x.modelo)) + '</small>' + barra(totC(x), maxC) + '</span>' +
        '<span class="num">' + totC(x) + '<small>' + [x.carrito ? x.carrito + ' carrito' : '', x.whatsapp ? x.whatsapp + ' WhatsApp' : '', x.pedidos ? x.pedidos + ' enviado' : ''].filter(Boolean).join(' · ') + '</small></span></li>').join('') + '</ol>') + '</div>' +
    '<div class="seccion"><h3>Productos que miró</h3>' + (!(data.vistos || []).length ? vacio('No abrió fichas de producto en este período.') :
      '<ol class="ranking">' + data.vistos.slice(0, 15).map((x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + linkProd(x.modelo) + '<small>' + esc(descProd(x.modelo)) + '</small>' + barra(x.veces, maxV) + '</span><span class="num">' + x.veces + '<small>' + haceCuanto(x.ultima) + '</small></span></li>').join('') + '</ol>') + '</div>' +
    '<div class="seccion"><h3>Paso a paso <small class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">(lo más reciente primero)</small></h3>' + (linea ? '<ul class="act-linea">' + linea + '</ul>' : vacio('Sin actividad en este período.')) + '</div>' +
    '<p class="muted" style="font-size:12.5px">Solo cuenta lo que hace con la sesión iniciada. Si entra sin su cuenta, cuenta como visitante anónimo en las estadísticas generales.</p>';
  cuerpo.insertAdjacentHTML('afterend', '<div class="panel-pie">' +
    (susPedidos.length ? '<button class="btn" id="a-pedidos">' + ICO.pedidos + 'Ver sus pedidos (' + susPedidos.length + ')</button>' : '') +
    (clientes.some(x => x.email === email) ? '<button class="btn" id="a-editar">Editar cliente</button>' : '') +
    '<button class="btn prim" id="a-listo" style="margin-left:auto">Cerrar</button></div>');
  enlazar();
  $('a-listo').onclick = cerrarPanel;
  if ($('a-pedidos')) $('a-pedidos').onclick = () => { buscaPed = email; filtroEstado = ''; irA('pedidos'); };
  if ($('a-editar')) $('a-editar').onclick = () => abrirCliente(clientes.find(x => x.email === email));
}

/* ---------- Visitantes sin cuenta (10_visitantes.sql) ---------- */
let diasVis = 30, buscaVis = '', datosVis = null, cuantasVis = 25;
const DIAS_VIS = [[1, '24 horas'], [7, '7 días'], [30, '30 días'], [90, '90 días']];
const faltaVisitantes = (err) => '<div class="caja"><div class="tarjeta-sync"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar el registro de visitantes</strong><div class="muted">Corre <span class="mono">10_visitantes.sql</span> en Supabase → SQL Editor (después de <span class="mono">04_estadisticas.sql</span>). Desde ese momento la tienda anota cada visita: de dónde entran, con qué equipo, qué buscan y qué tarjetas de producto ven.' + (err ? '<br><small>' + esc(mensajeError(err)) + '</small>' : '') + '</div></div></div></div>';
let nombresPais = null;
try { nombresPais = new Intl.DisplayNames(['es'], { type: 'region' }); } catch (e) {}
const nomPais = (c) => {
  if (!c || c === 'XX') return 'Desconocido';
  if (c === 'T1') return 'Red Tor (oculto)';
  try { return (nombresPais && nombresPais.of(c)) || c; } catch (e) { return c; }
};
const bandera = (c) => /^[A-Z]{2}$/.test(c || '') && c !== 'XX' && c !== 'T1' ? String.fromCodePoint(...[...c].map(ch => 127397 + ch.charCodeAt(0))) + ' ' : '🌐 ';
const lugarDe = (x) => {
  const partes = [x.ciudad, x.region && x.region !== x.ciudad ? x.region : null].filter(Boolean);
  if (x.pais && x.pais !== 'VE') partes.push(nomPais(x.pais));
  return partes.length ? bandera(x.pais) + partes.join(', ') : x.pais ? bandera(x.pais) + nomPais(x.pais) : 'Lugar desconocido';
};
const ICO_DISP = { Celular: '📱', Tablet: '📱', Computadora: '💻' };
const equipoDe = (x) => x.dispositivo ? (ICO_DISP[x.dispositivo] || '') + ' ' + x.dispositivo + (x.sistema && x.sistema !== 'Otro' ? ' · ' + x.sistema : '') + (x.navegador && x.navegador !== 'Otro' ? ' · ' + x.navegador : '') : '—';
const origenDe = (r) => r || 'Directo / enlace';
const duracion = (seg) => {
  seg = Math.round(Number(seg) || 0);
  if (seg < 5) return 'un momento';
  if (seg < 60) return seg + ' s';
  const m = Math.round(seg / 60); if (m < 60) return m + ' min';
  return Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
};
const hora = (d) => new Date(d).toLocaleTimeString('es-VE', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Caracas' });
const diaLargo = (d) => new Date(d).toLocaleDateString('es-VE', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'America/Caracas' });
const codigoVis = (v) => String(v || '').replace(/-/g, '').slice(0, 6).toUpperCase();
const paginaBonita = (p) => {
  if (!p) return '—';
  if (/^\/p\//.test(p)) return 'Página de producto ' + p.slice(3);
  const bonito = (x) => { x = x.replace(/-/g, ' '); return x.charAt(0).toUpperCase() + x.slice(1); };
  if (/^\/c\//.test(p)) return 'Categoría ' + p.slice(3).split(/[?#]/)[0].split('/').filter(Boolean).map(bonito).join(' › ');
  const hc = p.match(/#\/c\/([^?&]+)/); if (hc && !/[?&]p=/.test(p)) return 'Categoría ' + hc[1].split('/').filter(Boolean).map(bonito).join(' › ');
  if (/^\/links/.test(p)) return 'Página de enlaces';
  const h = p.replace(/^\/(tienda)?(\.html)?/, '');
  if (!h || h === '#' || h === '#/') return 'Inicio de la tienda';
  const pr = h.match(/[?&]p=([^&]+)/); if (pr) return 'Producto ' + pr[1];
  const q = h.match(/buscar\?q=([^&]+)/); if (q) return 'Búsqueda “' + q[1] + '”';
  const mc = h.match(/^#\/marca\/([^?&]+)/); if (mc) return 'Marca ' + mc[1].toUpperCase().replace(/-/g, ' ');
  if (/^#\/catalogos/.test(h)) return 'Catálogos';
  if (/^#\/todo/.test(h)) return 'Todos los productos';
  return 'Tienda ' + h.replace(/^#\/?/, '').replace(/\//g, ' › ');
};

// Mini gráfico de barras (horas del día, días de la semana)
function barrasSimples(valores, etiquetas, titulo){
  const max = Math.max(1, ...valores);
  return '<div class="grafico" style="height:120px">' + valores.map((v, i) => '<div class="col" data-tip="' + esc(titulo(i, v)) + '"><div class="b1" style="height:' + (100 * v / max) + '%;' + (v === max && v > 0 ? 'background:var(--azul)' : '') + '"></div></div>').join('') + '</div>' +
    '<div class="grafico-ejes">' + etiquetas.map(t => '<span>' + t + '</span>').join('') + '</div>';
}

/* ---------- Ventanas plegables (Visitantes) ----------
   Cerradas muestran el título y un resumen; al tocarlas se abren a todo el
   ancho. Este navegador recuerda cuáles dejaste abiertas. */
const PLEG_DEF = { vis: ['recientes'] };
function plegAbiertas(grupo){
  try { const v = JSON.parse(localStorage.getItem('suin_pleg_' + grupo) || 'null'); if (Array.isArray(v)) return v; } catch (e) {}
  return (PLEG_DEF[grupo] || []).slice();
}
function plegGuardar(grupo){
  const ab = [...document.querySelectorAll('[data-pleg-grupo="' + grupo + '"].abierta')].map(x => x.dataset.pleg);
  try { localStorage.setItem('suin_pleg_' + grupo, JSON.stringify(ab)); } catch (e) {}
}
function plegable(grupo, id, icono, titulo, resumen, contenido){
  const ab = plegAbiertas(grupo).includes(id);
  return '<section class="caja plegable' + (ab ? ' abierta' : '') + '" data-pleg-grupo="' + grupo + '" data-pleg="' + id + '">' +
    '<button type="button" class="pleg-cab" aria-expanded="' + ab + '"><span class="pleg-ico">' + icono + '</span>' +
      '<span class="pleg-tit"><h2>' + titulo + '</h2><span class="pleg-res">' + resumen + '</span></span>' +
      '<span class="pleg-chev" aria-hidden="true">' + I('<path d="m6 9 6 6 6-6"/>') + '</span></button>' +
    '<div class="pleg-cuerpo">' + contenido + '</div></section>';
}
function activarPlegables(grupo){
  const secs = document.querySelectorAll('[data-pleg-grupo="' + grupo + '"]');
  const poner = (sec, abrir) => { sec.classList.toggle('abierta', abrir); sec.querySelector('.pleg-cab').setAttribute('aria-expanded', abrir); };
  secs.forEach(sec => sec.querySelector('.pleg-cab').onclick = (e) => {
    if (e.target.closest('a')) return;
    const abrir = !sec.classList.contains('abierta');
    poner(sec, abrir); plegGuardar(grupo);
    if (abrir) setTimeout(() => sec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
  });
  document.querySelectorAll('[data-pleg-todo]').forEach(b => b.onclick = () => { secs.forEach(sec => poner(sec, b.dataset.plegTodo === '1')); plegGuardar(grupo); });
}

async function vistaVisitantes(){
  const chips = '<div class="chips">' + DIAS_VIS.map(([d, t]) => '<button class="chip' + (diasVis === d ? ' activo' : '') + '" data-dias-vis="' + d + '">' + t + '</button>').join('') + '</div>';
  $('main').innerHTML = cabecera('Visitantes', 'Quienes entran sin iniciar sesión: cuántos son, de dónde, cuándo, qué buscan y qué productos ven. Toca una visita para ver todo lo que hizo esa persona. No se cuenta lo que haces tú como administrador.', chips) + '<div class="cargando">Cargando…</div>';
  document.querySelectorAll('[data-dias-vis]').forEach(b => b.onclick = () => { diasVis = Number(b.dataset.diasVis); vistaVisitantes(); });
  const { data, error } = await sb.rpc('resumen_visitantes', { dias: diasVis });
  if (tab !== 'visitantes') return;
  const cont = document.querySelector('#main .cargando');
  if (error || !data){ cont.outerHTML = faltaVisitantes(error); return; }
  datosVis = data; cuantasVis = 25;
  const t = data.totales || {};
  const kpi = (icono, titulo, num, pie, extra) => '<div class="kpi' + (extra || '') + '"><div class="k-cab">' + titulo + icono + '</div><div class="k-num">' + (typeof num === 'string' ? num : Number(num || 0).toLocaleString('es-VE')) + '</div><div class="k-pie">' + pie + '</div></div>';
  const ranking = (lista, fila, vacio, n) => !lista || !lista.length ? '<div class="vacio">' + ICO.grafica + vacio + '</div>' :
    '<ol class="ranking">' + lista.slice(0, n || 12).map((x, i) => fila(x, i, lista)).join('') + '</ol>';
  const barra = (v, max) => '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * v / (max || 1))) + '%"></i></div>';
  const maxDe = (l, k) => Math.max(1, ...(l || []).map(x => x[k] || 0));
  const filaSimple = (nombre, v, max, sub) => '<li><span class="pos"></span><span class="nom"><strong>' + nombre + '</strong>' + (sub ? '<small>' + sub + '</small>' : '') + barra(v, max) + '</span><span class="num">' + v + '</span></li>';
  const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';

  // Visitas por día (completa los días sin datos)
  const porDia = {}; (data.por_dia || []).forEach(d => { porDia[d.dia] = d; });
  const dias = [];
  const nDias = Math.max(diasVis, 7);
  for (let i = nDias - 1; i >= 0; i--){
    const f = new Date(Date.now() - i * 86400000);
    const k = f.toLocaleDateString('en-CA', { timeZone: 'America/Caracas' });
    dias.push({ f, v: (porDia[k] || {}).visitas || 0, p: (porDia[k] || {}).visitantes || 0 });
  }
  const maxV = Math.max(1, ...dias.map(d => d.v));
  const cada = nDias <= 7 ? 1 : nDias <= 30 ? 5 : 15;
  const grafico = '<div class="grafico">' + dias.map(d => '<div class="col" data-tip="' + d.f.toLocaleDateString('es-VE', { weekday: 'short', day: 'numeric', month: 'short' }) + ': ' + d.v + ' visitas · ' + d.p + ' personas">' +
      '<div class="b1" style="height:' + (100 * d.v / maxV) + '%"></div><div class="b2" style="height:' + (100 * d.p / maxV) + '%"></div></div>').join('') + '</div>' +
    '<div class="grafico-ejes">' + dias.map((d, i) => '<span>' + ((dias.length - 1 - i) % cada === 0 ? d.f.getDate() : '') + '</span>').join('') + '</div>';

  const horas = Array(24).fill(0); (data.por_hora || []).forEach(h => { horas[h.hora] = h.visitas; });
  const semana = Array(7).fill(0); (data.por_semana || []).forEach(d => { semana[d.dia - 1] = d.visitas; });
  const DSEM = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
  const hTxt = (h) => (h % 12 || 12) + (h < 12 ? ' a. m.' : ' p. m.');
  const pico = horas.indexOf(Math.max(...horas));

  const maxP = maxDe(data.paises, 'visitas'), maxCi = maxDe(data.ciudades, 'visitas'), maxO = maxDe(data.origenes, 'visitas'), maxE = maxDe(data.entradas, 'visitas');
  const maxB = maxDe(data.buscado, 'veces'), maxT = maxDe(data.tarjetas, 'veces');
  const grupoMini = (titulo, lista, campo, nombre) => {
    const max = maxDe(lista, 'visitas');
    return '<div class="seccion"><h3>' + titulo + '</h3>' + (!(lista || []).length ? '<div class="muted">Sin datos.</div>' :
      '<ol class="ranking">' + lista.slice(0, 6).map(x => filaSimple(esc(nombre ? nombre(x[campo]) : (x[campo] || 'Desconocido')), x.visitas, max, pct(x.visitas, t.visitas) + ' de las visitas')).join('') + '</ol>') + '</div>';
  };

  // Resúmenes de una línea para cuando la ventana está cerrada
  const top = (l, k) => (l || [])[0] ? l[0][k] : null;
  const diaMax = dias.reduce((m, d) => d.v > m.v ? d : m, { v: -1 });
  const iSem = semana.indexOf(Math.max(...semana));
  const ult = (data.visitas || [])[0];
  const res = {
    recientes: (data.visitas || []).length ? (data.visitas || []).length + ' visitas · la última ' + haceCuanto(ult.inicio) + (ult ? ' desde ' + esc(lugarDe(ult)) : '') : 'Sin visitas en este período',
    dia: t.visitas ? Number(t.visitas).toLocaleString('es-VE') + ' visitas · el día con más: ' + diaMax.f.toLocaleDateString('es-VE', { weekday: 'short', day: 'numeric', month: 'short' }) + ' (' + diaMax.v + ')' : 'Sin visitas',
    hora: t.visitas ? 'Más visitas a las ' + hTxt(pico) : 'Sin datos',
    semana: t.visitas ? 'Más visitas los ' + DSEM[iSem] : 'Sin datos',
    pais: top(data.paises, 'pais') ? bandera(data.paises[0].pais) + esc(nomPais(data.paises[0].pais)) + ' · ' + pct(data.paises[0].visitas, t.visitas) + ' de las visitas' : 'Sin datos',
    ciudad: (data.ciudades || [])[0] ? esc(lugarDe(data.ciudades[0])) + ' · ' + data.ciudades[0].visitas + ' visitas' : 'Sin ciudades todavía',
    origen: (data.origenes || [])[0] ? esc(origenDe(data.origenes[0].referencia)) + ' · ' + pct(data.origenes[0].visitas, t.visitas) + ' de las visitas' : 'Sin datos',
    equipo: top(data.dispositivos, 'dispositivo') ? esc(data.dispositivos[0].dispositivo) + ' ' + pct(data.dispositivos[0].visitas, t.visitas) + (top(data.sistemas, 'sistema') ? ' · ' + esc(data.sistemas[0].sistema) : '') : 'Sin datos',
    buscan: (data.buscado || [])[0] ? '“' + esc(data.buscado[0].texto) + '” · ' + data.buscado[0].veces + ' veces' : 'Sin búsquedas todavía',
    tarjetas: (data.tarjetas || [])[0] ? esc(data.tarjetas[0].modelo) + ' · ' + data.tarjetas[0].veces + ' veces en pantalla' : 'Sin tarjetas vistas',
  };

  cont.outerHTML =
    '<div class="kpis">' +
      kpi(ICO.clientes, 'Visitas', t.visitas, Number(t.visitantes || 0).toLocaleString('es-VE') + ' personas distintas · ' + (t.nuevos || 0) + ' nuevas') +
      kpi(ICO.ojo, 'En la tienda ahora', data.ahora, 'activos en los últimos 15 minutos', data.ahora ? ' destacado' : '') +
      kpi(ICO.buscar, 'Búsquedas', t.busquedas, 'veces que usaron el buscador') +
      kpi(ICO.tienda, 'Tarjetas vistas', t.tarjetas, (t.fichas || 0) + ' fichas de producto abiertas') +
      kpi(ICO.whatsapp, 'Visitas con interés', t.con_interes, pct(t.con_interes, t.visitas) + ' agregó al pedido o escribió por WhatsApp') +
      kpi(ICO.sync, 'Tiempo promedio', t.duracion_media ? duracion(t.duracion_media) : '—', 'de las visitas que hicieron algo') +
    '</div>' +
    '<div class="pleg-barra"><span class="muted">Toca una ventana para abrirla completa</span><button class="btn chico fantasma" data-pleg-todo="1">Abrir todas</button><button class="btn chico fantasma" data-pleg-todo="0">Cerrar todas</button></div>' +
    '<div class="plegables" id="vis-plegables">' +
      plegable('vis', 'recientes', ICO.clientes, 'Visitas recientes <small>' + (data.visitas || []).length + (t.visitas > (data.visitas || []).length ? ' de ' + t.visitas : '') + '</small>', res.recientes,
        '<div class="buscar" style="margin-bottom:12px">' + ICO.buscar + '<input id="vis-buscar" type="search" placeholder="Filtrar por ciudad, búsqueda, origen…" value="' + esc(buscaVis) + '"></div>' +
        '<div class="tabla-wrap" id="vis-tabla"></div>') +
      plegable('vis', 'dia', ICO.grafica, 'Visitas por día', res.dia,
        '<div class="leyenda" style="margin-bottom:6px"><span><i style="background:color-mix(in srgb, var(--azul) 28%, var(--superficie))"></i>Visitas</span><span><i style="background:var(--azul)"></i>Personas distintas</span></div>' + grafico) +
      plegable('vis', 'hora', ICO.sync, '¿A qué hora entran?', res.hora,
        barrasSimples(horas, horas.map((_, h) => h % 3 === 0 ? (h % 12 || 12) + (h < 12 ? 'a' : 'p') : ''), (h, v) => hTxt(h) + ': ' + v + ' visitas') + '<p class="muted" style="margin:8px 0 0">Hora de Venezuela.</p>') +
      plegable('vis', 'semana', ICO.grafica, '¿Qué días?', res.semana,
        barrasSimples(semana, DSEM.map(d => d.slice(0, 3)), (i, v) => DSEM[i] + ': ' + v + ' visitas')) +
      plegable('vis', 'pais', ICO.globo, '¿De qué país?', res.pais,
        ranking(data.paises, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom"><strong>' + bandera(x.pais) + esc(nomPais(x.pais)) + '</strong><small>' + x.visitantes + ' persona' + (x.visitantes === 1 ? '' : 's') + '</small>' + barra(x.visitas, maxP) + '</span><span class="num">' + x.visitas + '<small>' + pct(x.visitas, t.visitas) + '</small></span></li>', 'Todavía no hay visitas en este período.')) +
      plegable('vis', 'ciudad', ICO.globo, '¿De qué ciudad?', res.ciudad,
        '<p class="sub" style="margin:0 0 10px">Aproximado: se calcula por la conexión a internet (con datos móviles puede salir la ciudad de la antena).</p>' +
        ranking(data.ciudades, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom"><strong>' + esc(lugarDe(x)) + '</strong><small>' + x.visitantes + ' persona' + (x.visitantes === 1 ? '' : 's') + '</small>' + barra(x.visitas, maxCi) + '</span><span class="num">' + x.visitas + '</span></li>', 'Sin ciudades todavía.', 25)) +
      plegable('vis', 'origen', ICO.enlace, '¿Cómo llegan?', res.origen,
        '<div class="pleg-2">' + '<div>' + ranking(data.origenes, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom"><strong>' + esc(origenDe(x.referencia)) + '</strong>' + (x.referencia ? '' : '<small>Escribieron la dirección, un marcador o un enlace de WhatsApp</small>') + barra(x.visitas, maxO) + '</span><span class="num">' + x.visitas + '<small>' + pct(x.visitas, t.visitas) + '</small></span></li>', 'Sin datos todavía.') + '</div>' +
        '<div class="seccion" style="margin:0"><h3>Página por la que entraron</h3>' + (!(data.entradas || []).length ? '<div class="muted">Sin datos.</div>' :
          '<ol class="ranking">' + data.entradas.slice(0, 10).map(x => filaSimple(linkPagina(x.pagina), x.visitas, maxE)).join('') + '</ol>') + '</div></div>') +
      plegable('vis', 'equipo', ICO.ojo, '¿Con qué equipo?', res.equipo,
        '<div class="pleg-2">' + grupoMini('Tipo de equipo', data.dispositivos, 'dispositivo') + grupoMini('Sistema', data.sistemas, 'sistema') +
        grupoMini('Navegador', data.navegadores, 'navegador') + grupoMini('Proveedor de internet', data.proveedores, 'proveedor') + '</div>') +
      plegable('vis', 'buscan', ICO.buscar, '¿Qué buscan?', res.buscan,
        ranking(data.buscado, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + linkBusq(x.texto) + (x.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : '') + '<small>' + x.personas + ' persona' + (x.personas === 1 ? '' : 's') + '</small>' + barra(x.veces, maxB) + '</span><span class="num">' + x.veces + '</span></li>', 'Todavía no hay búsquedas de visitantes.', 30)) +
      plegable('vis', 'tarjetas', ICO.tienda, 'Tarjetas de producto más vistas', res.tarjetas,
        '<p class="sub" style="margin:0 0 10px">Productos que estuvieron en pantalla (en la lista, en Inicio o en las páginas de Google) y cuántas veces abrieron la ficha.</p>' +
        ranking(data.tarjetas, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + linkProd(x.modelo) + '<small>' + esc(descProd(x.modelo)) + '</small>' + barra(x.veces, maxT) + '</span><span class="num">' + x.veces +
          '<small>' + x.personas + ' pers. · ' + (x.abiertas ? x.abiertas + ' abierta' + (x.abiertas === 1 ? '' : 's') : 'no la abrieron') + '</small></span></li>', 'Todavía no hay tarjetas vistas.', 40)) +
    '</div>';
  activarPlegables('vis');
  pintarVisitas();
  $('vis-buscar').oninput = (e) => { buscaVis = e.target.value; cuantasVis = 25; pintarVisitas(); };
}

function pintarVisitas(){
  const q = buscaVis.trim().toLowerCase();
  const lista = (datosVis && datosVis.visitas || []).filter(v => !q ||
    [lugarDe(v), nomPais(v.pais), v.proveedor, equipoDe(v), origenDe(v.referencia), v.buscado, paginaBonita(v.pagina), codigoVis(v.visitante)].join(' ').toLowerCase().includes(q));
  const el = $('vis-tabla');
  if (!el) return;
  if (!lista.length){ el.innerHTML = '<div class="vacio">' + ICO.clientes + (q ? 'Ninguna visita coincide con el filtro.' : 'Todavía no hay visitas en este período.') + '</div>'; return; }
  const act = (v) => [
    v.busquedas && '<span class="pill">' + v.busquedas + ' búsq.</span>',
    v.tarjetas && '<span class="pill">' + v.tarjetas + ' tarjetas</span>',
    v.fichas && '<span class="pill azul">' + v.fichas + ' fichas</span>',
    v.carrito && '<span class="pill verde">' + v.carrito + ' al pedido</span>',
    v.whatsapp && '<span class="pill verde">WhatsApp</span>',
  ].filter(Boolean).join(' ') || '<span class="muted">Solo entró</span>';
  el.innerHTML = '<table class="tabla-vis"><thead><tr><th>Cuándo</th><th>Desde dónde</th><th>Equipo</th><th>Llegó por</th><th>Qué hizo</th><th>Buscó</th></tr></thead><tbody>' +
    lista.slice(0, cuantasVis).map(v => '<tr class="clic" data-visitante="' + esc(v.visitante) + '">' +
      '<td><strong>' + haceCuanto(v.inicio) + '</strong><div class="muted">' + fecha(v.inicio) + (v.fin > v.inicio ? ' · ' + duracion((new Date(v.fin) - new Date(v.inicio)) / 1000) : '') + '</div>' +
        '<div style="margin-top:3px">' + (v.nuevo ? '<span class="pill amar">Nuevo</span>' : '<span class="pill tinta">Volvió</span>') + (v.visitas_periodo > 1 ? ' <span class="muted">' + v.visitas_periodo + ' visitas</span>' : '') + '</div></td>' +
      '<td>' + esc(lugarDe(v)) + (v.proveedor ? '<div class="muted">' + esc(v.proveedor) + '</div>' : '') + '</td>' +
      '<td>' + esc(equipoDe(v)) + '</td>' +
      '<td>' + esc(origenDe(v.referencia)) + '<div class="muted">' + linkPagina(v.pagina) + '</div></td>' +
      '<td class="vis-act">' + act(v) + '</td>' +
      '<td>' + (v.buscado ? v.buscado.split(' · ').map(linkBusq).join(' · ') : '<span class="muted">—</span>') + '</td></tr>').join('') +
    '</tbody></table>' +
    (lista.length > cuantasVis ? '<div style="text-align:center;padding:14px 0 4px"><button class="btn" id="vis-mas">Ver más visitas (' + (lista.length - cuantasVis) + ')</button></div>' : '');
  if ($('vis-mas')) $('vis-mas').onclick = () => { cuantasVis += 50; pintarVisitas(); };
  el.querySelectorAll('[data-visitante]').forEach(tr => tr.onclick = (e) => { if (!e.target.closest('a')) abrirVisitante(tr.dataset.visitante); });
}

// Panel con todo lo que hizo un visitante (todas sus visitas)
async function abrirVisitante(id){
  const cab = '<div class="panel-cab"><div class="avatar">' + esc(codigoVis(id).slice(0, 2)) + '</div><div><h2>Visitante ' + esc(codigoVis(id)) + '</h2><div class="muted">Sin cuenta · identificado por su navegador</div></div>' +
    '<button class="btn chico fantasma cerrar" id="v-cerrar" aria-label="Cerrar">' + ICO.cerrar + '</button></div>';
  const chips = '<div class="chips" style="margin-bottom:16px">' + DIAS_ACT.map(([d, t]) => '<button class="chip' + (diasAct === d ? ' activo' : '') + '" data-dias-vact="' + d + '">' + t + '</button>').join('') + '</div>';
  abrirPanel(cab + '<div class="panel-cuerpo">' + chips + '<div class="cargando">Cargando…</div></div>', true);
  $('panel').dataset.actividad = 'v:' + id;
  const enlazar = () => {
    $('v-cerrar').onclick = cerrarPanel;
    document.querySelectorAll('[data-dias-vact]').forEach(b => b.onclick = () => { diasAct = Number(b.dataset.diasVact); abrirVisitante(id); });
  };
  enlazar();
  const { data, error } = await sb.rpc('actividad_visitante', { p_visitante: id, dias: diasAct });
  if ($('panel').dataset.actividad !== 'v:' + id) return;
  const cuerpo = document.querySelector('#panel .panel-cuerpo');
  if (error || !data){ cuerpo.innerHTML = chips + faltaVisitantes(error); enlazar(); return; }

  const t = data.totales || {};
  const visitas = data.visitas || [];
  const ult = visitas[0] || {};
  const mini = (titulo, num, pie) => '<div class="kpi"><div class="k-cab">' + titulo + '</div><div class="k-num" style="font-size:23px">' + Number(num || 0).toLocaleString('es-VE') + '</div>' + (pie ? '<div class="k-pie">' + pie + '</div>' : '') + '</div>';
  const vacio = (txt) => '<div class="muted" style="padding:8px 0">' + txt + '</div>';
  const barra = (v, m) => '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * v / m)) + '%"></i></div>';
  const maxB = Math.max(1, ...(data.buscado || []).map(x => x.veces));
  const maxV = Math.max(1, ...(data.vistos || []).map(x => x.veces));
  const correos = data.correos || [];

  // Paso a paso, agrupado por visita
  const infoVisita = {}; visitas.forEach(v => { infoVisita[v.visita] = v; });
  const TXT = {
    visita: (e) => 'Entró' + (e.pagina ? ' por <strong>' + linkPagina(e.pagina) + '</strong>' : ''),
    busqueda: (e) => 'Buscó <strong>“' + linkBusq(e.texto) + '”</strong>' + (e.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : e.resultados != null ? ' <span class="muted">(' + e.resultados + ' resultados)</span>' : ''),
    ver_producto: (e) => 'Abrió la ficha de ' + linkProd(e.modelo) + (e.origen === 'pagina' ? ' <span class="muted">(página del producto)</span>' : ''),
    ver_tarjetas: (e) => {
      const l = e.modelos || [];
      return 'Vio ' + l.length + ' tarjeta' + (l.length === 1 ? '' : 's') + (e.texto ? ' en <strong>' + enlaceContexto(e.texto) + '</strong>' : '') +
        '<details class="vis-tarj"><summary>Ver cuáles</summary>' + l.map(m => linkProd(m)).join(' ') + '</details>';
    },
    agregar_carrito: (e) => 'Agregó ' + (e.cantidad ? e.cantidad + ' × ' : '') + linkProd(e.modelo) + ' al pedido',
    cotizar_whatsapp: (e) => 'Pidió precio por WhatsApp de ' + linkProd(e.modelo) + (e.origen === 'pagina' ? ' <span class="muted">(página del producto)</span>' : ''),
    pedido_whatsapp: (e) => 'Envió por WhatsApp ' + (e.cantidad ? e.cantidad + ' × ' : '') + linkProd(e.modelo),
    clic_enlace: (e) => 'Tocó <strong>' + esc(e.texto || 'un botón') + '</strong> en la página de enlaces',
  };
  const ICO_EV = { visita: ICO.tienda, busqueda: ICO.buscar, ver_producto: ICO.ojo, ver_tarjetas: ICO.grafica, agregar_carrito: ICO.tienda, cotizar_whatsapp: ICO.whatsapp, pedido_whatsapp: ICO.pedidos, clic_enlace: ICO.enlace };
  let visAnt = null;
  const linea = (data.recientes || []).map(e => {
    let cabV = '';
    if (e.visita !== visAnt){
      visAnt = e.visita;
      const v = infoVisita[e.visita] || {};
      cabV = '<li class="act-dia">' + (v.inicio ? diaLargo(v.inicio) + ' · ' + hora(v.inicio) : diaLargo(e.creado)) +
        '<div class="vis-cabv">' + [esc(lugarDe(v)), esc(equipoDe(v)), 'llegó por ' + esc(origenDe(v.referencia)), v.fin > v.inicio ? 'estuvo ' + duracion((new Date(v.fin) - new Date(v.inicio)) / 1000) : ''].filter(Boolean).join(' · ') + '</div></li>';
    }
    return cabV + '<li class="act-ev t-' + e.tipo + '">' + (ICO_EV[e.tipo] || '') + '<span>' + (TXT[e.tipo] || (() => esc(e.tipo)))(e) +
      (e.cliente_email ? ' <span class="pill azul">con su cuenta</span>' : '') + '</span><time>' + hora(e.creado) + '</time></li>';
  }).join('');

  cuerpo.innerHTML = chips +
    (correos.length ? '<div class="aviso azul">' + ICO.info + '<div>Este navegador también entró con cuenta: ' + correos.map(c => '<a href="#" data-act-email="' + esc(c) + '"><strong>' + esc(nombreCliente(c)) + '</strong></a>' + (nombreCliente(c) !== c ? ' <span class="muted">(' + esc(c) + ')</span>' : '')).join(', ') + '.</div></div>' : '') +
    '<div class="det-datos" style="margin-bottom:16px">' +
      '<div><span>Última visita</span>' + (data.ultima ? haceCuanto(data.ultima) + ' <small class="muted">· ' + fecha(data.ultima) + '</small>' : '—') + '</div>' +
      '<div><span>Primera vez</span>' + (data.primera ? fecha(data.primera) : '—') + '</div>' +
      '<div><span>Desde dónde</span>' + esc(lugarDe(ult)) + (ult.proveedor ? ' <small class="muted">· ' + esc(ult.proveedor) + '</small>' : '') + '</div>' +
      '<div><span>Equipo</span>' + esc(equipoDe(ult)) + '</div>' +
    '</div>' +
    '<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px">' +
      mini('Visitas', visitas.length) +
      mini('Búsquedas', t.busqueda) +
      mini('Tarjetas', data.n_tarjetas) +
      mini('Fichas', t.ver_producto) +
      mini('Al pedido', t.agregar_carrito) +
      mini('WhatsApp', (t.cotizar_whatsapp || 0) + (t.pedido_whatsapp || 0)) +
    '</div>' +
    '<div class="seccion"><h3>Lo que buscó</h3>' + (!(data.buscado || []).length ? vacio('No buscó nada en este período.') :
      '<ol class="ranking">' + data.buscado.slice(0, 15).map((x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + linkBusq(x.texto) + (x.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : '') +
        '<small>' + haceCuanto(x.ultima) + '</small>' + barra(x.veces, maxB) + '</span><span class="num">' + x.veces + '</span></li>').join('') + '</ol>') + '</div>' +
    '<div class="seccion"><h3>Fichas de producto que abrió</h3>' + (!(data.vistos || []).length ? vacio('No abrió fichas de producto en este período.') :
      '<ol class="ranking">' + data.vistos.slice(0, 15).map((x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom">' + linkProd(x.modelo) + '<small>' + esc(descProd(x.modelo)) + '</small>' + barra(x.veces, maxV) + '</span><span class="num">' + x.veces + '<small>' + haceCuanto(x.ultima) + '</small></span></li>').join('') + '</ol>') + '</div>' +
    '<div class="seccion"><h3>Tarjetas que tuvo en pantalla <small class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">(' + (data.tarjetas || []).length + ' productos distintos)</small></h3>' + (!(data.tarjetas || []).length ? vacio('No hay tarjetas vistas en este período.') :
      '<div class="vis-modelos">' + data.tarjetas.map(x => '<span title="' + esc(descProd(x.modelo)) + '">' + linkProd(x.modelo) + (x.veces > 1 ? ' <b>×' + x.veces + '</b>' : '') + '</span>').join('') + '</div>') + '</div>' +
    '<div class="seccion"><h3>Paso a paso <small class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">(lo más reciente primero)</small></h3>' + (linea ? '<ul class="act-linea">' + linea + '</ul>' : vacio('Sin actividad en este período.')) + '</div>' +
    '<p class="muted" style="font-size:12.5px">Si la persona borra los datos del navegador o entra desde otro equipo, aparece como un visitante nuevo. El lugar es aproximado.</p>';
  cuerpo.insertAdjacentHTML('afterend', '<div class="panel-pie"><button class="btn prim" id="v-listo" style="margin-left:auto">Cerrar</button></div>');
  enlazar();
  $('v-listo').onclick = cerrarPanel;
  cuerpo.querySelectorAll('[data-act-email]').forEach(a => a.onclick = (e) => { e.preventDefault(); abrirActividad(a.dataset.actEmail); });
}

/* ---------- En vivo (13_en_vivo.sql): quién está ahora y qué hace ---------- */
const VIVO_SEG = 100;                    // sin señal en 100 s → ya no está
let vivos = {}, feed = [], vivoEstado = 'conectando', vivoError = null, vivoCanal = null, avisos = null, nuevosFeed = new Set();
const vivoReciente = (r) => r && (Date.now() - new Date(r.visto)) / 1000 < (r.activo ? VIVO_SEG : 60);
const listaVivos = () => Object.values(vivos).filter(vivoReciente).sort((a, b) => (b.activo - a.activo) || new Date(b.visto) - new Date(a.visto));
const segs = (d) => Math.max(0, Math.round((Date.now() - new Date(d)) / 1000));
const haceSeg = (d) => { const s = segs(d); return s < 10 ? 'ahora' : s < 60 ? 'hace ' + s + ' s' : haceCuanto(d); };
const durVivo = (d) => { const m = Math.floor(segs(d) / 60); return m < 1 ? 'recién llegó' : m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
const nombreVivo = (r) => r.cliente_email ? nombreCliente(r.cliente_email) : 'Visitante ' + codigoVis(r.visitante);
const zonaDe = (p) => !p ? 'otro' : /^\/links/.test(p) ? 'links' : /^\/(p|c)\//.test(p) || /[?&]p=/.test(p) ? 'producto' : /^\/tienda/.test(p) ? 'tienda' : 'otro';

async function iniciarVivo(){
  const hace = new Date(Date.now() - 3 * 60000).toISOString(), hora = new Date(Date.now() - 60 * 60000).toISOString();
  const [a, b] = await Promise.all([
    sb.from('en_linea').select('*').gte('visto', hace),
    sb.from('eventos').select('id,tipo,texto,modelo,resultados,cantidad,cliente_email,origen,visitante,visita,pagina,pais,region,ciudad,dispositivo,referencia,creado')
      .gte('creado', hora).neq('tipo', 'ver_tarjetas').order('creado', { ascending: false }).limit(80),
  ]);
  if (a.error){ vivoEstado = 'falta'; vivoError = a.error; pintarVivoBadge(); if (tab === 'envivo') vistaEnVivo(); return; }
  (a.data || []).forEach(r => { vivos[r.visitante] = r; });
  feed = b.data || [];
  vivoCanal = sb.channel('panel-en-vivo')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'en_linea' }, (m) => {
      if (m.eventType === 'DELETE'){ if (m.old && m.old.visitante) delete vivos[m.old.visitante]; }
      else if (m.new && m.new.visitante) vivos[m.new.visitante] = m.new;
      refrescarVivo();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'eventos' }, (m) => {
      const e = m.new; if (!e || e.tipo === 'ver_tarjetas') return;
      if (e.cliente_email && (clientes.find(c => c.email === e.cliente_email) || {}).es_admin) return;
      feed.unshift(e); nuevosFeed.add(e.id); if (feed.length > 150) feed.length = 150;
      refrescarVivo();
    })
    .subscribe((st) => { vivoEstado = st === 'SUBSCRIBED' ? 'conectado' : st === 'CLOSED' ? 'desconectado' : st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' ? 'error' : 'conectando'; refrescarVivo(); });
  setInterval(refrescarVivo, 5000);
  refrescarVivo();
}
let tRefVivo = null;
function refrescarVivo(){
  clearTimeout(tRefVivo);
  tRefVivo = setTimeout(() => { pintarVivoBadge(); if (tab === 'envivo' && $('vivo-lista')) pintarVivo(); }, 120);
}
function pintarVivoBadge(){
  const n = listaVivos().filter(r => r.activo).length;
  const b = document.querySelector('[data-badge=envivo]');
  if (b){ b.textContent = n; b.hidden = !n; b.classList.add('verde'); }
}
function estadoVivoHTML(){
  const t = { conectado: ['verde', 'En vivo'], conectando: ['amar', 'Conectando…'], error: ['rojo', 'Sin conexión, reintentando'], desconectado: ['rojo', 'Desconectado'], falta: ['rojo', 'Falta instalar'] }[vivoEstado] || ['', vivoEstado];
  return '<span class="pill ' + t[0] + ' estado-vivo' + (vivoEstado === 'conectado' ? ' latiendo' : '') + '"><span class="punto"></span>' + t[1] + '</span>';
}

function vistaEnVivo(){
  $('main').innerHTML = cabecera('En vivo', 'Quién está en la web ahora mismo, en qué página y qué va haciendo. Se actualiza solo, al instante. Toca a una persona para ver todo su recorrido.', '<span id="vivo-estado">' + estadoVivoHTML() + '</span>') +
    (vivoEstado === 'falta' ? '<div class="caja"><div class="tarjeta-sync"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar "En vivo" en Supabase</strong><div class="muted">Corre <span class="mono">13_en_vivo.sql</span> en Supabase → SQL Editor (después de <span class="mono">12_enlaces.sql</span>) y vuelve a abrir el panel.' + (vivoError ? '<br><small>' + esc(mensajeError(vivoError)) + '</small>' : '') + '</div></div></div></div>' : '') +
    '<div class="kpis" id="vivo-kpis"></div>' +
    '<div class="grid-2 vivo-grid"><div class="caja"><div class="caja-cab"><h2>Ahora en la web <small id="vivo-n">0</small></h2><span class="muted">En gris: dejó la pestaña en segundo plano</span></div><div id="vivo-lista"></div></div>' +
    '<div class="caja"><div class="caja-cab"><h2>Lo que va pasando</h2><span class="muted">Última hora</span></div><ol class="feed" id="vivo-feed"></ol></div></div>' +
    '<div class="caja" id="vivo-avisos"><div class="caja-cab"><h2>Avisos a Telegram</h2><span class="muted">Te llegan por SuinBot</span></div><div class="cargando">Cargando…</div></div>';
  pintarVivo();
  cargarAvisos();
}
function pintarVivo(){
  if ($('vivo-estado')) $('vivo-estado').innerHTML = estadoVivoHTML();
  const l = listaVivos(), act = l.filter(r => r.activo);
  const n = (z) => act.filter(r => zonaDe(r.pagina) === z).length;
  const kpi = (icono, titulo, num, pie, extra) => '<div class="kpi' + (extra || '') + '"><div class="k-cab">' + titulo + icono + '</div><div class="k-num">' + num + '</div><div class="k-pie">' + pie + '</div></div>';
  const enHora = feed.filter(e => Date.now() - new Date(e.creado) < 3600000);
  $('vivo-kpis').innerHTML =
    kpi(ICO.clientes, 'En línea ahora', act.length, l.length > act.length ? (l.length - act.length) + ' en segundo plano' : 'personas con la web abierta', act.length ? ' destacado' : '') +
    kpi(ICO.tienda, 'En la tienda', n('tienda'), 'buscando o viendo la lista') +
    kpi(ICO.ojo, 'En un producto', n('producto'), 'páginas /p/ y /c/') +
    kpi(ICO.enlace, 'En enlaces', n('links'), 'suinelectric.com/links') +
    kpi(ICO.grafica, 'Acciones', enHora.filter(e => e.tipo !== 'visita').length, enHora.filter(e => e.tipo === 'visita').length + ' visitas en la última hora');
  $('vivo-n').textContent = act.length;
  $('vivo-lista').innerHTML = !l.length ? '<div class="vacio">' + ICO.globo + (vivoEstado === 'falta' ? 'Esperando la instalación.' : 'Nadie en la web en este momento.<br><small>Aparecerán aquí apenas entren.</small>') + '</div>' :
    l.map(r => {
      const c = r.cliente_email ? clientes.find(x => x.email === r.cliente_email) : null;
      const sitio = linkPagina(r.pagina);
      return '<div class="vivo-card' + (r.activo ? '' : ' segundo-plano') + '" data-vivo="' + esc(r.visitante) + '"' + (r.cliente_email ? ' data-email="' + esc(r.cliente_email) + '"' : '') + '>' +
        '<div class="avatar' + (c ? '' : ' anon') + '">' + esc(c ? iniciales(c) : codigoVis(r.visitante).slice(0, 2)) + '<i class="' + (r.activo ? 'on' : 'off') + '"></i></div>' +
        '<div class="vc-cuerpo"><div class="vc-nom"><strong>' + esc(nombreVivo(r)) + '</strong>' + (c && c.empresa ? ' <span class="muted">· ' + esc(c.empresa) + '</span>' : '') + (r.cliente_email ? ' <span class="pill azul">Con cuenta</span>' : '') + '</div>' +
          '<div class="vc-lugar muted">' + esc([lugarDe(r), equipoDe(r), r.referencia ? 'llegó por ' + r.referencia : 'entró directo'].filter(Boolean).join(' · ')) + '</div>' +
          '<div class="vc-pag">' + ICO.ojo + '<span>' + sitio + (r.titulo && !/^\/(tienda)?(\.html)?$/.test(r.pagina || '') ? '<small>' + esc(r.titulo.replace(/\s*\|\s*Suinelectric.*$/i, '')) + '</small>' : '') + '</span></div>' +
          (r.accion ? '<div class="vc-acc">↳ ' + esc(r.accion) + ' <span class="muted">· ' + haceSeg(r.accion_en) + '</span></div>' : '') + '</div>' +
        '<div class="vc-der"><strong>' + durVivo(r.entro) + '</strong><small>' + r.paginas + ' pág.</small><small>' + (r.activo ? haceSeg(r.visto) : 'segundo plano') + '</small></div></div>';
    }).join('');
  $('vivo-lista').querySelectorAll('[data-vivo]').forEach(el => el.onclick = (e) => {
    if (e.target.closest('a')) return;
    if (el.dataset.email) abrirActividad(el.dataset.email); else abrirVisitante(el.dataset.vivo);
  });
  pintarFeed();
}
function textoFeed(e){
  const lp = (m) => m ? linkProd(m) : 'un producto';
  switch (e.tipo){
    case 'visita': return 'Entró' + (e.origen === 'links' ? ' a la página de enlaces' : e.pagina ? ' por <strong>' + linkPagina(e.pagina) + '</strong>' : '') + (e.referencia ? ' <span class="muted">desde ' + esc(e.referencia) + '</span>' : '');
    case 'busqueda': return 'Buscó <strong>“' + linkBusq(e.texto) + '”</strong>' + (e.resultados === 0 ? ' <span class="pill rojo">sin resultados</span>' : e.resultados != null ? ' <span class="muted">(' + e.resultados + ')</span>' : '');
    case 'ver_producto': return 'Abrió ' + lp(e.modelo);
    case 'agregar_carrito': return 'Agregó ' + (e.cantidad ? e.cantidad + ' × ' : '') + lp(e.modelo) + ' al pedido';
    case 'cotizar_whatsapp': return 'Pidió precio por WhatsApp de ' + lp(e.modelo);
    case 'pedido_whatsapp': return 'Envió por WhatsApp ' + (e.cantidad ? e.cantidad + ' × ' : '') + lp(e.modelo);
    case 'clic_enlace': return 'Tocó <strong>' + esc(e.texto || 'un botón') + '</strong> en enlaces';
  }
  return esc(e.tipo);
}
function pintarFeed(){
  const el = $('vivo-feed'); if (!el) return;
  const ICO_F = { visita: ICO.globo, busqueda: ICO.buscar, ver_producto: ICO.ojo, agregar_carrito: ICO.tienda, cotizar_whatsapp: ICO.whatsapp, pedido_whatsapp: ICO.whatsapp, clic_enlace: ICO.enlace };
  const lugares = {}; feed.forEach(e => { if (e.tipo === 'visita' && e.visita) lugares[e.visita] = e; });
  const lista = feed.filter(e => Date.now() - new Date(e.creado) < 3600000).slice(0, 60);
  el.innerHTML = !lista.length ? '<li class="vacio">' + ICO.grafica + 'Sin movimiento en la última hora.</li>' : lista.map(e => {
    const r = vivos[e.visitante], v = lugares[e.visita] || r || {};
    const quien = e.cliente_email ? nombreCliente(e.cliente_email) : 'Visitante ' + codigoVis(e.visitante);
    const caliente = /carrito|whatsapp/.test(e.tipo) || (e.tipo === 'clic_enlace' && /whatsapp/i.test(e.texto || ''));
    return '<li class="f-' + e.tipo + (caliente ? ' caliente' : '') + (nuevosFeed.has(e.id) ? ' nuevo' : '') + '" data-vis="' + esc(e.visitante || '') + '"' + (e.cliente_email ? ' data-email="' + esc(e.cliente_email) + '"' : '') + '>' +
      (ICO_F[e.tipo] || ICO.info) + '<div><div>' + textoFeed(e) + '</div><small class="muted">' + esc(quien) + (v.ciudad || v.pais ? ' · ' + esc(lugarDe(v)) : '') + '</small></div><time>' + hora(e.creado) + '</time></li>';
  }).join('');
  nuevosFeed.clear();
  el.querySelectorAll('li[data-vis]').forEach(li => li.onclick = (ev) => {
    if (ev.target.closest('a') || !li.dataset.vis) return;
    if (li.dataset.email) abrirActividad(li.dataset.email); else abrirVisitante(li.dataset.vis);
  });
}
async function cargarAvisos(){
  const { data, error } = await sb.from('avisos_eventos').select('*').order('orden');
  const caja = $('vivo-avisos'); if (!caja || tab !== 'envivo') return;
  const cuerpo = caja.querySelector('.cargando') || caja.querySelector('.interruptores');
  if (error){ cuerpo.outerHTML = '<p class="muted" style="margin:0">Se activan al correr <span class="mono">13_en_vivo.sql</span> en Supabase. Usan el mismo SuinBot de los avisos de pedidos.</p>'; return; }
  avisos = data || [];
  cuerpo.outerHTML = '<p class="sub" style="margin-top:-6px">Elige qué te avisa SuinBot al celular. Cada aviso trae quién es (o de qué ciudad), qué hizo y un enlace a esta pantalla.</p>' +
    '<div class="interruptores avisos-grid">' + avisos.map(a => interruptor('aviso-' + a.clave, esc(a.nombre), esc(a.detalle || ''), a.activo).replace('<input', '<input data-aviso="' + esc(a.clave) + '"')).join('') + '</div>';
  caja.querySelectorAll('[data-aviso]').forEach(ch => ch.onchange = async () => {
    const { error } = await sb.from('avisos_eventos').update({ activo: ch.checked }).eq('clave', ch.dataset.aviso);
    if (error){ ch.checked = !ch.checked; return toast('Error: ' + mensajeError(error)); }
    toast((ch.checked ? 'Aviso activado: ' : 'Aviso apagado: ') + (avisos.find(a => a.clave === ch.dataset.aviso) || {}).nombre);
  });
}

let diasLnk = 30, datosLnk = null, buscaLnk = '', cuantasLnk = 25;
const faltaEnlaces = (err) => '<div class="caja"><div class="tarjeta-sync"><div class="icono mal">' + ICO.alerta + '</div><div><strong>Falta instalar el registro de la página de enlaces</strong><div class="muted">Corre <span class="mono">12_enlaces.sql</span> en Supabase → SQL Editor (después de <span class="mono">10_visitantes.sql</span>). Desde ese momento se anota quién entra a suinelectric.com/links, de dónde llega y qué botones toca.' + (err ? '<br><small>' + esc(mensajeError(err)) + '</small>' : '') + '</div></div></div></div>';

  const barra = (v, max) => '<div class="barra"><i style="width:' + Math.max(4, Math.round(100 * v / (max || 1))) + '%"></i></div>';

  cont.outerHTML =
    '<div class="kpis">' +
      kpi(ICO.clientes, 'Visitas', n(t.visitas), n(t.visitantes) + ' personas · ' + n(t.nuevos) + ' nuevas') +

      kpi(ICO.tienda, 'Siguieron a la tienda', n(t.a_tienda), pct(t.a_tienda, t.visitas) + ' de las visitas') +
    '</div>' +
    '<div class="grid-2" style="grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);margin-bottom:18px">' +
      '<div class="caja"><div class="caja-cab"><h2>Botones más tocados</h2><span class="muted">' + n(t.clics) + ' clics</span></div>' +

        ranking(data.origenes, (x, i) => '<li><span class="pos">' + (i + 1) + '</span><span class="nom"><strong>' + esc(origenDe(x.referencia)) + '</strong><small>' + (x.referencia ? '' : 'Enlace en la bio, un QR, WhatsApp o escribieron la dirección · ') + pct(x.con_clic, x.visitas) + ' tocó algún botón</small>' + barra(x.visitas, maxO) + '</span><span class="num">' + x.visitas + '<small>' + pct(x.visitas, t.visitas) + '</small></span></li>', 'Sin datos todavía.') +
        '<p class="muted" style="margin:12px 0 0;font-size:12.5px">Para saber exactamente de dónde viene cada visita, usa enlaces con etiqueta, por ejemplo <span class="mono">suinelectric.com/links?utm_source=instagram</span> en la bio de Instagram o <span class="mono">?utm_source=qr</span> en un QR impreso.</p></div>' +
    '</div>' +
    '<div class="caja"><div class="caja-cab"><h2>Visitas y clics por día</h2><div class="leyenda"><span><i style="background:color-mix(in srgb, var(--azul) 28%, var(--superficie))"></i>Visitas</span><span><i style="background:var(--azul)"></i>Clics en botones</span></div></div>' + grafico + '</div>' +
    '<div class="grid-2" style="grid-template-columns:1fr 1fr;margin-bottom:18px">' +

      '<div class="caja"><div class="caja-cab"><h2>¿Con qué equipo y a qué hora?</h2></div>' +
        mini('Tipo de equipo', data.dispositivos, 'dispositivo') + mini('Navegador o app', data.navegadores, 'navegador') +
        '<div class="seccion" style="margin:0"><h3>Hora de entrada (Venezuela)</h3>' + barrasSimples(horas, horas.map((_, h) => h % 3 === 0 ? (h % 12 || 12) + (h < 12 ? 'a' : 'p') : ''), (h, v) => hTxt(h) + ': ' + v + ' visitas') + '</div></div>' +

   Lo que se guarda aquí sale en la tienda al instante; cada noche pasa al
   catálogo fijo (página /p/ para Google y WhatsApp, fotos en tu dominio). */
let prodWeb = [], prodOcultos = new Map(), prodErr = null, prodInv = [];

async function cargarPanelProductos(){
  const [w, o, inv] = await Promise.all([
    sb.from('productos_web').select('*').order('actualizado', { ascending: false }),
    sb.from('productos_ocultos').select('*'),
    sb.from('inventario_web').select('*'),   // 15_inventario_web.sql (si no está, se ignora)
  ]);
  prodErr = w.error || o.error || null;
  prodInv = inv.error ? [] : (inv.data || []);
  prodWeb = w.data || [];

}
const formaDePanel = (r) => {
  const subs = (r.subcategorias || []).filter(Boolean), imgs = (r.imagenes || []).filter(Boolean);
  return { modelo: r.modelo, nombre: r.nombre || r.modelo, marca: r.marca, precio: r.precio == null ? null : Number(r.precio),
    disponible: r.disponible !== false && r.existencias !== 0, descripcion: r.descripcion || '', imagen: imgs[0] || null, imagenes: imgs,
    categoria_principal: r.categoria_principal, subcategorias: subs, _manual: true };
};
// Todos los productos con su origen: 'panel' (agregado o corregido aquí), 'manual' (productos_manuales.json) o 'proveedor'.
function directorio(){
  const web = new Map(prodWeb.map(r => [r.modelo, r]));
  const lista = productos.filter(p => !web.has(p.modelo)).map(p => ({ p, origen: p._manual ? 'manual' : 'proveedor' }));
  prodWeb.forEach(r => lista.unshift({ p: formaDePanel(r), origen: 'panel', row: r, enCatalogo: productos.some(x => x.modelo === r.modelo) }));
  // Tu inventario (lo publica la app de ventas): se marca lo que coincide (mismo modelo sin
  // guiones/espacios/mayúsculas) y se agrega lo que solo tienes tú. Muestra lo que ve la tienda.
  if (prodInv.length){
    const inv = new Map(prodInv.map(r => [claveMod(r.modelo), r]));
    const usadas = new Set();
    lista.forEach(x => {
      const k = claveMod(x.p.modelo), r = inv.get(k); if (!r) return;
      usadas.add(k); x.inv = r;
      x.p = Object.assign({}, x.p, { disponible: true });
      if (r.marca) x.p.marca = r.marca;
      if (r.nombre) x.p.nombre = r.nombre;
      if (r.precio != null && Number(r.precio) > 0) x.p.precio = Number(r.precio);
    });
    inv.forEach((r, k) => {
      if (usadas.has(k)) return;
      const cat = r.categoria || r.marca || 'Inventario';
      lista.unshift({ origen: 'inventario', inv: r, p: { modelo: r.modelo, nombre: r.nombre || r.modelo, marca: r.marca || '', descripcion: r.descripcion || '',
        precio: r.precio != null && Number(r.precio) > 0 ? Number(r.precio) : null, disponible: true, imagen: null, categoria_principal: cat, subcategorias: [], _manual: true } });
    });

  const ocultosClave = new Set([...prodOcultos.keys()].map(claveMod));

// Reduce la foto a máx. 1200 px en JPG (fondo blanco) antes de subirla.
function prepararFoto(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('No se pudo leer la foto')), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Ese archivo no es una imagen')); };
    img.src = url;
  });
}
