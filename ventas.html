  inp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { sel = Math.min(list.length - 1, sel + 1); mark(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); mark(); e.preventDefault(); }
    else if (e.key === 'Enter') { if (sel >= 0) { pick(sel); e.preventDefault(); } }
    else if (e.key === 'Escape') box.classList.add('hide');
  });
  box.addEventListener('mousedown', (e) => { const b = e.target.closest('.res'); if (b) { e.preventDefault(); pick(+b.dataset.i); } });
  document.addEventListener('mousedown', (e) => { if (!host.contains(e.target)) box.classList.add('hide'); });
  Bus.on('catalog', () => { if (document.activeElement === inp) render(); });
}

/* ---------------- editor ---------------- */
function docEditor(v, D, isNew) {
  const cfg = CFG();
  const venta = esVenta(D), compra = D.tipo === 'compra', oferta = D.tipo === 'oferta', ajuste = D.tipo === 'ajuste';
  const conDocumento = oferta || venta;
  let dirty = isNew, saved = isNew ? null : Store.get('docs', D.id);
  const setDirty = (x = true) => { dirty = x; const dd = $('#dirty', v); if (dd) dd.classList.toggle('hide', !dirty); };
  App.guard = async () => !dirty || !(D.items.length || (D.cliente && D.cliente.nombre)) || UI.confirm('Hay cambios sin guardar en este documento. ¿Salir sin guardar?', { ok: 'Salir sin guardar', danger: true });
  window.onbeforeunload = () => (dirty && D.items.length ? true : undefined);

  const titleTxt = isNew ? `${TIPOS[D.tipo]} nueva` : `${TIPOS[D.tipo]} ${D.numero || ''}`;
  const backHref = oferta ? '#/ofertas' : compra || ajuste ? '#/compras' : '#/ventas';
  const vendOpts = (cfg.vendedores || []).map(x => `<option ${D.vendedor === x ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const provList = Store.all('proveedores').map(p => `<option value="${esc(p.nombre)}">`).join('');
  v.innerHTML = `
  <div class="vh"><a class="btn ghost" href="${backHref}" title="Volver">${ico('back')}</a><h1>${esc(titleTxt)}</h1>
    <span id="dirty" class="row small muted ${dirty ? '' : 'hide'}"><i class="dirty-dot"></i> Sin guardar</span>
    ${D.importado ? `<span class="pill" title="Viene del respaldo de Mi Negocio; no vuelve a mover existencias">Importado · ${esc(D.importado)}</span>` : ''}
    ${D.estado === 'anulada' ? '<span class="pill bad">Anulada</span>' : ''}</div>
  <div class="ed">
    <div class="stack">
      <section class="panel">
        <div class="grid g4">
          ${conDocumento ? `<label class="fld" style="grid-column:span 2"><span>Título en el documento</span><input class="inp" data-k="titulo" value="${esc(D.titulo || cfg.titulos[D.tipo] || '')}"></label>` : ''}
          <label class="fld"><span>N° de control</span><input class="inp mono" data-k="numero" value="${esc(D.numero || '')}"></label>
          <label class="fld"><span>Fecha</span><input class="inp" type="date" data-k="fechaD" value="${esc((D.fecha || '').slice(0, 10))}"></label>
          ${oferta ? `<label class="fld"><span>Estado</span><select class="inp" data-k="estado">${Object.entries(ESTADOS_OFERTA).map(([k, [l]]) => `<option value="${k}" ${D.estado === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>` : ''}
          ${!compra && !ajuste ? `<label class="fld"><span>Vendedor</span><select class="inp" data-k="vendedor"><option value="">—</option>${vendOpts}</select></label>` : ''}
          ${compra || ajuste ? `<div class="fld"><span>Entra al inventario de</span><div class="seg" data-seg="inventario">${['manuel', 'papa'].map(o => `<button type="button" data-v="${o}" class="${D.inventario === o ? 'on' : ''}">${esc(origenNombre(o))}</button>`).join('')}</div></div>` : ''}
          ${compra ? `<label class="fld" style="grid-column:span 2"><span>Proveedor</span><input class="inp" data-k="proveedorNombre" list="dl-prov" value="${esc((D.proveedor && D.proveedor.nombre) || '')}" placeholder="Nombre del proveedor"><datalist id="dl-prov">${provList}</datalist></label>
            <label class="fld"><span>Factura del proveedor</span><input class="inp" data-k="refProveedor" value="${esc(D.refProveedor || '')}"></label>` : ''}
        </div>
      </section>
      ${!compra && !ajuste ? `<section class="panel" id="sec-cli"></section>` : ''}
      <section class="panel">
        <div class="ph"><h2>Productos</h2><div class="act"><button class="btn sm" data-addline>${ico('plus')} Línea manual</button></div></div>
        <div id="finder" style="margin-bottom:12px"></div>
        <div id="lines"></div>
        <p class="muted small" style="margin:8px 0 0">Negrita en el PDF: escribe <code>*así*</code>. ${venta ? 'Cada línea dice de dónde sale: tu inventario, el de tu papá, el distribuidor o libre (servicios, sin existencia).' : compra ? 'Los productos que no estén en tu inventario se crean al guardar.' : ''}</p>
      </section>
      ${venta || compra ? `<section class="panel" id="sec-pagos"></section>` : ''}
      ${conDocumento ? `<section class="panel">
        <h2>Documento PDF</h2>
        <div class="grid g2">
          <label class="fld" style="grid-column:1/-1"><span>Términos, condiciones y garantía (una por línea)</span><textarea class="inp" data-k="condTxt" rows="5">${esc((D.condiciones || []).join('\n'))}</textarea></label>
          <label class="fld"><span>Nombre del archivo</span><input class="inp" data-k="archivo" placeholder="${esc(PDF.defaultFileName(D))}" value="${esc(D.archivo || '')}"></label>
          <div class="fld"><span>&nbsp;</span><div class="row"><label class="chk"><input type="checkbox" data-k="firmas" ${D.firmas ? 'checked' : ''}> Con firmas</label><button class="btn sm ghost" type="button" data-cond-reset>Restaurar condiciones</button></div></div>
        </div></section>` : ''}
      <section class="panel"><label class="fld"><span>Notas internas (no salen en el PDF)</span><textarea class="inp" data-k="notas" rows="2">${esc(D.notas || '')}</textarea></label></section>
    </div>
    <aside class="ed-side">
      <section class="panel">
        <div class="grid g2" style="margin-bottom:10px">
          <label class="fld"><span>Descuento %</span><input class="inp num" inputmode="decimal" data-k="descPct" value="${D.descPct ? esc(D.descPct) : ''}" placeholder="0"></label>
          <label class="fld"><span>I.V.A. %</span><select class="inp" data-k="ivaPct"><option value="0">Exento</option><option value="${cfg.ivaPct}" ${num(D.ivaPct) === num(cfg.ivaPct) ? 'selected' : ''}>${fmtNum(cfg.ivaPct)}%</option>${D.ivaPct && num(D.ivaPct) !== num(cfg.ivaPct) ? `<option value="${esc(D.ivaPct)}" selected>${fmtNum(num(D.ivaPct))}%</option>` : ''}</select></label>
        </div>
        ${!compra && !ajuste ? `<label class="fld"><span>Tasa de cambio (Bs por $)</span><input class="inp num" inputmode="decimal" data-k="tasa" value="${D.tasa ? esc(D.tasa) : ''}" placeholder="Sin tasa"></label>
        <div class="row" id="rates" style="margin-top:6px"></div>` : ''}
        <div class="tot-box" id="tot" style="margin-top:12px"></div>
      </section>
      <section class="panel stack" style="gap:8px">
        <button class="btn pri" data-a="save">${ico('save')} Guardar</button>
        ${conDocumento ? `<div class="row" style="flex-wrap:nowrap"><button class="btn" style="flex:1" data-a="pdf">${ico('pdf')} Descargar PDF</button><button class="btn" data-a="preview" title="Vista previa">${ico('eye')}</button>${navigator.canShare ? `<button class="btn" data-a="share" title="Compartir PDF">↗</button>` : ''}</div>` : ''}
        ${oferta ? `<button class="btn" data-a="toNota">Convertir en nota de entrega</button><button class="btn" data-a="toVenta">Registrar como venta sin nota</button>` : ''}
        ${D.tipo === 'venta' ? `<button class="btn" data-a="toNotaV">Hacer nota de entrega de esta venta</button>` : ''}
        ${!isNew ? `<button class="btn" data-a="dup">${ico('copy')} Duplicar</button>` : ''}
        ${!isNew && !oferta ? `<button class="btn ${D.estado === 'anulada' ? '' : 'red'}" data-a="anular">${D.estado === 'anulada' ? 'Reactivar' : 'Anular'}</button>` : ''}
        ${!isNew ? `<button class="btn ghost red" data-a="del">Eliminar</button>` : ''}
        ${D.origenDoc && Store.get('docs', D.origenDoc) ? `<a class="small" href="#/doc/${esc(D.origenDoc)}">Viene de ${esc(Store.get('docs', D.origenDoc).numero)}</a>` : ''}
        ${D.convertidoA && Store.get('docs', D.convertidoA) ? `<a class="small" href="#/doc/${esc(D.convertidoA)}">Convertida en ${esc(Store.get('docs', D.convertidoA).numero)}</a>` : ''}
      </section>
    </aside>
  </div>`;

  /* ----- cliente ----- */
  const paintCliente = () => {
    const box = $('#sec-cli', v); if (!box) return;
    const c = D.cliente || (D.cliente = { nombre: '', rif: '', direccion: '', extras: [] });
    const rec = D.clienteId && Store.get('clientes', D.clienteId);
    box.innerHTML = `<div class="ph"><h2>Cliente</h2><div class="act"><button class="btn sm" data-c="paste">Pegar datos</button><button class="btn sm" data-c="pick">Mis clientes</button>${rec ? `<a class="btn sm" href="#/cliente/${esc(rec.id)}">Ver ficha</a>` : ''}</div></div>
      <div class="grid g2">
        <label class="fld"><span>Razón social o nombre</span><input class="inp" data-ck="nombre" value="${esc(c.nombre)}" list="dl-cli" autocomplete="off"></label>
        <label class="fld"><span>RIF o cédula</span><input class="inp" data-ck="rif" value="${esc(c.rif)}"></label>
        <label class="fld" style="grid-column:1/-1"><span>Dirección</span><input class="inp" data-ck="direccion" value="${esc(c.direccion)}"></label>
      </div>
      <datalist id="dl-cli">${Store.all('clientes').slice(0, 400).map(x => `<option value="${esc(x.nombre)}">`).join('')}</datalist>
      <div class="extras" style="margin-top:10px">${(c.extras || []).map((x, i) => `<div class="ex"><input class="inp" data-ex="${i}" data-exk="l" value="${esc(x.l)}"><input class="inp" data-ex="${i}" data-exk="v" value="${esc(x.v)}"><button class="btn ghost sm" data-exdel="${i}" title="Quitar">✕</button></div>`).join('')}</div>
      <div class="row small"><span class="muted">Agregar dato:</span>${['Teléfono', 'Correo', 'Atención', 'Contacto', 'Otro'].map(l => `<button class="btn sm ghost" data-exadd="${l}">+ ${l}</button>`).join('')}</div>
      ${!rec && c.nombre ? '<p class="muted small" style="margin:8px 0 0">Al guardar se crea este cliente en tu lista (o se enlaza si ya existe con el mismo RIF o nombre).</p>' : ''}`;
    $$('[data-ck]', box).forEach(i => i.addEventListener('input', () => {
      c[i.dataset.ck] = i.value; setDirty();
      if (i.dataset.ck === 'nombre') { const m = Store.all('clientes').find(x => x.nombre === i.value); if (m) { D.clienteId = m.id; D.cliente = docClienteSnap(m); paintCliente(); } }
    }));
    $$('[data-ex]', box).forEach(i => i.addEventListener('input', () => { c.extras[+i.dataset.ex][i.dataset.exk] = i.value; setDirty(); }));
    $$('[data-exdel]', box).forEach(b => b.onclick = () => { c.extras.splice(+b.dataset.exdel, 1); setDirty(); paintCliente(); });
    $$('[data-exadd]', box).forEach(b => b.onclick = () => { (c.extras = c.extras || []).push({ l: b.dataset.exadd === 'Otro' ? 'Dato' : b.dataset.exadd, v: '' }); setDirty(); paintCliente(); const ins = $$('[data-exk="v"]', box); ins[ins.length - 1].focus(); });
    $('[data-c="paste"]', box).onclick = async () => {
      let txt = ''; try { txt = await Promise.race([navigator.clipboard.readText(), new Promise(r => setTimeout(() => r(''), 700))]) || ''; } catch (e) { /* sin permiso */ }
      const m = UI.modal({ title: 'Pegar datos del cliente', body: `<p class="muted small" style="margin-top:0">Pega el bloque que te mandó el cliente: nombre, RIF, dirección, teléfono…</p><textarea class="inp" rows="7">${esc(txt)}</textarea>`, foot: [['Cancelar', '', c2 => c2()], ['Usar estos datos', 'pri', (c2) => {
        const p = parseClienteTexto($('textarea', m.body).value);
        const ex = findCliente(p);
        if (ex) { D.clienteId = ex.id; D.cliente = docClienteSnap(ex); UI.toast('Cliente encontrado en tu lista: ' + ex.nombre); }
        else { D.clienteId = null; D.cliente = p; }
        setDirty(); paintCliente(); c2();
      }]] });
    };
    $('[data-c="pick"]', box).onclick = () => pickCliente((cl) => { D.clienteId = cl.id; D.cliente = docClienteSnap(cl); setDirty(); paintCliente(); });
  };

  /* ----- líneas ----- */
  const prevQty = (pid, inv) => { if (!saved || !saved.afectaStock || saved.estado === 'anulada' || !esVenta(saved)) return 0; return (saved.items || []).filter(i => i.productoId === pid && i.origen === inv).reduce((a, i) => a + num(i.cant), 0); };
  const lineMeta = (it) => {
    const parts = [];
    if (venta || oferta) {
      if ((it.origen === 'manuel' || it.origen === 'papa')) {
        if (it.productoId) { const s = Calc.st(it.productoId); const disp = s[it.origen].cant + prevQty(it.productoId, it.origen); const otro = it.origen === 'manuel' ? 'papa' : 'manuel'; parts.push(`<span class="${num(it.cant) > disp ? 'warn' : ''}">Disponible ${esc(origenNombre(it.origen))}: ${fmtQty(disp)}</span>`); if (s[otro].cant > 0) parts.push(`<span>${esc(origenNombre(otro))}: ${fmtQty(s[otro].cant)}</span>`); }
        else parts.push('<span class="warn">No está en el inventario: no descuenta existencia</span>');
      }
      if (it.origen === 'dist' && it.listPrice) parts.push(`<span>Lista distribuidor ${fmtUSD(it.listPrice)}</span>`);
      const c = it.costo === '' || it.costo == null ? null : num(it.costo), p = num(it.precio);
      if (c != null && p > 0) parts.push(`<span>Ganancia ${fmtUSD((p - c) * num(it.cant))} (${fmtNum((p - c) / p * 100, 1)}%)</span>`);
      else if (it.origen !== 'libre') parts.push('<span>Sin costo: no calcula ganancia</span>');
      if (venta && it.origen === 'dist') parts.push(`<label>Pedido: <select class="inp" style="width:auto;padding:2px 6px;font-size:12.5px" data-lk="pedido">${Object.entries(PEDIDO).map(([k, [l]]) => `<option value="${k}" ${(it.pedido || 'por pedir') === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`);
    }
    if (compra) { if (!it.productoId) parts.push(`<span class="warn">Producto nuevo: se agrega al inventario de ${esc(origenNombre(D.inventario))} al guardar</span>`); else { const s = Calc.st(it.productoId); parts.push(`<span>Existencia actual ${esc(origenNombre(D.inventario))}: ${fmtQty(s[D.inventario].cant)} · costo prom. ${fmtUSD(s[D.inventario].costo)}</span>`); } }
    return parts.join('');
  };
  const paintLines = () => {
    const box = $('#lines', v);
    const showCost = !compra;
    if (!D.items.length) { box.innerHTML = '<div class="empty" style="border:1px dashed var(--line);border-radius:6px">Busca un producto arriba o agrega una línea manual.</div>'; paintTotals(); return; }
    box.innerHTML = `<div class="lines"><div class="ln head"><span></span><span>Código</span><span>${compra ? '' : 'Origen'}</span><span class="r">Cant.</span><span class="r">${compra ? 'Costo unit.' : 'Precio unit.'}</span><span class="r">${showCost ? 'Costo unit.' : ''}</span><span class="r">Total</span><span></span></div>
      ${D.items.map((it, i) => `<div class="ln o-${esc(compra ? D.inventario : (it.origen || 'libre'))}" data-li="${i}">
        <div class="idx">${i > 0 ? `<button data-up title="Subir">▲</button>` : ''}${i + 1}${i < D.items.length - 1 ? `<button data-down title="Bajar">▼</button>` : ''}</div>
        <div class="c-code"><input class="inp mono" style="font-size:13px" data-lk="codigo" value="${esc(it.codigo || '')}" placeholder="Código"></div>
        <div class="c-orig">${venta || oferta ? `<select class="inp orig" data-lk="origen" aria-label="Origen">${ORIGENES.map(o => `<option value="${o}" ${it.origen === o ? 'selected' : ''}>${esc(origenNombre(o))}</option>`).join('')}</select>` : ''}</div>
        <label><span class="lbl-m">Cantidad</span><input class="inp num" inputmode="decimal" data-lk="cant" value="${esc(fmtQty(num(it.cant)))}"></label>
        <label><span class="lbl-m">${compra ? 'Costo unit.' : 'Precio unit.'}</span><input class="inp num" inputmode="decimal" data-lk="precio" value="${esc(it.precio === '' ? '' : round2(num(it.precio)))}"></label>
        <label>${showCost ? `<span class="lbl-m">Costo unit.</span><input class="inp num" inputmode="decimal" data-lk="costo" value="${it.costo === '' || it.costo == null ? '' : esc(round2(num(it.costo)))}" placeholder="—" title="Tu costo (no sale en el PDF)">` : ''}</label>
        <div class="tot" data-ltot>${fmtUSD(num(it.cant) * num(it.precio))}</div>
        <button class="del" data-del title="Quitar línea" aria-label="Quitar línea">✕</button>
        <div class="c-desc"><textarea class="inp" data-lk="desc" rows="3">${esc(it.desc || '')}</textarea></div>
        <div class="meta" data-meta>${lineMeta(it)}</div>
      </div>`).join('')}</div>`;
    paintTotals();
  };
  $('#lines', v).addEventListener('input', (e) => {
    const row = e.target.closest('[data-li]'); const k = e.target.dataset.lk; if (!row || !k || e.target.tagName === 'SELECT') return;
    const it = D.items[+row.dataset.li];
    it[k] = k === 'cant' || k === 'precio' ? num(e.target.value) : k === 'costo' ? (e.target.value.trim() === '' ? '' : num(e.target.value)) : e.target.value;
    $('[data-ltot]', row).textContent = fmtUSD(num(it.cant) * num(it.precio));
    if (k !== 'desc' && k !== 'codigo') $('[data-meta]', row).innerHTML = lineMeta(it);
    setDirty(); paintTotals();
  });
  $('#lines', v).addEventListener('change', (e) => {
    const row = e.target.closest('[data-li]'); const k = e.target.dataset.lk; if (!row || !k) return;
    const it = D.items[+row.dataset.li];
    if (k === 'origen') {
      it.origen = e.target.value;
      if (it.origen === 'manuel' || it.origen === 'papa') {
        if (!it.productoId) { const p = findProductoByCodigo(it.codigo); if (p) it.productoId = p.id; }
        if (it.productoId) { const s = Calc.st(it.productoId); if (s[it.origen].costo) it.costo = round2(s[it.origen].costo); }
      } else if (it.origen === 'dist') {
        const c = catalogoByCodigo(it.codigo); if (c) { it.listPrice = c.precio; const cd = costoDist(c); if (cd != null) it.costo = cd; }
      } else if (it.origen === 'libre') { /* sin existencia */ }
      setDirty(); paintLines(); return;
    }
    if (k === 'pedido') { it.pedido = e.target.value; setDirty(); return; }
    if (k === 'codigo' && !it.productoId && (it.origen === 'manuel' || it.origen === 'papa' || compra)) { const p = findProductoByCodigo(it.codigo); if (p) { it.productoId = p.id; setDirty(); paintLines(); } }
    if (k === 'cant' || k === 'precio' || k === 'costo') { e.target.value = k === 'cant' ? fmtQty(num(it.cant)) : (it[k] === '' ? '' : round2(num(it[k]))); }
  });
  $('#lines', v).addEventListener('click', (e) => {
    const row = e.target.closest('[data-li]'); if (!row) return; const i = +row.dataset.li;
    if (e.target.closest('[data-del]')) { D.items.splice(i, 1); setDirty(); paintLines(); }
    else if (e.target.closest('[data-up]')) { [D.items[i - 1], D.items[i]] = [D.items[i], D.items[i - 1]]; setDirty(); paintLines(); }
    else if (e.target.closest('[data-down]')) { [D.items[i + 1], D.items[i]] = [D.items[i], D.items[i + 1]]; setDirty(); paintLines(); }
  });
  $('[data-addline]', v).onclick = () => { D.items.push({ id: uid('i'), productoId: null, codigo: '', desc: 'Descripción del producto o servicio', cant: 1, precio: 0, costo: '', origen: compra ? null : 'libre' }); setDirty(); paintLines(); const ts = $$('#lines textarea', v); const t = ts[ts.length - 1]; t.focus(); t.select(); };
  productFinder($('#finder', v), {
    tipo: D.tipo,
    onPick: (x) => {
      let it;
      if (x.k === 'p') it = lineFromProducto(x.p, D.tipo, compra || ajuste ? D.inventario : null);
      else { const own = findProductoByCodigo(x.c.m); it = lineFromCatalogo(x.c, D.tipo); if (compra && own) { it.productoId = own.id; delete it.nuevoProd; } }
      if (compra) it.origen = null;
      const cli = D.clienteId && Store.get('clientes', D.clienteId);
      if (cli && num(cli.descuento) && !compra) { /* el descuento del cliente se aplica al documento */ if (!num(D.descPct)) { D.descPct = num(cli.descuento); const di = $('[data-k="descPct"]', v); if (di) di.value = D.descPct; } }
      D.items.push(it); setDirty(); paintLines();
      UI.toast(`Agregado: ${it.codigo}`, 1200);
    }
  });

  /* ----- pagos ----- */
  const paintPagos = () => {
    const box = $('#sec-pagos', v); if (!box) return;
    const T = Calc.totals(D); const formas = cfg.formasPago || [];
    box.innerHTML = `<div class="ph"><h2>Pagos</h2><div class="act">${T.saldo > 0.005 ? `<button class="btn sm" data-p="full">Pagado completo (${fmtUSD(T.saldo)})</button>` : ''}<button class="btn sm" data-p="add">${ico('plus')} Pago</button></div></div>
      ${(D.pagos || []).length ? D.pagos.map((p, i) => `<div class="pay" data-pi="${i}"><input class="inp" type="date" data-pk="fecha" value="${esc((p.fecha || '').slice(0, 10))}"><input class="inp" data-pk="forma" list="dl-formas" value="${esc(p.forma || '')}" placeholder="Forma de pago"><input class="inp num" inputmode="decimal" data-pk="monto" value="${esc(round2(num(p.monto)))}"><input class="inp" data-pk="ref" value="${esc(p.ref || '')}" placeholder="Referencia / nota"><button class="btn ghost sm" data-pdel title="Quitar">✕</button></div>`).join('') : `<p class="muted small" style="margin:0">Sin pagos registrados.</p>`}
      <datalist id="dl-formas">${formas.map(f => `<option value="${esc(f)}">`).join('')}</datalist>`;
    $$('[data-pk]', box).forEach(inp => inp.addEventListener('input', () => { const p = D.pagos[+inp.closest('[data-pi]').dataset.pi]; const k = inp.dataset.pk; p[k] = k === 'monto' ? num(inp.value) : k === 'fecha' ? inp.value + ' 12:00' : inp.value; setDirty(); paintTotals(); }));
    $$('[data-pdel]', box).forEach(b => b.onclick = () => { D.pagos.splice(+b.closest('[data-pi]').dataset.pi, 1); setDirty(); paintPagos(); paintTotals(); });
    const add = (monto) => { (D.pagos = D.pagos || []).push({ id: uid('g'), fecha: localStamp(), forma: formas[0] || '', monto: round2(monto), ref: '' }); setDirty(); paintPagos(); paintTotals(); };
    $('[data-p="add"]', box).onclick = () => add(Math.max(0, Calc.totals(D).saldo));
    const full = $('[data-p="full"]', box); if (full) full.onclick = () => add(Calc.totals(D).saldo);
  };

  /* ----- totales ----- */
  const paintTotals = () => {
    const T = Calc.totals(D); const box = $('#tot', v);
    let h = `<div class="tr"><span>Subtotal</span><b>${fmtUSD(T.sub)}</b></div>`;
    if (T.desc > 0) h += `<div class="tr neg"><span>Descuento ${fmtNum(T.descPct)}%</span><b>-${fmtUSD(T.desc)}</b></div>`;
    h += `<div class="tr"><span>${T.ivaPct ? `I.V.A. ${fmtNum(T.ivaPct)}%` : 'I.V.A. (exento)'}</span><b>${fmtUSD(T.iva)}</b></div>`;
    h += `<div class="tr big"><span>Total</span><b>${fmtUSD(T.total)}</b></div>`;
    if (T.tasa && !compra) h += `<div class="tr"><span>Total en Bs</span><b>${fmtBS(T.bs)}</b></div>`;
    if (venta || compra) h += `<div class="tr" style="margin-top:6px"><span>Pagado</span><b>${fmtUSD(T.pagado)}</b></div><div class="tr"><span>${compra ? 'Por pagar' : 'Por cobrar'}</span><b style="color:${T.saldo > 0.005 ? 'var(--red)' : 'var(--ok)'}">${fmtUSD(Math.max(T.saldo, 0))}</b></div>`;
    if (!compra && !ajuste && D.items.length) {
      h += `<div style="border-top:1px solid var(--line-2);margin-top:8px;padding-top:8px">`;
      Object.entries(T.porOrigen).forEach(([o, g]) => { if (o === 'libre' && !g.costo) { h += `<div class="tr small"><span>${ownTag(o)}</span><b>${fmtUSD(g.venta)}</b></div>`; return; } h += `<div class="tr small"><span>${ownTag(o)}</span><b>${g.sinCosto ? '<span class="muted" title="Falta el costo en alguna línea">s/c</span> ' : ''}${fmtUSD(g.gan)}</b></div>`; });
      h += `<div class="tr gan"><span>Ganancia${T.sinCosto ? ' (parcial)' : ''}</span><b>${fmtUSD(T.gan)}</b></div></div>`;
    }
    box.innerHTML = h;
    const sp = $('#sec-pagos', v); if (sp && !sp.contains(document.activeElement)) paintPagos();
  };

  /* ----- tasas ----- */
  const paintRates = () => {
    const box = $('#rates', v); if (!box) return;
    box.innerHTML = Rates.SOURCES.filter(s => Rates.data[s.id]).map(s => `<button class="btn sm ${D.tasaFuente === s.id && num(D.tasa) === round2(Rates.data[s.id].v) ? 'pri' : ''}" data-rate="${s.id}" title="${esc(s.name)}">${esc(s.name)} ${fmtNum(Rates.data[s.id].v, 2)}</button>`).join('') + `<button class="btn sm ghost" data-rate-r title="Actualizar tasas">${Rates.loading ? '…' : '↻'}</button>`;
    $$('[data-rate]', box).forEach(b => b.onclick = () => { D.tasa = round2(Rates.data[b.dataset.rate].v); D.tasaFuente = b.dataset.rate; $('[data-k="tasa"]', v).value = D.tasa; setDirty(); paintRates(); paintTotals(); });
    $('[data-rate-r]', box).onclick = () => Rates.fetch();
  };
  App.onRates = () => { if (document.body.contains(v)) paintRates(); };

  /* ----- campos generales ----- */
  $$('[data-k]', v).forEach(el => {
    const ev = el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'date' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      const k = el.dataset.k;
      if (k === 'fechaD') { D.fecha = el.value + ' ' + ((D.fecha || '').slice(11, 16) || '12:00'); }
      else if (k === 'proveedorNombre') { D.proveedor = { nombre: el.value }; const p = Store.all('proveedores').find(x => normKey(x.nombre) === normKey(el.value)); D.proveedorId = p ? p.id : null; }
      else if (k === 'condTxt') D.condiciones = el.value.split('\n');
      else if (k === 'firmas') D.firmas = el.checked;
      else if (k === 'descPct' || k === 'ivaPct') D[k] = num(el.value);
      else if (k === 'tasa') { D.tasa = el.value.trim() ? num(el.value) : null; D.tasaFuente = 'manual'; }
      else D[k] = el.value;
      setDirty(); paintTotals(); if (k === 'tasa') paintRates();
    });
  });
  $$('[data-seg]', v).forEach(seg => seg.addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; D[seg.dataset.seg] = b.dataset.v; $$('button', seg).forEach(x => x.classList.toggle('on', x === b)); setDirty(); paintLines(); }));
  const cr = $('[data-cond-reset]', v); if (cr) cr.onclick = () => { D.condiciones = (cfg.condiciones[oferta ? 'oferta' : 'nota'] || []).slice(); $('[data-k="condTxt"]', v).value = D.condiciones.join('\n'); setDirty(); };

  /* ----- guardar ----- */
  const save = () => {
    D.condiciones = (D.condiciones || []).filter(s => String(s).trim() !== '' || false);
    if (!D.numero) D.numero = nextNumero(D.tipo, D.fecha);
    const dupNum = Store.all('docs').find(x => x.id !== D.id && x.numero === D.numero);
    if (dupNum) { UI.toast(`Ya existe otro documento con el número ${D.numero}. Cámbialo.`, 3200); return false; }
    if (!compra && !ajuste && D.cliente && D.cliente.nombre && D.cliente.nombre.trim()) { const c = clienteFromDoc(D); if (c) D.clienteId = c.id; }
    if (compra) {
      const nom = (D.proveedor && D.proveedor.nombre || '').trim();
      if (nom) { let p = Store.all('proveedores').find(x => normKey(x.nombre) === normKey(nom)); if (!p) p = Store.put('proveedores', { id: uid('pv_'), nombre: nom, empresa: '', telefono: '', correo: '', notas: '' }); D.proveedorId = p.id; D.proveedor = { nombre: p.nombre }; }
      // productos nuevos de la compra
      D.items.forEach(it => {
        if (it.productoId || !String(it.codigo || '').trim()) return;
        const ex = findProductoByCodigo(it.codigo);
        if (ex) { it.productoId = ex.id; return; }
        const np = Object.assign({ id: uid('p_'), codigo: it.codigo.trim(), nombre: '', descripcion: '', marca: it.marca || '', categoria: '', unidad: 'UND', precio: 0, inv: {}, activo: true, notas: '' }, it.nuevoProd || {});
        if (!np.nombre && !np.descripcion) np.nombre = plainFirst(it.desc).replace(/^Ref \/ Modelo:\s*/i, '').replace(it.codigo, '').replace(/^[\s—-]+/, '');
        np.inv[D.inventario] = { cant: 0, costo: 0 };
        Store.put('productos', np); it.productoId = np.id; delete it.nuevoProd;
      });
      D.items.forEach(it => { it.costo = num(it.precio); it.origen = D.inventario; });
    }
    if (venta) D.items.forEach(it => { if (it.origen === 'dist' && !it.pedido) it.pedido = 'por pedir'; });
    if (!D.importado && D.tipo !== 'oferta') D.afectaStock = true;
    Store.put('docs', D);
    saved = clone(D); setDirty(false);
    UI.toast(`Guardado: ${D.numero}`);
    if (isNew) { isNew = false; App.guard = null; history.replaceState(null, '', '#/doc/' + D.id); App.go(); }
    return true;
  };
  const convert = (tipo) => {
    if (dirty && !save()) return;
    const cfg2 = CFG();
    const nd = newDoc(tipo, { clienteId: D.clienteId, cliente: clone(D.cliente || {}), items: clone(D.items).map(it => Object.assign(it, { id: uid('i') })), descPct: D.descPct, ivaPct: D.ivaPct, tasa: D.tasa, tasaFuente: D.tasaFuente, vendedor: D.vendedor, origenDoc: D.id, notas: D.notas });
    if (tipo === 'nota') nd.condiciones = (cfg2.condiciones.nota || []).slice();
    nd.items.forEach(it => { if (it.origen === 'dist') it.pedido = 'por pedir'; });
    Store.put('docs', nd);
    const orig = Store.get('docs', D.id); if (orig) { if (orig.tipo === 'oferta') orig.estado = 'aceptada'; orig.convertidoA = nd.id; Store.put('docs', orig); }
    dirty = false; App.guard = null; location.hash = '#/doc/' + nd.id;
    UI.toast(`Creada ${TIPOS[tipo].toLowerCase()} ${nd.numero}`);
  };
  v.addEventListener('click', async (e) => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    const act = a.dataset.a;
    if (act === 'save') save();
    else if (act === 'pdf' || act === 'preview' || act === 'share') {
      if (!D.items.length) { UI.toast('Agrega al menos un producto'); return; }
      if (dirty && act === 'pdf') save();
      try {
        if (act === 'pdf') await PDF.build(D);
        else {
          const { blob, name } = await PDF.build(D, { output: 'blob' });
          if (act === 'share') { const f = new File([blob], name, { type: 'application/pdf' }); if (navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: name }); else UI.toast('Este equipo no permite compartir archivos'); }
          else { const url = URL.createObjectURL(blob); if (window.innerWidth < 860) { window.open(url, '_blank'); } else UI.modal({ title: 'Vista previa', wide: true, foot: false, body: `<iframe class="pdfview" src="${url}" title="Vista previa del PDF"></iframe>`, onClose: () => URL.revokeObjectURL(url) }); }
        }
      } catch (err) { if (err && err.name !== 'AbortError') { console.error(err); UI.toast('No se pudo generar el PDF: ' + err.message, 3500); } }
    }
    else if (act === 'toNota') convert('nota');
    else if (act === 'toVenta') convert('venta');
    else if (act === 'toNotaV') { D.tipo = 'nota'; D.numero = nextNumero('nota', D.fecha); D.titulo = cfg.titulos.nota; D.condiciones = (cfg.condiciones.nota || []).slice(); D.firmas = true; setDirty(); save(); App.render(); }
    else if (act === 'dup') {
      const nd = newDoc(D.tipo, { clienteId: D.clienteId, cliente: clone(D.cliente || {}), proveedor: clone(D.proveedor || {}), proveedorId: D.proveedorId, inventario: D.inventario, items: clone(D.items).map(it => Object.assign(it, { id: uid('i'), pedido: it.origen === 'dist' ? 'por pedir' : undefined })), descPct: D.descPct, ivaPct: D.ivaPct, condiciones: clone(D.condiciones || []), firmas: D.firmas, titulo: D.titulo });
      if (dirty && !(await UI.confirm('Hay cambios sin guardar. ¿Duplicar de todas formas (sin guardarlos)?'))) return;
      dirty = false; App.guard = null; App.pendingDoc = nd; location.hash = '#/nuevo/' + D.tipo; UI.toast('Copia lista: revisa y guarda');
    }
    else if (act === 'anular') { D.estado = D.estado === 'anulada' ? 'activa' : 'anulada'; save(); App.render(); }
    else if (act === 'del') {
      if (!(await UI.confirm(`¿Eliminar ${TIPOS[D.tipo].toLowerCase()} ${D.numero}? ${venta || compra ? 'Su efecto en el inventario se revierte. Si solo quieres dejar constancia, mejor anúlala.' : ''}`, { ok: 'Eliminar', danger: true }))) return;
      Store.del('docs', D.id); dirty = false; App.guard = null; location.hash = backHref; UI.toast('Eliminado');
    }
  });
  v.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });

  paintCliente(); paintLines(); paintPagos(); paintRates(); paintTotals();
  if (!Object.keys(Rates.data).length) Rates.fetch();
}

/* elegir cliente de la lista */
function pickCliente(onPick) {
  const m = UI.modal({ title: 'Mis clientes', foot: false, body: `<input class="inp" type="search" placeholder="Buscar por nombre, RIF o teléfono"><div class="stack" style="gap:0;margin-top:10px;max-height:60vh;overflow:auto" data-l></div>` });
  const inp = $('input', m.body), l = $('[data-l]', m.body);
  const paint = () => {
    const q = normTxt(inp.value);
    const rows = Store.all('clientes').filter(c => !q || normTxt(c.nombre + ' ' + c.rif + ' ' + c.telefono + ' ' + c.correo).includes(q)).sort((a, b) => a.nombre.localeCompare(b.nombre)).slice(0, 100);
    l.innerHTML = rows.length ? rows.map(c => `<button class="res" type="button" data-id="${esc(c.id)}"><div class="t"><b>${esc(c.nombre)}</b><div class="muted small">${esc([c.rif, c.telefono, c.direccion].filter(Boolean).join(' · '))}</div></div></button>`).join('') : '<div class="empty">Sin clientes con esa búsqueda.</div>';
    $$('[data-id]', l).forEach(b => b.onclick = () => { m.close(); onPick(Store.get('clientes', b.dataset.id)); });
  };
  inp.addEventListener('input', paint); paint();
}

   Resumen, clientes, inventario, distribuidor
   ===================================================================== */
const ventasActivas = () => Store.all('docs').filter(d => esVenta(d) && d.estado !== 'anulada');
const pedidosPendientes = () => {
  const out = [];
  ventasActivas().forEach(d => (d.items || []).forEach(it => { if (it.origen === 'dist' && (it.pedido || 'por pedir') !== 'entregado') out.push({ d, it }); }));
  return out.sort((a, b) => (a.d.fecha || '').localeCompare(b.d.fecha || ''));
};
const COLOR_O = { manuel: '#15803D', dist: '#1D4ED8', papa: '#C2410C', libre: '#64748B' };

/* ---------------- Resumen ---------------- */
Views.resumen = (v) => {
  const F = Object.assign({ per: 'mes' }, lsGet('suinadm_f_res', {}));
  const docs = ventasActivas();
  const enPer = docs.filter(d => enPeriodo(d.fecha, F.per));
  let ventas = 0, gan = 0, sinCosto = 0; const porO = {};
  enPer.forEach(d => { const T = Calc.totals(d); ventas += T.base; Object.entries(T.porOrigen).forEach(([o, g]) => { const x = porO[o] || (porO[o] = { venta: 0, costo: 0, gan: 0, sc: false, n: 0 }); x.venta += g.venta; x.costo += g.costo; x.gan += g.gan; x.sc = x.sc || g.sinCosto; }); if (T.sinCosto) sinCosto++; });
  Object.values(porO).forEach(x => gan += x.gan);
  const cobrar = docs.map(d => ({ d, T: Calc.totals(d) })).filter(x => x.T.saldo > 0.005).sort((a, b) => (a.d.fecha || '').localeCompare(b.d.fecha || ''));
  const totCobrar = cobrar.reduce((a, x) => a + x.T.saldo, 0);
  const ped = pedidosPendientes(); const porPedir = ped.filter(x => (x.it.pedido || 'por pedir') === 'por pedir');
  const valInv = { manuel: 0, papa: 0 }, nInv = { manuel: 0, papa: 0 };
  Store.all('productos').forEach(p => { const s = Calc.st(p.id); ['manuel', 'papa'].forEach(i => { if (s[i].cant > 0) { valInv[i] += s[i].cant * s[i].costo; nInv[i]++; } }); });
  const abiertas = Store.all('docs').filter(d => d.tipo === 'oferta' && (d.estado || 'abierta') === 'abierta').sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const perLabel = (periodoOpts().find(p => p[0] === F.per) || [, ''])[1].toLowerCase();

  v.innerHTML = `
  <div class="vh"><h1>Resumen</h1><div class="act"><select class="inp" style="width:auto" data-per>${periodoOpts().map(([k, l]) => `<option value="${k}" ${F.per === k ? 'selected' : ''}>${l}</option>`).join('')}</select><button class="btn pri" data-new>${ico('plus')} Nuevo</button></div></div>
  ${!Sync.online() ? `<div class="banner">${Sync.configured() ? 'No has iniciado sesión: los cambios se guardan solo en este equipo.' : 'Los datos se guardan solo en este equipo. Conecta Supabase para verlos en el teléfono y compartirlos con tu papá.'} <a class="btn sm" href="#/ajustes/conexion">Conectar</a></div>` : ''}
  ${!Store.all('productos').length && !Store.all('docs').length ? `<div class="banner">Aún no hay datos. Importa tu inventario y ventas de Mi Negocio desde Ajustes → Datos. <a class="btn sm" href="#/ajustes/datos">Importar</a></div>` : ''}
  <div class="kpis">
    <div class="kpi"><div class="l">Ventas · ${esc(perLabel)}</div><div class="v">${fmtUSD0(ventas)}</div><div class="d">${enPer.length} venta${enPer.length === 1 ? '' : 's'}</div></div>
    <div class="kpi"><div class="l">Ganancia · ${esc(perLabel)}</div><div class="v">${fmtUSD0(gan)}</div><div class="d">${ventas ? fmtNum(gan / ventas * 100, 1) + '% de margen' : '—'}${sinCosto ? ` · ${sinCosto} sin costo` : ''}</div></div>
    <a class="kpi" href="#/ventas" data-cobrar><div class="l">Por cobrar</div><div class="v">${fmtUSD0(totCobrar)}</div><div class="d">${cobrar.length} documento${cobrar.length === 1 ? '' : 's'}</div></a>
    <a class="kpi" href="#/distribuidor"><div class="l">Pedidos al distribuidor</div><div class="v">${porPedir.length}</div><div class="d">por pedir · ${ped.length - porPedir.length} pedidos sin entregar</div></a>
    <a class="kpi" href="#/inventario/manuel"><div class="l">Inventario ${esc(origenNombre('manuel'))}</div><div class="v">${fmtUSD0(valInv.manuel)}</div><div class="d">${nInv.manuel} productos con existencia, al costo</div></a>
    <a class="kpi" href="#/inventario/papa"><div class="l">Inventario ${esc(origenNombre('papa'))}</div><div class="v">${fmtUSD0(valInv.papa)}</div><div class="d">${nInv.papa} productos con existencia, al costo</div></a>
  </div>
  <div class="cols2">
    <section class="panel"><div class="ph"><h2>Ventas por mes</h2><div class="act"><span class="muted small">últimos 12 meses, sin I.V.A.</span></div></div><div id="chart"></div></section>
    <section class="panel"><h2>Por origen · ${esc(perLabel)}</h2>
      ${Object.keys(porO).length ? `<table class="tbl"><thead><tr><th>Origen</th><th class="r">Ventas</th><th class="r">Ganancia</th><th class="r hm">Margen</th></tr></thead><tbody>
      ${['manuel', 'papa', 'dist', 'libre'].filter(o => porO[o]).map(o => { const x = porO[o]; return `<tr><td>${ownTag(o)}</td><td class="num">${fmtUSD(x.venta)}</td><td class="num">${fmtUSD(x.gan)}${x.sc ? ' <span class="muted" title="Hay líneas sin costo">*</span>' : ''}</td><td class="num hm">${x.venta ? fmtNum(x.gan / x.venta * 100, 1) + '%' : '—'}</td></tr>`; }).join('')}
      </tbody></table>${Object.values(porO).some(x => x.sc) ? '<p class="muted small" style="margin:8px 0 0">* Hay líneas sin costo: su ganancia cuenta como el precio completo. Pon tu descuento de distribuidor en Ajustes.</p>' : ''}` : '<div class="empty">Sin ventas en este período.</div>'}
    </section>
  </div>
  <div class="cols2" style="margin-top:14px">
    <section class="panel"><div class="ph"><h2>Por cobrar</h2></div>
      ${cobrar.length ? `<div class="tbl-wrap"><table class="tbl"><tbody>${cobrar.slice(0, 12).map(({ d, T }) => `<tr class="click" data-doc="${esc(d.id)}"><td class="mono small">${esc(fmtFecha(d.fecha))}</td><td>${esc(docParty(d))}<div class="muted small mono">${esc(d.numero)}</div></td><td class="num">${fmtUSD(T.saldo)}</td></tr>`).join('')}</tbody></table></div>${cobrar.length > 12 ? `<p class="small"><a href="#/ventas">Ver los ${cobrar.length}</a></p>` : ''}` : '<div class="empty">Nada pendiente por cobrar.</div>'}
    </section>
    <section class="panel"><div class="ph"><h2>Ofertas abiertas</h2><div class="act"><a class="btn sm" href="#/nuevo/oferta">${ico('plus')} Oferta</a></div></div>
      ${abiertas.length ? `<div class="tbl-wrap"><table class="tbl"><tbody>${abiertas.slice(0, 10).map(d => `<tr class="click" data-doc="${esc(d.id)}"><td class="mono small">${esc(fmtFecha(d.fecha))}</td><td>${esc(docParty(d))}<div class="muted small mono">${esc(d.numero)}</div></td><td class="num">${fmtUSD(Calc.totals(d).total)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No hay ofertas abiertas.</div>'}
    </section>
  </div>`;
  $('[data-per]', v).onchange = (e) => { F.per = e.target.value; lsSet('suinadm_f_res', F); App.render(); };
  $('[data-new]', v).onclick = () => App.newMenu();
  $('[data-cobrar]', v).addEventListener('click', () => lsSet('suinadm_f_notaventa', Object.assign(lsGet('suinadm_f_notaventa', {}), { est: 'cobrar', per: 'todo' })));
  $$('[data-doc]', v).forEach(tr => tr.onclick = () => location.hash = '#/doc/' + tr.dataset.doc);
  monthlyChart($('#chart', v), docs);
};

/* barras apiladas por mes, por origen (con leyenda, separadores y detalle al pasar) */
function monthlyChart(host, docs) {
  const now = new Date(); const months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); }
  const data = months.map(m => ({ m, o: { manuel: 0, dist: 0, papa: 0, libre: 0 }, gan: 0 }));
  docs.forEach(d => { const k = (d.fecha || '').slice(0, 7); const row = data.find(x => x.m === k); if (!row) return; const T = Calc.totals(d); Object.entries(T.porOrigen).forEach(([o, g]) => { row.o[o] = (row.o[o] || 0) + g.venta; }); row.gan += T.gan; });
  const order = ['manuel', 'dist', 'papa', 'libre'].filter(o => data.some(r => r.o[o] > 0));
  const max = Math.max(1, ...data.map(r => order.reduce((a, o) => a + r.o[o], 0)));
  const step = (() => { const raw = max / 4; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; })();
  const top = step * Math.ceil(max / step);
  const W = 640, H = 240, L = 54, R = 8, T = 10, B = 26, cw = (W - L - R) / data.length, bw = Math.min(28, cw * 0.62);
  const y = (val) => T + (H - T - B) * (1 - val / top);
  const mes = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  let g = '';
  for (let t = 0; t <= top + 1e-9; t += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#E7ECF1"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#5B6778" font-family="IBM Plex Mono">${t >= 1000 ? '$' + (t / 1000) + 'k' : '$' + t}</text>`;
  data.forEach((r, i) => {
    const x = L + i * cw + (cw - bw) / 2; let acc = 0;
    const segs = order.filter(o => r.o[o] > 0);
    segs.forEach((o, j) => {
      const v0 = acc, v1 = acc + r.o[o]; acc = v1;
      const y0 = y(v0), y1 = y(v1); const h = Math.max(0, y0 - y1 - (j > 0 ? 2 : 0));
      const isTop = j === segs.length - 1, rr = isTop ? Math.min(4, h / 2) : 0;
      const yy = y1, bot = yy + h;
      g += isTop && rr > 0 ? `<path d="M${x},${bot} V${yy + rr} Q${x},${yy} ${x + rr},${yy} H${x + bw - rr} Q${x + bw},${yy} ${x + bw},${yy + rr} V${bot} Z" fill="${COLOR_O[o]}"/>` : `<rect x="${x}" y="${yy}" width="${bw}" height="${h}" fill="${COLOR_O[o]}"/>`;
    });
    const [yy, mm] = r.m.split('-');
    g += `<text x="${L + i * cw + cw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#5B6778">${mes[+mm - 1]}${mm === '01' || i === 0 ? ' ' + yy.slice(2) : ''}</text>`;
    g += `<rect x="${L + i * cw}" y="${T}" width="${cw}" height="${H - T - B}" fill="transparent" data-i="${i}"/>`;
  });
  host.innerHTML = `<div class="legend">${order.map(o => `<span><i style="background:${COLOR_O[o]}"></i>${esc(origenNombre(o))}</span>`).join('')}</div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por mes y origen">${g}</svg><div class="tip hide"></div></div>
    <details style="margin-top:8px"><summary class="small muted" style="cursor:pointer">Ver como tabla</summary><table class="tbl" style="margin-top:6px"><thead><tr><th>Mes</th>${order.map(o => `<th class="r">${esc(origenNombre(o))}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>${data.slice().reverse().map(r => `<tr><td>${r.m}</td>${order.map(o => `<td class="num">${fmtUSD0(r.o[o])}</td>`).join('')}<td class="num">${fmtUSD0(order.reduce((a, o) => a + r.o[o], 0))}</td></tr>`).join('')}</tbody></table></details>`;
  const svg = $('svg', host), tip = $('.tip', host);
  svg.addEventListener('mousemove', (e) => {
    const t = e.target.closest('[data-i]'); if (!t) { tip.classList.add('hide'); return; }
    const r = data[+t.dataset.i]; const [yy, mm] = r.m.split('-'); const tot = order.reduce((a, o) => a + r.o[o], 0);
    tip.innerHTML = `<b>${mes[+mm - 1]} ${yy}</b><br>${order.map(o => `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${COLOR_O[o]};margin-right:6px"></span>${esc(origenNombre(o))}: <span class="num">${fmtUSD0(r.o[o])}</span>`).join('<br>')}<br>Total: <span class="num">${fmtUSD0(tot)}</span> · ganancia <span class="num">${fmtUSD0(r.gan)}</span>`;
    const box = host.querySelector('.chart').getBoundingClientRect(); const sb = t.getBoundingClientRect();
    tip.style.left = Math.min(Math.max(sb.left - box.left + sb.width / 2, 80), box.width - 80) + 'px'; tip.style.top = '20px'; tip.classList.remove('hide');
  });
  svg.addEventListener('mouseleave', () => tip.classList.add('hide'));
}

const statsCliente = (cid) => {
  const ds = Store.all('docs').filter(d => d.clienteId === cid);
  const vs = ds.filter(d => esVenta(d) && d.estado !== 'anulada');
  let total = 0, saldo = 0, ultima = '';
  vs.forEach(d => { const T = Calc.totals(d); total += T.total; saldo += Math.max(0, T.saldo); if ((d.fecha || '') > ultima) ultima = d.fecha; });
  return { docs: ds, ventas: vs, total, saldo, ultima, ofertas: ds.filter(d => d.tipo === 'oferta').length };
};

/* ---------------- Oferta rápida (tu app de siempre, dentro del panel) ----------------
   Su registro vive en localStorage 'suin_registro_v1' (clase "rapida"). Aquí se copia a la
   colección 'rapidas' para que viaje a Supabase y aparezca en tus otros equipos. */
const K_REG_RAPIDA = 'suin_registro_v1';
const Rapidas = {
  readLocal() { try { return JSON.parse(localStorage.getItem(K_REG_RAPIDA)) || []; } catch (e) { return []; } },
  toCloud() {
    const loc = this.readLocal().filter(x => x && x.id && x.clase === 'rapida');
    let n = 0;
    loc.forEach(r => { const cur = Store.get('rapidas', r.id); if (!cur || (r.mod || 0) > (cur.modLocal || 0)) { Store.put('rapidas', Object.assign({}, r, { modLocal: r.mod || 0 }), { quiet: true }); n++; } });
    if (n) Bus.emit('data', 'rapidas');
  },
  toLocal() {
    const loc = this.readLocal(); const map = new Map(loc.map(x => [x.id, x])); let ch = false;
    Store.all('rapidas').forEach(r => { const l = map.get(r.id); if (!l || (r.modLocal || 0) > (l.mod || 0)) { const c = Object.assign({}, r); delete c.modLocal; c.mod = r.modLocal || r.mod; map.set(r.id, c); ch = true; } });
    if (ch) { try { localStorage.setItem(K_REG_RAPIDA, JSON.stringify(Array.from(map.values()))); } catch (e) { /* sin espacio */ } }
  }
};
window.addEventListener('message', (e) => { if (e.data && e.data.suin === 'reg-changed') Rapidas.toCloud(); });
Views.rapida = (v) => {
  Rapidas.toLocal();
  v.style.maxWidth = 'none'; v.style.padding = window.innerWidth < 860 ? '0' : '14px 16px 0';
  v.innerHTML = `<iframe class="rapida-frame" title="Oferta rápida" allow="clipboard-read; clipboard-write"></iframe>`;
  const b64 = document.getElementById('rapida-b64').textContent.trim();
  const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  $('iframe', v).srcdoc = new TextDecoder('utf-8').decode(u);
};

    let n = { productos: 0, clientes: 0, proveedores: 0, docs: 0 };
    ['productos', 'clientes', 'proveedores', 'docs'].forEach(col => (json[col] || []).forEach(r => { if (!Store.get(col, r.id)) { Store.put(col, r, { quiet: true }); n[col]++; } }));

      (x.extras || []).forEach(e => { const l = normTxt(e.l); if (l.startsWith('tel')) rec.telefono = e.v; else if (l.startsWith('corr')) rec.correo = e.v; else if (l.startsWith('aten') || l.startsWith('cont')) rec.contacto = e.v; else rec.extras.push(e); });
      Store.put('clientes', rec, { quiet: true }); nc++;
    });

    (json.registro || []).filter(x => x && !x.deleted).forEach(r => {
      if (r.clase === 'rapida') { if (!Store.get('rapidas', r.id)) { Store.put('rapidas', Object.assign({}, r, { modLocal: r.mod || 0 }), { quiet: true }); nr++; } return; }
      const id = 'd_cot_' + r.id; if (Store.get('docs', id)) return;

      const nt = document.createElement('div'); nt.innerHTML = s.notesHtml || '';
      const cond = $$('p', nt).map(p => toRich(p.innerHTML)).filter(Boolean);
      const f = String(r.fecha || s.fecha || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      const fecha = f ? `${f[3]}-${pad(f[2])}-${pad(f[1])} 12:00` : localStamp(new Date(r.creado || Date.now()));
      const cli = r.cliente || s.cliente || {};
      const tipo = (r.tipo || s.tipo) === 'nota' ? 'nota' : 'oferta';
      const d = { id, tipo, numero: r.control || s.control || nextNumero(tipo, fecha), fecha, estado: tipo === 'oferta' ? 'abierta' : 'activa', cliente: { nombre: cli.nombre || '', rif: cli.rif || '', direccion: cli.direccion || '', extras: cli.extras || [] }, items, descPct: num(s.disc), ivaPct: num(s.iva) * (num(s.iva) < 1 ? 100 : 1), tasa: num(s.rate) || null, pagos: [], condiciones: cond, firmas: s.sign !== 'hide', archivo: s.fileCustom === 'true' ? s.file : '', notas: '', afectaStock: false, importado: 'Cotizador' };
      if (d.cliente.nombre && d.cliente.nombre !== 'NOMBRE DEL CLIENTE') { const c = findCliente(d.cliente); if (c) d.clienteId = c.id; }
      Store.put('docs', d, { quiet: true }); nd++;
    });
    COLS.forEach(cc => Bus.emit('data', cc));
    return { clientes: nc, docs: nd, rapidas: nr };
  },
  respaldo() {
    const out = { app: 'suinelectric-admin', version: 1, exportado: nowISO() };
    COLS.forEach(c => out[c] = Store.all(c));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: 'application/json' })); a.download = `respaldo_admin_suinelectric_${ymd()}.json`; a.click();
  },
  async restaurar(json) {
    if (!json || json.app !== 'suinelectric-admin') throw new Error('Este archivo no es un respaldo de esta app.');
    let n = 0;
    COLS.forEach(c => (json[c] || []).forEach(r => { const cur = Store.get(c, r.id); if (!cur || (r.mod || '') > (cur.mod || '')) { Store.put(c, r, { quiet: true }); n++; } }));
    COLS.forEach(cc => Bus.emit('data', cc));
    return n;
  }
};

const SQL_SETUP = `-- Suinelectric Administración: tabla única para todos los registros
create table if not exists public.adm_registros (
  coleccion text not null,
  id text not null,
  data jsonb not null,
  borrado boolean not null default false,
  actualizado timestamptz not null default now(),
  actualizado_por uuid default auth.uid(),
  primary key (coleccion, id)
);
create index if not exists adm_registros_actualizado on public.adm_registros (actualizado);

-- Quién puede usar el panel (tú y tu papá)
create table if not exists public.adm_usuarios (email text primary key);

-- Entra quien sea administrador de la tienda (clientes.es_admin) o esté en adm_usuarios
create or replace function public.adm_es_admin() returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce(public.es_admin(), false)
      or exists (select 1 from public.adm_usuarios u where lower(u.email) = lower(auth.jwt() ->> 'email'));
$$;

create or replace function public.adm_tocar() returns trigger language plpgsql as $$
begin new.actualizado := now(); new.actualizado_por := auth.uid(); return new; end $$;
drop trigger if exists adm_registros_tocar on public.adm_registros;
create trigger adm_registros_tocar before insert or update on public.adm_registros
  for each row execute function public.adm_tocar();

alter table public.adm_registros enable row level security;
alter table public.adm_usuarios enable row level security;
drop policy if exists adm_todo on public.adm_registros;
create policy adm_todo on public.adm_registros for all to authenticated
  using (public.adm_es_admin()) with check (public.adm_es_admin());
drop policy if exists adm_yo on public.adm_usuarios;
create policy adm_yo on public.adm_usuarios for select to authenticated
  using (lower(email) = lower(auth.jwt() ->> 'email'));

-- Cambios en vivo entre equipos
do $$ begin
  alter publication supabase_realtime add table public.adm_registros;
exception when duplicate_object then null; end $$;

-- Pon aquí los correos con los que van a entrar:
insert into public.adm_usuarios (email) values
  ('manolo1496@gmail.com')
  -- , ('correo-de-tu-papa@gmail.com')
on conflict do nothing;`;

Views.ajustes = (v, tab = 'empresa') => {
  const raw = clone(DB.config.get('main') || { id: 'main' });
  const C = CFG();
  const TABS = [['empresa', 'Empresa'], ['documentos', 'Documentos'], ['precios', 'Precios'], ['listas', 'Listas'], ['conexion', 'Conexión'], ['datos', 'Datos']];
  v.innerHTML = `<div class="vh"><h1>Ajustes</h1></div><div class="tabs">${TABS.map(([k, l]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div><div id="ab"></div>`;
  $$('[data-t]', v).forEach(b => b.onclick = () => { location.hash = '#/ajustes/' + b.dataset.t; });
  const box = $('#ab', v);
  const saveCfg = (mut) => { const r = clone(DB.config.get('main') || { id: 'main' }); mut(r); Store.put('config', r); UI.toast('Ajustes guardados'); };
  const field = (label, path, val, opts = {}) => `<label class="fld" ${opts.full ? 'style="grid-column:1/-1"' : ''}><span>${esc(label)}</span>${opts.area ? `<textarea class="inp" data-p="${path}" rows="${opts.rows || 4}">${esc(val)}</textarea>` : `<input class="inp ${opts.num ? 'num' : ''}" data-p="${path}" value="${esc(val == null ? '' : val)}" ${opts.ph ? `placeholder="${esc(opts.ph)}"` : ''} ${opts.num ? 'inputmode="decimal"' : ''}>`}${opts.help ? `<small class="muted">${opts.help}</small>` : ''}</label>`;
  const bindSave = (conv = {}) => {
    $('[data-save]', box).onclick = () => saveCfg(r => {
      $$('[data-p]', box).forEach(i => {
        const path = i.dataset.p.split('.'); let o = r; path.slice(0, -1).forEach(k => { o[k] = o[k] && typeof o[k] === 'object' ? o[k] : clone(C[k] || {}); o = o[k]; });
        const k = path[path.length - 1]; const f = conv[i.dataset.p];
        o[k] = f ? f(i.value) : i.value;
      });
    });
  };
  if (tab === 'empresa') {
    const e = C.empresa;
    box.innerHTML = `<section class="panel"><div class="grid g2">
      ${field('Nombre', 'empresa.nombre', e.nombre)}${field('RIF', 'empresa.rif', e.rif)}
      ${field('Descripción bajo el nombre', 'empresa.lema', e.lema, { full: true, area: true, rows: 2 })}
      ${field('Línea de contacto (pie del PDF)', 'empresa.contacto', e.contacto, { full: true })}
      ${field('Firma izquierda', 'empresa.firmaEmpresa', e.firmaEmpresa)}${field('Texto bajo la firma izquierda', 'empresa.firmaEmpresaSub', e.firmaEmpresaSub)}
      ${field('Firma derecha', 'empresa.firmaCliente', e.firmaCliente)}${field('Texto bajo la firma derecha', 'empresa.firmaClienteSub', e.firmaClienteSub)}
      </div>
      <div class="row" style="margin-top:14px"><img src="${esc(e.logo || DEFAULT_LOGO)}" alt="Logo" style="width:56px;height:56px;border-radius:50%;border:1px solid var(--line)"><button class="btn sm" data-logo>Cambiar logo</button>${e.logo ? '<button class="btn sm ghost" data-logo-r>Usar el logo original</button>' : ''}</div>
      <div class="row" style="margin-top:14px"><button class="btn pri" data-save>Guardar</button></div></section>`;
    bindSave();
    $('[data-logo]', box).onclick = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = () => { const f = i.files[0]; if (!f) return; const img = new Image(); img.onload = () => { const r = Math.min(1, 256 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); saveCfg(x => { x.empresa = Object.assign({}, x.empresa || {}, { logo: c.toDataURL('image/png') }); }); App.render(); }; img.src = URL.createObjectURL(f); }; i.click(); };
    const lr = $('[data-logo-r]', box); if (lr) lr.onclick = () => { saveCfg(x => { if (x.empresa) x.empresa.logo = ''; }); App.render(); };
  }
  if (tab === 'documentos') {
    box.innerHTML = `<section class="panel"><div class="grid g3">
      ${field('Título de las ofertas', 'titulos.oferta', C.titulos.oferta)}${field('Título de las notas', 'titulos.nota', C.titulos.nota)}<div></div>
      ${['oferta', 'nota', 'venta', 'compra', 'ajuste'].map(t => field('Prefijo ' + TIPOS[t].toLowerCase(), 'prefijos.' + t, C.prefijos[t], { help: `${esc(C.prefijos[t])}-${ymd()}-001` })).join('')}
      </div><div class="grid g2" style="margin-top:12px">
      ${field('Condiciones de las ofertas (una por línea, *negrita*)', 'condiciones.oferta', (C.condiciones.oferta || []).join('\n'), { area: true, rows: 7 })}
      ${field('Condiciones de las notas de entrega', 'condiciones.nota', (C.condiciones.nota || []).join('\n'), { area: true, rows: 7 })}
      </div><div class="row" style="margin-top:14px"><button class="btn pri" data-save>Guardar</button></div></section>`;
    const lines = (s) => s.split('\n').map(x => x.trimEnd()).filter(Boolean);
    bindSave({ 'condiciones.oferta': lines, 'condiciones.nota': lines });
  }
  if (tab === 'precios') {
    box.innerHTML = `<section class="panel"><div class="grid g3">
      ${field('I.V.A. %', 'ivaPct', C.ivaPct, { num: true })}
      ${field('Descuento web para vender (%)', 'descWeb', C.descWeb, { num: true, help: 'Sobre el precio de lista del scraper; se redondea hacia arriba. Igual que la tienda.' })}
      ${field('Tu descuento como distribuidor (%)', 'descCostoDist', C.descCostoDist == null ? '' : C.descCostoDist, { num: true, ph: 'Sin definir', help: 'Sobre el precio de lista; da tu costo para calcular la ganancia de lo que vendes del distribuidor. Siempre se puede corregir en cada venta.' })}
      ${field('Nombre del inventario 1', 'inventarios.manuel', C.inventarios.manuel)}${field('Nombre del inventario 2', 'inventarios.papa', C.inventarios.papa)}
      </div><div class="row" style="margin-top:14px"><button class="btn pri" data-save>Guardar</button></div></section>`;
    bindSave({ ivaPct: num, descWeb: num, descCostoDist: (x) => String(x).trim() === '' ? null : num(x) });
  }
  if (tab === 'listas') {
    box.innerHTML = `<section class="panel"><div class="grid g2">
      ${field('Formas de pago (una por línea)', 'formasPago', (C.formasPago || []).join('\n'), { area: true, rows: 8 })}
      ${field('Vendedores (una por línea)', 'vendedores', (C.vendedores || []).join('\n'), { area: true, rows: 8 })}
      ${field('Link del catálogo (scraper)', 'catalogo.main', C.catalogo.main, { full: true })}
      ${field('Link de productos manuales', 'catalogo.manual', C.catalogo.manual, { full: true })}
      </div><div class="row" style="margin-top:14px"><button class="btn pri" data-save>Guardar</button><button class="btn" data-cat>Actualizar catálogo ahora</button></div></section>`;
    const lines = (s) => s.split('\n').map(x => x.trim()).filter(Boolean);
    bindSave({ formasPago: lines, vendedores: lines });
    $('[data-cat]', box).onclick = () => { Catalog.refresh().then(() => UI.toast(Catalog.error || `Catálogo: ${Catalog.items.length} productos`)); };
  }
  if (tab === 'conexion') {
    const sc = Sync.conf();
    box.innerHTML = `<section class="panel stack">
      <div class="row"><span class="sync ${Sync.state}" style="color:var(--ink);padding:0;border:none"><i></i><span>${esc(Sync.msg)}</span></span>${Sync.user ? `<span class="muted small">Sesión: ${esc(Sync.user.email)}</span>` : ''}</div>
      <p style="margin:0">Con Supabase los datos quedan en la nube: los ves en la PC y en el teléfono, y tu papá puede entrar con su propio correo. Sin conexión, todo se guarda en este navegador y se sube cuando vuelve internet.</p>
      <div class="grid g2">
        <label class="fld"><span>URL del proyecto</span><input class="inp" data-sb="url" value="${esc(sc.url)}" placeholder="https://xxxx.supabase.co" ${SUPABASE_URL_FIJA ? 'disabled' : ''}></label>
        <label class="fld"><span>Clave pública (anon key)</span><input class="inp" data-sb="key" value="${esc(sc.key)}" placeholder="eyJhbGciOi…" ${SUPABASE_KEY_FIJA ? 'disabled' : ''}></label>
      </div>
      <div class="row"><button class="btn pri" data-sb-save>Guardar y conectar</button>${Sync.user ? '<button class="btn" data-sb-sync>Sincronizar ahora</button><button class="btn red" data-sb-out>Cerrar sesión</button>' : Sync.sb ? '<button class="btn" data-sb-in>Iniciar sesión</button>' : ''}</div>
      <details><summary style="cursor:pointer;font-weight:600">Cómo prepararlo (una sola vez)</summary>
        <ol class="small" style="line-height:1.7">
          <li>En tu proyecto de Supabase (el mismo de la tienda sirve), abre <b>SQL Editor</b>, pega el código de abajo, cambia los correos y dale <b>Run</b>.</li>
          <li>En <b>Authentication → Users</b> crea un usuario con tu correo y contraseña (y otro para tu papá, si va a entrar).</li>
          <li>En <b>Project Settings → API</b> copia la URL y la clave <b>anon public</b> y pégalas arriba.</li>
          <li>Entra con tu correo. Luego, en la pestaña Datos, importa tu inventario: se sube solo.</li>
        </ol>
        <div class="row" style="margin-bottom:6px"><button class="btn sm" data-sql-copy>Copiar código SQL</button></div>
        <textarea class="inp mono" rows="12" readonly style="font-size:12px">${esc(SQL_SETUP)}</textarea>
      </details></section>`;
    $('[data-sb-save]', box).onclick = async () => {
      const url = $('[data-sb="url"]', box).value.trim(), key = $('[data-sb="key"]', box).value.trim();
      lsSet('suinadm_sb', { url, key }); lsSet('suinadm_lastsync', null); Sync.lastSync = null;
      Sync.init(); if (!Sync.sb) { UI.toast('Revisa la URL y la clave'); return; }
      await Sync.session(); if (!Sync.user) showLogin(); else { Sync.listen(); Sync.run(); App.render(); }
    };
    const si = $('[data-sb-in]', box); if (si) si.onclick = () => showLogin();
    const ss = $('[data-sb-sync]', box); if (ss) ss.onclick = () => Sync.run();
    const so = $('[data-sb-out]', box); if (so) so.onclick = async () => { await Sync.logout(); App.render(); };
    $('[data-sql-copy]', box).onclick = () => navigator.clipboard.writeText(SQL_SETUP).then(() => UI.toast('Código copiado'));
  }
  if (tab === 'datos') {
    const n = (c) => DB[c].size;
    box.innerHTML = `<section class="panel stack">
      <p style="margin:0">En este equipo: <b>${n('productos')}</b> productos, <b>${n('clientes')}</b> clientes, <b>${n('proveedores')}</b> proveedores, <b>${n('docs')}</b> documentos, <b>${n('rapidas')}</b> ofertas rápidas. ${Pend.size ? `<span class="pill warn">${Pend.size} cambios por subir</span>` : ''}</p>
      <div class="panel" style="background:var(--panel-2)"><h2>Inventario y ventas de Mi Negocio</h2><p class="small" style="margin-top:0">Abre <b>datos_iniciales.json</b> (viene con esta app). Carga el inventario de tu papá (Inventario, eBay y DORAL 2023) y el tuyo (INV. MANU), con sus ventas, compras, clientes y proveedores. Se puede repetir sin duplicar.</p><button class="btn pri" data-imp="ini">Importar datos iniciales</button></div>
      <div class="panel" style="background:var(--panel-2)"><h2>Respaldo del cotizador</h2><p class="small" style="margin-top:0">En tu cotizador actual: Registro → Exportar respaldo. Trae tus clientes, ofertas, notas y ofertas rápidas guardadas.</p><button class="btn" data-imp="cot">Importar respaldo del cotizador</button></div>
      <div class="panel" style="background:var(--panel-2)"><h2>Respaldo completo de esta app</h2><div class="row"><button class="btn" data-exp>Descargar respaldo</button><button class="btn" data-imp="res">Restaurar respaldo</button></div></div>
      <div class="panel" style="background:var(--panel-2)"><h2>Este equipo</h2><p class="small" style="margin-top:0">Borra la copia local (no toca la nube). Útil si un equipo quedó desordenado: al volver a entrar baja todo de nuevo.</p><button class="btn red" data-wipe>Borrar datos de este equipo</button></div>
    </section>`;
    const run = async (fn, okMsg) => { try { const json = await readJsonFile(); const r = await fn(json); UI.toast(okMsg(r), 4000); App.render(); } catch (e) { UI.modal({ title: 'No se pudo importar', body: `<p>${esc(e.message)}</p>`, foot: [['Entendido', 'pri', c => c()]] }); } };
    $('[data-imp="ini"]', box).onclick = () => run(Importer.iniciales, r => `Importados: ${r.productos} productos, ${r.clientes} clientes, ${r.proveedores} proveedores, ${r.docs} documentos`);
    $('[data-imp="cot"]', box).onclick = () => run(Importer.cotizador, r => `Importados: ${r.clientes} clientes, ${r.docs} ofertas/notas, ${r.rapidas} ofertas rápidas`);
    $('[data-imp="res"]', box).onclick = () => run(Importer.restaurar, r => `Restaurados ${r} registros`);
    $('[data-exp]', box).onclick = () => Importer.respaldo();
    $('[data-wipe]', box).onclick = async () => {
      if (Pend.size && !(await UI.confirm(`Hay ${Pend.size} cambios que aún no se subieron a la nube y se perderían. ¿Borrar igual?`, { ok: 'Borrar', danger: true }))) return;
      if (!(await UI.confirm('¿Borrar todos los datos de este equipo?', { ok: 'Borrar', danger: true }))) return;
      await IDB.del('data'); await IDB.del('pend'); lsSet('suinadm_lastsync', null); location.reload();
    };
  }
};

/* ---------------- inicio de sesión ---------------- */
function showLogin() {
  return new Promise((resolve) => {
    const wrap = document.createElement('div'); wrap.className = 'ov'; wrap.style.background = 'var(--plate)'; wrap.style.alignItems = 'center';
    let modo = 'clave', emailPend = '';
    const done = () => { wrap.remove(); Sync.listen(); Sync.run(); App.render(); resolve(true); };
    App.loginDone = () => { if (document.body.contains(wrap)) done(); };
    const paint = () => {
      const cuerpo = emailPend ? `<p class="small" style="margin:0 0 10px">Te enviamos un correo a <b>${esc(emailPend)}</b>. Escribe el código o toca el enlace del correo.</p>
          <form class="stack" style="gap:10px" data-f="cod"><label class="fld"><span>Código</span><input class="inp mono" inputmode="numeric" autocomplete="one-time-code" required></label>
          <div class="small" style="color:var(--red);min-height:1em" data-err></div><button class="btn pri" type="submit">Entrar</button>
          <button class="btn ghost small" type="button" data-back>Usar otro correo</button></form>`
        : modo === 'codigo' ? `<form class="stack" style="gap:10px" data-f="mail"><label class="fld"><span>Correo de administrador</span><input class="inp" type="email" autocomplete="email" required></label>
          <div class="small" style="color:var(--red);min-height:1em" data-err></div><button class="btn pri" type="submit">Enviarme un código</button>
          <button class="btn ghost small" type="button" data-modo="clave">Entrar con clave</button></form>`
        : `<form class="stack" style="gap:10px" data-f="clave"><label class="fld"><span>Correo</span><input class="inp" type="email" autocomplete="username" required></label>
          <label class="fld"><span>Clave</span><input class="inp" type="password" autocomplete="current-password" required></label>
          <div class="small" style="color:var(--red);min-height:1em" data-err></div><button class="btn pri" type="submit">Entrar</button>
          <p class="small muted" style="margin:4px 0 0;line-height:1.5">Es el mismo acceso del panel de la tienda. ¿No tienes clave o la olvidaste? <button class="btn sm" type="button" data-modo="codigo">Entrar con un código</button></p></form>`;
      wrap.innerHTML = `<div class="md" style="width:min(380px,100%);min-height:0;border-radius:8px"><div class="md-b" style="padding:26px">
        <img src="${DEFAULT_LOGO}" alt="" style="width:72px;display:block;margin:0 auto 10px"><h1 style="text-align:center;font-size:19px;margin:0 0 18px">Administración Suinelectric</h1>
        ${cuerpo}<button class="btn ghost small" type="button" data-skip style="width:100%;margin-top:6px">Seguir sin conexión en este equipo</button></div></div>`;
      const f = $('form', wrap), ins = $$('input', f), err = $('[data-err]', wrap);
      setTimeout(() => ins[0].focus(), 30);
      $$('[data-modo]', wrap).forEach(b => b.onclick = () => { modo = b.dataset.modo; paint(); });
      const back = $('[data-back]', wrap); if (back) back.onclick = () => { emailPend = ''; modo = 'codigo'; paint(); };
      $('[data-skip]', wrap).onclick = () => { wrap.remove(); Sync.set('local', 'Sin sesión: solo este equipo'); resolve(false); };
      f.onsubmit = async (e) => {
        e.preventDefault(); err.textContent = ''; const btn = $('button[type=submit]', f); btn.disabled = true;
        try {
          if (f.dataset.f === 'clave') { await Sync.login(ins[0].value.trim().toLowerCase(), ins[1].value); done(); }
          else if (f.dataset.f === 'mail') { emailPend = ins[0].value.trim().toLowerCase(); await Sync.sendCode(emailPend); paint(); }
          else { await Sync.verifyCode(emailPend, ins[0].value.trim()); done(); }
        } catch (er) {
          const m = String(er && er.message || er);
          if (f.dataset.f === 'mail') emailPend = '';
          err.textContent = /invalid login/i.test(m) ? 'Correo o clave incorrectos. Si nunca creaste una clave, entra con un código.'
            : /signups? not allowed|not found|user not/i.test(m) ? 'Ese correo no tiene cuenta. Usa el mismo correo con el que entras al panel de la tienda.'
            : /expired|invalid|token/i.test(m) && f.dataset.f === 'cod' ? 'Código no válido o vencido.'
            : /rate|seconds/i.test(m) ? 'Espera un minuto antes de pedir otro código.'
            : /fetch|network/i.test(m) ? 'Sin conexión con Supabase. Revisa el internet.' : m;
          btn.disabled = false;
        }
      };
    };
    paint(); document.body.appendChild(wrap);
  });
}

/* ---------------- arranque ---------------- */
(async function boot() {
  await Store.load();
  App.shell();
  Sync.init();
  if (Sync.sb) {
    await Sync.session();
    if (Sync.user) { Sync.listen(); Sync.run(); } else { Sync.set('local', 'Sin sesión'); }
  } else Sync.set('local', 'Solo en este equipo');
  App.go();
  Catalog.load();
  if (!Rates.data.bcv_usd) Rates.fetch();
  Rapidas.toCloud();
  if (Sync.sb && !Sync.user) showLogin();
  if (Sync.sb) Sync.sb.auth.onAuthStateChange((ev, ses) => { if (ev === 'SIGNED_IN' && ses && !Sync.online()) { Sync.user = ses.user; if (App.loginDone) App.loginDone(); } });
  Bus.on('data', (c) => { if (c === 'rapidas' && App.route.name !== 'rapida') Rapidas.toLocal(); });
})();
