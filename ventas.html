const ESTADOS_PEDIDO = { enviado: ['Nuevo', 'warn'], cotizado: ['Cotizado', 'info'], aprobado: ['Aprobado', 'info'], pagado: ['Pagado', 'ok'], entregado: ['Entregado', 'ok'], cancelado: ['Cancelado', 'bad'] };

/* =====================================================================
   PUENTE CON EL COTIZADOR (tu generador de ofertas y notas, tal cual)
   ---------------------------------------------------------------------
   El cotizador corre dentro del panel (mismo origen), así que comparte
   el almacenamiento del navegador:
     suin_registro_v1  → ofertas, notas y ofertas rápidas guardadas
     suin_clientes_v1  → "Mis clientes"
     suin_nube_v1      → link de tu nube de Google Drive
   Este puente copia el registro a la administración (y a Supabase) y
   devuelve al cotizador lo que se haga en la administración, para que
   los dos vean lo mismo en todos los equipos.
   ===================================================================== */
const Cot = (() => {
  const K_REG = 'suin_registro_v1', K_CLI = 'suin_clientes_v1', K_NUBE = 'suin_nube_v1';
  const ROW_CTRL = '<div class="rc"><button type="button" class="row-up" title="Subir">▲</button><button type="button" class="row-drag" title="Arrastrar para mover" draggable="true">⋮⋮</button><button type="button" class="row-down" title="Bajar">▼</button><button type="button" class="row-del" title="Quitar producto">✕</button></div>';
  const readArr = (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } };
  const writeArr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { console.warn('sin espacio', e); return false; } };
  const modOf = (x) => x ? (x.mod || x.guardado || x.updated || 0) : 0;
  let frame = null, busy = false;

  /* ---------- HTML del cotizador → texto con *negrita* ---------- */
  const htmlToRich = (html) => {
    const el = document.createElement('div');
    el.innerHTML = String(html || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div)>/gi, '\n');
    el.querySelectorAll('[data-html2canvas-ignore]').forEach(n => n.remove());
    el.querySelectorAll('strong,b').forEach(b => { const t = b.textContent; b.replaceWith(t.trim() ? '*' + t.trim() + '*' + (/\s$/.test(t) ? ' ' : '') : t); });
    return el.textContent.replace(/ /g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  };
  const richToHtml = (txt) => esc(txt).replace(/\*([^*\n]*[^*\s\n][^*\n]*)\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  const modeloDe = (desc) => { const m = String(desc || '').match(/Ref\s*\/\s*Modelo:\s*\*?\s*([^*\n—]+)/i); return m ? m[1].trim() : ''; };

  /* filas de la tabla del cotizador (todas las versiones) */
  const parseItems = (s) => {
    if (Array.isArray(s.items) && s.items.length && typeof s.items[0] === 'object') {
      return s.items.map(x => ({ cant: num(x.cant ?? x.qty ?? x.cantidad ?? 1), desc: htmlToRich(x.desc ?? x.html ?? x.descripcion ?? ''), precio: num(x.precio ?? x.price ?? x.unit ?? 0) }));
    }
    const html = s.itemsHtml || s.tbody || '';
    if (!html) return [];
    const doc = new DOMParser().parseFromString(`<table><tbody>${html}</tbody></table>`, 'text/html');
    const out = [];
    doc.querySelectorAll('tbody > tr').forEach(tr => {
      const cells = Array.from(tr.children).filter(td => !td.classList.contains('row-ctrl') && !td.classList.contains('no-print') && !td.hasAttribute('data-html2canvas-ignore'));
      let q = tr.querySelector('.quantity'), d = tr.querySelector('.item-desc'), u = tr.querySelector('.unit-price');
      if (!d && q) d = q.nextElementSibling;
      if (!q || !u) {
        const c = cells.filter(td => !td.classList.contains('item-num'));
        if (c.length >= 4) { q = q || c[0]; d = d || c[1]; u = u || c[2]; }
        else if (c.length === 3) { q = q || c[0]; d = d || c[1]; u = u || c[2]; }
      }
      if (!d) return;
      const desc = htmlToRich(d.innerHTML);
      const cant = q ? num(q.textContent) : 1, precio = u ? num(u.textContent) : 0;
      if (!desc && !precio) return;
      out.push({ cant: cant || (q ? 0 : 1), desc, precio });
    });
    return out;
  };
  const parseCond = (s) => {
    if (!s.notesHtml) return null;
    const doc = new DOMParser().parseFromString(`<div>${s.notesHtml}</div>`, 'text/html');
    const ps = Array.from(doc.querySelectorAll('p')).map(p => htmlToRich(p.innerHTML)).filter(Boolean);
    return ps.length ? ps : null;
  };
  const fechaISO = (f, fallback) => { const m = String(f || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? `${m[3]}-${pad(m[2])}-${pad(m[1])} 12:00` : localStamp(new Date(fallback || Date.now())); };

  /* contenido comparable (para saber si algo cambió) */
  const sig = (d) => JSON.stringify([d.vendedor || '', d.tipo, d.numero, (d.fecha || '').slice(0, 10), d.cliente && [d.cliente.nombre, d.cliente.rif, d.cliente.direccion, (d.cliente.extras || []).map(x => x.l + ':' + x.v)], (d.items || []).map(i => [num(i.cant), round2(num(i.precio)), i.desc]), num(d.descPct), num(d.ivaPct), d.tasa ? round2(num(d.tasa)) : 0, (d.condiciones || []).filter(Boolean), !!d.firmas, d.archivo || '']);

  /* ---------- asignar origen a una línea que viene del cotizador ---------- */
  const autoOrigen = (it) => {

    if (p) { const s = Calc.st(p.id); const inv = s.manuel.cant > 0 ? 'manuel' : s.papa.cant > 0 ? 'papa' : null; if (inv) return { origen: inv, productoId: p.id, costo: round2(s[inv].costo) || '' }; }
    const c = cod ? catalogoByCodigo(cod) : null;
    if (c) { const dd = distDeCat(c); return Object.assign({ origen: 'dist', dist: dd ? dd.id : '', productoId: null, costo: '' }, costoLinea(c, dd)); }
    if (p) { const s = Calc.st(p.id); return { origen: (p.inv || {}).papa && !(p.inv || {}).manuel ? 'papa' : 'manuel', productoId: p.id, costo: round2(s.manuel.costo || s.papa.costo) || '' }; }
    return { origen: 'libre', productoId: null, costo: '' };
  };

  /* notas anteriores a la fecha de corte: ya están en el historial de Mi Negocio */
  const esHistorial = (r) => { const corte = CFG().corteCotizador; if (!corte) return false; const f = fechaISO((r.fecha || (r.estado || {}).fecha), r.creado).slice(0, 10); return f < corte; };

  /* ---------- registro del cotizador → documento de la administración ---------- */
  const docIdFor = (rid) => rid.startsWith('adm_') ? rid.slice(4) : 'd_cot_' + rid;
  const toDoc = (r, prev) => {
    const s = r.estado || {};
    const tipo = (r.tipo || s.tipo) === 'nota' ? 'nota' : 'oferta';
    const cli = r.cliente || s.cliente || {};
    let items = parseItems(s).map(x => Object.assign({ codigo: modeloDe(x.desc) }, x));
    if (!items.length && (r.total || '').replace(/[^\d]/g, '')) items = [{ codigo: '', desc: 'Detalle no disponible en el respaldo del cotizador', cant: 1, precio: num(r.total) }];
    const prevItems = (prev && prev.items) || [];
    items = items.map((x, i) => {
      // conservar lo que se definió en la administración (origen, costo, pedido) si es la misma línea
      const old = prevItems.find(o => o.codigo && o.codigo === x.codigo && !o._usado) || (prevItems[i] && (!prevItems[i].codigo || prevItems[i].codigo === x.codigo) ? prevItems[i] : null);
      if (old) { old._usado = true; return { id: old.id, productoId: old.productoId || null, codigo: x.codigo || old.codigo, desc: x.desc, cant: x.cant, precio: x.precio, costo: old.costo, origen: old.origen, dist: old.dist, pedido: old.pedido, listPrice: old.listPrice, dtoDist: old.dtoDist, recargo: old.recargo }; }
      const a = autoOrigen(x);
      return Object.assign({ id: uid('i'), codigo: x.codigo, desc: x.desc, cant: x.cant, precio: x.precio }, a, tipo === 'nota' && a.origen === 'dist' ? { pedido: 'por pedir' } : {}, { auto: true });
    });
    prevItems.forEach(o => delete o._usado);
    const ivaRaw = num(s.iva);
    const d = Object.assign({}, prev || {}, {
      id: docIdFor(r.id), tipo, numero: r.control || s.control || (prev && prev.numero) || nextNumero(tipo),
      fecha: prev && fmtFecha(prev.fecha) === String(r.fecha || s.fecha || '').trim() ? prev.fecha : fechaISO(r.fecha || s.fecha, r.creado),
      cliente: { nombre: cli.nombre && cli.nombre !== 'NOMBRE DEL CLIENTE' ? cli.nombre : '', rif: cli.rif && cli.rif !== 'J-00000000-0' ? cli.rif : '', direccion: cli.direccion && cli.direccion !== 'Ciudad, Estado, Venezuela.' ? cli.direccion : '', extras: cli.extras || [] },
      items, descPct: num(s.disc), ivaPct: ivaRaw > 0 && ivaRaw < 1 ? round2(ivaRaw * 100) : ivaRaw,
      tasa: num(s.rate) || null, condiciones: parseCond(s) || (prev && prev.condiciones) || (CFG().condiciones[tipo] || []).slice(),
      firmas: s.sign ? s.sign !== 'hide' : tipo === 'nota', archivo: s.fileCustom === 'true' ? (s.file || '') : '',
      estado: prev && prev.estado ? prev.estado : (tipo === 'oferta' ? 'abierta' : 'activa'),
      pagos: (prev && prev.pagos) || [], notas: (prev && prev.notas) || '',
      afectaStock: tipo === 'nota' && !esHistorial(r), historial: tipo === 'nota' && esHistorial(r), fuente: 'cotizador', cotId: r.id, cotMod: modOf(r), cotRaw: r,
      vendedor: r.vendedor || (prev && prev.vendedor) || '',
      creado: (prev && prev.creado) || new Date(r.creado || Date.now()).toISOString()
    });
    if (prev && prev.tipo === 'venta' && tipo === 'nota') d.tipo = 'nota';
    if (d.items.some(i => i.auto)) d.origenAuto = true;
    if (d.cliente.nombre) { const c = findCliente(d.cliente); if (c) d.clienteId = c.id; }
    d.cotSig = sig(d);
    return d;
  };

  /* ---------- documento de la administración → registro del cotizador ---------- */
  const toRecord = (d) => {
    const cfg = CFG();
    const rows = (d.items || []).map((it, i) => `<tr class="item-row"><td class="text-center no-print row-ctrl" data-html2canvas-ignore="true">${ROW_CTRL}</td><td class="text-center item-num" contenteditable="false">${i + 1}</td><td class="text-center quantity" contenteditable="true">${esc(fmtQty(num(it.cant)).replace(',', '.'))}</td><td class="item-desc" contenteditable="true">${richToHtml(it.desc)}</td><td class="text-right unit-price" contenteditable="true">${num(it.precio).toFixed(2)}</td><td class="text-right item-total">${(num(it.cant) * num(it.precio)).toFixed(2)}</td></tr>`).join('');
    const cond = (d.condiciones && d.condiciones.length ? d.condiciones : cfg.condiciones[d.tipo === 'oferta' ? 'oferta' : 'nota'] || []).filter(Boolean);
    const notesHtml = `<h4 contenteditable="true">Términos, Condiciones y Garantía</h4>` + cond.map(c => `<p contenteditable="true">${richToHtml(c)}</p>`).join('');
    const tipo = d.tipo === 'oferta' ? 'oferta' : 'nota';
    const cli = { nombre: (d.cliente && d.cliente.nombre) || '', rif: (d.cliente && d.cliente.rif) || '', direccion: (d.cliente && d.cliente.direccion) || '', extras: (d.cliente && d.cliente.extras || []).filter(x => x.v) };
    const T = Calc.totals(d);
    const estado = { tipo, iva: num(d.ivaPct) ? String(round2(num(d.ivaPct) / 100)) : '0', disc: num(d.descPct) ? String(num(d.descPct)) : '', sign: d.firmas === false ? 'hide' : 'show', file: d.archivo || PDF.defaultFileName(d), fileCustom: d.archivo ? 'true' : 'false', control: d.numero, fecha: fmtFecha(d.fecha), cliente: cli, rate: d.tasa ? num(d.tasa).toFixed(2) : '', itemsHtml: rows, notesHtml };
    const now = Date.now();

    return { id, tipo, vendedor: d.vendedor || '', control: d.numero, fecha: fmtFecha(d.fecha), cliente: cli, total: fmtUSD(T.total), items: (d.items || []).length, buscar: (cli.nombre + ' ' + cli.rif + ' ' + d.numero + ' ' + (d.items || []).map(i => i.desc.replace(/\*/g, '') + ' ' + i.cant + ' ' + i.precio).join(' ')).toLowerCase().slice(0, 4000), creado: prev.creado || Date.parse(d.creado || '') || now, guardado: now, mod: now, estado };
  };

  /* ---------- sincronizar en ambos sentidos ---------- */
  const fromCot = () => {
    const reg = readArr(K_REG); let n = 0;
    // clientes del cotizador
    readArr(K_CLI).forEach(c => {
      if (!c || !c.id || c.deleted || !c.nombre || c.nombre === 'NOMBRE DEL CLIENTE') return;
      const ex = Store.all('clientes').find(x => x.cotId === c.id) || findCliente(c);

        let el = card.querySelector(':scope > .mg-row');
        if (!html) { if (el) el.remove(); return; }
        if (!el) { el = dd.createElement('div'); el.className = 'mg-row'; const foot = card.querySelector('.m-item-foot'); if (foot) foot.insertAdjacentElement('afterend', el); else card.appendChild(el); }
        if (el.innerHTML !== html) el.innerHTML = html;
      });
    } catch (e) { console.warn('margen', e); }
  };
  let selIdx = -1;
  const setupMargen = (w) => {
    const dd = w.document; const run = debounce(() => paintMargen(dd), 200);
    const tb = dd.getElementById('items-tbody');
    if (tb) {
      new w.MutationObserver(run).observe(tb, { childList: true, subtree: true, characterData: true });
      tb.addEventListener('focusin', (e) => { const tr = e.target.closest && e.target.closest('tr.item-row'); if (!tr) return; selIdx = Array.from(tb.querySelectorAll(':scope > tr.item-row')).indexOf(tr); run(); });
    }
    const tbl = dd.getElementById('items-table'); if (tbl) tbl.addEventListener('input', run);
    const di = dd.getElementById('discount-input'); if (di) di.addEventListener('input', run);
    const ml = dd.getElementById('m-items-list'); if (ml) new w.MutationObserver(run).observe(ml, { childList: true });
    const span = dd.getElementById('doc-control-span'); if (span) new w.MutationObserver(run).observe(span, { childList: true, characterData: true, subtree: true });
    mgRun = run; run();
  };
  let mgRun = null;
  Bus.on('catalog', () => mgRun && mgRun()); Bus.on('data', (c) => { if (mgRun && (c === 'docs' || c === 'proveedores' || c === 'productos')) mgRun(); });
  const enhance = (w) => {
    const dd = w.document;
    if (!dd.getElementById('adm-gen-css')) { const st = dd.createElement('style'); st.id = 'adm-gen-css'; st.textContent = GEN_CSS; dd.head.appendChild(st); }
    if (!dd.getElementById('adm-leer-css')) { const st = dd.createElement('style'); st.id = 'adm-leer-css'; st.textContent = LEER_CSS; dd.head.appendChild(st); }
    const setTop = () => { const hd = dd.querySelector('.actions-container'); if (!hd) return; const top = parseFloat(w.getComputedStyle(hd).top) || 10; dd.documentElement.style.setProperty('--adm-top', Math.round(top + hd.offsetHeight + 14) + 'px'); };
    setTop(); w.addEventListener('resize', setTop); setTimeout(setTop, 800);
    const obs = new w.MutationObserver(() => decorate(dd));
    ['catalog-results', 'm-results'].forEach(id => { const el = dd.getElementById(id); if (el) obs.observe(el, { childList: true, subtree: true }); });
    decorate(dd);
  };

  /* ---------- vendedor dentro del generador ---------- */
  let selVend = '';
  const stamp = (arr, ctl) => {
    const prev = new Map(readArr(K_REG).map(r => [r.id, r.vendedor]));
    const now = Date.now();
    (Array.isArray(arr) ? arr : []).forEach(r => {
      if (!r || !r.id || r.deleted) return;
      const reciente = now - modOf(r) < 15000;
      if (r.clase === 'rapida') { if (!r.vendedor) r.vendedor = prev.get(r.id) || (reciente ? selVend : ''); return; }
      if (reciente && ctl && r.control === ctl) r.vendedor = selVend || prev.get(r.id) || '';
      else if (!r.vendedor && prev.get(r.id)) r.vendedor = prev.get(r.id);
    });
    return arr;
  };
  const patchStorage = (w, ctlFn) => {
    try {
      if (!w || w.__admPatch) return; const proto = w.Storage.prototype, orig = proto.setItem;
      proto.setItem = function (k, v) { if (k === K_REG) { try { v = JSON.stringify(stamp(JSON.parse(v), ctlFn())); } catch (e) { /* tal cual */ } } return orig.call(this, k, v); };
      w.__admPatch = true;
    } catch (e) { console.warn('patch', e); }
  };
  const vendOptions = () => '<option value="">— Sin vendedor —</option>' + vendedoresActivos().map(n => `<option ${n === selVend ? 'selected' : ''}>${esc(n)}</option>`).join('');
  const setupVendedor = (w) => {
    const dd = w.document; selVend = Yo.nombre();
    const ctl = () => { const el = dd.getElementById('doc-control-span'); return el ? el.innerText.trim() : ''; };
    patchStorage(w, ctl);
    // selector en escritorio
    if (!dd.getElementById('adm-vend-css')) { const st = dd.createElement('style'); st.id = 'adm-vend-css'; st.textContent = '#adm-vend{padding:7px 10px;font-size:15.5px;border:2px solid #cbd5e1;border-radius:8px;cursor:pointer;outline:none;background:#fff;font-family:inherit;font-weight:600;color:#1e293b;min-width:130px}'; dd.head.appendChild(st); }
    const grp = dd.querySelector('.hd-group .hd-fields');
    if (grp && !dd.getElementById('adm-vend')) { const l = dd.createElement('label'); l.className = 'hd-field'; l.innerHTML = `<span>Vendedor</span><select id="adm-vend">${vendOptions()}</select>`; grp.appendChild(l); }
    // selector en el teléfono
    const mcard = dd.querySelector('#m-panel-client [data-bind="doc-control-span"]');
    if (mcard && !dd.getElementById('adm-vend-m')) { const card = mcard.closest('.m-card'); const l = dd.createElement('label'); l.className = 'm-field'; l.style.marginTop = '10px'; l.innerHTML = `<span>Vendedor</span><select class="m-input" id="adm-vend-m">${vendOptions()}</select>`; card.appendChild(l); }
    const sels = () => [dd.getElementById('adm-vend'), dd.getElementById('adm-vend-m')].filter(Boolean);
    const show = (v) => { selVend = v || ''; sels().forEach(s => { if (!Array.from(s.options).some(o => o.value === selVend)) s.insertAdjacentHTML('beforeend', `<option>${esc(selVend)}</option>`); s.value = selVend; }); };
    const onPick = (v) => {
      show(v);
      // si el documento abierto ya está guardado, se actualiza su vendedor
      const c = ctl(); const reg = readArr(K_REG); const r = reg.find(x => x && !x.deleted && x.clase !== 'rapida' && x.control === c);
      if (r && r.vendedor !== selVend) { r.vendedor = selVend; r.mod = Date.now(); writeArr(K_REG, reg); sync(); }
    };
    sels().forEach(s => s.addEventListener('change', () => onPick(s.value)));
    // al abrir otro documento o empezar uno nuevo, mostrar su vendedor
    const refresh = () => { const c = ctl(); const r = readArr(K_REG).find(x => x && !x.deleted && x.clase !== 'rapida' && x.control === c); show(r ? (r.vendedor || '') : Yo.nombre()); };
    const span = dd.getElementById('doc-control-span');
    if (span) new w.MutationObserver(debounce(refresh, 120)).observe(span, { childList: true, characterData: true, subtree: true });
    dd.addEventListener('suin:newdoc', () => show(Yo.nombre()));
    refresh();
    // la oferta rápida vive en otro marco: también se marca
    const rf = dd.getElementById('rapida-frame');
    if (rf) { const pr = () => patchStorage(rf.contentWindow, () => ''); rf.addEventListener('load', pr); pr(); }
  };

  /* ---------- montar el generador ----------
     Vive en su propio archivo (/cotizador): el navegador lo guarda en caché y Gestión
     carga más rápido. Es el mismo dominio, así que el puente funciona igual. */
  const mount = async (host) => {
    if (CFG().nubeCotizador && !localStorage.getItem(K_NUBE)) localStorage.setItem(K_NUBE, CFG().nubeCotizador);
    toCot();
    host.innerHTML = '<iframe class="cot-frame" title="Generador de ofertas y notas" allow="clipboard-read; clipboard-write"></iframe>';
    frame = $('iframe', host);
    frame.src = '/cotizador';
    frame.addEventListener('load', () => {
      const w = frame.contentWindow;
      try { setupVendedor(w); } catch (e) { console.warn('vendedor', e); }
      try { enhance(w); } catch (e) { console.warn('diseño', e); }
      try { setupMargen(w); } catch (e) { console.warn('margen', e); }
      const tryInject = () => injectInventario();
      w.document.addEventListener('suinapp:ready', tryInject);
      setTimeout(tryInject, 600);
      clearInterval(Cot._t); Cot._t = setInterval(() => { if (!document.body.contains(frame)) { clearInterval(Cot._t); return; } injectInventario(); sync(); }, 4000);
      if (Cot._pending) { const p = Cot._pending; Cot._pending = null; setTimeout(() => act(p), 900); }
    });
  };
  /* acciones dentro del generador */
  const act = ({ tipo, cliente, abrir }) => {
    const w = frame && frame.contentWindow; if (!w) return;
    const dd = w.document;
    try {
      if (abrir) {
        dd.getElementById('act-registro').click();
        setTimeout(() => {
          const item = Array.from(dd.querySelectorAll('.sx-list-item')).find(x => (x.querySelector('.sx-li-sub') || {}).textContent.includes(abrir));
          if (item) item.querySelector('[data-a="open"]').click(); else UI.toast('No encontré ese documento en el registro del generador');
        }, 250);
        return;
      }
      dd.getElementById('act-new').click();
      if (tipo) { const sel = dd.getElementById('doc-type-selector'); sel.value = tipo; sel.dispatchEvent(new w.Event('change', { bubbles: true })); const mb = dd.querySelector(`.m-seg [data-doc="${tipo}"]`); if (mb) mb.click(); }
      if (cliente) {
        const set = (id, v) => { const el = dd.getElementById(id); if (el && v) { el.innerText = v; el.dispatchEvent(new w.Event('input', { bubbles: true })); } };
        set('client-name', cliente.nombre); set('client-rif', cliente.rif); set('client-address', cliente.direccion);
        dd.querySelectorAll('[data-bind]').forEach(i => { const src = dd.getElementById(i.dataset.bind); if (src) i.value = src.innerText; });
      }
    } catch (e) { console.warn(e); }
  };
  const open = (p) => { if (frame && document.body.contains(frame)) act(p); else { Cot._pending = p; Route.nav('#/ofertas'); } };

  Bus.on('del', ({ col, rec }) => {
    if (col !== 'docs' || !rec || (rec.tipo !== 'oferta' && rec.tipo !== 'nota')) return;
    const rid = rec.cotId || ('adm_' + rec.id); const reg = readArr(K_REG); const i = reg.findIndex(r => r.id === rid);
    if (i < 0) return; reg[i] = { id: rid, deleted: true, mod: Date.now() }; writeArr(K_REG, reg);
  });
  window.addEventListener('storage', (e) => { if (e.key === K_REG || e.key === K_CLI) syncSoon(); });
  Bus.on('data', (c) => { if (c === 'docs' || c === 'clientes') { if (!busy) setTimeout(() => { if (!busy) { busy = true; try { toCot(); } finally { busy = false; } } }, 300); } });
  return { sync, fromCot, toCot, pullDrive, mount, open, parseItems, toDoc, toRecord, sig };
})();

/* ---------------- Oferta rápida (tu app de siempre, dentro del panel) ----------------
   Su registro vive en localStorage 'suin_registro_v1' (clase "rapida"). Aquí se copia a la
   colección 'rapidas' para que viaje a Supabase y aparezca en tus otros equipos. */
const K_REG_RAPIDA = 'suin_registro_v1';
const Rapidas = {
  readLocal() { try { return JSON.parse(localStorage.getItem(K_REG_RAPIDA)) || []; } catch (e) { return []; } },
  toCloud() {
    const loc = this.readLocal().filter(x => x && x.id && x.clase === 'rapida');
    let n = 0;
    loc.forEach(r => { const cur = Store.get('rapidas', r.id); if (!cur || (r.mod || 0) > (cur.modLocal || 0)) { Store.put('rapidas', Object.assign({}, r, { modLocal: r.mod || 0 }), { quiet: true }); n++; } });
    if (n) Bus.emit('data', 'rapidas');
  },
  toLocal() {
    const loc = this.readLocal(); const map = new Map(loc.map(x => [x.id, x])); let ch = false;
    Store.all('rapidas').forEach(r => { const l = map.get(r.id); if (!l || (r.modLocal || 0) > (l.mod || 0)) { const c = Object.assign({}, r); delete c.modLocal; c.mod = r.modLocal || r.mod; map.set(r.id, c); ch = true; } });
    if (ch) { try { localStorage.setItem(K_REG_RAPIDA, JSON.stringify(Array.from(map.values()))); } catch (e) { /* sin espacio */ } }
  }
};
window.addEventListener('message', (e) => { if (e.data && e.data.suin === 'reg-changed') Rapidas.toCloud(); });
/* ---------------- Importar datos ---------------- */
const Importer = {
  async iniciales(json) {
    if (!json || !Array.isArray(json.productos) || !Array.isArray(json.docs)) throw new Error('Este archivo no es el de datos iniciales.');
    const cfgRec = clone(DB.config.get('main') || { id: 'main' });
    const ex = json.extras || {};
    const c = CFG();
    const formas = Array.from(new Set((c.formasPago || []).concat((ex.formasPago || []).map(f => f.charAt(0) + f.slice(1).toLowerCase()))));
    cfgRec.formasPago = formas.filter((f, i) => formas.findIndex(g => normKey(g) === normKey(f)) === i);
    cfgRec.vendedores = Array.from(new Set((c.vendedores || []).concat(ex.vendedores || [])));
    Store.put('config', cfgRec, { quiet: true });
    let n = { productos: 0, clientes: 0, proveedores: 0, docs: 0 };
    ['productos', 'clientes', 'proveedores', 'docs'].forEach(col => (json[col] || []).forEach(r => { if (!Store.get(col, r.id)) { Store.put(col, r, { quiet: true }); n[col]++; } }));
    aplicarFixCostos();
    COLS.forEach(cc => Bus.emit('data', cc));
    return n;
  },
  /* respaldo del cotizador: { clientes:[...], registro:[...] } → se mezcla en su registro y el puente lo trae */
  async cotizador(json) {
    if (!json || (!Array.isArray(json.clientes) && !Array.isArray(json.registro))) throw new Error('Este archivo no es un respaldo del cotizador.');
    const merge = (k, arr) => { let cur = []; try { cur = JSON.parse(localStorage.getItem(k)) || []; } catch (e) { /* vacío */ } const m = new Map(cur.map(x => [x.id, x])); let n = 0; (arr || []).forEach(x => { if (!x || !x.id) return; const c = m.get(x.id); if (!c || (x.mod || x.guardado || 0) > (c.mod || c.guardado || 0)) { m.set(x.id, x); n++; } }); localStorage.setItem(k, JSON.stringify(Array.from(m.values()))); return n; };
    const nr = merge('suin_registro_v1', json.registro), nc = merge('suin_clientes_v1', json.clientes);
    const before = DB.docs.size; Cot.sync(); Rapidas.toCloud();
    return { clientes: nc, docs: Math.max(0, DB.docs.size - before) || nr, rapidas: (json.registro || []).filter(x => x && x.clase === 'rapida').length };
  },
  respaldo() {
    const out = { app: 'suinelectric-admin', version: 1, exportado: nowISO() };
    COLS.forEach(c => out[c] = Store.all(c));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: 'application/json' })); a.download = `respaldo_admin_suinelectric_${ymd()}.json`; a.click();
  },
  async restaurar(json) {
    if (!json || json.app !== 'suinelectric-admin') throw new Error('Este archivo no es un respaldo de esta app.');
    let n = 0;
    COLS.forEach(c => (json[c] || []).forEach(r => { const cur = Store.get(c, r.id); if (!cur || (r.mod || '') > (cur.mod || '')) { Store.put(c, r, { quiet: true }); n++; } }));
    COLS.forEach(cc => Bus.emit('data', cc));
    return n;
  }
};

/* ---------------- inicio de sesión ---------------- */
function showLogin() {
  return new Promise((resolve) => {
    const wrap = document.createElement('div'); wrap.className = 'ov'; wrap.style.background = 'var(--plate)'; wrap.style.alignItems = 'center';
    let modo = 'clave', emailPend = '';
    const done = () => { wrap.remove(); Sync.listen(); Sync.run(); App.render(); resolve(true); };
    App.loginDone = () => { if (document.body.contains(wrap)) done(); };
    const paint = () => {
      const cuerpo = emailPend ? `<p class="small" style="margin:0 0 10px">Te enviamos un correo a <b>${esc(emailPend)}</b>. Escribe el código o toca el enlace del correo.</p>
          <form class="stack" style="gap:10px" data-f="cod"><label class="fld"><span>Código</span><input class="inp mono" inputmode="numeric" autocomplete="one-time-code" required></label>
          <div class="small" style="color:var(--red);min-height:1em" data-err></div><button class="btn pri" type="submit">Entrar</button>
          <button class="btn ghost small" type="button" data-back>Usar otro correo</button></form>`
        : modo === 'codigo' ? `<form class="stack" style="gap:10px" data-f="mail"><label class="fld"><span>Correo de administrador</span><input class="inp" type="email" autocomplete="email" required></label>
          <div class="small" style="color:var(--red);min-height:1em" data-err></div><button class="btn pri" type="submit">Enviarme un código</button>
          <button class="btn ghost small" type="button" data-modo="clave">Entrar con clave</button></form>`
        : `<form class="stack" style="gap:10px" data-f="clave"><label class="fld"><span>Correo</span><input class="inp" type="email" autocomplete="username" required></label>
          <label class="fld"><span>Clave</span><input class="inp" type="password" autocomplete="current-password" required></label>
          <div class="small" style="color:var(--red);min-height:1em" data-err></div><button class="btn pri" type="submit">Entrar</button>
          <p class="small muted" style="margin:4px 0 0;line-height:1.5">Es el mismo acceso del panel de la tienda. ¿No tienes clave o la olvidaste? <button class="btn sm" type="button" data-modo="codigo">Entrar con un código</button></p></form>`;
      wrap.innerHTML = `<div class="md" style="width:min(380px,100%);min-height:0;border-radius:8px"><div class="md-b" style="padding:26px">
        <img src="${DEFAULT_LOGO}" alt="" style="width:72px;display:block;margin:0 auto 10px"><h1 style="text-align:center;font-size:22px;margin:0 0 18px">Gestión Suinelectric</h1>
        ${cuerpo}<button class="btn ghost small" type="button" data-skip style="width:100%;margin-top:6px">Seguir sin conexión en este equipo</button></div></div>`;
      const f = $('form', wrap), ins = $$('input', f), err = $('[data-err]', wrap);
      setTimeout(() => ins[0].focus(), 30);
      $$('[data-modo]', wrap).forEach(b => b.onclick = () => { modo = b.dataset.modo; paint(); });
      const back = $('[data-back]', wrap); if (back) back.onclick = () => { emailPend = ''; modo = 'codigo'; paint(); };
      $('[data-skip]', wrap).onclick = () => { wrap.remove(); Sync.set('local', 'Sin sesión: solo este equipo'); resolve(false); };
      f.onsubmit = async (e) => {
        e.preventDefault(); err.textContent = ''; const btn = $('button[type=submit]', f); btn.disabled = true;
        try {
          if (f.dataset.f === 'clave') { await Sync.login(ins[0].value.trim().toLowerCase(), ins[1].value); done(); }
          else if (f.dataset.f === 'mail') { emailPend = ins[0].value.trim().toLowerCase(); await Sync.sendCode(emailPend); paint(); }
          else { await Sync.verifyCode(emailPend, ins[0].value.trim()); done(); setTimeout(() => Yo.check(), 800); }
        } catch (er) {
          const m = String(er && er.message || er);
          if (f.dataset.f === 'mail') emailPend = '';
          err.textContent = /invalid login/i.test(m) ? 'Correo o clave incorrectos. Si nunca creaste una clave, entra con un código.'
            : /signups? not allowed|not found|user not/i.test(m) ? 'Ese correo no tiene cuenta. Usa el mismo correo con el que entras al panel de la tienda.'
            : /expired|invalid|token/i.test(m) && f.dataset.f === 'cod' ? 'Código no válido o vencido.'
            : /rate|seconds/i.test(m) ? 'Espera un minuto antes de pedir otro código.'
            : /fetch|network/i.test(m) ? 'Sin conexión con Supabase. Revisa el internet.' : m;
          btn.disabled = false;
        }
      };
    };
    paint(); document.body.appendChild(wrap);
  });
}

function aplicarFixCostos() {
  let n = 0;
  Object.keys(FIX_COSTOS).forEach(did => {
    const d = Store.get('docs', did); if (!d || !d.importado || d.fixCostos) return;
    const its = FIX_COSTOS[did];
    (d.items || []).forEach(it => { const f = its[it.id]; if (f) { it.costo = f[0]; it.precio = f[1]; } });
    d.fixCostos = 1; Store.put('docs', d, { quiet: true }); n++;
  });
  if (n) { Bus.emit('data', 'docs'); console.info('Costos de compras corregidos en', n, 'documentos'); }
  return n;
}

/* ---------------- arranque ---------------- */
/* ---------------- tu inventario en la tienda (15_inventario_web.sql) ----------------
   Cada vez que cambian productos, compras, ventas o ajustes, sube a la tienda lo
   público de cada producto con existencia (tuya + de tu papá): modelo, marca, nombre,
   descripción, categoría y precio de venta. Las cantidades van a una tabla privada.
   Solo sube si algo cambió desde la última vez. */
const InvWeb = {
  ultimo: lsGet('suinadm_invweb', ''), corriendo: false, falta: false,
  datos() {
    /* Solo lo publicado (los borradores y ocultos no salen) y solo productos tuyos de verdad
       (con existencia o historial en tu inventario). Sin existencia se publican igual: la tienda
       los muestra "A pedido" (16_inventario_a_pedido.sql). */
    Calc.build();
    return Store.all('productos').filter(p => p.activo !== false && String(p.codigo || '').trim() && WebProd.publicado(p) && (Object.keys(p.inv || {}).length || (Calc.movs.get(p.id) || []).length)).map(p => {
      const s = Calc.st(p.id);
      const cant = Math.max(0, num(s.manuel.cant)) + Math.max(0, num(s.papa.cant));
      return { modelo: String(p.codigo).trim(), marca: p.marca || '', nombre: p.nombre && p.nombre !== p.codigo ? p.nombre : '', descripcion: p.descripcion || '', categoria: [p.webCat].concat(p.webCat ? p.webSubs || [] : []).filter(Boolean).join(' > ') || p.categoria || '', precio: num(p.precio) > 0 ? num(p.precio) : null, cantidad: Math.floor(cant) };
    }).filter(x => x.cantidad >= 0).sort((a, b) => a.modelo.localeCompare(b.modelo));
  },
  async publicar() {
    if (this.corriendo || this.falta || !Sync.online() || !Store.ready || Pend.size) return;
    const datos = this.datos(), txt = JSON.stringify(datos);
    let h = 2166136261; for (let i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); }
    const firma = (h >>> 0).toString(36) + ':' + txt.length;
    if (firma === this.ultimo) return;
    this.corriendo = true;
    try {
      const { error } = await Sync.sb.rpc('publicar_inventario_web', { datos });
      if (error) { if (/publicar_inventario_web|schema cache|does not exist/i.test(error.message || '')) this.falta = true; console.warn('Inventario en la tienda:', error.message); return; }
      this.ultimo = firma; lsSet('suinadm_invweb', firma);
    } catch (e) { console.warn('Inventario en la tienda:', e); }
    finally { this.corriendo = false; }
  },
  programar: debounce(() => InvWeb.publicar(), 5000)
};
Bus.on('data', (c) => { if (c === 'docs' || c === 'productos') InvWeb.programar(); });
Bus.on('sync', () => { if (Sync.state === 'ok') InvWeb.programar(); });

  } else { Sync.set('local', 'Solo en este equipo'); ensureDistribuidores(); }
  App.go();
  Catalog.load();
  if (!Rates.data.bcv_usd) Rates.fetch();
  Rapidas.toCloud();
  aplicarFixCostos(); Bus.on('remote', () => aplicarFixCostos());
  migrarEmpleados(); borrarHaley(); Bus.on('sync', () => { if (Sync.state === 'ok') borrarHaley(); });
  setTimeout(() => { if (!document.querySelector('.ov')) Yo.check(); }, 1200);
  if (CFG().nubeCotizador && !localStorage.getItem('suin_nube_v1')) localStorage.setItem('suin_nube_v1', CFG().nubeCotizador);
  Cot.sync(); Cot.pullDrive();
  setTimeout(() => Tienda.cargar(), 1500); setTimeout(() => WebProd.cargar(), 2500);
  Bus.on('sync', () => autoCategorias.programar()); Bus.on('catalog', () => autoCategorias.programar());
  setInterval(() => { if (document.visibilityState === 'visible') WebProd.cargar(); }, 300000); setInterval(() => { if (document.visibilityState === 'visible') Tienda.cargar(); }, 180000);
  Bus.on('remote', () => setTimeout(() => Cot.sync(), 200));
  if (Sync.sb && !Sync.user) showLogin();
  if (Sync.sb && typeof Sync.sb.auth.onAuthStateChange === 'function') Sync.sb.auth.onAuthStateChange((ev, ses) => { if (ev === 'SIGNED_IN' && ses && !Sync.online()) { Sync.user = ses.user; if (App.loginDone) App.loginDone(); } });
  Bus.on('data', (c) => { if (c === 'rapidas' && App.route.name !== 'rapida') Rapidas.toLocal(); });
})();

<script>
/* Teléfono: cada celda recibe el nombre de su columna para mostrar las tablas como fichas */
(function(){
  const etiquetar = (tabla) => {
    const ths = [...tabla.querySelectorAll('thead th')].map(th => th.textContent.replace(/[↕▲▼⇅]/g, '').trim());
    if (!ths.length) return;
    tabla.classList.add('apilable');
    tabla.querySelectorAll('tbody tr').forEach(tr => {
      let i = 0;
      [...tr.children].forEach(td => { const span = Number(td.getAttribute('colspan') || 1); if (!td.hasAttribute('data-label') && ths[i]) td.setAttribute('data-label', ths[i]); i += span; });
    });
  };
  let pend = false;
  new MutationObserver(() => { if (pend) return; pend = true; requestAnimationFrame(() => { pend = false; document.querySelectorAll('table.tbl').forEach(etiquetar); }); })
    .observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
