    return parts.join('');
  };
  const paintLines = () => {
    const box = $('#lines', v);
    const showCost = !compra;
    if (!D.items.length) { box.innerHTML = '<div class="empty" style="border:1px dashed var(--line);border-radius:6px">Busca un producto arriba o agrega una línea manual.</div>'; paintTotals(); return; }
    box.innerHTML = `<div class="lines"><div class="ln head"><span></span><span>Código</span><span>${compra ? '' : 'Origen'}</span><span class="r">Cant.</span><span class="r">${compra ? 'Costo unit.' : 'Precio unit.'}</span><span class="r">${showCost ? 'Costo unit.' : ''}</span><span class="r">Total</span><span></span></div>
      ${D.items.map((it, i) => `<div class="ln o-${esc(compra ? D.inventario : (it.origen || 'libre'))}" data-li="${i}">
        <div class="idx">${i > 0 ? `<button data-up title="Subir">▲</button>` : ''}${i + 1}${i < D.items.length - 1 ? `<button data-down title="Bajar">▼</button>` : ''}</div>
        <div class="c-code"><input class="inp mono" style="font-size:15.5px" data-lk="codigo" value="${esc(it.codigo || '')}" placeholder="Código"></div>
        <div class="c-orig">${venta || oferta ? `<select class="inp orig" data-lk="origen" aria-label="Origen">${origenOpts(it)}</select>` : ''}</div>
        <label><span class="lbl-m">Cantidad</span><input class="inp num" inputmode="decimal" data-lk="cant" value="${esc(fmtQty(num(it.cant)))}"></label>
        <label><span class="lbl-m">${compra ? 'Costo unit.' : 'Precio unit.'}</span><input class="inp num" inputmode="decimal" data-lk="precio" value="${esc(it.precio === '' ? '' : round2(num(it.precio)))}"></label>
        <label>${showCost ? `<span class="lbl-m">Costo unit.</span><input class="inp num" inputmode="decimal" data-lk="costo" value="${it.costo === '' || it.costo == null ? '' : esc(round2(num(it.costo)))}" placeholder="—" title="Tu costo (no sale en el PDF)">` : ''}</label>
        <div class="tot" data-ltot>${fmtUSD(num(it.cant) * num(it.precio))}</div>
        <button class="del" data-del title="Quitar línea" aria-label="Quitar línea">✕</button>
        <div class="c-desc"><textarea class="inp" data-lk="desc" rows="3">${esc(it.desc || '')}</textarea></div>
        <div class="meta" data-meta>${lineMeta(it)}</div>
      </div>`).join('')}</div>`;
    paintTotals();
  };
  $('#lines', v).addEventListener('input', (e) => {
    const row = e.target.closest('[data-li]'); const k = e.target.dataset.lk; if (!row || !k || e.target.tagName === 'SELECT') return;
    const it = D.items[+row.dataset.li];
    it[k] = k === 'cant' || k === 'precio' ? num(e.target.value) : k === 'costo' ? (e.target.value.trim() === '' ? '' : num(e.target.value)) : e.target.value;
    $('[data-ltot]', row).textContent = fmtUSD(num(it.cant) * num(it.precio));
    if (k !== 'desc' && k !== 'codigo') $('[data-meta]', row).innerHTML = lineMeta(it);
    setDirty(); paintTotals();
  });
  $('#lines', v).addEventListener('change', (e) => {
    const row = e.target.closest('[data-li]'); const k = e.target.dataset.lk; if (!row || !k) return;
    const it = D.items[+row.dataset.li];
    if (k === 'origen') {
      const [ov, did] = e.target.value.split('|'); it.origen = ov; if (ov === 'dist') it.dist = did || '';
      if (it.origen === 'manuel' || it.origen === 'papa') {
        if (!it.productoId) { const p = findProductoByCodigo(it.codigo); if (p) it.productoId = p.id; }
        if (it.productoId) { const s = Calc.st(it.productoId); if (s[it.origen].costo) it.costo = round2(s[it.origen].costo); }
      } else if (it.origen === 'dist') {
        const c = catalogoByCodigo(it.codigo); if (venta && !it.pedido) it.pedido = 'por pedir'; if (c) { const cl = costoLinea(c, Store.get('proveedores', it.dist) || null); if (cl.costo != null) Object.assign(it, cl); else it.listPrice = c.precio; }
      } else if (it.origen === 'libre') { /* sin existencia */ }
      setDirty(); paintLines(); return;
    }
    if (k === 'pedido') { it.pedido = e.target.value; setDirty(); return; }
    if (k === 'dist') { it.dist = e.target.value; const c = catalogoByCodigo(it.codigo); if (c) { const cl = costoLinea(c, Store.get('proveedores', it.dist) || null); if (cl.costo != null) Object.assign(it, cl); } setDirty(); paintLines(); return; }
    if (k === 'codigo' && !it.productoId && (it.origen === 'manuel' || it.origen === 'papa' || compra)) { const p = findProductoByCodigo(it.codigo); if (p) { it.productoId = p.id; setDirty(); paintLines(); } }
    if (k === 'cant' || k === 'precio' || k === 'costo') { e.target.value = k === 'cant' ? fmtQty(num(it.cant)) : (it[k] === '' ? '' : round2(num(it[k]))); }
  });
  $('#lines', v).addEventListener('click', (e) => {
    const row = e.target.closest('[data-li]'); if (!row) return; const i = +row.dataset.li;
    if (e.target.closest('[data-del]')) { D.items.splice(i, 1); setDirty(); paintLines(); }
    else if (e.target.closest('[data-up]')) { [D.items[i - 1], D.items[i]] = [D.items[i], D.items[i - 1]]; setDirty(); paintLines(); }
    else if (e.target.closest('[data-down]')) { [D.items[i + 1], D.items[i]] = [D.items[i], D.items[i + 1]]; setDirty(); paintLines(); }
  });
  $('[data-addline]', v).onclick = () => { D.items.push({ id: uid('i'), productoId: null, codigo: '', desc: 'Descripción del producto o servicio', cant: 1, precio: 0, costo: '', origen: compra ? null : 'libre' }); setDirty(); paintLines(); const ts = $$('#lines textarea', v); const t = ts[ts.length - 1]; t.focus(); t.select(); };
  productFinder($('#finder', v), {
    tipo: D.tipo,
    onPick: (x) => {
      let it;
      if (x.k === 'p') it = lineFromProducto(x.p, D.tipo, compra || ajuste ? D.inventario : null);
      else { const own = findProductoByCodigo(x.c.m); it = lineFromCatalogo(x.c, D.tipo); if (compra && own) { it.productoId = own.id; delete it.nuevoProd; } }
      if (compra) it.origen = null;
      const cli = D.clienteId && Store.get('clientes', D.clienteId);
      if (cli && num(cli.descuento) && !compra) { /* el descuento del cliente se aplica al documento */ if (!num(D.descPct)) { D.descPct = num(cli.descuento); const di = $('[data-k="descPct"]', v); if (di) di.value = D.descPct; } }
      D.items.push(it); setDirty(); paintLines();
      UI.toast(`Agregado: ${it.codigo}`, 1200);
    }
  });

  /* ----- pagos ----- */
  const paintPagos = () => {
    const box = $('#sec-pagos', v); if (!box) return;
    const T = Calc.totals(D); const formas = cfg.formasPago || [];
    box.innerHTML = `<div class="ph"><h2>Pagos</h2><div class="act">${T.saldo > 0.005 ? `<button class="btn sm" data-p="full">Pagado completo (${fmtUSD(T.saldo)})</button>` : ''}<button class="btn sm" data-p="add">${ico('plus')} Pago</button></div></div>
      ${(D.pagos || []).length ? D.pagos.map((p, i) => `<div class="pay" data-pi="${i}"><input class="inp" type="date" data-pk="fecha" value="${esc((p.fecha || '').slice(0, 10))}"><input class="inp" data-pk="forma" list="dl-formas" value="${esc(p.forma || '')}" placeholder="Forma de pago"><input class="inp num" inputmode="decimal" data-pk="monto" value="${esc(round2(num(p.monto)))}"><input class="inp" data-pk="ref" value="${esc(p.ref || '')}" placeholder="Referencia / nota"><button class="btn ghost sm" data-pdel title="Quitar">✕</button></div>`).join('') : `<p class="muted small" style="margin:0">Sin pagos registrados.</p>`}
      <datalist id="dl-formas">${formas.map(f => `<option value="${esc(f)}">`).join('')}</datalist>`;
    $$('[data-pk]', box).forEach(inp => inp.addEventListener('input', () => { const p = D.pagos[+inp.closest('[data-pi]').dataset.pi]; const k = inp.dataset.pk; p[k] = k === 'monto' ? num(inp.value) : k === 'fecha' ? inp.value + ' 12:00' : inp.value; setDirty(); paintTotals(); }));
    $$('[data-pdel]', box).forEach(b => b.onclick = () => { D.pagos.splice(+b.closest('[data-pi]').dataset.pi, 1); setDirty(); paintPagos(); paintTotals(); });
    const add = (monto) => { (D.pagos = D.pagos || []).push({ id: uid('g'), fecha: localStamp(), forma: formas[0] || '', monto: round2(monto), ref: '' }); setDirty(); paintPagos(); paintTotals(); };
    $('[data-p="add"]', box).onclick = () => add(Math.max(0, Calc.totals(D).saldo));
    const full = $('[data-p="full"]', box); if (full) full.onclick = () => add(Calc.totals(D).saldo);
  };

  /* ----- totales ----- */
  const paintTotals = () => {
    const T = Calc.totals(D); const box = $('#tot', v);
    let h = `<div class="tr"><span>Subtotal</span><b>${fmtUSD(T.sub)}</b></div>`;
    if (T.desc > 0) h += `<div class="tr neg"><span>Descuento ${fmtNum(T.descPct)}%</span><b>-${fmtUSD(T.desc)}</b></div>`;
    h += `<div class="tr"><span>${T.ivaPct ? `I.V.A. ${fmtNum(T.ivaPct)}%` : 'I.V.A. (exento)'}</span><b>${fmtUSD(T.iva)}</b></div>`;
    h += `<div class="tr big"><span>Total</span><b>${fmtUSD(T.total)}</b></div>`;
    if (T.tasa && !compra) h += `<div class="tr"><span>Total en Bs</span><b>${fmtBS(T.bs)}</b></div>`;
    if (venta || compra) h += `<div class="tr" style="margin-top:6px"><span>Pagado</span><b>${fmtUSD(T.pagado)}</b></div><div class="tr"><span>${compra ? 'Por pagar' : 'Por cobrar'}</span><b style="color:${T.saldo > 0.005 ? 'var(--red)' : 'var(--ok)'}">${fmtUSD(Math.max(T.saldo, 0))}</b></div>`;
    if (!compra && !ajuste && D.items.length) {
      const G = desgloseDoc(D);
      h += `<div style="border-top:1px solid var(--line-2);margin-top:8px;padding-top:8px"><div class="small muted" style="margin-bottom:2px">Ganancia por origen</div>`;
      G.grupos.forEach(g => { h += `<div class="tr small"><span>${grupoTag(g)}</span><b>${g.sinCosto ? '<span class="muted" title="Falta el costo en alguna línea">s/c</span> ' : ''}${fmtUSD(g.gan)}${g.costo > 0 ? ` <span class="muted" style="font-weight:400">${fmtNum(g.gan / g.costo * 100, 1)}%</span>` : ''}</b></div>`; });
      h += `<div class="tr gan"><span>Ganancia${T.sinCosto ? ' (parcial)' : ''}</span><b>${fmtUSD(T.gan)}</b></div>
        <button type="button" class="btn sm" data-a="desglose" style="width:100%;margin-top:8px">Ver detalle por distribuidor</button></div>`;
    }
    box.innerHTML = h;
    const sp = $('#sec-pagos', v); if (sp && !sp.contains(document.activeElement)) paintPagos();
  };

  /* ----- tasas ----- */
  const paintRates = () => {
    const box = $('#rates', v); if (!box) return;
    box.innerHTML = Rates.SOURCES.filter(s => Rates.data[s.id]).map(s => `<button class="btn sm ${D.tasaFuente === s.id && num(D.tasa) === round2(Rates.data[s.id].v) ? 'pri' : ''}" data-rate="${s.id}" title="${esc(s.name)}">${esc(s.name)} ${fmtNum(Rates.data[s.id].v, 2)}</button>`).join('') + `<button class="btn sm ghost" data-rate-r title="Actualizar tasas">${Rates.loading ? '…' : '↻'}</button>`;
    $$('[data-rate]', box).forEach(b => b.onclick = () => { D.tasa = round2(Rates.data[b.dataset.rate].v); D.tasaFuente = b.dataset.rate; $('[data-k="tasa"]', v).value = D.tasa; setDirty(); paintRates(); paintTotals(); });
    $('[data-rate-r]', box).onclick = () => Rates.fetch();
  };
  App.onRates = () => { if (document.body.contains(v)) paintRates(); };

  /* ----- campos generales ----- */
  $$('[data-k]', v).forEach(el => {
    const ev = el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'date' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      const k = el.dataset.k;
      if (k === 'fechaD') { D.fecha = el.value + ' ' + ((D.fecha || '').slice(11, 16) || '12:00'); }
      else if (k === 'proveedorNombre') { D.proveedor = { nombre: el.value }; const p = provPorNombre(el.value); D.proveedorId = p ? p.id : null; }
      else if (k === 'condTxt') D.condiciones = el.value.split('\n');
      else if (k === 'firmas') D.firmas = el.checked;
      else if (k === 'descPct' || k === 'ivaPct') D[k] = num(el.value);
      else if (k === 'tasa') { D.tasa = el.value.trim() ? num(el.value) : null; D.tasaFuente = 'manual'; }
      else D[k] = el.value;
      setDirty(); paintTotals(); if (k === 'tasa') paintRates();
    });
  });
  $$('[data-seg]', v).forEach(seg => seg.addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; D[seg.dataset.seg] = b.dataset.v; $$('button', seg).forEach(x => x.classList.toggle('on', x === b)); setDirty(); paintLines(); }));
  const cr = $('[data-cond-reset]', v); if (cr) cr.onclick = () => { D.condiciones = (cfg.condiciones[oferta ? 'oferta' : 'nota'] || []).slice(); $('[data-k="condTxt"]', v).value = D.condiciones.join('\n'); setDirty(); };

  /* ----- guardar ----- */
  const save = () => {
    D.condiciones = (D.condiciones || []).filter(s => String(s).trim() !== '' || false);
    if (!D.numero) D.numero = nextNumero(D.tipo, D.fecha);
    const dupNum = Store.all('docs').find(x => x.id !== D.id && x.numero === D.numero);
    if (dupNum) { UI.toast(`Ya existe otro documento con el número ${D.numero}. Cámbialo.`, 3200); return false; }
    if (!compra && !ajuste && D.cliente && D.cliente.nombre && D.cliente.nombre.trim()) { const c = clienteFromDoc(D); if (c) D.clienteId = c.id; }
    if (compra) {
      const nom = (D.proveedor && D.proveedor.nombre || '').trim();
      if (nom) { let p = provPorNombre(nom); if (!p) p = Store.put('proveedores', Object.assign(nuevoDist('nacional'), { nombre: nom })); D.proveedorId = p.id; D.proveedor = { nombre: p.nombre }; }
      // productos nuevos de la compra
      D.items.forEach(it => {
        if (it.productoId || !String(it.codigo || '').trim()) return;
        const ex = findProductoByCodigo(it.codigo);
        if (ex) { it.productoId = ex.id; return; }
        const np = Object.assign({ id: uid('p_'), codigo: it.codigo.trim(), nombre: '', descripcion: '', marca: it.marca || '', categoria: '', unidad: 'UND', precio: 0, inv: {}, activo: true, notas: '', tienda: 'borrador' }, it.nuevoProd || {});
        if (!np.nombre && !np.descripcion) np.nombre = plainFirst(it.desc).replace(/^Ref \/ Modelo:\s*/i, '').replace(it.codigo, '').replace(/^[\s—-]+/, '');
        np.inv[D.inventario] = { cant: 0, costo: 0 };
        if (!np.webCat) { const sg = CatAuto.sugerir(np); if (sg) { np.webCat = sg.webCat; np.webSubs = sg.webSubs; np.catAuto = sg.como; if (!np.marca && sg.marca) np.marca = sg.marca; if (!np.categoria) np.categoria = CatAuto.grupoDe(sg.webCat, sg.webSubs, np); } }
        Store.put('productos', np); it.productoId = np.id; delete it.nuevoProd;
      });
      D.items.forEach(it => { it.costo = num(it.precio); it.origen = D.inventario; });
    }
    if (venta || oferta) D.items.forEach(it => { if (it.origen === 'dist') { if (venta && !it.pedido) it.pedido = 'por pedir'; if (!it.dist) it.dist = itDist(it); } });
    if (!D.importado && !D.historial && D.tipo !== 'oferta') D.afectaStock = true;
    D.items.forEach(it => delete it.auto); delete D.origenAuto;
    Store.put('docs', D);
    saved = clone(D); setDirty(false);
    UI.toast(`Guardado: ${D.numero}`);
    if (isNew) { isNew = false; App.guard = null; Route.nav('#/doc/' + D.id, { replace: true }); }
    return true;
  };
  const convert = (tipo) => {
    if (dirty && !save()) return;
    const cfg2 = CFG();
    const nd = newDoc(tipo, { clienteId: D.clienteId, cliente: clone(D.cliente || {}), items: clone(D.items).map(it => Object.assign(it, { id: uid('i') })), descPct: D.descPct, ivaPct: D.ivaPct, tasa: D.tasa, tasaFuente: D.tasaFuente, vendedor: D.vendedor, origenDoc: D.id, notas: D.notas });
    if (tipo === 'nota') nd.condiciones = (cfg2.condiciones.nota || []).slice();
    nd.items.forEach(it => { if (it.origen === 'dist') it.pedido = 'por pedir'; });
    Store.put('docs', nd);
    const orig = Store.get('docs', D.id); if (orig) { if (orig.tipo === 'oferta') orig.estado = 'aceptada'; orig.convertidoA = nd.id; Store.put('docs', orig); }
    dirty = false; App.guard = null; Route.nav('#/doc/' + nd.id);
    UI.toast(`Creada ${TIPOS[tipo].toLowerCase()} ${nd.numero}`);
  };
  v.addEventListener('click', async (e) => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    const act = a.dataset.a;
    if (act === 'save') save();
    else if (act === 'pdf' || act === 'preview' || act === 'share') {
      if (!D.items.length) { UI.toast('Agrega al menos un producto'); return; }
      if (dirty && act === 'pdf') save();
      try {
        if (act === 'pdf') await PDF.build(D);
        else {
          const { blob, name } = await PDF.build(D, { output: 'blob' });
          if (act === 'share') { const f = new File([blob], name, { type: 'application/pdf' }); if (navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: name }); else UI.toast('Este equipo no permite compartir archivos'); }
          else { const url = URL.createObjectURL(blob); if (window.innerWidth < 860) { window.open(url, '_blank'); } else UI.modal({ title: 'Vista previa', wide: true, foot: false, body: `<iframe class="pdfview" src="${url}" title="Vista previa del PDF"></iframe>`, onClose: () => URL.revokeObjectURL(url) }); }
        }
      } catch (err) { if (err && err.name !== 'AbortError') { console.error(err); UI.toast('No se pudo generar el PDF: ' + err.message, 3500); } }
    }
    else if (act === 'desglose') desgloseModal(D);
    else if (act === 'engen') { if (dirty && !save()) return; Cot.open({ abrir: D.numero }); }
    else if (act === 'contar') { D.historial = false; D.afectaStock = true; save(); App.render(); }
    else if (act === 'toNota') convert('nota');
    else if (act === 'toVenta') convert('venta');
    else if (act === 'toNotaV') { D.tipo = 'nota'; D.numero = nextNumero('nota', D.fecha); D.titulo = cfg.titulos.nota; D.condiciones = (cfg.condiciones.nota || []).slice(); D.firmas = true; setDirty(); save(); App.render(); }
    else if (act === 'dup') {
      const nd = newDoc(D.tipo, { clienteId: D.clienteId, cliente: clone(D.cliente || {}), proveedor: clone(D.proveedor || {}), proveedorId: D.proveedorId, inventario: D.inventario, items: clone(D.items).map(it => Object.assign(it, { id: uid('i'), pedido: it.origen === 'dist' ? 'por pedir' : undefined })), descPct: D.descPct, ivaPct: D.ivaPct, condiciones: clone(D.condiciones || []), firmas: D.firmas, titulo: D.titulo });
      if (dirty && !(await UI.confirm('Hay cambios sin guardar. ¿Duplicar de todas formas (sin guardarlos)?'))) return;
      dirty = false; App.guard = null; App.pendingDoc = nd; Route.nav('#/nuevo/' + D.tipo); UI.toast('Copia lista: revisa y guarda');
    }
    else if (act === 'anular') { D.estado = D.estado === 'anulada' ? 'activa' : 'anulada'; save(); App.render(); }
    else if (act === 'del') {
      if (!(await UI.confirm(`¿Eliminar ${TIPOS[D.tipo].toLowerCase()} ${D.numero}? ${venta || compra ? 'Su efecto en el inventario se revierte. Si solo quieres dejar constancia, mejor anúlala.' : ''}`, { ok: 'Eliminar', danger: true }))) return;
      Store.del('docs', D.id); dirty = false; App.guard = null; Route.nav(backHref); UI.toast('Eliminado');
    }
  });
  v.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });

  paintCliente(); paintLines(); paintPagos(); paintRates(); paintTotals();
  if (!Object.keys(Rates.data).length) Rates.fetch();
}

/* ---------------- desglose de un documento: inventario propio, cada distribuidor y libre ----------------
   Precio neto = precio de la línea con el descuento del documento. % ganancia = sobre el costo. */
const desgloseDoc = (d) => {
  const T = Calc.totals(d); const f = T.sub ? T.base / T.sub : 1;
  const gs = new Map();
  (d.items || []).forEach(it => {
    const o = it.origen || 'libre'; const did = o === 'dist' ? (itDist(it) || '') : null; const key = o === 'dist' ? 'dist|' + did : o;
    let g = gs.get(key);
    if (!g) { const dp = did ? Store.get('proveedores', did) : null; g = { key, o, dist: dp, nombre: o === 'dist' ? (dp ? dp.nombre : 'Distribuidor sin asignar') : origenNombre(o), lineas: [], venta: 0, costo: 0, gan: 0, sinCosto: false }; gs.set(key, g); }
    const q = num(it.cant), pu = num(it.precio), pn = pu * f;
    const c = it.costo === '' || it.costo == null ? null : num(it.costo);
    const lista = num(it.listPrice) || null, rec = num(it.recargo) || 0;
    const dto = o === 'dist' && lista ? (it.dtoDist != null && it.dtoDist !== '' ? num(it.dtoDist) : c != null ? (1 - c / (1 + rec / 100) / lista) * 100 : null) : null;
    const l = { it, q, pu, pn, c, lista, dto, rec, venta: q * pn, costo: c != null ? q * c : null };
    l.gan = c != null ? l.venta - l.costo : null; l.ganPct = c ? (pn - c) / c * 100 : null;
    g.lineas.push(l); g.venta += l.venta; if (c != null) g.costo += l.costo; else if (o !== 'libre') g.sinCosto = true;
  });
  const ord = (g) => g.o === 'manuel' ? 0 : g.o === 'papa' ? 1 : g.o === 'dist' ? 2 : 3;
  const grupos = Array.from(gs.values()).sort((a, b) => ord(a) - ord(b) || a.nombre.localeCompare(b.nombre));
  grupos.forEach(g => { g.gan = g.venta - g.costo; });
  return { T, f, grupos };
};
const grupoTag = (g) => g.o === 'dist' ? `<span class="own dist">${esc(g.nombre)}</span>` : ownTag(g.o);
function desgloseModal(D) {
  const { T, f, grupos } = desgloseDoc(D);
  const tasa = num(D.tasa);
  const pct = (x) => x == null || !isFinite(x) ? '—' : fmtNum(x, 1) + '%';
  const body = `${f < 0.9999 ? `<div class="banner" style="margin-bottom:12px">El documento tiene ${fmtNum(T.descPct)}% de descuento: la ganancia se calcula con el precio neto.</div>` : ''}
    <div class="kpis k4" style="margin-bottom:14px">
      <div class="kpi"><div class="l">Venta${T.ivaPct ? ' (sin I.V.A.)' : ''}</div><div class="v" style="font-size:23px">${fmtUSD(T.base)}</div>${tasa ? `<div class="d">${fmtBS(T.base * tasa)}</div>` : ''}</div>
      <div class="kpi"><div class="l">Costo</div><div class="v" style="font-size:23px">${fmtUSD(T.costo)}</div>${tasa ? `<div class="d">${fmtBS(T.costo * tasa)}</div>` : ''}</div>
      <div class="kpi"><div class="l">Ganancia${T.sinCosto ? ' (parcial)' : ''}</div><div class="v" style="font-size:23px;color:var(--ok)">${fmtUSD(T.gan)}</div>${tasa ? `<div class="d">${fmtBS(T.gan * tasa)}</div>` : ''}</div>
      <div class="kpi"><div class="l">% ganancia sobre costo</div><div class="v" style="font-size:23px">${T.costo ? pct(T.gan / T.costo * 100) : '—'}</div><div class="d">${T.base ? pct(T.gan / T.base * 100) + ' de la venta' : ''}</div></div>
    </div>
    ${grupos.map(g => { const d = g.dist; return `<section style="margin-bottom:16px">
      <div class="row" style="margin-bottom:6px">${grupoTag(g)}${d ? `<span class="pill ${esInter(d) ? 'warn' : 'info'}">${esInter(d) ? 'Internacional' : 'Nacional'}</span><span class="muted small">${esc(descTxt(d))}</span><a class="small" href="#/distribuidores/${esc(d.id)}" data-close>ficha</a>` : ''}
        <span style="margin-left:auto" class="small">venta <b class="mono">${fmtUSD(g.venta)}</b> · costo <b class="mono">${fmtUSD(g.costo)}</b> · ganancia <b class="mono" style="color:var(--ok)">${fmtUSD(g.gan)}</b>${g.costo ? ` (${pct(g.gan / g.costo * 100)})` : ''}</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Lista</th><th class="r">% desc.</th><th class="r">Costo unit.</th><th class="r">Precio unit.</th><th class="r">% ganancia</th><th class="r">Ganancia</th></tr></thead><tbody>
      ${g.lineas.map(l => `<tr><td><span class="code">${esc(l.it.codigo || modeloDesc(l.it.desc) || plainFirst(l.it.desc).slice(0, 40))}</span>${l.rec ? `<div class="muted small">incluye +${fmtNum(l.rec)}% de traerlo</div>` : ''}${g.o === 'manuel' || g.o === 'papa' ? '<div class="muted small">costo promedio del inventario</div>' : ''}</td><td class="num">${fmtQty(l.q)}</td><td class="num">${l.lista ? fmtUSD(l.lista) : '—'}</td><td class="num">${l.dto != null ? pct(l.dto) : '—'}</td><td class="num">${l.c != null ? fmtUSD(l.c) : '<span class="muted">sin costo</span>'}</td><td class="num">${fmtUSD(l.pu)}${f < 0.9999 ? `<div class="muted small">neto ${fmtUSD(l.pn)}</div>` : ''}</td><td class="num" style="${l.ganPct != null && l.ganPct < 0 ? 'color:var(--red)' : ''}">${pct(l.ganPct)}</td><td class="num">${l.gan != null ? fmtUSD(l.gan) : '—'}</td></tr>`).join('')}
      </tbody></table></div></section>`; }).join('')}
    ${T.sinCosto ? '<p class="muted small">Las líneas sin costo cuentan su precio completo como ganancia. Ponle el costo en la línea o el descuento en la ficha del distribuidor.</p>' : ''}`;
  const m = UI.modal({ title: `Costos y ganancia · ${D.numero || TIPOS[D.tipo]}`, wide: true, foot: false, body });
  $$('[data-close]', m.body).forEach(a => a.addEventListener('click', () => m.close()));
}

/* =====================================================================
   Resumen, clientes, inventario, distribuidor
   ===================================================================== */
const ventasActivas = () => Store.all('docs').filter(d => esVenta(d) && d.estado !== 'anulada' && !d.historial);
const pedidosPendientes = () => {
  const out = [];
  ventasActivas().forEach(d => (d.items || []).forEach(it => { if (it.origen === 'dist' && (it.pedido || 'por pedir') !== 'entregado') out.push({ d, it, dist: itDist(it) }); }));
  return out.sort((a, b) => (a.d.fecha || '').localeCompare(b.d.fecha || ''));
};
const COLOR_O = { manuel: '#15803D', dist: '#1D4ED8', papa: '#C2410C', libre: '#64748B' };
// Ventas de un documento por origen, con cada distribuidor por separado (claves 'manuel', 'papa', 'libre', 'dist|<id>').
const porOrigenDet = (d) => {
  const T = Calc.totals(d), f = T.sub ? T.base / T.sub : 1, out = {};
  (d.items || []).forEach(it => {
    const o = it.origen || 'libre'; const k = o === 'dist' ? 'dist|' + (itDist(it) || '') : o;
    const g = out[k] || (out[k] = { venta: 0, costo: 0, gan: 0, sinCosto: false });
    const imp = num(it.cant) * num(it.precio) * f; g.venta += imp;
    const c = it.costo === '' || it.costo == null ? null : num(it.costo);
    if (c == null){ if (o !== 'libre') g.sinCosto = true; } else g.costo += num(it.cant) * c;
  });
  Object.values(out).forEach(g => { g.gan = g.venta - g.costo; });
  return out;
};
// Orden fijo: inventarios, cada distribuidor (en el orden de la lista), sin asignar y libre.
const ordenOrigenes = (keys) => { const ds = Dists().map(x => 'dist|' + x.id); const rank = (k) => k === 'manuel' ? 0 : k === 'papa' ? 1 : k.startsWith('dist|') ? (ds.indexOf(k) < 0 ? 90 : 2 + ds.indexOf(k)) : 99; return keys.slice().sort((a, b) => rank(a) - rank(b)); };
const TONOS_DIST = ['#1D4ED8', '#0891B2', '#7C3AED', '#0F766E', '#4338CA', '#0369A1', '#6D28D9'];
const colorOrigen = (k) => { if (!k.startsWith('dist|')) return COLOR_O[k] || '#64748B'; const ds = Dists().map(x => 'dist|' + x.id); const i = ds.indexOf(k); return i < 0 ? '#94A3B8' : TONOS_DIST[i % TONOS_DIST.length]; };

/* barras apiladas por mes, por origen (con leyenda, separadores y detalle al pasar) */
function monthlyChart(host, docs) {
  const now = new Date(); const months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); }
  const data = months.map(m => ({ m, o: {}, gan: 0 }));
  docs.forEach(d => { const k = (d.fecha || '').slice(0, 7); const row = data.find(x => x.m === k); if (!row) return; const T = Calc.totals(d); Object.entries(porOrigenDet(d)).forEach(([o, g]) => { row.o[o] = (row.o[o] || 0) + g.venta; }); row.gan += T.gan; });
  const order = ordenOrigenes([...new Set(data.flatMap(r => Object.keys(r.o)))].filter(o => data.some(r => r.o[o] > 0)));
  data.forEach(r => order.forEach(o => { r.o[o] = r.o[o] || 0; }));
  const max = Math.max(1, ...data.map(r => order.reduce((a, o) => a + r.o[o], 0)));
  const step = (() => { const raw = max / 4; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; })();
  const top = step * Math.ceil(max / step);
  const W = 640, H = 240, L = 54, R = 8, T = 10, B = 26, cw = (W - L - R) / data.length, bw = Math.min(28, cw * 0.62);
  const y = (val) => T + (H - T - B) * (1 - val / top);
  const mes = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  let g = '';
  for (let t = 0; t <= top + 1e-9; t += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#E7ECF1"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="13" fill="#5B6778" font-family="IBM Plex Mono">${t >= 1000 ? '$' + (t / 1000) + 'k' : '$' + t}</text>`;
  data.forEach((r, i) => {
    const x = L + i * cw + (cw - bw) / 2; let acc = 0;
    const segs = order.filter(o => r.o[o] > 0);
    segs.forEach((o, j) => {
      const v0 = acc, v1 = acc + r.o[o]; acc = v1;
      const y0 = y(v0), y1 = y(v1); const h = Math.max(0, y0 - y1 - (j > 0 ? 2 : 0));
      const isTop = j === segs.length - 1, rr = isTop ? Math.min(4, h / 2) : 0;
      const yy = y1, bot = yy + h;
      g += isTop && rr > 0 ? `<path d="M${x},${bot} V${yy + rr} Q${x},${yy} ${x + rr},${yy} H${x + bw - rr} Q${x + bw},${yy} ${x + bw},${yy + rr} V${bot} Z" fill="${colorOrigen(o)}"/>` : `<rect x="${x}" y="${yy}" width="${bw}" height="${h}" fill="${colorOrigen(o)}"/>`;
    });
    const [yy, mm] = r.m.split('-');
    g += `<text x="${L + i * cw + cw / 2}" y="${H - 8}" text-anchor="middle" font-size="13" fill="#5B6778">${mes[+mm - 1]}${mm === '01' || i === 0 ? ' ' + yy.slice(2) : ''}</text>`;
    g += `<rect x="${L + i * cw}" y="${T}" width="${cw}" height="${H - T - B}" fill="transparent" data-i="${i}"/>`;
  });
  host.innerHTML = `<div class="legend">${order.map(o => `<span><i style="background:${colorOrigen(o)}"></i>${esc(nombreOrigen(o))}</span>`).join('')}</div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por mes y origen">${g}</svg><div class="tip hide"></div></div>

const statsCliente = (cid) => {
  const ds = Store.all('docs').filter(d => d.clienteId === cid);
  const vs = ds.filter(d => esVenta(d) && d.estado !== 'anulada');
  let total = 0, saldo = 0, ultima = '';
  vs.forEach(d => { const T = Calc.totals(d); total += T.total; saldo += Math.max(0, T.saldo); if ((d.fecha || '') > ultima) ultima = d.fecha; });
  return { docs: ds, ventas: vs, total, saldo, ultima, ofertas: ds.filter(d => d.tipo === 'oferta').length };
};

    let raw = hid.value.split(/\s*[›>]\s*/).map(x => x.trim()).filter(Boolean), tocado = false, auto = '';
    // marca y grupo puestos solos: se actualizan mientras no los cambies tú
    const puestos = {}; const poner = (k, val) => { const el = $(`[data-k="${k}"]`, m.body); if (!el) return; const cur = el.value.trim(); if ((!cur && val) || (cur && cur === puestos[k])) { el.value = val || ''; puestos[k] = val || ''; } };
    const propio = (k) => { const v = $(`[data-k="${k}"]`, m.body).value; return v.trim() && v.trim() === puestos[k] ? '' : v; };
    const ctx = () => ({ marca: $('[data-k="marca"]', m.body).value, codigo: $('[data-k="codigo"]', m.body).value });

    const subsDe = (c) => { const n = new Map(); Catalog.items.forEach(x => { const r = CatTienda.ruta(x); if (r[1] !== c) return; for (let i = 3; i <= Math.min(r.length, 4); i++) { const k = r.slice(2, i).join(' › '); n.set(k, (n.get(k) || 0) + 1); } }); return Array.from(n.entries()).sort((a, b) => a[0].localeCompare(b[0], 'es', { numeric: true })).slice(0, 400); };
    const sugerencia = () => CatAuto.sugerir(Object.assign({}, p, { codigo: $('[data-k="codigo"]', m.body).value, nombre: $('[data-k="nombre"]', m.body).value, descripcion: $('[data-k="descripcion"]', m.body).value, categoria: propio('categoria'), marca: propio('marca') }));
    const pintar = () => {
      hid.value = raw.join(' › ');
      const v = CatAuto.rutaVista(raw[0], raw.slice(1), ctx());
      const ok = !CatAuto.enOtros(v);
      fam.value = ok ? v[0] : ''; llenarCats(fam.value); cat.value = ok ? v[1] || '' : '';
      if (document.activeElement !== sub) sub.value = ok ? v.slice(2).join(' › ') : '';
      $('#dl-csub', m.body).innerHTML = cat.value ? subsDe(cat.value).map(([k, n]) => `<option value="${esc(k)}">${n} en el catálogo</option>`).join('') : '';
      const sg = sugerencia(), sv = sg ? CatAuto.rutaVista(sg.webCat, sg.webSubs, ctx()) : [];
      const igual = sg && sv.join('|') === v.join('|');
      info.innerHTML = (!raw.length ? '<span class="muted">Sin categoría: elige familia y categoría.</span>'
          : ok ? `Sale en la tienda en <b>${esc(v.join(' › '))}</b>${auto ? ` <span class="pill ok">puesta sola · ${esc(auto)}</span>` : ''}`
          : `<span style="color:var(--red)">“${esc(raw[0])}” no es una categoría de la tienda: saldría en <b>Otros Productos</b>.</span>`)
        + (sg && !igual ? `<div style="margin-top:4px"><span class="muted">Sugerida (${esc(sg.como)}${sg.ref ? ' · ' + esc(sg.ref) : ''}):</span> <b>${esc(sv.join(' › '))}</b> <button type="button" class="btn sm" data-cusar>Usar</button></div>` : '');
      const u = $('[data-cusar]', info); if (u) u.onclick = () => set([sg.webCat].concat(sg.webSubs), sg.como);
    };

      raw = c ? [CatAuto.raizDe(c)].concat(s2) : fam.value ? [fam.value] : [];
      poner('categoria', c); pintar(); };
    const set = (r, como) => { raw = r.filter(Boolean); auto = como || ''; tocado = true; poner('categoria', CatAuto.grupoDe(raw[0], raw.slice(1), ctx())); pintar(); };
    fam.onchange = () => { llenarCats(fam.value); cat.value = ''; sub.value = ''; desdeSelects(); };
    cat.onchange = () => { sub.value = ''; desdeSelects(); };
    sub.oninput = debounce(desdeSelects, 250);
    // mientras escribes código, nombre o descripción: si aún no tiene categoría, se pone sola
    const intentar = () => { if (tocado && !auto) return; if (raw.length && !auto) { pintar(); return; } const sg = sugerencia(); if (sg) { raw = [sg.webCat].concat(sg.webSubs); auto = sg.como; poner('marca', sg.marca); poner('categoria', CatAuto.grupoDe(sg.webCat, sg.webSubs, ctx())); } else if (auto) { raw = []; auto = ''; poner('marca', ''); poner('categoria', ''); } pintar(); };
    ['codigo', 'nombre', 'descripcion', 'categoria'].forEach(k => { const el = $(`[data-k="${k}"]`, m.body); if (el) el.addEventListener('input', debounce(intentar, 400)); });
    if (!raw.length) intentar(); else pintar();
    return { set };
  })();

  if (cc) cc.onclick = () => { const c = mc.c; const set = (k, v) => { const el = $(`[data-k="${k}"]`, m.body); if (el && v) el.value = v; };
    if (c.n && c.n !== c.m) set('nombre', c.n); set('descripcion', c.desc); set('marca', (c.marca || '').toUpperCase());

    UI.toast('Copiado del catálogo: revisa y guarda'); };
}

/* ---------------- métricas por empleado ---------------- */
const esDe = (d, nombre, campo = 'vendedor') => nombre === '-' ? !d[campo] : normKey(d[campo]) === normKey(nombre);
/* ventas de un documento repartidas por origen (con el descuento del documento) */
const lineasPorOrigen = (d, acc) => {
  const T = Calc.totals(d); const f = T.sub ? T.base / T.sub : 1;
  (d.items || []).forEach(it => {
    const o = it.origen || 'libre'; const k = o === 'dist' ? 'dist|' + (itDist(it) || '') : o;
    const x = acc[k] || (acc[k] = { k, o, venta: 0, costo: 0, n: 0, sinCosto: false });
    const v = num(it.cant) * num(it.precio) * f; x.venta += v; x.n++;
    if (it.costo === '' || it.costo == null) { if (o !== 'libre') x.sinCosto = true; } else x.costo += num(it.cant) * num(it.costo);
  });
  return acc;
};
const nombreOrigen = (k) => k.startsWith('dist|') ? distNombre(k.slice(5)) : origenNombre(k);
const tagOrigen = (k) => k.startsWith('dist|') ? `<span class="own dist" style="--c:${colorOrigen(k)}">${esc(distNombre(k.slice(5)))}</span>` : ownTag(k);

/* Lotes FIFO: cada compra al inventario es un lote; las ventas de ese inventario se comen los lotes
   del más viejo al más nuevo. Así se sabe cuánto se vendió de lo que compró cada quien. */
const Lotes = {
  dirty: true, porDueno: new Map(),
  build() {
    if (!this.dirty) return this.porDueno; Calc.build();
    const out = new Map(); const push = (k, l) => { if (!out.has(k)) out.set(k, []); out.get(k).push(l); };
    Store.all('productos').forEach(p => {
      const ms = (Calc.movs.get(p.id) || []).filter(x => x.aplicado && x.doc.estado !== 'anulada');
      ['manuel', 'papa'].forEach(inv => {
        const lots = []; const b = (p.inv || {})[inv];
        if (b && num(b.cant) > 0) lots.push({ dueno: '', inicial: true, p, inv, fecha: '', doc: null, cant: num(b.cant), costo: num(b.costo), resto: num(b.cant), vend: 0, ingreso: 0 });
        ms.filter(x => x.inv === inv).forEach(x => {
          if (x.delta > 0) { const l = { dueno: x.doc.tipo === 'compra' ? (x.doc.comprador || '') : '', ajuste: x.doc.tipo === 'ajuste', p, inv, fecha: x.doc.fecha || '', doc: x.doc, cant: x.delta, costo: num(x.item.costo) || num(x.item.precio), resto: x.delta, vend: 0, ingreso: 0 }; lots.push(l); if (x.doc.tipo === 'compra') push(normKey(l.dueno) || '-', l); return; }
          let q = -x.delta; const venta = esVenta(x.doc); const T = venta ? Calc.totals(x.doc) : null; const pu = venta ? num(x.item.precio) * (T.sub ? T.base / T.sub : 1) : 0;
          for (const l of lots) { if (q <= 1e-9) break; if (l.resto <= 1e-9) continue; const t = Math.min(l.resto, q); l.resto -= t; q -= t; if (venta) { l.vend += t; l.ingreso += t * pu; } }
        });
      });
    });
    this.porDueno = out; this.dirty = false; return out;
  },
  de(nombre) { return this.build().get(nombre === '-' ? '-' : normKey(nombre)) || []; }
};
Bus.on('data', (c) => { if (c === 'docs' || c === 'productos') Lotes.dirty = true; });

const statsEmpleado = (nombre, per) => {
  const ventas = ventasActivas().filter(d => esDe(d, nombre) && enPeriodo(d.fecha, per));
  const porO = {}; let tot = 0, gan = 0, costo = 0, saldo = 0;
  ventas.forEach(d => { const T = Calc.totals(d); tot += T.base; gan += T.gan; costo += T.costo; saldo += Math.max(0, T.saldo); lineasPorOrigen(d, porO); });
  const sum = (pred) => Object.values(porO).filter(pred).reduce((a, x) => ({ venta: a.venta + x.venta, costo: a.costo + x.costo }), { venta: 0, costo: 0 });
  const dist = sum(x => x.o === 'dist'), propia = sum(x => x.o === 'manuel' || x.o === 'papa'), libre = sum(x => x.o === 'libre');
  const ofertas = Store.all('docs').filter(d => d.tipo === 'oferta' && esDe(d, nombre) && enPeriodo(d.fecha, per));
  const acept = ofertas.filter(d => d.estado === 'aceptada' || d.convertidoA).length, rech = ofertas.filter(d => d.estado === 'rechazada').length;
  const compras = Store.all('docs').filter(d => d.tipo === 'compra' && d.estado !== 'anulada' && esDe(d, nombre, 'comprador') && enPeriodo(d.fecha, per));
  const lotes = Lotes.de(nombre).filter(l => enPeriodo(l.fecha, per));
  const inv = lotes.reduce((a, l) => ({ cant: a.cant + l.cant, costo: a.costo + l.cant * l.costo, vend: a.vend + l.vend, ingreso: a.ingreso + l.ingreso, costoVend: a.costoVend + l.vend * l.costo, resto: a.resto + l.resto, valorResto: a.valorResto + l.resto * l.costo }), { cant: 0, costo: 0, vend: 0, ingreso: 0, costoVend: 0, resto: 0, valorResto: 0 });
  return { ventas, n: ventas.length, tot, gan, costo, saldo, porO, dist, propia, libre, ofertas, acept, rech, compras, totCompras: compras.reduce((a, d) => a + Calc.totals(d).total, 0), lotes, inv };
};

  const m = UI.modal({ title: isNew ? 'Nuevo empleado' : e.nombre, body: `<div class="grid g2">
      <label class="fld"><span>Nombre</span><input class="inp" data-k="nombre" value="${esc(e.nombre)}"></label>
      <label class="fld"><span>Puesto</span><input class="inp" data-k="puesto" value="${esc(e.puesto || '')}" placeholder="Vendedor, despacho…"></label>

      <label class="fld"><span>Correo con el que entra</span><input class="inp" data-k="correo" value="${esc(e.correo || '')}" placeholder="Para marcarlo como vendedor automáticamente"></label>
      <label class="fld"><span>Comisión sobre ventas %</span><input class="inp num" inputmode="decimal" data-k="comision" value="${num(e.comision) ? esc(e.comision) : ''}" placeholder="0"></label>
      <label class="fld"><span>&nbsp;</span><label class="chk"><input type="checkbox" data-k="activo" ${e.activo !== false ? 'checked' : ''}> Activo (aparece como vendedor)</label></label>
      <label class="fld" style="grid-column:1/-1"><span>Notas</span><textarea class="inp" data-k="notas" rows="2">${esc(e.notas || '')}</textarea></label></div>`,
    foot: [].concat(isNew ? [] : [['Eliminar', 'red', async (c) => { if (await UI.confirm('¿Eliminar este empleado? Sus ventas quedan con su nombre.', { ok: 'Eliminar', danger: true })) { Store.del('empleados', e.id); c(); Route.nav('#/empleados'); } }]])
      .concat([['Cancelar', '', c => c()], ['Guardar', 'pri', (c) => {
        const old = e.nombre;
        $$('[data-k]', m.body).forEach(i => { const k = i.dataset.k; e[k] = i.type === 'checkbox' ? i.checked : k === 'comision' ? num(i.value) : i.value.trim(); });
        if (!e.nombre) { UI.toast('Escribe el nombre'); return; }

        c(); App.render(); UI.toast('Empleado guardado');
      }]])
  });
}

const descTxt = (p) => { const g = descDist(p), n = reglasDe(p).length; return [g != null ? fmtNum(g) + '% general' : '', n ? `${n} regla${n === 1 ? '' : 's'}` : '', esInter(p) && recargoInter(p) ? `+${fmtNum(recargoInter(p))}% de traerlo` : ''].filter(Boolean).join(' · ') || '—'; };
const nuevoDist = (alcance) => ({ id: uid('pv_'), nombre: '', empresa: '', tipo: 'Distribuidor', alcance, rif: '', telefono: '', correo: '', direccion: '', descuento: 0, web: '', notas: '', reglas: [], logistica: {} });
Views.proveedores = () => Route.nav('#/distribuidores', { replace: true });
Views.proveedor = (v, id) => Route.nav('#/distribuidores/' + (id || ''), { replace: true });
Views.distribuidores = (v, id) => { if (id) return fichaDistribuidor(v, id); return listaDistribuidores(v); };

    <div class="sub">A quién le compras. Los <b>nacionales</b> pueden darte descuentos distintos por producto, grupo o categoría; en los <b>internacionales</b> anotas lo que cuesta y tarda traer la mercancía, y eso se suma a tu costo.</div></div>
    <div class="row" style="margin-bottom:12px"><input class="inp" style="flex:1 1 240px" type="search" placeholder="Buscar distribuidor" value="${esc(F.q)}" data-q>
    <div class="seg" data-seg>${[['', 'Todos'], ['nacional', 'Nacionales'], ['internacional', 'Internacionales']].map(([k, l]) => `<button type="button" data-v="${k}" class="${F.alc === k ? 'on' : ''}">${l}</button>`).join('')}</div></div><div id="lst"></div>`;
  const paint = () => {

    const rows = Store.all('proveedores').filter(p => (!F.alc || (p.alcance || 'nacional') === F.alc) && (!q || normTxt([p.nombre, p.empresa, p.rif, p.telefono, p.correo, (p.logistica || {}).pais].join(' ')).includes(q)))
      .map(p => { const cs = compras.filter(d => d.proveedorId === p.id); return { p, n: cs.length, tot: cs.reduce((a, d) => a + Calc.totals(d).total, 0), saldo: cs.reduce((a, d) => a + Math.max(0, Calc.totals(d).saldo), 0), ult: cs.reduce((a, d) => (d.fecha || '') > a ? d.fecha : a, '') }; })
      .sort((a, b) => (b.ult || '').localeCompare(a.ult || '') || a.p.nombre.localeCompare(b.p.nombre));
    $('#lst', v).innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nombre</th><th>Tipo</th><th class="hm">Descuento</th><th class="hm">Teléfono</th><th class="r">Compras</th><th class="r">Total</th><th class="r">Por pagar</th><th class="hm">Última</th></tr></thead><tbody>
      ${rows.map(({ p, n, tot, saldo, ult }) => `<tr class="click" data-id="${esc(p.id)}"><td><b style="font-weight:500">${esc(p.nombre)}</b>${p.empresa ? `<div class="muted small">${esc(p.empresa)}</div>` : ''}</td><td><span class="pill ${esInter(p) ? 'warn' : 'info'}">${esInter(p) ? 'Internacional' : 'Nacional'}</span>${esInter(p) && (p.logistica || {}).pais ? ` <span class="muted small">${esc(p.logistica.pais)}</span>` : ''}</td><td class="hm small">${esc(descTxt(p))}</td><td class="hm">${esc(p.telefono || '')}</td><td class="num">${n}</td><td class="num">${fmtUSD(tot)}</td><td class="num" style="${saldo > 0.005 ? 'color:var(--red)' : ''}">${saldo > 0.005 ? fmtUSD(saldo) : '—'}</td><td class="hm mono small">${esc(fmtFecha(ult))}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="panel empty">No hay distribuidores con esa búsqueda.</div>';

/* productos del catálogo que surte un distribuidor (si aún no surte nada, todo el catálogo) */
const itemsDeDist = (p) => { const xs = Catalog.items.filter(c => { const d = distDeCat(c); return d && d.id === p.id; }); return { items: xs.length ? xs : Catalog.items, todos: !xs.length }; };
/* árbol de categorías (como la tienda) de una lista de productos: [{ruta, n}] */
const arbolCategorias = (items, maxNivel = 6) => {
  const m = new Map();
  items.forEach(c => { const r = CatTienda.ruta(c); for (let i = 1; i <= Math.min(r.length, maxNivel); i++) { const k = r.slice(0, i).join('|||'); const x = m.get(k); if (x) x.n++; else m.set(k, { ruta: r.slice(0, i), n: 1 }); } });
  return Array.from(m.values()).sort((a, b) => CatTienda.famIdx(a.ruta[0]) - CatTienda.famIdx(b.ruta[0]) || a.ruta.join(' › ').localeCompare(b.ruta.join(' › '), 'es', { numeric: true }));
};

function fichaDistribuidor(v, id) {
  let p = Store.get('proveedores', id), isNew = false;
  if (!p && App.pendingProv && App.pendingProv.id === id) { p = App.pendingProv; isNew = true; }
  if (!p) { v.innerHTML = '<div class="panel empty">Este distribuidor no existe.<br><br><a class="btn" href="#/distribuidores">Ver distribuidores</a></div>'; return; }
  p = clone(p); p.reglas = Array.isArray(p.reglas) ? p.reglas : []; p.logistica = p.logistica || {}; if (!p.alcance) p.alcance = 'nacional';
  const cs = comprasDe(p);
  const act = cs.filter(d => d.estado !== 'anulada');

  $$('[data-r]', v).forEach(b => b.onclick = () => ({ cat: catModal, grupo: () => grupoModal(null), prod: prodModal })[b.dataset.r]());
  let probado = null;
  const probar = () => {

  };
  buscarCat($('#probar', v), (c) => { probado = c; probar(); }, 'Buscar un producto para ver qué descuento le toca');
  paintReglas();

  /* ----- historial ----- */
  const paintHist = () => {

    $$('[data-t]', v).forEach(x => x.classList.toggle('on', x.dataset.t === F.tab));
    if (F.tab === 'ventas') {

      box.innerHTML = vc.length ? `<p class="muted small" style="margin:0 0 8px">Lo que vendiste saliendo de ${esc(p.nombre)}: venta ${fmtUSD(vcVenta)} · costo ${fmtUSD(vcCosto)} · ganancia ${fmtUSD(vcVenta - vcCosto)}.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Producto</th><th class="r">Cant.</th><th class="hm">Cliente</th><th class="r">Venta</th><th class="r">Costo</th><th>Pedido</th></tr></thead><tbody>${vc.map(({ d, it }) => `<tr class="click" data-doc="${esc(d.id)}"><td class="mono small">${esc(fmtFecha(d.fecha))}<div class="mono small">${esc(d.numero)}</div></td><td><span class="code">${esc(it.codigo || '')}</span></td><td class="num">${fmtQty(num(it.cant))}</td><td class="hm">${esc(docParty(d))}</td><td class="num">${fmtUSD(num(it.cant) * num(it.precio))}</td><td class="num">${it.costo === '' || it.costo == null ? '—' : fmtUSD(num(it.cant) * num(it.costo))}</td><td class="small">${esc(PL[it.pedido || 'por pedir'] || it.pedido)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Aún no hay ventas que salgan de ${esc(p.nombre)}. En cada venta, pon el origen de la línea en <b>${esc(p.nombre)}</b>.</div>`;
      $$('[data-doc]', box).forEach(tr => tr.onclick = () => Route.nav('#/doc/' + tr.dataset.doc));
      return;
    }
    if (F.tab === 'productos') { const rows = Array.from(prods.values()).sort((a, b) => (b.ult || '').localeCompare(a.ult || '')); box.innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Último costo</th><th class="hm">Última vez</th></tr></thead><tbody>${rows.map(r => `<tr><td class="code">${esc(r.k)}</td><td class="num">${fmtQty(r.cant)}</td><td class="num">${fmtUSD(r.costo)}</td><td class="hm mono small">${esc(fmtFecha(r.ult))}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Sin compras todavía.</div>'; return; }
    box.innerHTML = cs.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Número</th><th class="hm">Inventario</th><th class="hm">Comprado por</th><th class="r">Total</th><th>Estado</th></tr></thead><tbody>${cs.map(d => `<tr class="click ${d.estado === 'anulada' ? 'anul' : ''}" data-doc="${esc(d.id)}"><td class="mono small">${esc(fmtFecha(d.fecha))}</td><td class="mono small">${esc(d.numero)}</td><td class="hm">${ownTag(d.inventario)}</td><td class="hm small">${esc(d.comprador || '—')}</td><td class="num">${fmtUSD(Calc.totals(d).total)}</td><td>${estadoPill(d)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Sin compras todavía.</div>';
    $$('[data-doc]', box).forEach(tr => tr.onclick = () => Route.nav('#/doc/' + tr.dataset.doc));
  };
  $('[data-tabs]', v).addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; F.tab = b.dataset.t; paintHist(); });

  /* ----- datos y guardar ----- */
  $$('[data-k]', v).forEach(i => i.addEventListener(i.tagName === 'SELECT' ? 'change' : 'input', () => { p[i.dataset.k] = i.dataset.k === 'descuento' ? num(i.value) : i.value; setDirty(); if (i.dataset.k === 'alcance') showAlc(); if (i.dataset.k === 'descuento') { paintLog(); paintReglas(); probar(); } }));
  const surte = () => { p.surte = Object.assign({ scraping: false, marcas: '' }, p.surte || {}); return p.surte; };
  $('[data-sc]', v).addEventListener('change', e => { surte().scraping = e.target.checked; setDirty(); });
  $('[data-sm]', v).addEventListener('input', e => { surte().marcas = e.target.value; setDirty(); });
  App.guard = async () => !dirty || !p.nombre || UI.confirm('Hay cambios sin guardar. ¿Salir sin guardar?', { ok: 'Salir sin guardar', danger: true });
  $('[data-save]', v).onclick = () => {
    p.nombre = String(p.nombre || '').trim(); if (!p.nombre) { UI.toast('Escribe el nombre'); return; }
    const dup = Store.all('proveedores').find(x => x.id !== p.id && normKey(x.nombre) === normKey(p.nombre)); if (dup) { UI.toast('Ya existe un distribuidor con ese nombre'); return; }
    p.tipo = 'Distribuidor';
    Store.put('proveedores', p); dirty = false; App.guard = null; App.pendingProv = null;
    cs.filter(d => d.proveedor && d.proveedor.nombre !== p.nombre).forEach(d => { d.proveedor = { nombre: p.nombre }; Store.put('docs', d, { quiet: true }); });
    UI.toast('Guardado'); if (isNew) Route.nav('#/distribuidores/' + p.id, { replace: true }); else App.render();
  };
  const del = $('[data-del]', v); if (del) del.onclick = async () => { if (!(await UI.confirm(cs.length ? `Tiene ${cs.length} compras: quedan registradas con su nombre. ¿Eliminar el distribuidor?` : '¿Eliminar este distribuidor?', { ok: 'Eliminar', danger: true }))) return; cs.forEach(d => { d.proveedorId = null; Store.put('docs', d, { quiet: true }); }); Store.del('proveedores', p.id); dirty = false; App.guard = null; Route.nav('#/distribuidores'); };
  const nc = $('[data-compra]', v); if (nc) nc.onclick = () => { App.pendingDoc = newDoc('compra', { proveedorId: p.id, proveedor: { nombre: p.nombre } }); Route.nav('#/nuevo/compra'); };
  paintHist();
}

/* =====================================================================
   PUENTE CON LA TIENDA WEB (mismo Supabase)
   - public.clientes  → aparecen en Clientes (marcados "Tienda web")
   - public.pedidos   → se ven en la ficha del cliente
   Si se editan aquí, se actualiza también su cuenta de la tienda.
   ===================================================================== */
const Tienda = (() => {
  let tipos = [], pedidos = [], ok = false, loading = false, last = 0, error = '';
  const sb = () => Sync.online() ? Sync.sb : null;

  /* pedidos de la tienda sin atender (para el Resumen) */
  const porAtender = () => pedidos.filter(p => p.estado === 'enviado' && !p.archivado);

  /* cliente de la tienda → ficha del panel */
  const aPanel = (t, rec) => {
    const empresa = (t.empresa || '').trim(), nombre = (t.nombre || '').trim();
    rec = rec || { id: 'c_web_' + normKey(t.email), descuento: 0, notas: '', extras: [] };
    Object.assign(rec, {
      tiendaEmail: t.email, tiendaModo: empresa ? 'empresa' : 'nombre', tiendaAct: t.actualizado, tiendaCreado: t.creado, tiendaActivo: t.activo !== false,
      nombre: empresa || nombre || t.email, contacto: empresa ? nombre : (rec.contacto || ''),
      correo: t.email, rif: t.rif || '', telefono: t.telefono || '', direccion: t.direccion || '',
      tipo: (tipos.find(x => x.id === t.tipo_id) || {}).nombre || t.tipo_id || rec.tipo || ''
    });
    return rec;
  };

  const cargar = async ({ force } = {}) => {
    const s = sb(); if (!s || loading) return false;
    if (!force && Date.now() - last < 60000) return ok;
    loading = true; error = '';
    try {
      const [rt, rc, rp] = await Promise.all([
        s.from('tipos_cliente').select('*').order('orden'),
        s.from('clientes').select('*').eq('es_admin', false),
        s.from('pedidos').select('*').order('creado', { ascending: false }).limit(1000)
      ]);
      if (rc.error) throw rc.error;
      tipos = rt.data || []; pedidos = rp.error ? [] : (rp.data || []);
      let n = 0;
      (rc.data || []).forEach(t => {
        const email = String(t.email || '').toLowerCase(); if (!email) return;
        let rec = Store.all('clientes').find(x => x.tiendaEmail === email) || Store.all('clientes').find(x => x.correo && x.correo.toLowerCase() === email);
        if (!rec) { const m = findCliente({ nombre: t.empresa || t.nombre, rif: t.rif }); if (m && !m.tiendaEmail) rec = m; }
        if (rec && rec.tiendaEmail && rec.tiendaAct && t.actualizado && t.actualizado <= rec.tiendaAct) return; // sin cambios en la tienda
        const out = aPanel(t, rec ? clone(rec) : null);
        Store.put('clientes', out, { quiet: true }); n++;
      });
      if (n) Bus.emit('data', 'clientes');
      ok = true; last = Date.now();
      setTimeout(() => subirNuevos(), 50);
    } catch (e) { console.warn('Tienda', e); error = /permission|policy|denied|JWT/i.test(e.message || '') ? 'Sin permiso para leer los clientes de la tienda' : 'No se pudo leer la tienda'; ok = false; }
    loading = false; Bus.emit('tienda');
    return ok;
  };

  /* cliente creado en /ventas con correo → también en la tienda (así lo ves en /admin y,
     cuando se registre con ese correo, su cuenta queda enlazada a esta ficha) */
  const crear = async (c) => {
    const s = sb(); const email = String(c.correo || '').trim().toLowerCase();
    if (!s || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { ok: false, msg: 'sin correo' };
    const tp = tipos.find(x => normKey(x.nombre) === normKey(c.tipo) || x.id === c.tipo);
    const empresa = !!(c.contacto && c.contacto.trim());
    const fila = { email, nombre: (empresa ? c.contacto : c.nombre) || null, empresa: empresa ? c.nombre : null, rif: c.rif || null, telefono: c.telefono || null, direccion: c.direccion || null };
    if (tp) fila.tipo_id = tp.id;
    let { data, error: er } = await s.from('clientes').insert(fila).select().maybeSingle();
    if (er && /duplicate|unique|already exists/i.test(er.message || '')) { const r = await s.from('clientes').select('*').eq('email', email).maybeSingle(); data = r.data; er = r.error; }
    if (er || !data) { const r1 = Store.get('clientes', c.id); if (r1) { r1.tiendaError = Date.now(); Store.put('clientes', r1, { quiet: true }); } return { ok: false, msg: er ? er.message : 'no se pudo crear' }; }
    const rec = Store.get('clientes', c.id) || c; Object.assign(rec, { tiendaEmail: email, tiendaModo: data.empresa ? 'empresa' : 'nombre', tiendaAct: data.actualizado, tiendaCreado: data.creado, tiendaActivo: data.activo !== false });
    Store.put('clientes', rec, { quiet: true });
    return { ok: true };
  };
  const subirNuevos = async () => {
    const pend = Store.all('clientes').filter(c => !c.tiendaEmail && c.correo && /@/.test(c.correo) && !(c.tiendaError && Date.now() - c.tiendaError < 864e5));
    for (const c of pend) { try { await crear(c); } catch (e) { /* sigue con el próximo */ } }
    if (pend.length) Bus.emit('data', 'clientes');
  };

  /* ficha del panel → cuenta de la tienda */
  const guardar = async (c) => {
    const s = sb(); if (!s || !c.tiendaEmail) return { ok: false, msg: 'sin conexión' };
    const upd = { rif: c.rif || null, telefono: c.telefono || null, direccion: c.direccion || null };
    if (c.tiendaModo === 'empresa') { upd.empresa = c.nombre || null; upd.nombre = c.contacto || null; } else upd.nombre = c.nombre || null;
    const tp = tipos.find(x => normKey(x.nombre) === normKey(c.tipo) || x.id === c.tipo); if (tp) upd.tipo_id = tp.id;
    const { data, error: er } = await s.from('clientes').update(upd).eq('email', c.tiendaEmail).select().maybeSingle();
    if (er) return { ok: false, msg: er.message };
    if (data) { const rec = Store.get('clientes', c.id); if (rec) { rec.tiendaAct = data.actualizado; Store.put('clientes', rec, { quiet: true }); } }
    return { ok: true };
  };

  const pedidosDe = (c) => c && c.tiendaEmail ? pedidos.filter(p => p.cliente_email === c.tiendaEmail) : [];
  const cambiarEstado = async (id, estado) => {
    const s = sb(); if (!s) return false;
    const { error: er } = await s.from('pedidos').update({ estado }).eq('id', id);
    if (er) { UI.toast('No se pudo cambiar el estado: ' + er.message, 3500); return false; }
    const p = pedidos.find(x => x.id === id); if (p) p.estado = estado; return true;
  };
  /* pedido web → oferta o nota en el panel */
  const aDocumento = (p, tipo) => {
    const c = Store.all('clientes').find(x => x.tiendaEmail === p.cliente_email);
    const items = (p.items || []).map(it => {
      const cod = it.modelo || it.sku || '';
      const desc = [`*Ref / Modelo: ${cod}*${it.marca ? ' — ' + it.marca : ''}`, it.descripcion || it.nombre || ''].filter(Boolean).join('\n');
      const base = { id: uid('i'), codigo: cod, desc, cant: num(it.cantidad) || 1, precio: num(it.precio_unit ?? it.precio) };
      const a = (() => { const pr = cod ? findProductoByCodigo(cod) : null; if (pr) { const s = Calc.st(pr.id); const inv = s.manuel.cant > 0 ? 'manuel' : s.papa.cant > 0 ? 'papa' : null; if (inv) return { origen: inv, productoId: pr.id, costo: round2(s[inv].costo) || '' }; } const cc = cod ? catalogoByCodigo(cod) : null; if (cc) { const dd = distDeCat(cc); return Object.assign({ origen: 'dist', dist: dd ? dd.id : '', productoId: null, costo: '' }, costoLinea(cc, dd)); } return { origen: 'libre', productoId: null, costo: '' }; })();
      return Object.assign(base, a, tipo === 'nota' && a.origen === 'dist' ? { pedido: 'por pedir' } : {});
    });
    const d = newDoc(tipo, { clienteId: c ? c.id : null, cliente: c ? docClienteSnap(c) : { nombre: p.cliente_email, rif: '', direccion: '', extras: [] }, items, pedidoWeb: p.id, notas: [p.nota_cliente ? 'Nota del cliente: ' + p.nota_cliente : '', `Pedido web #${p.id}`].filter(Boolean).join('\n') });
    App.pendingDoc = d; App.pendingEditor = true; Route.nav('#/nuevo/' + tipo);
  };
  return { cargar, guardar, crear, pedidosDe, porAtender, cambiarEstado, aDocumento, get tipos() { return tipos; }, get error() { return error; }, get ok() { return ok; } };
})();
/* =====================================================================
   PRODUCTOS: /ventas ⇄ /admin ⇄ /tienda (tabla productos_web, la de /admin → Productos)
   - Lo público (nombre, marca, categoría de la tienda, descripción, precio, fotos, publicado/borrador)
     vive en productos_web: /admin lo edita, la tienda lo muestra, /ventas lo lee y lo escribe.
   - Lo privado (existencia, costos, dueño) sigue solo en /ventas.
   - Un producto nuevo hecho en /ventas nace como BORRADOR: no sale en la tienda hasta publicarlo.
   - Se compara por modelo (sin guiones, espacios ni mayúsculas). Si se edita en dos lados, gana lo más reciente.
   ===================================================================== */
const WebProd = (() => {
  let ocultos = new Set(), last = 0, loading = false, error = '', filas = 0;
  const sb = () => Sync.online() ? Sync.sb : null;
  const estado = (p) => p.tienda || 'publicado';           // los que ya tenías antes de esto: publicados (como hasta ahora)
  const publicado = (p) => estado(p) === 'publicado';
  const ruta = (p) => [p.webCat || '', ...(p.webSubs || [])].filter(Boolean);
  const faltan = (p) => [!String(p.marca || '').trim() && 'marca', !p.webCat && 'categoría de la tienda'].filter(Boolean);
  const cargar = async ({ force } = {}) => {
    const s = sb(); if (!s || loading) return false;
    if (!force && Date.now() - last < 120000) return true;
    loading = true; error = '';
    try {
      const [rw, ro] = await Promise.all([s.from('productos_web').select('*'), s.from('productos_ocultos').select('modelo')]);
      if (rw.error) throw rw.error;
      ocultos = new Set((ro.data || []).map(x => normKey(x.modelo)));
      const porClave = new Map(Store.all('productos').map(p => [normKey(p.codigo), p]));
      let n = 0;
      (rw.data || []).forEach(r => {
        const k = normKey(r.modelo); if (!k) return;
        const cur = porClave.get(k);
        if (cur && cur.webAct && r.actualizado && r.actualizado <= cur.webAct) return;     // ya estaba al día
        const p = cur ? clone(cur) : { id: 'p_web_' + k, codigo: r.modelo, unidad: 'UND', inv: {}, activo: true, notas: '', deWeb: true };
        Object.assign(p, {
          nombre: r.nombre || p.nombre || '', marca: r.marca || p.marca || '', descripcion: r.descripcion || p.descripcion || '',
          webCat: r.categoria_principal || '', webSubs: r.subcategorias || [], imagenes: r.imagenes || [],
          precio: r.precio != null ? num(r.precio) : num(p.precio), tienda: r.activo ? 'publicado' : 'borrador', webAct: r.actualizado
        });
        if (!p.categoria) p.categoria = r.categoria_principal || '';
        Store.put('productos', p, { quiet: true }); n++;
      });
      Store.all('productos').forEach(p => {
        const oc = ocultos.has(normKey(p.codigo));
        if (oc && estado(p) !== 'oculto') { p.tiendaAntes = estado(p); p.tienda = 'oculto'; p.ocultoWeb = true; Store.put('productos', p, { quiet: true }); n++; }
        else if (!oc && estado(p) === 'oculto' && p.ocultoWeb) { p.tienda = p.tiendaAntes || 'publicado'; delete p.ocultoWeb; Store.put('productos', p, { quiet: true }); n++; }
      });
      filas = (rw.data || []).length;
      if (n) Bus.emit('data', 'productos');
      last = Date.now();
    } catch (e) { console.warn('Productos web', e); error = /productos_web|schema cache|does not exist/i.test(e.message || '') ? 'Falta instalar "Productos" (14_productos_web.sql) en Supabase' : 'No se pudo leer los productos de la tienda'; }
    loading = false; Bus.emit('tienda');
    return !error;
  };
  /* ficha de /ventas → productos_web (y productos_ocultos) */
  const guardar = async (p) => {
    const s = sb(); if (!s) return { ok: false, msg: 'sin conexión: se guardó solo aquí' };
    const out = { ok: true, msg: '' };
    const oc = estado(p) === 'oculto';
    try {
      if (oc) await s.from('productos_ocultos').upsert({ modelo: String(p.codigo).trim() }, { onConflict: 'modelo' });
      else if (ocultos.has(normKey(p.codigo))) { await s.from('productos_ocultos').delete().eq('modelo', String(p.codigo).trim()); ocultos.delete(normKey(p.codigo)); }
    } catch (e) { /* tabla de ocultos opcional */ }
    if (oc) { ocultos.add(normKey(p.codigo)); const r0 = Store.get('productos', p.id); if (r0 && !r0.ocultoWeb) { r0.ocultoWeb = true; Store.put('productos', r0, { quiet: true }); } }
    const falta = faltan(p);
    if (falta.length) return { ok: false, msg: 'falta ' + falta.join(' y ') + ' para que aparezca en /admin y en la tienda' };
    const d = { modelo: String(p.codigo).trim(), nombre: (p.nombre && p.nombre !== p.codigo ? p.nombre : null), marca: String(p.marca).trim().toUpperCase(),
      categoria_principal: p.webCat, subcategorias: p.webSubs || [], descripcion: p.descripcion || null, precio: num(p.precio) > 0 ? num(p.precio) : null,
      disponible: true, imagenes: (p.imagenes || []).slice(0, 8), activo: estado(p) === 'publicado' };
    const { data, error: er } = await s.from('productos_web').upsert(d, { onConflict: 'modelo' }).select().maybeSingle();
    if (er) return { ok: false, msg: er.message };
    const rec = Store.get('productos', p.id); if (rec && data) { rec.webAct = data.actualizado; Store.put('productos', rec, { quiet: true }); }
    return out;
  };
  /* fotos: el mismo almacén que usa /admin */
  const foto = (file) => new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1200 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('No se pudo leer la foto')), 'image/jpeg', 0.86); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Ese archivo no es una imagen')); };
    img.src = url;
  });
  const subirFoto = async (modelo, file) => {
    const s = sb(); if (!s) throw new Error('Inicia sesión para subir fotos');
    const blob = await foto(file);
    const slug = String(modelo).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
    const path = slug + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 6) + '.jpg';
    const { error: er } = await s.storage.from('productos').upload(path, blob, { contentType: 'image/jpeg', upsert: false, cacheControl: '31536000' });
    if (er) throw er;
    return s.storage.from('productos').getPublicUrl(path).data.publicUrl;
  };
  /* rutas de categorías que ya existen en la tienda (para elegir) */
  const rutas = () => {
    const m = new Map();
    Catalog.items.forEach(c => { if (!c.cat) return; const r = [c.cat].concat(c.subs || []).join(' › '); m.set(r, (m.get(r) || 0) + 1); });
    Store.all('productos').forEach(p => { const r = ruta(p).join(' › '); if (r) m.set(r, (m.get(r) || 0) + 1); });
    return Array.from(m.entries()).sort((a, b) => a[0].localeCompare(b[0]));
  };
  return { cargar, guardar, subirFoto, rutas, ruta, faltan, estado, publicado, get error() { return error; } };
})();

/* ---------------- tu producto ↔ catálogo (scraping, manuales o /admin) ---------------- */
const MatchCat = (() => {
  let idx = null, n = -1;
  const build = () => {
    if (idx && n === Catalog.items.length) return idx;
    const mod = new Map(), sku = new Map();
    Catalog.items.forEach(c => { const k = normKey(c.m); if (k && !mod.has(k)) mod.set(k, c); const s2 = normKey(c.sku); if (s2 && s2.length >= 8 && !sku.has(s2)) sku.set(s2, c); });
    idx = { mod, sku }; n = Catalog.items.length; return idx;
  };
  /* devuelve { c, como: 'modelo' | 'código de barras' | 'texto' } o null */
  const de = (p) => {
    const { mod, sku } = build(); const k = normKey(p.codigo);
    if (k && mod.has(k)) return { c: mod.get(k), como: 'modelo' };
    if (k && sku.has(k)) return { c: sku.get(k), como: 'código de barras' };
    const toks = String((p.codigo || '') + ' ' + (p.nombre || '') + ' ' + (p.descripcion || '')).match(/[A-Za-z0-9][A-Za-z0-9\-./]{4,}/g) || [];
    for (const t of toks) { const kk = normKey(t); if (kk.length >= 6 && /\d/.test(kk) && /[a-z]/.test(kk) && mod.has(kk)) return { c: mod.get(kk), como: 'texto' }; }
    return null;
  };
  return { de };
})();
/* ---------------- Categorías de la tienda para productos del inventario ----------------
   Sugiere la categoría con la que el producto sale en la tienda y en /admin:
   1) el mismo modelo en el catálogo (scraping, manuales, /admin)
   2) un modelo parecido del catálogo (mismo inicio de código: 3RT1034-… → los 3RT1034)
   3) palabras del nombre, la descripción, el grupo viejo y el tipo de código
   Se guarda como p.webCat (raíz que entiende la tienda) + p.webSubs. */
const CatAuto = (() => {
  const { FAMILIAS, MAPA_CATEGORIAS, rutaDe } = CatTienda;
  const famDe = new Map(); FAMILIAS.forEach(f => f.categorias.forEach(c => famDe.set(c, f.nombre)));
  // categoría de la tienda → raíz del proveedor que la produce (sin niveles extra)
  const RAIZ = new Map(); Object.entries(MAPA_CATEGORIAS).forEach(([raw, b]) => { if (b.length === 2 && !RAIZ.has(b[1])) RAIZ.set(b[1], raw); });
  const raizDe = (cat) => RAIZ.get(cat) || cat;
  const familias = () => FAMILIAS.map(f => ({ nombre: f.nombre, categorias: f.categorias.slice() }));
  /* ruta como se ve en la tienda: [familia, categoría, …] */
  const rutaVista = (webCat, webSubs, p) => webCat ? rutaDe({ categoria_principal: webCat, subcategorias: (webSubs || []).filter(Boolean), marca: p && p.marca || '', modelo: p && p.codigo || '' }) : [];
  const rutaP = (p) => rutaVista(p.webCat, p.webSubs, p);
  const enOtros = (r) => !r.length || r[0] === 'Otros Productos';

  /* ---- marca por el tipo de código ---- */
  const MARCAS = [
    [/^(3R[A-Z]|3V[A-Z]|3S[A-Z]|3L[A-Z]|3K[A-Z]|3U[A-Z]|3W[A-Z]|5S[A-Z]|5T[A-Z]|6E[A-Z]|6ES7|6AV|6SE|6SL|6GK|7K[A-Z]|7M[A-Z]|8W[A-Z]|3NA|3NE)/i, 'SIEMENS'],
    [/^(HG[A-Z]|MMS\d|HOK)/i, 'HYUNDAI'],
    [/^GD\d|INVT/i, 'INVT'],
    [/^KIN[CK]O/i, 'KINCO'],
  ];
  const marcaDe = (p) => { const t = String(p.codigo || '').trim(); for (const [re, m] of MARCAS) if (re.test(t)) return m; const tx = normTxt((p.nombre || '') + ' ' + (p.descripcion || '')); if (/\bsiemens\b|\blogo!?\b|\bsirius\b|\bsimatic\b/.test(tx)) return 'SIEMENS'; if (/\bhyundai\b/.test(tx)) return 'HYUNDAI'; if (/\binvt\b/.test(tx)) return 'INVT'; if (/\bkin[ck]o\b/.test(tx)) return 'KINCO'; if (/\bschneider\b|\btelemecanique\b/.test(tx)) return 'SCHNEIDER'; return ''; };

  /* ---- reglas por código (fuertes) y por palabras ---- [categoría, sub opcional] */
  const COD = [
    [/^6ED10(55-4M|55-4MH)/i, 'PLC Básicos', 'LOGO!'], [/^6ED1/i, 'PLC Básicos', 'LOGO!'], [/^6EP/i, 'Fuentes de Alimentación'],
    [/^6ES72/i, 'PLC Básicos'], [/^6ES7/i, 'PLC Avanzados'], [/^6AV/i, 'Paneles HMI'], [/^6S[EL]/i, 'Variadores de Frecuencia'], [/^6GK|^6XV/i, 'SIMATIC NET'],
    [/^3RW/i, 'Arrancadores Suaves'], [/^3RP|^3UG|^7PV|^3RS/i, 'Relés de Supervisión y Control'],
    [/^3RV29|^3RV19/i, 'Guardamotores', 'Accesorios'], [/^3RV|^MMS\d/i, 'Guardamotores'],
    [/^3R[UB]|^HGT(?!MB)/i, 'Relés de Sobrecarga'], [/^HGTMB/i, 'Relés de Sobrecarga', 'Accesorios'],
    [/^3RT19|^3RH19|^3RT29|^3RH29|^HGC(TB|SB|OL|TIP|IU|CD|RC|CU|ET)|^HOK/i, 'Contactores', 'Accesorios'],
    [/^3RH/i, 'Contactores', 'Contactores Auxiliares'], [/^3RT|^HGC/i, 'Contactores'],
    [/^3V[ALMFT]|^HGM|^HGP/i, 'Breakers en Caja Moldeada'], [/^CTB\s?\d/i, 'Breakers en Caja Moldeada', 'Accesorios'],
    [/^5S[LYJXP]|^HGD|^Q[123]\d{2}\b/i, 'Breakers Automáticos'], [/^3WT|^3WL|^HGS/i, 'Breakers en Aire'],
    [/^3SE/i, 'Finales de Carrera'], [/^3SB|^3SU|^XB[457]/i, 'Pulsadores y Pilotos'], [/^8W[AH]/i, 'Bornes de Conexión'],
    [/^3NE|^3NA|^3NC/i, 'Fusibles Ultrarrápidos'], [/^3LD|^3KA|^3KD/i, 'Seccionadores'], [/^7KM/i, 'Medidores de Energía'], [/^GD\d/i, 'Variadores de Frecuencia'],
  ];
  const PAL = [
    [/logo!?\s*power|fuente de alimenta|power supply|fuentes?\b/, 'Fuentes de Alimentación'],
    [/\blogo\b/, 'PLC Básicos', 'LOGO!'],
    [/\bhmi\b|panel de operador|multipanel|pantalla tactil|touch panel|visualizador|\bpantalla\b|kin[ck]o gl/, 'Paneles HMI'],
    [/\bplc\b|\bcpu\b|unidad central|controlador logico|s7-?1200/, 'PLC Avanzados'],
    [/variador|inverter|convertidor de frecuencia|micromaster|sinamics/, 'Variadores de Frecuencia'],
    [/arrancador(es)? suave/, 'Arrancadores Suaves'],
    [/temporizad|rele de control|reles de control|rele de supervision|secuencia y corte de fase|rele de tension|monitor de fase/, 'Relés de Supervisión y Control'],
    [/bases? de reles/, 'Relés de Sobrecarga', 'Accesorios'],
    [/rele(s)? (termico|de sobrecarga)|termicos? de sobrecarga|\bsobrecarga\b/, 'Relés de Sobrecarga'],
    [/accesorios? para guardamot|contacto aux.*3rv|bloque.*guardamot/, 'Guardamotores', 'Accesorios'],
    [/guardamotor|proteccion (del|de) motor|disyuntor.*motor/, 'Guardamotores'],
    [/bobina|contactos principales|contactos? auxiliar|bloque (de )?contactos|enclavamiento|supresor|bloque auxiliar/, 'Contactores', 'Accesorios'],
    [/contactor auxiliar|contactor relay/, 'Contactores', 'Contactores Auxiliares'],
    [/contactor/, 'Contactores'],
    [/caja moldeada|moldeada|\bvl160|\bmccb\b/, 'Breakers en Caja Moldeada'],
    [/kit .*bornes|bornes? .*hgm/, 'Breakers en Caja Moldeada', 'Accesorios'],
    [/breaker|magnetotermico|termomagnetico|automatico(s)? (iec|de riel)|curva c|interruptor (monopolar|bipolar|tripolar)|\bmcb\b|enchufable/, 'Breakers Automáticos'],
    [/final(es)? de carrera|interruptor de posicion|position switch/, 'Finales de Carrera'],
    [/pulsador|selector|piloto|boton|parada de emergencia|seta/, 'Pulsadores y Pilotos'],
    [/baliza|sirena/, 'Balizas Luminosas y Acústicas'],
    [/sensor|proximidad|inductivo|capacitivo|fotoelectric/, 'Sensores de Proximidad'],
    [/encoder/, 'Encoders'],
    [/bornera|\bbornes?\b|terminal(es)? de punta/, 'Bornes de Conexión'],
    [/seccionador/, 'Seccionadores'],
    [/fusible/, 'Fusibles Ultrarrápidos'],
    [/medidor|multimedidor|analizador de red|sentron pac/, 'Medidores de Energía'],
    [/neumatic|electrovalvula|cilindro/, 'Neumática'],
    [/transformador/, 'Media Tensión y Transformadores'],
  ];
  const deRegla = (cat, sub) => ({ webCat: raizDe(cat), webSubs: sub ? [sub] : [] });

  /* ---- índice de prefijos del catálogo ---- */
  let pidx = null, pn = -1;
  const prefIdx = () => {
    if (pidx && pn === Catalog.items.length) return pidx;
    pidx = Catalog.items.filter(c => c.cat).map(c => ({ k: normKey(c.m), c })).filter(x => x.k.length >= 5).sort((a, b) => a.k < b.k ? -1 : a.k > b.k ? 1 : 0);
    pn = Catalog.items.length; return pidx;
  };
  const rango = (pre) => { const a = prefIdx(); let lo = 0, hi = a.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (a[mid].k < pre) lo = mid + 1; else hi = mid; } const out = []; for (let i = lo; i < a.length && a[i].k.startsWith(pre); i++) { out.push(a[i].c); if (out.length > 400) break; } return out; };
  const parecido = (codigo) => {
    const k = normKey(codigo); if (k.length < 6 || !/[a-z]/.test(k) || !/\d/.test(k)) return null;
    for (let L = Math.min(k.length - 1, 11); L >= 5; L--) {
      const pre = k.slice(0, L); if (!/\d/.test(pre)) break;
      const xs = rango(pre).filter(c => !enOtros(CatTienda.ruta(c))); if (!xs.length) continue;
      const g = new Map(); xs.forEach(c => { const key = c.cat + '|||' + (c.subs[0] || ''); if (!g.has(key)) g.set(key, []); g.get(key).push(c); });
      const [, best] = Array.from(g.entries()).sort((a, b) => b[1].length - a[1].length)[0];
      if (best.length / xs.length < 0.6) return null;
      // subcategorías que comparten todos los del grupo
      let subs = best[0].subs.slice(); best.forEach(c => { let i = 0; while (i < subs.length && c.subs[i] === subs[i]) i++; subs = subs.slice(0, i); });
      return { webCat: best[0].cat, webSubs: subs, ref: best[0].m, n: xs.length };
    }
    return null;
  };

  /* ---- sugerencia ---- { webCat, webSubs, como, ref, marca } o null */
  const sugerir = (p) => {
    const marca = (p.marca || '').trim() ? '' : marcaDe(p);
    const m = Catalog.items.length ? MatchCat.de(p) : null;
    if (m && m.c.cat && !enOtros(CatTienda.ruta(m.c))) return { webCat: m.c.cat, webSubs: (m.c.subs || []).slice(), como: m.como === 'texto' ? 'catálogo (modelo en el texto)' : 'catálogo', ref: m.c.m, marca: marca || (m.c.marca || '').toUpperCase() };
    const cod = String(p.codigo || '').trim();
    const sim = Catalog.items.length ? (parecido(cod) || (() => { for (const t of (String((p.nombre || '') + ' ' + (p.descripcion || '')).match(/[A-Za-z0-9][A-Za-z0-9\-./]{5,}/g) || [])) { const r = /\d/.test(t) && /[a-z]/i.test(t) ? parecido(t) : null; if (r) return r; } return null; })()) : null;
    if (sim) return Object.assign(sim, { como: 'modelo parecido', marca });
    for (const [re, cat, sub] of COD) if (re.test(cod)) return Object.assign(deRegla(cat, sub), { como: 'tipo de código', marca });
    const tx = normTxt([p.nombre, p.descripcion, p.categoria, cod].join(' '));
    for (const [re, cat, sub] of PAL) if (re.test(tx)) return Object.assign(deRegla(cat, sub), { como: 'palabras', marca });
    return null;
  };
  /* nombre corto para el grupo del inventario */
  const grupoDe = (webCat, webSubs, p) => { const r = rutaVista(webCat, webSubs, p); return enOtros(r) ? '' : r[1] || r[0]; };
  return { familias, famDe, raizDe, rutaVista, rutaP, enOtros, sugerir, marcaDe, grupoDe };
})();

/* pone sola la categoría de la tienda a los productos que no tienen (una vez por producto) */
const autoCategorias = (() => {
  let hecho = false;
  const correr = () => {
    if (hecho || !Catalog.items.length || Sync.state !== 'ok') return;
    hecho = true; let n = 0;
    Store.all('productos').forEach(p0 => {
      if (p0.webCat || p0.catAuto) return;
      const sg = CatAuto.sugerir(p0); if (!sg) return;
      const p = Store.get('productos', p0.id); if (!p || p.webCat) return;
      p.webCat = sg.webCat; p.webSubs = sg.webSubs; p.catAuto = sg.como; if (!String(p.marca || '').trim() && sg.marca) p.marca = sg.marca;
      Store.put('productos', p, { quiet: true }); n++;
    });
    if (n) { Bus.emit('data', 'productos'); UI.toast(`Categoría de la tienda puesta a ${n} productos. Revísalas en Inventario → Ordenar categorías`, 5000); }
  };
  return { correr, programar: debounce(correr, 4000) };
})();

/* ¿la descripción actual está vacía, muy corta o mal escrita? */
const descFloja = (t) => {
  t = String(t || '').trim(); if (t.length < 15) return true;
  if (/[�?]{1}/.test(t.replace(/\?\s/g, ''))) return true;
  const letras = t.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g, ''); if (letras.length > 10 && letras.replace(/[^a-záéíóúñ]/g, '').length / letras.length < 0.15) return true;   // todo en mayúsculas (Mi Negocio)
  return false;
};

    .map(x => { const c = x.m.c; const nuevaDesc = c.desc || '';
      const corto = (t) => { t = String(t || '').replace(/\s+/g, ' ').trim(); if (t.length <= 90) return t; const u = t.slice(0, 90); return u.slice(0, Math.max(40, u.lastIndexOf(' '))).replace(/[,;:\-–—\s]+$/, '').replace(/(\s+(en|de|del|para|con|y|a|la|el|los|las|por|o|u|sin|al))+$/i, ''); };
      const nuevoNombre = c.n && c.n !== c.m ? c.n : (c.desc && descFloja(x.p.nombre) ? corto(c.desc) : '');
