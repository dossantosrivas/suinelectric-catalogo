    foot: [].concat(isNew ? [] : [['Eliminar', 'red', async (close) => { if (movs.length) { UI.toast('Tiene movimientos: márcalo como inactivo en vez de eliminarlo', 3200); return; } if (await UI.confirm('¿Eliminar este producto?', { ok: 'Eliminar', danger: true })) { Store.del('productos', p.id); close(); } }]])
      .concat([['Cancelar', '', c => c()], ['Guardar', 'pri', (close) => {
        $$('[data-k]', m.body).forEach(i => { const k = i.dataset.k; p[k] = i.type === 'checkbox' ? i.checked : k === 'precio' ? num(i.value) : i.value.trim(); });
        if (!p.codigo) { UI.toast('Escribe el código'); return; }
        const dup = Store.all('productos').find(x => x.id !== p.id && normKey(x.codigo) === normKey(p.codigo)); if (dup) { UI.toast('Ya existe un producto con ese código'); return; }
        p.inv = p.inv || {}; const ajustes = [];
        ['manuel', 'papa'].forEach(i => {
          const ci = $(`[data-inv="${i}"][data-ik="cant"]`, m.body), co = $(`[data-inv="${i}"][data-ik="costo"]`, m.body);
          const newC = num(ci.value), newCo = num(co.value);
          if (isNew) { if (newC || newCo) p.inv[i] = { cant: newC, costo: newCo }; return; }
          if (Math.abs(newCo - s[i].costo) > 0.004) { p.inv[i] = Object.assign({ cant: 0 }, p.inv[i] || {}, { costo: newCo, desde: localStamp() }); }
          const delta = round2(newC - s[i].cant);
          if (Math.abs(delta) > 0.0001) { if (!p.inv[i]) p.inv[i] = { cant: 0, costo: newCo }; ajustes.push({ i, delta, costo: newCo }); }
        });
        Store.put('productos', p);
        ajustes.forEach(a => {
          const d = newDoc('ajuste', { inventario: a.i, notas: 'Ajuste manual de existencia', items: [{ id: uid('i'), productoId: p.id, codigo: p.codigo, desc: `*${p.codigo}*`, cant: a.delta, precio: 0, costo: a.costo, origen: a.i }] });
          Store.put('docs', d);
        });
        UI.toast(ajustes.length ? 'Guardado y existencia ajustada' : 'Producto guardado'); close(); App.refresh();
      }]])
  });
  $$('[data-doc]', m.body).forEach(tr => tr.onclick = () => { m.close(); location.hash = '#/doc/' + tr.dataset.doc; });
}

const vendedoresActivos = () => {

};
/* quién está usando este equipo (para marcar automáticamente el vendedor) */
const Yo = {
  get() {
    const em = Sync.user && Sync.user.email ? normTxt(Sync.user.email) : '';
    let e = em ? Store.all('empleados').find(x => x.correo && normTxt(x.correo) === em) : null;
    if (!e) { const id = lsGet('suinadm_yo', null); e = id ? Store.get('empleados', id) : null; }
    return e && e.activo !== false ? e : null;
  },
  nombre() { const e = this.get(); return e ? e.nombre : ''; },
  pick(onDone) {
    const emps = Store.all('empleados').filter(e => e.activo !== false).sort((a, b) => a.nombre.localeCompare(b.nombre));
    const m = UI.modal({ title: '¿Quién eres?', foot: false, body: `<p class="small" style="margin-top:0">Así las ofertas, notas y ventas que hagas en este equipo quedan a tu nombre automáticamente. Siempre puedes cambiar el vendedor en cada documento.</p>

      <button class="btn ghost" data-none>Ninguno / preguntar luego</button></div>` });
    $$('[data-id]', m.body).forEach(b => b.onclick = () => {

  },
  check() { if (!this.get() && !lsGet('suinadm_yo_skip', false) && Store.all('empleados').some(e => e.activo !== false)) this.pick(() => App.render()); }
};

Views.empleados = (v) => {

  const emps = Store.all('empleados').sort((a, b) => (b.activo !== false) - (a.activo !== false) || a.nombre.localeCompare(b.nombre));
  const stat = (nombre) => { const vs = ventas.filter(d => normKey(d.vendedor) === normKey(nombre)); let tot = 0, gan = 0; vs.forEach(d => { const T = Calc.totals(d); tot += T.base; gan += T.gan; }); return { n: vs.length, tot, gan }; };
  const sinVend = ventas.filter(d => !d.vendedor || !emps.some(e => normKey(e.nombre) === normKey(d.vendedor)));

    ${emps.map(e => { const s = stat(e.nombre); return `<tr class="click ${e.activo === false ? 'anul' : ''}" data-id="${esc(e.id)}"><td><b style="font-weight:500">${esc(e.nombre)}</b>${Yo.get() && Yo.get().id === e.id ? ' <span class="pill info">tú</span>' : ''}${e.activo === false ? ' <span class="pill">inactivo</span>' : ''}${e.correo ? `<div class="muted small">${esc(e.correo)}</div>` : ''}</td><td class="hm">${esc(e.puesto || '')}</td><td class="hm">${esc(e.telefono || '')}</td><td class="num">${s.n}</td><td class="num">${fmtUSD(s.tot)}</td><td class="num">${fmtUSD(s.gan)}</td><td class="num hm">${num(e.comision) ? fmtUSD(s.tot * num(e.comision) / 100) + ` <span class="muted small">(${fmtNum(num(e.comision))}%)</span>` : '—'}</td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="panel empty">Aún no hay empleados.</div>'}
    ${sinVend.length ? `<p class="muted small" style="margin-top:8px">${sinVend.length} venta${sinVend.length === 1 ? '' : 's'} del período sin vendedor asignado.</p>` : ''}`;
  $('[data-per]', v).onchange = (e) => { F.per = e.target.value; lsSet('suinadm_f_emp', F); App.render(); };
  $('[data-new]', v).onclick = () => empleadoModal(null);
  $('[data-yo]', v).onclick = () => Yo.pick(() => App.render());
  $$('tr[data-id]', v).forEach(tr => tr.onclick = () => empleadoModal(Store.get('empleados', tr.dataset.id)));

function empleadoModal(e) {

      <label class="fld"><span>Correo con el que entra</span><input class="inp" data-k="correo" value="${esc(e.correo || '')}" placeholder="Para marcarlo como vendedor automáticamente"></label>

      <label class="fld"><span>&nbsp;</span><label class="chk"><input type="checkbox" data-k="activo" ${e.activo !== false ? 'checked' : ''}> Activo (aparece como vendedor)</label></label>
      <label class="fld" style="grid-column:1/-1"><span>Notas</span><textarea class="inp" data-k="notas" rows="2">${esc(e.notas || '')}</textarea></label></div>
      ${ventas.length ? `<h3 style="font-size:15px;margin:16px 0 8px">Ventas (${ventas.length})</h3><div class="tbl-wrap" style="max-height:260px"><table class="tbl"><tbody>${ventas.slice(0, 100).map(d => `<tr class="click" data-doc="${esc(d.id)}"><td class="mono small">${esc(fmtFecha(d.fecha))}</td><td>${esc(docParty(d))}<div class="mono small muted">${esc(d.numero)}</div></td><td class="num">${fmtUSD(Calc.totals(d).total)}</td></tr>`).join('')}</tbody></table></div>` : ''}`,
    foot: [].concat(isNew ? [] : [['Eliminar', 'red', async (c) => { if (await UI.confirm('¿Eliminar este empleado? Sus ventas quedan con su nombre.', { ok: 'Eliminar', danger: true })) { Store.del('empleados', e.id); c(); App.render(); } }]])
      .concat([['Cancelar', '', c => c()], ['Guardar', 'pri', (c) => {

        c(); App.render(); UI.toast('Empleado guardado');
      }]])
  });
  $$('[data-doc]', m.body).forEach(tr => tr.onclick = () => { m.close(); location.hash = '#/doc/' + tr.dataset.doc; });

/* =====================================================================
   PUENTE CON LA TIENDA WEB (mismo Supabase)
   - public.clientes  → aparecen en Clientes (marcados "Tienda web")
   - public.pedidos   → se ven en la ficha del cliente

   ===================================================================== */
const Tienda = (() => {
  let tipos = [], pedidos = [], ok = false, loading = false, last = 0, error = '';
  const sb = () => Sync.online() ? Sync.sb : null;

  /* cliente de la tienda → ficha del panel */
  const aPanel = (t, rec) => {
    const empresa = (t.empresa || '').trim(), nombre = (t.nombre || '').trim();
    rec = rec || { id: 'c_web_' + normKey(t.email), descuento: 0, notas: '', extras: [] };
    Object.assign(rec, {
      tiendaEmail: t.email, tiendaModo: empresa ? 'empresa' : 'nombre', tiendaAct: t.actualizado, tiendaCreado: t.creado, tiendaActivo: t.activo !== false,
      nombre: empresa || nombre || t.email, contacto: empresa ? nombre : (rec.contacto || ''),
      correo: t.email, rif: t.rif || '', telefono: t.telefono || '', direccion: t.direccion || '',
      tipo: (tipos.find(x => x.id === t.tipo_id) || {}).nombre || t.tipo_id || rec.tipo || ''
    });
    return rec;
  };

  const cargar = async ({ force } = {}) => {
    const s = sb(); if (!s || loading) return false;
    if (!force && Date.now() - last < 60000) return ok;
    loading = true; error = '';
    try {
      const [rt, rc, rp] = await Promise.all([
        s.from('tipos_cliente').select('*').order('orden'),
        s.from('clientes').select('*').eq('es_admin', false),
        s.from('pedidos').select('*').order('creado', { ascending: false }).limit(1000)
      ]);
      if (rc.error) throw rc.error;
      tipos = rt.data || []; pedidos = rp.error ? [] : (rp.data || []);
      let n = 0;
      (rc.data || []).forEach(t => {
        const email = String(t.email || '').toLowerCase(); if (!email) return;
        let rec = Store.all('clientes').find(x => x.tiendaEmail === email) || Store.all('clientes').find(x => x.correo && x.correo.toLowerCase() === email);
        if (!rec) { const m = findCliente({ nombre: t.empresa || t.nombre, rif: t.rif }); if (m && !m.tiendaEmail) rec = m; }
        if (rec && rec.tiendaEmail && rec.tiendaAct && t.actualizado && t.actualizado <= rec.tiendaAct) return; // sin cambios en la tienda
        const out = aPanel(t, rec ? clone(rec) : null);
        Store.put('clientes', out, { quiet: true }); n++;
      });
      if (n) Bus.emit('data', 'clientes');
      ok = true; last = Date.now();
    } catch (e) { console.warn('Tienda', e); error = /permission|policy|denied|JWT/i.test(e.message || '') ? 'Sin permiso para leer los clientes de la tienda' : 'No se pudo leer la tienda'; ok = false; }
    loading = false; Bus.emit('tienda');
    return ok;
  };

  /* ficha del panel → cuenta de la tienda */
  const guardar = async (c) => {
    const s = sb(); if (!s || !c.tiendaEmail) return { ok: false, msg: 'sin conexión' };
    const upd = { rif: c.rif || null, telefono: c.telefono || null, direccion: c.direccion || null };
    if (c.tiendaModo === 'empresa') { upd.empresa = c.nombre || null; upd.nombre = c.contacto || null; } else upd.nombre = c.nombre || null;
    const tp = tipos.find(x => normKey(x.nombre) === normKey(c.tipo) || x.id === c.tipo); if (tp) upd.tipo_id = tp.id;
    const { data, error: er } = await s.from('clientes').update(upd).eq('email', c.tiendaEmail).select().maybeSingle();
    if (er) return { ok: false, msg: er.message };
    if (data) { const rec = Store.get('clientes', c.id); if (rec) { rec.tiendaAct = data.actualizado; Store.put('clientes', rec, { quiet: true }); } }
    return { ok: true };
  };

  const pedidosDe = (c) => c && c.tiendaEmail ? pedidos.filter(p => p.cliente_email === c.tiendaEmail) : [];
  const cambiarEstado = async (id, estado) => {
    const s = sb(); if (!s) return false;
    const { error: er } = await s.from('pedidos').update({ estado }).eq('id', id);
    if (er) { UI.toast('No se pudo cambiar el estado: ' + er.message, 3500); return false; }
    const p = pedidos.find(x => x.id === id); if (p) p.estado = estado; return true;
  };
  /* pedido web → oferta o nota en el panel */
  const aDocumento = (p, tipo) => {
    const c = Store.all('clientes').find(x => x.tiendaEmail === p.cliente_email);
    const items = (p.items || []).map(it => {
      const cod = it.modelo || it.sku || '';
      const desc = [`*Ref / Modelo: ${cod}*${it.marca ? ' — ' + it.marca : ''}`, it.descripcion || it.nombre || ''].filter(Boolean).join('\n');
      const base = { id: uid('i'), codigo: cod, desc, cant: num(it.cantidad) || 1, precio: num(it.precio_unit ?? it.precio) };
      const a = (() => { const pr = cod ? findProductoByCodigo(cod) : null; if (pr) { const s = Calc.st(pr.id); const inv = s.manuel.cant > 0 ? 'manuel' : s.papa.cant > 0 ? 'papa' : null; if (inv) return { origen: inv, productoId: pr.id, costo: round2(s[inv].costo) || '' }; } const cc = cod ? catalogoByCodigo(cod) : null; if (cc) { const cd = costoDist(cc); return { origen: 'dist', productoId: null, costo: cd != null ? cd : '', listPrice: cc.precio }; } return { origen: 'libre', productoId: null, costo: '' }; })();
      return Object.assign(base, a, tipo === 'nota' && a.origen === 'dist' ? { pedido: 'por pedir' } : {});
    });
    const d = newDoc(tipo, { clienteId: c ? c.id : null, cliente: c ? docClienteSnap(c) : { nombre: p.cliente_email, rif: '', direccion: '', extras: [] }, items, pedidoWeb: p.id, notas: [p.nota_cliente ? 'Nota del cliente: ' + p.nota_cliente : '', `Pedido web #${p.id}`].filter(Boolean).join('\n') });
    App.pendingDoc = d; App.pendingEditor = true; location.hash = '#/nuevo/' + tipo;
  };
  return { cargar, guardar, pedidosDe, cambiarEstado, aDocumento, get tipos() { return tipos; }, get error() { return error; }, get ok() { return ok; } };
})();
const ESTADOS_PEDIDO = { enviado: ['Nuevo', 'warn'], cotizado: ['Cotizado', 'info'], aprobado: ['Aprobado', 'info'], pagado: ['Pagado', 'ok'], entregado: ['Entregado', 'ok'], cancelado: ['Cancelado', 'bad'] };

/* =====================================================================
   PUENTE CON EL COTIZADOR (tu generador de ofertas y notas, tal cual)
   ---------------------------------------------------------------------
   El cotizador corre dentro del panel (mismo origen), así que comparte
   el almacenamiento del navegador:
     suin_registro_v1  → ofertas, notas y ofertas rápidas guardadas
     suin_clientes_v1  → "Mis clientes"
     suin_nube_v1      → link de tu nube de Google Drive
   Este puente copia el registro a la administración (y a Supabase) y
   devuelve al cotizador lo que se haga en la administración, para que
   los dos vean lo mismo en todos los equipos.
   ===================================================================== */
const Cot = (() => {
  const K_REG = 'suin_registro_v1', K_CLI = 'suin_clientes_v1', K_NUBE = 'suin_nube_v1';
  const ROW_CTRL = '<div class="rc"><button type="button" class="row-up" title="Subir">▲</button><button type="button" class="row-drag" title="Arrastrar para mover" draggable="true">⋮⋮</button><button type="button" class="row-down" title="Bajar">▼</button><button type="button" class="row-del" title="Quitar producto">✕</button></div>';
  const readArr = (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } };
  const writeArr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { console.warn('sin espacio', e); return false; } };
  const modOf = (x) => x ? (x.mod || x.guardado || x.updated || 0) : 0;
  let frame = null, busy = false;

  /* ---------- HTML del cotizador → texto con *negrita* ---------- */
  const htmlToRich = (html) => {
    const el = document.createElement('div');
    el.innerHTML = String(html || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div)>/gi, '\n');
    el.querySelectorAll('[data-html2canvas-ignore]').forEach(n => n.remove());
    el.querySelectorAll('strong,b').forEach(b => { const t = b.textContent; b.replaceWith(t.trim() ? '*' + t.trim() + '*' + (/\s$/.test(t) ? ' ' : '') : t); });
    return el.textContent.replace(/ /g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  };
  const richToHtml = (txt) => esc(txt).replace(/\*([^*\n]*[^*\s\n][^*\n]*)\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  const modeloDe = (desc) => { const m = String(desc || '').match(/Ref\s*\/\s*Modelo:\s*\*?\s*([^*\n—]+)/i); return m ? m[1].trim() : ''; };

  /* filas de la tabla del cotizador (todas las versiones) */
  const parseItems = (s) => {
    if (Array.isArray(s.items) && s.items.length && typeof s.items[0] === 'object') {
      return s.items.map(x => ({ cant: num(x.cant ?? x.qty ?? x.cantidad ?? 1), desc: htmlToRich(x.desc ?? x.html ?? x.descripcion ?? ''), precio: num(x.precio ?? x.price ?? x.unit ?? 0) }));
    }
    const html = s.itemsHtml || s.tbody || '';
    if (!html) return [];
    const doc = new DOMParser().parseFromString(`<table><tbody>${html}</tbody></table>`, 'text/html');
    const out = [];
    doc.querySelectorAll('tbody > tr').forEach(tr => {
      const cells = Array.from(tr.children).filter(td => !td.classList.contains('row-ctrl') && !td.classList.contains('no-print') && !td.hasAttribute('data-html2canvas-ignore'));
      let q = tr.querySelector('.quantity'), d = tr.querySelector('.item-desc'), u = tr.querySelector('.unit-price');
      if (!d && q) d = q.nextElementSibling;
      if (!q || !u) {
        const c = cells.filter(td => !td.classList.contains('item-num'));
        if (c.length >= 4) { q = q || c[0]; d = d || c[1]; u = u || c[2]; }
        else if (c.length === 3) { q = q || c[0]; d = d || c[1]; u = u || c[2]; }
      }
      if (!d) return;
      const desc = htmlToRich(d.innerHTML);
      const cant = q ? num(q.textContent) : 1, precio = u ? num(u.textContent) : 0;
      if (!desc && !precio) return;
      out.push({ cant: cant || (q ? 0 : 1), desc, precio });
    });
    return out;
  };
  const parseCond = (s) => {
    if (!s.notesHtml) return null;
    const doc = new DOMParser().parseFromString(`<div>${s.notesHtml}</div>`, 'text/html');
    const ps = Array.from(doc.querySelectorAll('p')).map(p => htmlToRich(p.innerHTML)).filter(Boolean);
    return ps.length ? ps : null;
  };
  const fechaISO = (f, fallback) => { const m = String(f || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? `${m[3]}-${pad(m[2])}-${pad(m[1])} 12:00` : localStamp(new Date(fallback || Date.now())); };

  /* contenido comparable (para saber si algo cambió) */
  const sig = (d) => JSON.stringify([d.vendedor || '', d.tipo, d.numero, (d.fecha || '').slice(0, 10), d.cliente && [d.cliente.nombre, d.cliente.rif, d.cliente.direccion, (d.cliente.extras || []).map(x => x.l + ':' + x.v)], (d.items || []).map(i => [num(i.cant), round2(num(i.precio)), i.desc]), num(d.descPct), num(d.ivaPct), d.tasa ? round2(num(d.tasa)) : 0, (d.condiciones || []).filter(Boolean), !!d.firmas, d.archivo || '']);

  /* ---------- asignar origen a una línea que viene del cotizador ---------- */
  const autoOrigen = (it) => {
    const cod = it.codigo || modeloDe(it.desc);
    const p = cod ? findProductoByCodigo(cod) : null;
    if (p) { const s = Calc.st(p.id); const inv = s.manuel.cant > 0 ? 'manuel' : s.papa.cant > 0 ? 'papa' : null; if (inv) return { origen: inv, productoId: p.id, costo: round2(s[inv].costo) || '' }; }
    const c = cod ? catalogoByCodigo(cod) : null;
    if (c) { const cd = costoDist(c); return { origen: 'dist', productoId: null, costo: cd != null ? cd : '', listPrice: c.precio }; }
    if (p) { const s = Calc.st(p.id); return { origen: (p.inv || {}).papa && !(p.inv || {}).manuel ? 'papa' : 'manuel', productoId: p.id, costo: round2(s.manuel.costo || s.papa.costo) || '' }; }
    return { origen: 'libre', productoId: null, costo: '' };
  };

  /* notas anteriores a la fecha de corte: ya están en el historial de Mi Negocio */
  const esHistorial = (r) => { const corte = CFG().corteCotizador; if (!corte) return false; const f = fechaISO((r.fecha || (r.estado || {}).fecha), r.creado).slice(0, 10); return f < corte; };

  /* ---------- registro del cotizador → documento de la administración ---------- */
  const docIdFor = (rid) => rid.startsWith('adm_') ? rid.slice(4) : 'd_cot_' + rid;
  const toDoc = (r, prev) => {
    const s = r.estado || {};
    const tipo = (r.tipo || s.tipo) === 'nota' ? 'nota' : 'oferta';
    const cli = r.cliente || s.cliente || {};
    let items = parseItems(s).map(x => Object.assign({ codigo: modeloDe(x.desc) }, x));
    if (!items.length && (r.total || '').replace(/[^\d]/g, '')) items = [{ codigo: '', desc: 'Detalle no disponible en el respaldo del cotizador', cant: 1, precio: num(r.total) }];
    const prevItems = (prev && prev.items) || [];
    items = items.map((x, i) => {

  async cotizador(json) {
    if (!json || (!Array.isArray(json.clientes) && !Array.isArray(json.registro))) throw new Error('Este archivo no es un respaldo del cotizador.');
    const merge = (k, arr) => { let cur = []; try { cur = JSON.parse(localStorage.getItem(k)) || []; } catch (e) { /* vacío */ } const m = new Map(cur.map(x => [x.id, x])); let n = 0; (arr || []).forEach(x => { if (!x || !x.id) return; const c = m.get(x.id); if (!c || (x.mod || x.guardado || 0) > (c.mod || c.guardado || 0)) { m.set(x.id, x); n++; } }); localStorage.setItem(k, JSON.stringify(Array.from(m.values()))); return n; };
    const nr = merge('suin_registro_v1', json.registro), nc = merge('suin_clientes_v1', json.clientes);
    const before = DB.docs.size; Cot.sync(); Rapidas.toCloud();
    return { clientes: nc, docs: Math.max(0, DB.docs.size - before) || nr, rapidas: (json.registro || []).filter(x => x && x.clase === 'rapida').length };
  },
  respaldo() {
    const out = { app: 'suinelectric-admin', version: 1, exportado: nowISO() };
    COLS.forEach(c => out[c] = Store.all(c));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: 'application/json' })); a.download = `respaldo_admin_suinelectric_${ymd()}.json`; a.click();
  },
  async restaurar(json) {
    if (!json || json.app !== 'suinelectric-admin') throw new Error('Este archivo no es un respaldo de esta app.');
    let n = 0;
    COLS.forEach(c => (json[c] || []).forEach(r => { const cur = Store.get(c, r.id); if (!cur || (r.mod || '') > (cur.mod || '')) { Store.put(c, r, { quiet: true }); n++; } }));
    COLS.forEach(cc => Bus.emit('data', cc));
    return n;
  }
};
const readJsonFile = () => new Promise((res, rej) => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json,.json'; i.onchange = async () => { const f = i.files[0]; if (!f) return; try { res(JSON.parse(await f.text())); } catch (e) { rej(new Error('No se pudo leer el archivo: no es un JSON válido.')); } }; i.click(); });

const SQL_SETUP = `-- Suinelectric Administración: tabla única para todos los registros
create table if not exists public.adm_registros (
  coleccion text not null,
  id text not null,
  data jsonb not null,
  borrado boolean not null default false,
  actualizado timestamptz not null default now(),
  actualizado_por uuid default auth.uid(),
  primary key (coleccion, id)
);
create index if not exists adm_registros_actualizado on public.adm_registros (actualizado);

-- Quién puede usar el panel (tú y tu papá)
create table if not exists public.adm_usuarios (email text primary key);

-- Entra quien sea administrador de la tienda (clientes.es_admin) o esté en adm_usuarios
create or replace function public.adm_es_admin() returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce(public.es_admin(), false)
      or exists (select 1 from public.adm_usuarios u where lower(u.email) = lower(auth.jwt() ->> 'email'));
$$;

create or replace function public.adm_tocar() returns trigger language plpgsql as $$
begin new.actualizado := now(); new.actualizado_por := auth.uid(); return new; end $$;
drop trigger if exists adm_registros_tocar on public.adm_registros;
create trigger adm_registros_tocar before insert or update on public.adm_registros
  for each row execute function public.adm_tocar();

alter table public.adm_registros enable row level security;
alter table public.adm_usuarios enable row level security;
drop policy if exists adm_todo on public.adm_registros;
create policy adm_todo on public.adm_registros for all to authenticated
  using (public.adm_es_admin()) with check (public.adm_es_admin());
drop policy if exists adm_yo on public.adm_usuarios;
create policy adm_yo on public.adm_usuarios for select to authenticated
  using (lower(email) = lower(auth.jwt() ->> 'email'));

-- Cambios en vivo entre equipos
do $$ begin
  alter publication supabase_realtime add table public.adm_registros;
exception when duplicate_object then null; end $$;

-- Pon aquí los correos con los que van a entrar:
insert into public.adm_usuarios (email) values
  ('manolo1496@gmail.com')
  -- , ('correo-de-tu-papa@gmail.com')
on conflict do nothing;`;

function showLogin() {
  return new Promise((resolve) => {
    const wrap = document.createElement('div'); wrap.className = 'ov'; wrap.style.background = 'var(--plate)'; wrap.style.alignItems = 'center';
    let modo = 'clave', emailPend = '';
    const done = () => { wrap.remove(); Sync.listen(); Sync.run(); App.render(); resolve(true); };
    App.loginDone = () => { if (document.body.contains(wrap)) done(); };
    const paint = () => {
      const cuerpo = emailPend ? `<p class="small" style="margin:0 0 10px">Te enviamos un correo a <b>${esc(emailPend)}</b>. Escribe el código o toca el enlace del correo.</p>
          <form class="stack" style="gap:10px" data-f="cod"><label class="fld"><span>Código</span><input class="inp mono" inputmode="numeric" autocomplete="one-time-code" required></label>
          <div class="small" style="color:var(--red);min-height:1em" data-err></div><button class="btn pri" type="submit">Entrar</button>
          <button class="btn ghost small" type="button" data-back>Usar otro correo</button></form>`
        : modo === 'codigo' ? `<form class="stack" style="gap:10px" data-f="mail"><label class="fld"><span>Correo de administrador</span><input class="inp" type="email" autocomplete="email" required></label>
          <div class="small" style="color:var(--red);min-height:1em" data-err></div><button class="btn pri" type="submit">Enviarme un código</button>
          <button class="btn ghost small" type="button" data-modo="clave">Entrar con clave</button></form>`
        : `<form class="stack" style="gap:10px" data-f="clave"><label class="fld"><span>Correo</span><input class="inp" type="email" autocomplete="username" required></label>
          <label class="fld"><span>Clave</span><input class="inp" type="password" autocomplete="current-password" required></label>
          <div class="small" style="color:var(--red);min-height:1em" data-err></div><button class="btn pri" type="submit">Entrar</button>
          <p class="small muted" style="margin:4px 0 0;line-height:1.5">Es el mismo acceso del panel de la tienda. ¿No tienes clave o la olvidaste? <button class="btn sm" type="button" data-modo="codigo">Entrar con un código</button></p></form>`;
      wrap.innerHTML = `<div class="md" style="width:min(380px,100%);min-height:0;border-radius:8px"><div class="md-b" style="padding:26px">
        <img src="${DEFAULT_LOGO}" alt="" style="width:72px;display:block;margin:0 auto 10px"><h1 style="text-align:center;font-size:19px;margin:0 0 18px">Administración Suinelectric</h1>
        ${cuerpo}<button class="btn ghost small" type="button" data-skip style="width:100%;margin-top:6px">Seguir sin conexión en este equipo</button></div></div>`;
      const f = $('form', wrap), ins = $$('input', f), err = $('[data-err]', wrap);
      setTimeout(() => ins[0].focus(), 30);
      $$('[data-modo]', wrap).forEach(b => b.onclick = () => { modo = b.dataset.modo; paint(); });
      const back = $('[data-back]', wrap); if (back) back.onclick = () => { emailPend = ''; modo = 'codigo'; paint(); };
      $('[data-skip]', wrap).onclick = () => { wrap.remove(); Sync.set('local', 'Sin sesión: solo este equipo'); resolve(false); };
      f.onsubmit = async (e) => {
        e.preventDefault(); err.textContent = ''; const btn = $('button[type=submit]', f); btn.disabled = true;
        try {
          if (f.dataset.f === 'clave') { await Sync.login(ins[0].value.trim().toLowerCase(), ins[1].value); done(); }
          else if (f.dataset.f === 'mail') { emailPend = ins[0].value.trim().toLowerCase(); await Sync.sendCode(emailPend); paint(); }
          else { await Sync.verifyCode(emailPend, ins[0].value.trim()); done(); setTimeout(() => Yo.check(), 800); }
        } catch (er) {
          const m = String(er && er.message || er);
          if (f.dataset.f === 'mail') emailPend = '';
          err.textContent = /invalid login/i.test(m) ? 'Correo o clave incorrectos. Si nunca creaste una clave, entra con un código.'
            : /signups? not allowed|not found|user not/i.test(m) ? 'Ese correo no tiene cuenta. Usa el mismo correo con el que entras al panel de la tienda.'
            : /expired|invalid|token/i.test(m) && f.dataset.f === 'cod' ? 'Código no válido o vencido.'
            : /rate|seconds/i.test(m) ? 'Espera un minuto antes de pedir otro código.'
            : /fetch|network/i.test(m) ? 'Sin conexión con Supabase. Revisa el internet.' : m;
          btn.disabled = false;
        }
      };
    };
    paint(); document.body.appendChild(wrap);
  });
}

function aplicarFixCostos() {
  let n = 0;
  Object.keys(FIX_COSTOS).forEach(did => {
    const d = Store.get('docs', did); if (!d || !d.importado || d.fixCostos) return;
    const its = FIX_COSTOS[did];
    (d.items || []).forEach(it => { const f = its[it.id]; if (f) { it.costo = f[0]; it.precio = f[1]; } });
    d.fixCostos = 1; Store.put('docs', d, { quiet: true }); n++;
  });
  if (n) { Bus.emit('data', 'docs'); console.info('Costos de compras corregidos en', n, 'documentos'); }
  return n;
}
