<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suinelectric Administración</title>
<meta name="theme-color" content="#0E2233">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suin Admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --plate:#0E2233; --plate-2:#17334A; --plate-ink:#E6EEF5; --plate-mute:#8FA6BA;
  --paper:#EEF1F5; --panel:#FFFFFF; --panel-2:#F7F9FB; --line:#D6DDE5; --line-2:#E7ECF1;
  --ink:#1E293B; --ink-2:#334155; --muted:#5B6778;
  --steel:#1F6E94; --steel-2:#18597A; --steel-soft:#E3EFF6;
  --amber:#D99A0E; --amber-soft:#FBF1D9; --red:#B91C1C; --red-soft:#FBE7E7; --ok:#15803D; --ok-soft:#E3F3E8;
  --man:#15803D; --pap:#C2410C; --dis:#1D4ED8; --lib:#64748B;
  --f-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --nav-w:224px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--f-sans);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--steel)}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Placa lateral ---------- */
.shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100vh}
.plate{background:var(--plate);color:var(--plate-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid #07131D}
.plate::before{content:"";display:block;height:5px;background:repeating-linear-gradient(135deg,var(--amber) 0 10px,var(--plate) 10px 20px)}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand img{width:40px;height:40px;border-radius:50%}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--plate-mute)}
.nav{display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow:auto;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:5px;color:var(--plate-ink);text-decoration:none;font-size:14.5px}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--plate-2);box-shadow:inset 3px 0 0 var(--amber)}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.nav .cnt{margin-left:auto;font:500 11.5px var(--f-mono);background:var(--amber);color:#2A1B00;border-radius:4px;padding:0 5px}
.sync{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:var(--plate-mute);display:flex;gap:8px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--plate-mute);flex:none}
.sync.ok i{background:#4ADE80}.sync.busy i{background:var(--amber)}.sync.err i{background:#F87171}.sync.local i{background:var(--plate-mute)}
.sync button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.18);color:var(--plate-ink);border-radius:4px;font-size:12px;padding:2px 7px}

main.view{padding:22px 26px 80px;min-width:0;max-width:1320px}
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vh h1{font-size:23px;margin:0;font-weight:600;letter-spacing:-.01em}
.vh .sub{color:var(--muted);font-size:14px;width:100%;margin-top:-6px}
.vh .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:7px 13px;font-weight:500;font-size:14px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:#B9C3CF}
.btn.pri{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.pri:hover{background:var(--steel-2)}
.btn.red{color:var(--red)}
.btn.redf{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:4px;padding:7px 9px;min-width:0}
textarea.inp{resize:vertical;min-height:60px;line-height:1.4}
.inp:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px var(--steel-soft)}
.inp.num{text-align:right}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12.5px;color:var(--muted);font-weight:500}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.seg button{border:none;background:none;padding:6px 12px;font-size:13.5px;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--plate);color:#fff}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:14px}

/* ---------- Paneles y tablas ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel>h2,.panel>.ph h2{font-size:15.5px;margin:0 0 12px;font-weight:600}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ph h2{margin:0!important}
.ph .act{margin-left:auto;display:flex;gap:6px}
.stack{display:flex;flex-direction:column;gap:14px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:#F4F8FB}
.tbl .r{text-align:right}
.tbl tr.anul td{color:#97A1AE;text-decoration:line-through}
.empty{padding:28px;text-align:center;color:var(--muted)}
.code{font:500 13.5px var(--f-mono);color:var(--ink)}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Etiquetas de dueño: el color siempre va con el nombre */
.own{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:1px 7px 1px 0;border-radius:3px;white-space:nowrap;color:var(--ink-2)}
.own::before{content:"";width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.own.manuel{--c:var(--man)}.own.papa{--c:var(--pap)}.own.dist{--c:var(--dis)}.own.libre{--c:var(--lib)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--amber-soft);color:#8A5A00}.pill.bad{background:var(--red-soft);color:var(--red)}.pill.info{background:var(--steel-soft);color:var(--steel-2)}
.stk{font:500 12.5px var(--f-mono);white-space:nowrap}
.stk.zero{color:#A0A9B5}

/* ---------- Resumen ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:inherit;display:block}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font:600 24px var(--f-mono);letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:2px}
a.kpi:hover{border-color:#B9C3CF}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--plate);color:#fff;border-radius:5px;padding:8px 10px;font-size:12.5px;line-height:1.5;min-width:150px;transform:translate(-50%,-100%);margin-top:-8px;white-space:nowrap;z-index:5}
.tip .num{text-align:left}
.cols2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}

/* ---------- Editor de documento ---------- */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.ed-side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.tot-box .tr{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.tot-box .tr b{font-family:var(--f-mono);font-weight:500}
.tot-box .tr.big{border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-size:16px;font-weight:600}
.tot-box .tr.big b{font-weight:600}
.tot-box .tr.neg b{color:var(--red)}
.tot-box .tr.gan{color:var(--ok)}
.doc-title{font:600 13px var(--f-mono);color:var(--red);letter-spacing:.02em}
.lines{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ln{display:grid;grid-template-columns:28px minmax(0,1.4fr) minmax(110px,.8fr) 72px 100px 100px 96px 30px;gap:8px;align-items:start;padding:10px;border-bottom:1px solid var(--line-2);background:#fff;position:relative}
.ln:last-child{border-bottom:none}
.ln.head{background:var(--panel-2);font-size:12.5px;color:var(--muted);font-weight:600;padding:7px 10px;align-items:center}
.ln .idx{font:500 13px var(--f-mono);color:var(--muted);padding-top:8px;text-align:center}
.ln .idx button{display:block;border:none;background:none;color:var(--muted);padding:0;width:100%;line-height:1;font-size:11px}
.ln textarea{min-height:58px;font-size:14px}
.ln .c-desc{grid-column:2/-2}
.ln .tot{padding-top:8px;font:500 14px var(--f-mono);text-align:right}
.ln .del{border:none;background:none;color:var(--muted);padding-top:6px;font-size:18px;line-height:1}
.ln .del:hover{color:var(--red)}
.ln .meta{grid-column:2/-1;display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:-2px}
.ln .meta .warn{color:var(--red);font-weight:600}
.ln::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,transparent)}
.ln.o-manuel{--c:var(--man)}.ln.o-papa{--c:var(--pap)}.ln.o-dist{--c:var(--dis)}.ln.o-libre{--c:var(--lib)}
select.orig{font-size:13px;padding:6px 6px}
.lbl-m{display:none;font-size:11.5px;color:var(--muted)}
.finder{position:relative}
.results{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(14,34,51,.18);max-height:430px;overflow:auto;z-index:30}
.results .grp{padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel-2);border-bottom:1px solid var(--line-2);position:sticky;top:0}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none}
.res:hover,.res.on{background:#F1F6FA}
.res .t{font-size:13.5px;min-width:0}
.res .t .clip{color:var(--muted);font-size:12.5px}
.res .p{font:500 14px var(--f-mono);text-align:right}
.res .s{grid-column:1/-1;display:flex;gap:10px;font-size:12.5px}
.pay{display:grid;grid-template-columns:150px minmax(0,1fr) 120px minmax(0,1fr) 30px;gap:8px;align-items:center;margin-bottom:6px}
.client-card{display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;padding:10px 12px}
.client-card b{display:block}
.extras .ex{display:grid;grid-template-columns:130px minmax(0,1fr) 30px;gap:8px;margin-bottom:6px}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block}

/* ---------- Modal y avisos ---------- */
.ov{position:fixed;inset:0;background:rgba(9,20,31,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto}
.md{background:#fff;border-radius:8px;width:min(720px,100%);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.md.wide{width:min(1000px,100%)}
.md-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.md-h h3{margin:0;font-size:17px}
.md-h .x{margin-left:auto}
.md-b{padding:16px 18px}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--plate);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.banner{background:var(--amber-soft);border:1px solid #EBCB80;color:#5C3D00;border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pdfview{width:100%;height:75vh;border:1px solid var(--line);border-radius:5px;background:#525659}
.rapida-frame{width:100%;height:calc(100vh - 40px);border:1px solid var(--line);border-radius:var(--r);background:#fff;display:block}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow:auto}
.tabs button{border:none;background:none;padding:8px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--steel);font-weight:600}
.login{min-height:100vh;display:grid;place-items:center;background:var(--plate);padding:20px}
.login .box{background:#fff;border-radius:8px;width:min(380px,100%);padding:26px}
.login img{width:72px;display:block;margin:0 auto 10px}
.login h1{text-align:center;font-size:19px;margin:0 0 18px}

/* ---------- Móvil ---------- */
.mbar,.mnav{display:none}
@media (max-width:1100px){.ed{grid-template-columns:minmax(0,1fr)}.ed-side{position:static}.cols2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .plate{display:none}
  main.view{padding:14px 12px 96px}
  .mbar{display:flex;align-items:center;gap:10px;background:var(--plate);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));position:sticky;top:0;z-index:40}
  .mbar img{width:30px;height:30px;border-radius:50%}
  .mbar b{font-size:15px}
  .mbar .sync{border:none;padding:0;margin-left:auto}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40}
  .mnav a,.mnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:11.5px;color:var(--muted);text-decoration:none;border:none;background:none}
  .mnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mnav .on{color:var(--steel)}
  .mnav .plus svg{background:var(--steel);color:#fff;border-radius:50%;padding:4px;width:30px;height:30px;stroke:#fff}
  .g3,.g4,.kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vh h1{font-size:20px}
  .ln,.ln.head{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ln.head{display:none}
  .ln{padding:12px 10px 12px 14px}
  .ln .idx{display:none}
  .ln .c-code,.ln .c-desc,.ln .meta{grid-column:1/-1}
  .ln .c-orig{grid-column:1/-1}
  .ln .tot{text-align:left}
  .ln .del{position:absolute;right:8px;top:8px}
  .lbl-m{display:block}
  .pay{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tbl .hm{display:none}
  .ov{padding:0}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .md{border-radius:0;min-height:100vh}
  .rapida-frame{height:calc(100vh - 130px)}
  .extras .ex{grid-template-columns:100px minmax(0,1fr) 30px}
}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.kpi .v{font-size:21px}}
</style>
</head>

const IDB = (() => {

    const r = indexedDB.open('suin_admin', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');

  }));

    get: (k) => tx('readonly', st => st.get(k)).catch(() => undefined),
    set: (k, v) => tx('readwrite', st => st.put(v, k)).catch(e => console.warn('IDB', e)),
    del: (k) => tx('readwrite', st => st.delete(k)).catch(() => {})
  };
})();

const DB = {}; COLS.forEach(c => DB[c] = new Map());
const Pend = new Map();   // "col|id" -> {col,id,data,borrado}
const CFG = () => deepMerge(CONFIG_DEFAULT, DB.config.get('main') || {});
const Store = {
  ready: false,
  async load() {
    const snap = await IDB.get('data');
    if (snap) COLS.forEach(c => { (snap[c] || []).forEach(r => DB[c].set(r.id, r)); });
    const pend = await IDB.get('pend');
    if (pend) pend.forEach(p => Pend.set(p.col + '|' + p.id, p));
    this.ready = true;
  },
  persist: debounce(() => {
    const snap = {}; COLS.forEach(c => snap[c] = Array.from(DB[c].values()));
    IDB.set('data', snap);
    IDB.set('pend', Array.from(Pend.values()));
  }, 350),
  all(col) { return Array.from(DB[col].values()); },
  get(col, id) { return DB[col].get(id); },
  put(col, rec, { quiet } = {}) {
    rec.mod = nowISO();
    DB[col].set(rec.id, rec);
    Pend.set(col + '|' + rec.id, { col, id: rec.id, data: rec, borrado: false });
    this.persist(); Sync.schedule();
    if (!quiet) Bus.emit('data', col);
    return rec;
  },
  putMany(col, recs) { recs.forEach(r => this.put(col, r, { quiet: true })); Bus.emit('data', col); },
  del(col, id) {
    DB[col].delete(id);
    Pend.set(col + '|' + id, { col, id, data: { id }, borrado: true });
    this.persist(); Sync.schedule(); Bus.emit('data', col);
  },
  applyRemote(col, id, data, borrado) {
    if (!DB[col]) return false;
    if (Pend.has(col + '|' + id)) return false; // hay un cambio local más nuevo por subir
    if (borrado) { if (!DB[col].has(id)) return false; DB[col].delete(id); }
    else DB[col].set(id, data);
    return true;
  }
};

/* ---------------- sincronización con Supabase ---------------- */
const Sync = {
  sb: null, user: null, state: 'local', msg: 'Solo en este equipo', lastSync: lsGet('suinadm_lastsync', null), channel: null, busy: false,
  conf() {
    const c = lsGet('suinadm_sb', {});
    return { url: (SUPABASE_URL_FIJA || c.url || '').trim(), key: (SUPABASE_KEY_FIJA || c.key || '').trim() };
  },
  configured() { const c = this.conf(); return !!(c.url && c.key); },
  init() {
    if (!this.configured() || !window.supabase) { this.sb = null; return; }
    const c = this.conf();
    try { this.sb = window.supabase.createClient(c.url, c.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' } } /* misma sesión que la tienda */); }
    catch (e) { console.error(e); this.sb = null; this.set('err', 'Datos de Supabase inválidos'); }
  },
  set(state, msg) { this.state = state; this.msg = msg; Bus.emit('sync'); },
  async session() {
    if (!this.sb) return null;
    const { data } = await this.sb.auth.getSession();
    this.user = data && data.session ? data.session.user : null;
    return this.user;
  },
  async login(email, pass) {
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    this.user = data.user; return data.user;
  },
  async sendCode(email) {
    const { error } = await this.sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.href.split('#')[0] } });
    if (error) throw error;
  },
  async verifyCode(email, token) {
    const { data, error } = await this.sb.auth.verifyOtp({ email, token, type: 'email' });
    if (error) throw error;
    this.user = data.user; return data.user;
  },
  async logout() { if (this.sb) await this.sb.auth.signOut(); this.user = null; if (this.channel) { this.sb.removeChannel(this.channel); this.channel = null; } this.set('local', 'Sesión cerrada'); },
  online() { return !!(this.sb && this.user); },
  schedule: debounce(function () { Sync.run(); }, 1200),
  async run() {
    if (!this.online() || this.busy) return;
    this.busy = true; this.set('busy', 'Sincronizando…');
    try {
      await this.push();
      await this.pull();
      this.set('ok', 'Sincronizado ' + new Date().toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' }));
    } catch (e) {
      console.error(e);
      const m = String(e && (e.message || e.error_description) || e);
      this.set('err', /relation|does not exist|schema cache/i.test(m) ? 'Falta crear la tabla en Supabase' : /JWT|auth|permission|denied|policy|row-level/i.test(m) ? 'Sin permiso: tu correo no es administrador' : navigator.onLine ? 'Error al sincronizar' : 'Sin internet: se guarda en este equipo');
    } finally { this.busy = false; if (Pend.size) this.schedule(); }
  },
  async push() {
    let guard = 0;
    while (Pend.size && guard++ < 50) {
      const batch = Array.from(Pend.values()).slice(0, 300);
      const rows = batch.map(p => ({ coleccion: p.col, id: p.id, data: p.data, borrado: !!p.borrado }));
      const { error } = await this.sb.from('adm_registros').upsert(rows, { onConflict: 'coleccion,id' });
      if (error) throw error;
      // quitar de pendientes solo lo que no cambió mientras subía
      batch.forEach(p => { const k = p.col + '|' + p.id; if (Pend.get(k) === p) Pend.delete(k); });
      Store.persist();
    }
  },
  async pull() {
    let changed = new Set(), from = 0, maxTs = this.lastSync;
    const PAGE = 1000;
    for (;;) {
      let q = this.sb.from('adm_registros').select('coleccion,id,data,borrado,actualizado').order('actualizado', { ascending: true }).range(from, from + PAGE - 1);
      if (this.lastSync) q = q.gt('actualizado', new Date(Date.parse(this.lastSync) - 120000).toISOString()); // 2 min de solape por relojes
      const { data, error } = await q;
      if (error) throw error;
      (data || []).forEach(r => { if (Store.applyRemote(r.coleccion, r.id, r.data, r.borrado)) changed.add(r.coleccion); if (!maxTs || r.actualizado > maxTs) maxTs = r.actualizado; });
      if (!data || data.length < PAGE) break;
      from += PAGE;
    }
    if (maxTs) { this.lastSync = maxTs; lsSet('suinadm_lastsync', maxTs); }
    if (changed.size) { Store.persist(); changed.forEach(c => Bus.emit('data', c)); Bus.emit('remote'); }
  },
  listen() {
    if (!this.online() || this.channel) return;
    this.channel = this.sb.channel('adm-cambios')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'adm_registros' }, (p) => {
        const r = p.new && p.new.id ? p.new : null; if (!r) return;
        if (Store.applyRemote(r.coleccion, r.id, r.data, r.borrado)) { Store.persist(); Bus.emit('data', r.coleccion); Bus.emit('remote'); }
      }).subscribe();
  }
};
window.addEventListener('online', () => Sync.schedule());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Sync.schedule(); });
setInterval(() => { if (document.visibilityState === 'visible') Sync.run(); }, 90000);

/* ---------------- cálculos derivados ---------------- */
const Calc = {
  dirty: true, stock: new Map(), movs: new Map(),
  invalidate() { this.dirty = true; },
  build() {
    if (!this.dirty) return;
    const stock = new Map(), movs = new Map();
    Store.all('productos').forEach(p => {
      const s = {};
      ['manuel', 'papa'].forEach(inv => { const b = (p.inv || {})[inv]; s[inv] = { cant: b ? num(b.cant) : 0, costo: b ? num(b.costo) : 0, desde: b && b.desde || '', tiene: !!b }; });
      stock.set(p.id, s);
    });
    const docs = Store.all('docs').filter(d => d.estado !== 'anulada').sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
    docs.forEach(d => {
      (d.items || []).forEach(it => {
        if (!it.productoId) return;
        const inv = (d.tipo === 'compra' || d.tipo === 'ajuste') ? (it.origen === 'manuel' || it.origen === 'papa' ? it.origen : d.inventario) : it.origen;
        if (inv !== 'manuel' && inv !== 'papa') return;
        const q = num(it.cant);
        let delta = 0;
        if (esVenta(d)) delta = -q; else if (d.tipo === 'compra') delta = q; else if (d.tipo === 'ajuste') delta = q; else return;
        const ml = movs.get(it.productoId) || []; ml.push({ doc: d, item: it, inv, delta, aplicado: !!d.afectaStock }); movs.set(it.productoId, ml);
        if (!d.afectaStock) return;
        const s = stock.get(it.productoId); if (!s) return;
        const slot = s[inv]; slot.tiene = true;
        if (delta > 0 && d.tipo === 'compra' && (!slot.desde || (d.fecha || '') > slot.desde)) {
          const c = num(it.costo); const prev = Math.max(slot.cant, 0);
          slot.costo = prev + delta > 0 ? (prev * slot.costo + delta * c) / (prev + delta) : c;
        }
        slot.cant += delta;
      });
    });
    this.stock = stock; this.movs = movs; this.dirty = false;
  },
  st(pid) { this.build(); return this.stock.get(pid) || { manuel: { cant: 0, costo: 0 }, papa: { cant: 0, costo: 0 } }; },
  totals(d) {
    let sub = 0, costo = 0, sinCosto = false; const porOrigen = {};
    (d.items || []).forEach(it => {
      const q = num(it.cant), p = num(it.precio), imp = q * p; sub += imp;
      const c = it.costo === '' || it.costo == null ? null : num(it.costo);
      const o = it.origen || 'libre';
      const g = porOrigen[o] || (porOrigen[o] = { venta: 0, costo: 0, sinCosto: false });
      g.venta += imp;
      if (c == null) { if (o !== 'libre') { sinCosto = true; g.sinCosto = true; } } else { costo += q * c; g.costo += q * c; }
    });
    const descPct = num(d.descPct), ivaPct = num(d.ivaPct);
    const desc = sub * descPct / 100, base = sub - desc, iva = base * ivaPct / 100, total = base + iva;
    const f = sub ? base / sub : 1;
    Object.values(porOrigen).forEach(g => { g.venta *= f; g.gan = g.venta - g.costo; });
    const pagado = (d.pagos || []).reduce((a, p) => a + num(p.monto), 0);
    const tasa = num(d.tasa);
    return { sub, desc, descPct, base, iva, ivaPct, total, pagado, saldo: round2(total - pagado), costo, gan: base - costo, sinCosto, porOrigen, tasa, bs: tasa ? total * tasa : 0 };
  }
};

/* numeración: OF-AAAAMMDD-001, como en el cotizador */
const nextNumero = (tipo, fecha) => {
  const pref = (CFG().prefijos[tipo] || tipo.toUpperCase()) + '-' + (fecha ? fecha.slice(0, 10).replace(/-/g, '') : ymd()) + '-';
  let max = 0;
  Store.all('docs').forEach(d => { if ((d.numero || '').startsWith(pref)) max = Math.max(max, parseInt(d.numero.slice(pref.length), 10) || 0); });
  return pref + pad(max + 1, 3);
};

const precioWeb = (p) => { if (!(p.precio > 0)) return null; if (p.src !== 's') return p.precio; return Math.ceil(p.precio * (1 - num(CFG().descWeb) / 100) - 1e-9); };
const costoDist = (p) => { const d = CFG().descCostoDist; if (p.src !== 's' || d == null || d === '' || !(p.precio > 0)) return null; return round2(p.precio * (1 - num(d) / 100)); };

/* ---------------- catálogo del distribuidor ---------------- */
const Catalog = {
  items: [], meta: null, loading: false, error: '',
  trim(p, src) {
    return {
      src, m: String(p.modelo || p.sku || '').trim(), n: String(p.nombre || p.modelo || '').trim(), marca: String(p.marca || '').trim(),
      cat: String(p.categoria_principal || '').trim(), precio: typeof p.precio === 'number' ? p.precio : parseFloat(p.precio) || null,
      disp: p.disponible !== false, exist: p.existencias != null ? p.existencias : null, desc: String(p.descripcion || '').trim(), sku: String(p.sku || '').trim(), url: p.url || ''
    };
  },
  apply(docs, origen) {
    let all = [], gen = null;
    docs.forEach(json => {
      const arr = Array.isArray(json) ? json : (json.productos || []);
      const src = (!Array.isArray(json) && (json.fuente || json.total_productos != null)) ? 's' : 'm';
      all = all.concat(arr.map(p => this.trim(p, src)).filter(p => p.m));
      if (json.generado) gen = json.generado;
    });
    const seen = new Set(); this.items = [];
    all.forEach(p => { const k = p.m.toUpperCase() + '|' + p.marca.toUpperCase(); if (!seen.has(k)) { seen.add(k); p._k = normTxt(p.m + ' ' + p.n + ' ' + p.marca + ' ' + p.desc + ' ' + p.sku + ' ' + p.cat); this.items.push(p); } });
    this.meta = { generado: gen || nowISO(), leido: nowISO(), total: this.items.length, origen };
    IDB.set('catalogo', { items: this.items.map(p => { const c = Object.assign({}, p); delete c._k; return c; }), meta: this.meta });
    Bus.emit('catalog');
  },
  async load() {
    const c = await IDB.get('catalogo');
    if (c && c.items) { this.items = c.items.map(p => Object.assign(p, { _k: normTxt(p.m + ' ' + p.n + ' ' + p.marca + ' ' + p.desc + ' ' + p.sku + ' ' + p.cat) })); this.meta = c.meta; Bus.emit('catalog'); }
    const age = this.meta ? Date.now() - new Date(this.meta.leido).getTime() : Infinity;
    if (age > 3 * 3600e3) this.refresh();
  },
  async refresh() {
    if (this.loading) return; this.loading = true; this.error = ''; Bus.emit('catalog');
    try {
      const u = CFG().catalogo; const docs = [];
      for (const url of [u.main, u.manual].filter(Boolean)) { const r = await fetch(url, { cache: 'no-cache' }); if (!r.ok) throw new Error(url + ' → ' + r.status); docs.push(await r.json()); }
      this.apply(docs, 'github');
    } catch (e) { console.warn(e); this.error = 'No se pudo actualizar el catálogo (revisa internet o los links en Ajustes).'; }
    this.loading = false; Bus.emit('catalog');
  },
  search(q, limit = 30) {
    const t = normTxt(q).trim(); if (t.length < 2) return [];
    const words = t.split(/\s+/);
    const out = [];
    for (const p of this.items) { if (words.every(w => p._k.includes(w))) { out.push(p); if (out.length >= limit) break; } }
    const qq = t.replace(/\s+/g, '');
    return out.sort((a, b) => (normTxt(b.m).startsWith(qq) ? 1 : 0) - (normTxt(a.m).startsWith(qq) ? 1 : 0));
  }
};

const clienteKey = (c) => { const r = normRif(c.rif); return r && /\d{5}/.test(r) ? 'R:' + r : 'N:' + normKey(c.nombre); };
const findCliente = (c) => { const k = clienteKey(c); return Store.all('clientes').find(x => clienteKey(x) === k) || null; };
const clienteFromDoc = (d) => {
  const c = d.cliente || {}; if (!c.nombre || !c.nombre.trim()) return null;
  let rec = d.clienteId ? Store.get('clientes', d.clienteId) : null;
  if (!rec) rec = findCliente(c);
  if (!rec) {
    rec = { id: uid('c_'), nombre: c.nombre.trim(), rif: c.rif || '', direccion: c.direccion || '', telefono: '', correo: '', contacto: '', tipo: '', descuento: 0, notas: '', extras: [] };
    (c.extras || []).forEach(x => { const l = normTxt(x.l); if (l.startsWith('tel')) rec.telefono = x.v; else if (l.startsWith('corr')) rec.correo = x.v; else if (l.startsWith('aten') || l.startsWith('cont')) rec.contacto = x.v; else rec.extras.push(x); });
    Store.put('clientes', rec);
  } else {
    let ch = false;
    if (!rec.rif && c.rif) { rec.rif = c.rif; ch = true; }
    if (!rec.direccion && c.direccion) { rec.direccion = c.direccion; ch = true; }
    if (ch) Store.put('clientes', rec);
  }
  return rec;
};
const docClienteSnap = (c) => {
  const extras = [];
  if (c.telefono) extras.push({ l: 'Teléfono', v: c.telefono });
  if (c.correo) extras.push({ l: 'Correo', v: c.correo });
  if (c.contacto) extras.push({ l: 'Atención', v: c.contacto });

  return { nombre: c.nombre || '', rif: c.rif || '', direccion: c.direccion || '', extras };
};
/* Lee un bloque pegado (con o sin etiquetas) y lo reparte en nombre, RIF, dirección y extras */
const parseClienteTexto = (text) => {
  const out = { nombre: '', rif: '', direccion: '', extras: [] };
  const lines = String(text || '').split(/\n|;/).map(s => s.trim()).filter(Boolean);
  const LBL = [[/^(nombre|raz[oó]n\s*social|cliente|empresa)[^:]*:\s*/i, 'nombre'], [/^(rif|c\.?\s*i\.?|c[eé]dula)[^:]*:\s*/i, 'rif'], [/^(direcci[oó]n|domicilio|direc)[^:]*:\s*/i, 'direccion'], [/^(tel[eé]fono|telf?|cel(ular)?|whatsapp)[^:]*:\s*/i, 'Teléfono'], [/^(correo|e-?mail)[^:]*:\s*/i, 'Correo'], [/^(atenci[oó]n|contacto)[^:]*:\s*/i, 'Atención']];
  const rest = [];
  lines.forEach(l => {
    for (const [re, k] of LBL) { if (re.test(l)) { const v = l.replace(re, '').trim(); if (k === 'nombre' || k === 'rif' || k === 'direccion') out[k] = k === 'rif' ? normRif(v) : v; else out.extras.push({ l: k, v }); return; } }
    if (!out.rif && /\b[VEJGPC][ -.]?\d{6,9}/i.test(l) && l.length < 30) { out.rif = normRif(l); return; }
    if (/@/.test(l) && !/\s/.test(l)) { out.extras.push({ l: 'Correo', v: l }); return; }
    if (/^\+?[\d\s()-]{10,}$/.test(l)) { out.extras.push({ l: 'Teléfono', v: l }); return; }
    rest.push(l);
  });
  if (!out.nombre && rest.length) out.nombre = rest.shift();
  if (!out.direccion && rest.length) out.direccion = rest.join(', ');
  return out;
};

/* ---------------- texto enriquecido (*negrita*, saltos) ---------------- */
const richSegments = (txt) => {
  const segs = [];
  String(txt || '').split('\n').forEach((line, i) => {
    if (i) segs.push({ br: true });
    const re = /\*([^*\n]*[^*\s\n][^*\n]*)\*/g; let last = 0, m;
    while ((m = re.exec(line))) { if (m.index > last) segs.push({ t: line.slice(last, m.index), b: false }); segs.push({ t: m[1], b: true }); last = re.lastIndex; }
    if (last < line.length) segs.push({ t: line.slice(last), b: false });
  });
  return segs;
};
const richHtml = (txt) => esc(txt).replace(/\*([^*\n]*[^*\s\n][^*\n]*)\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const plainFirst = (txt) => String(txt || '').replace(/\*/g, '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 2).join(' — ');

  modal({ title, body, foot, wide, onClose }) {

    ov.innerHTML = `<div class="md ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="md-h"><h3>${esc(title)}</h3><button class="btn ghost x" data-x aria-label="Cerrar">✕</button></div><div class="md-b"></div>${foot !== false ? '<div class="md-f"></div>' : ''}</div>`;

    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);

/* =====================================================================
   PDF vectorial (mismo diseño del cotizador: texto nítido, hoja carta
   o una hoja larga a la medida, varias hojas numeradas si es muy largo)
   ===================================================================== */
const PDF = (() => {
  const CP1252_EXTRA = '€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';
  const safe = (s) => String(s == null ? '' : s).replace(/ /g, ' ').replace(/[≥]/g, '>=').replace(/[≤]/g, '<=').replace(/[Ω]/g, 'Ohm')
    .replace(/[‐‑‒]/g, '-').replace(/[′]/g, "'").replace(/[″]/g, '"').replace(/[^\n\x20-\xff]/g, (c) => CP1252_EXTRA.includes(c) ? c : '?');

  let logoCache = { src: null, val: null };
  const logoData = (src) => {
    if (!src) return Promise.resolve(null);
    if (logoCache.src === src) return Promise.resolve(logoCache.val);
    return new Promise((res) => {
      const img = new Image();
      const done = (v) => { logoCache = { src, val: v }; res(v); };
      const t = setTimeout(() => done(null), 4000);
      img.onload = () => {
        clearTimeout(t);
        try {
          const MAXPX = 240, r = Math.min(1, MAXPX / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * r)), h = Math.max(1, Math.round(img.naturalHeight * r));
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, w, h);
          done({ data: c.toDataURL('image/jpeg', 0.88), w, h });
        } catch (e) { done(null); }
      };
      img.onerror = () => { clearTimeout(t); done(null); };
      img.src = src;
    });
  };

  const labelSegs = (label, value) => [{ t: label + ' ', b: true }].concat(richSegments(value));

  async function build(d, { output = 'save' } = {}) {
    const { jsPDF } = window.jspdf;
    const cfg = CFG(), emp = cfg.empresa;
    const logo = await logoData(emp.logo || DEFAULT_LOGO);
    const T = Calc.totals(d);
    const LETTER = 792, MAX_ONE_PAGE = 1400;
    const titulo = (d.titulo || cfg.titulos[d.tipo] || TIPOS[d.tipo] || '').toUpperCase();
    const cli = d.cliente || {};
    const condiciones = (d.condiciones && d.condiciones.length ? d.condiciones : (cfg.condiciones[d.tipo === 'oferta' ? 'oferta' : 'nota'] || [])).filter(s => String(s).trim());
    const firmas = d.firmas != null ? d.firmas : d.tipo !== 'oferta';

    const make = (PH) => {
      const doc = new jsPDF({ unit: 'pt', format: [612, PH], compress: true });
      const PW = 612, ML = 43, MR = 43, MT = 36, MB = 40, CW = PW - ML - MR;
      const INK = [30, 41, 59], RED = [185, 28, 28], G600 = [75, 85, 99], G700 = [55, 65, 81], S500 = [100, 116, 139], S400 = [148, 163, 184], LINE = [226, 232, 240], BG = [248, 250, 252], ROWL = [241, 245, 249];
      const setF = (size, bold, color) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...(color || INK)); };
      const tw = (s, size, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); return doc.getTextWidth(s); };
      const layout = (segs, maxW, size) => {
        const lines = [[]]; let lineW = 0;
        const push = (t, b) => {
          const w = tw(t, size, b), cur = lines[lines.length - 1];
          if (lineW + w > maxW && cur.length && t.trim()) {
            const last = cur[cur.length - 1]; if (last && /\s$/.test(last.t)) last.t = last.t.replace(/\s+$/, '');
            lines.push([]); lineW = 0; t = t.replace(/^\s+/, '');
          }
          if (tw(t, size, b) > maxW) { let chunk = ''; for (const ch of t) { if (tw(chunk + ch, size, b) > maxW && chunk) { lines[lines.length - 1].push({ t: chunk, b }); lines.push([]); chunk = ''; } chunk += ch; } t = chunk; }
          lines[lines.length - 1].push({ t, b }); lineW += tw(t, size, b);
        };
        segs.forEach(s => {
          if (s.br) { lines.push([]); lineW = 0; return; }
          const parts = safe(s.t).split(/(\s+)/).filter(x => x !== ''); const words = [];
          parts.forEach(p => { if (/^\s+$/.test(p) && words.length) words[words.length - 1] += ' '; else if (!/^\s+$/.test(p)) words.push(p); else words.push(' '); });
          words.forEach(w => push(w, s.b));
        });
        while (lines.length > 1 && !lines[lines.length - 1].some(x => x.t.trim())) lines.pop();
        return lines;
      };
      const draw = (lines, x, y, size, lh, color, align = 'left', width = 0) => {
        lines.forEach((ln, i) => {
          const lw = ln.reduce((a, s) => a + tw(s.t, size, s.b), 0);
          let cx = align === 'center' ? x + (width - lw) / 2 : align === 'right' ? x + width - lw : x;
          ln.forEach(s => { setF(size, s.b, color); doc.text(s.t, cx, y + i * lh, { baseline: 'top' }); cx += tw(s.t, size, s.b); });
        });
        return lines.length * lh;
      };
      let y = MT;

      // ---------- Encabezado ----------
      const LOGO = 64, RIGHTW = 150;
      const centerX = ML + LOGO + 12, centerW = CW - LOGO - 12 - RIGHTW - 12;
      let headerH = LOGO, cy = y + 2;
      setF(19.5, true, [17, 24, 39]); doc.text(safe(emp.nombre), centerX + centerW / 2, cy, { baseline: 'top', align: 'center' }); cy += 24;
      [labelSegs('RIF:', emp.rif), richSegments(emp.lema)].forEach(segs => { cy += draw(layout(segs, centerW, 8.25), centerX, cy, 8.25, 11, G600, 'center', centerW) + 2; });
      headerH = Math.max(headerH, cy - y);
      let ry = y + 4;
      setF(13.5, true, RED);
      doc.splitTextToSize(safe(titulo), RIGHTW).forEach(t => { doc.text(t, PW - MR, ry, { baseline: 'top', align: 'right' }); ry += 16; });
      [labelSegs('Control:', d.numero || ''), labelSegs('Fecha:', fmtFecha(d.fecha))].forEach(segs => { ry += draw(layout(segs, RIGHTW, 8.25), PW - MR - RIGHTW, ry, 8.25, 11, G700, 'right', RIGHTW) + 1; });
      headerH = Math.max(headerH, ry - y);
      if (logo) { const r = Math.min(LOGO / logo.w, LOGO / logo.h); const w = logo.w * r, h = logo.h * r; doc.addImage(logo.data, 'JPEG', ML, y + (headerH - h) / 2, w, h); }
      y += headerH + 10;
      doc.setDrawColor(...INK); doc.setLineWidth(3); doc.line(ML, y, PW - MR, y); y += 18;

      // ---------- Cliente ----------
      const csRowsSrc = [labelSegs('Razón Social / Nombre:', cli.nombre || ''), labelSegs('RIF / C.I.:', cli.rif || ''), labelSegs('Dirección:', cli.direccion || '')]
        .concat((cli.extras || []).filter(x => x.v).map(x => labelSegs(x.l + ':', x.v)));
      const csRows = csRowsSrc.map(s => layout(s, CW - 28, 8.25)); const csLH = 13;
      const csH = 14 + 14 + 8 + csRows.reduce((a, l) => a + l.length * csLH, 0) + 8;
      doc.setFillColor(...BG); doc.setDrawColor(...LINE); doc.setLineWidth(0.75); doc.roundedRect(ML, y, CW, csH, 7, 7, 'FD');
      let yy = y + 14; setF(9, true, INK); doc.text(safe((d.tituloCliente || 'Datos del Cliente').toUpperCase()), ML + 14, yy, { baseline: 'top' });
      yy += 14; doc.setDrawColor(...LINE); doc.setLineWidth(1.5); doc.line(ML + 14, yy, PW - MR - 14, yy); yy += 8;
      csRows.forEach(l => { yy += draw(l, ML + 14, yy, 8.25, csLH, INK); });
      y += csH + 18;

      // ---------- Tabla ----------
      const COLS = [
        { key: 'num', title: safe('ÍTEM'), w: 32, align: 'center' }, { key: 'qty', title: 'CANT.', w: 40, align: 'center' },
        { key: 'desc', title: safe('DESCRIPCIÓN TÉCNICA'), w: CW - 32 - 40 - 78 - 84, align: 'left' },
        { key: 'unit', title: 'UNIT. ($)', w: 78, align: 'right' }, { key: 'total', title: 'TOTAL ($)', w: 84, align: 'right' }];
      const PAD = 7.5, FS = 8.25, LH = 12;
      const head = () => { doc.setFillColor(...INK); doc.rect(ML, y, CW, 24, 'F'); let x = ML; COLS.forEach(c => { setF(7.5, true, [255, 255, 255]); const tx = c.align === 'right' ? x + c.w - PAD : c.align === 'center' ? x + c.w / 2 : x + PAD; doc.text(c.title, tx, y + 8.5, { baseline: 'top', align: c.align }); x += c.w; }); y += 24; };
      const newPage = () => { doc.addPage(); y = MT; };
      head();
      const money = (v) => fmtUSD(v).replace('$', '');
      (d.items || []).forEach((it, i) => {
        const descLines = layout(richSegments(it.desc || ''), COLS[2].w - PAD * 2, FS);
        const vals = { num: String(i + 1), qty: safe(fmtQty(num(it.cant))), unit: money(num(it.precio)), total: money(num(it.cant) * num(it.precio)) };
        let rest = descLines.length ? descLines : [[]], first = true;
        while (rest.length) {
          const avail = PH - MB - y - PAD * 2 - 2; const fit = Math.floor(avail / LH);
          if (fit < Math.min(rest.length, 3)) { newPage(); head(); continue; }
          const chunk = rest.slice(0, fit); rest = rest.slice(chunk.length);
          const h = Math.max(chunk.length * LH, LH) + PAD * 2 + 2; let x = ML;
          COLS.forEach(c => {
            if (c.key === 'desc') draw(chunk, x + PAD, y + PAD + 1, FS, LH, INK);
            else if (first) { setF(FS, c.key === 'total', INK); const tx = c.align === 'right' ? x + c.w - PAD : x + c.w / 2; const ty = rest.length ? y + PAD + 1 : y + h / 2 - FS / 2; doc.text(vals[c.key], tx, ty, { baseline: 'top', align: c.align }); }
            x += c.w;
          });
          y += h; first = false; doc.setDrawColor(...ROWL); doc.setLineWidth(0.75); doc.line(ML, y, PW - MR, y);
        }
      });
      y += 18;

      // ---------- Totales ----------
      const rows = [{ label: 'Monto Subtotal', value: fmtUSD(T.sub) }];
      if (T.desc > 0) rows.push({ label: `Descuento (${fmtNum(T.descPct)}%)`, value: '-' + fmtUSD(T.desc), red: true });
      rows.push({ label: T.ivaPct ? `I.V.A. (${fmtNum(T.ivaPct)}%)` : 'I.V.A. (Exento)', value: fmtUSD(T.iva) });
      rows.push({ label: 'TOTAL NETO (USD)', value: fmtUSD(T.total), big: true });
      if (T.tasa) { rows.push({ label: 'Tasa de Cambio (Bs)', value: fmtNum(T.tasa, 2), gap: true }); rows.push({ label: 'TOTAL (Bs)', value: fmtBS(T.bs), medium: true }); }
      const rowH = (r) => r.big ? 26 : r.medium ? 20 : r.gap ? 20 : 14;
      const SW = 250, sH = 22 + rows.reduce((a, r) => a + rowH(r) + (r.big ? 8 : 0), 0);
      if (y + sH > PH - MB) newPage();
      const sx = PW - MR - SW;
      doc.setFillColor(...BG); doc.setDrawColor(...LINE); doc.setLineWidth(0.75); doc.roundedRect(sx, y, SW, sH, 7, 7, 'FD');
      let sy = y + 11;
      rows.forEach(r => {
        if (r.big) { sy += 4; doc.setDrawColor(...INK); doc.setLineWidth(1.5); doc.line(sx + 11, sy, sx + SW - 11, sy); sy += 6; }
        if (r.gap) sy += 6;
        const size = r.big ? 13 : r.medium ? 11 : 9, color = r.red ? [239, 68, 68] : (r.medium ? [51, 65, 85] : INK);
        setF(size, r.big || r.medium, color);
        const v = safe(r.value), vw = tw(v, size, r.big || r.medium);
        doc.text(doc.splitTextToSize(safe(r.label), SW - 22 - vw - 8)[0], sx + 11, sy, { baseline: 'top' });
        doc.text(v, sx + SW - 11, sy, { baseline: 'top', align: 'right' });
        sy += r.gap ? rowH(r) - 6 : rowH(r);
      });
      y += sH + 10;

      // ---------- Firmas ----------
      if (firmas) {
        if (y + 70 > PH - MB) newPage();
        y += 28; const bw = (CW - 38) / 2;
        [[emp.firmaEmpresa, emp.firmaEmpresaSub], [emp.firmaCliente, emp.firmaClienteSub]].forEach((b, i) => {
          const bx = ML + i * (bw + 38);
          doc.setDrawColor(...INK); doc.setLineWidth(1.5); doc.line(bx, y, bx + bw, y);
          setF(8.25, true, [17, 24, 39]); doc.text(safe(b[0]), bx + bw / 2, y + 8, { baseline: 'top', align: 'center' });
          setF(7.5, false, S500); doc.text(safe(b[1]), bx + bw / 2, y + 20, { baseline: 'top', align: 'center' });
        });
        y += 40;
      }

      // ---------- Condiciones y contacto ----------
      const blocks = condiciones.map(p => layout(richSegments(p), CW, 7.5));
      const notesH = 30 + blocks.reduce((a, l) => a + l.length * 11 + 2, 0) + 30;
      if (blocks.length) {
        if (y + Math.min(notesH, 140) > PH - MB) newPage();
        y += 12; doc.setDrawColor(...LINE); doc.setLineWidth(0.75); doc.line(ML, y, PW - MR, y); y += 12;
        doc.setFillColor(...RED); doc.rect(ML, y - 1, 3, 11, 'F');
        setF(8.25, true, INK); doc.text(safe((d.tituloCondiciones || 'Términos, Condiciones y Garantía').toUpperCase()), ML + 8, y, { baseline: 'top' }); y += 16;
        blocks.forEach(l => { if (y + l.length * 11 > PH - MB) newPage(); y += draw(l, ML, y, 7.5, 11, [51, 65, 85]) + 2; });
      }
      y += 12; setF(7.5, false, S400);
      const autoUrl = (t) => /@/.test(t) ? 'mailto:' + t : 'https://' + t.replace(/^https?:\/\//i, '');
      doc.splitTextToSize(safe(emp.contacto || ''), CW).forEach(t => {
        if (y > PH - MB) newPage();
        doc.text(t, PW / 2, y, { baseline: 'top', align: 'center' });
        const x0 = PW / 2 - doc.getTextWidth(t) / 2;
        (t.match(/[\w.+-]+@[\w-]+\.[\w.]+|(?:https?:\/\/)?(?:www\.)?[\w-]+\.(?:com|net|org|ve|me|ee)(?:\/[\w\-./?=&#%]*)?/gi) || []).forEach(m => {
          const i = t.indexOf(m); if (i < 0) return; doc.link(x0 + doc.getTextWidth(t.slice(0, i)), y - 1, doc.getTextWidth(m), 10, { url: autoUrl(m) });
        });
        y += 10;
      });
      const n = doc.getNumberOfPages();
      if (n > 1) for (let i = 1; i <= n; i++) { doc.setPage(i); setF(7, false, S400); doc.text(`Página ${i} de ${n}`, PW - MR, PH - 22, { align: 'right' }); }
      return { doc, end: y + MB, pages: n };
    };

    const need = Math.ceil(make(100000).end);
    let out;
    if (need <= MAX_ONE_PAGE) { let H = Math.max(LETTER, need); out = make(H); for (let i = 0; out.pages > 1 && i < 10; i++) { H += 60; out = make(H); } }
    else out = make(LETTER);
    let name = (d.archivo || defaultFileName(d)).trim().toUpperCase().replace(/[\\/:*?"<>|]/g, '');
    if (!name.endsWith('.PDF')) name += '.PDF';
    if (output === 'save') { out.doc.save(name); return name; }
    if (output === 'blob') return { blob: out.doc.output('blob'), name };
    return out.doc;
  }
  const defaultFileName = (d) => {
    const pref = (CFG().titulos[d.tipo] || TIPOS[d.tipo] || '').toUpperCase();
    let c = String((d.cliente && d.cliente.nombre) || '').toUpperCase().split(',')[0].normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Z0-9\s-]/g, '').trim();
    return `${pref} ${c || 'CLIENTE'}`;
  };
  return { build, defaultFileName };
})();

const ESTADOS_OFERTA = { abierta: ['Abierta', 'info'], aceptada: ['Aceptada', 'ok'], rechazada: ['Rechazada', 'bad'] };
const PEDIDO = { 'por pedir': ['Por pedir', 'warn'], pedido: ['Pedido', 'info'], entregado: ['Entregado', 'ok'] };
const ownTag = (o) => `<span class="own ${esc(o)}">${esc(origenNombre(o))}</span>`;
const docParty = (d) => d.tipo === 'compra' ? ((d.proveedor && d.proveedor.nombre) || '—') : ((d.cliente && d.cliente.nombre) || '—');
const docItemsTxt = (d) => { const its = d.items || []; if (!its.length) return '<span class="muted">Sin productos</span>'; const f = its[0]; const t = f.codigo || plainFirst(f.desc); return `<span class="code">${esc(t.slice(0, 40))}</span>${its.length > 1 ? ` <span class="muted">+${its.length - 1}</span>` : ''}`; };
const docOrigins = (d) => Array.from(new Set((d.items || []).map(i => d.tipo === 'compra' || d.tipo === 'ajuste' ? d.inventario : i.origen).filter(Boolean)));
const estadoPill = (d) => {
  if (d.estado === 'anulada') return '<span class="pill bad">Anulada</span>';
  if (d.tipo === 'oferta') { const e = ESTADOS_OFERTA[d.estado || 'abierta'] || ESTADOS_OFERTA.abierta; return `<span class="pill ${e[1]}">${e[0]}</span>`; }
  if (d.tipo === 'ajuste') return '<span class="pill">Ajuste</span>';
  const T = Calc.totals(d);
  if (T.total <= 0.005) return '';
  if (T.saldo <= 0.005) return '<span class="pill ok">Pagada</span>';
  if (T.pagado > 0) return `<span class="pill warn">Debe ${fmtUSD(T.saldo)}</span>`;
  return `<span class="pill warn">Por cobrar</span>`;
};
const periodoOpts = () => {
  const d = new Date(); const opts = [['todo', 'Todo'], ['mes', 'Este mes'], ['mesant', 'Mes anterior'], ['30', 'Últimos 30 días'], ['anio', 'Este año'], ['anioant', 'Año anterior']];
  return opts;
};
const enPeriodo = (fecha, p) => {
  if (!p || p === 'todo') return true;
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  const f = String(fecha || '').slice(0, 10);
  const iso = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
  if (p === 'mes') return f >= iso(new Date(y, m, 1));
  if (p === 'mesant') return f >= iso(new Date(y, m - 1, 1)) && f < iso(new Date(y, m, 1));
  if (p === '30') return f >= iso(new Date(Date.now() - 30 * 864e5));
  if (p === 'anio') return f >= `${y}-01-01`;
  if (p === 'anioant') return f >= `${y - 1}-01-01` && f < `${y}-01-01`;
  return true;
};

  const inp = $('input', host), box = $('.results', host);

    const q = inp.value.trim();

    const own = Store.all('productos').filter(p => p.activo !== false || true).filter(p => { const k = normTxt(p.codigo + ' ' + p.nombre + ' ' + p.descripcion + ' ' + (p.marca || '') + ' ' + (p.categoria || '')); return words.every(w => k.includes(w)); });

    const cat = Catalog.search(q, 25);
    list = own.slice(0, 25).map(p => ({ k: 'p', p })).concat(cat.map(c => ({ k: 'c', c })));
    sel = list.length ? 0 : -1;
    let html = '';
    if (own.length) {
      html += `<div class="grp">Inventario propio (${own.length})</div>`;
      html += own.slice(0, 25).map((p, i) => { const s = Calc.st(p.id); return `<button type="button" class="res" data-i="${i}"><div class="t"><span class="code">${esc(p.codigo)}</span><div class="clip">${esc([p.nombre, p.descripcion].filter(Boolean).join(' — '))}</div></div><div class="p">${fmtUSD(num(p.precio))}</div><div class="s"><span class="own manuel">${esc(origenNombre('manuel'))}: ${fmtQty(s.manuel.cant)}</span><span class="own papa">${esc(origenNombre('papa'))}: ${fmtQty(s.papa.cant)}</span></div></button>`; }).join('');
    }
    if (cat.length) {
      const off = Math.min(own.length, 25);
      html += `<div class="grp">Catálogo del distribuidor (${cat.length}${cat.length >= 25 ? '+' : ''})</div>`;
      html += cat.map((c, j) => { const pw = precioWeb(c), cd = costoDist(c); return `<button type="button" class="res" data-i="${off + j}"><div class="t"><span class="code">${esc(c.m)}</span> <span class="muted small">${esc(c.marca)}</span><div class="clip">${esc([c.n !== c.m ? c.n : '', c.desc].filter(Boolean).join(' — '))}</div></div><div class="p">${pw != null ? fmtUSD(pw) : '—'}</div><div class="s"><span class="own dist">Distribuidor${c.exist != null ? ': ' + esc(c.exist) : ''}</span>${c.disp === false ? '<span class="pill bad">Sin stock</span>' : ''}${c.precio ? `<span class="muted">lista ${fmtUSD(c.precio)}${cd != null ? ' · costo ' + fmtUSD(cd) : ''}</span>` : ''}</div></button>`; }).join('');
    }
    if (!html) html = `<div class="empty small">Sin resultados. ${Catalog.items.length ? '' : 'El catálogo del distribuidor aún no se ha cargado.'}</div>`;
    box.innerHTML = html; box.classList.remove('hide'); mark();
  };
  const mark = () => $$('.res', box).forEach(b => b.classList.toggle('on', +b.dataset.i === sel));
  const pick = (i) => { const x = list[i]; if (!x) return; onPick(x); inp.value = ''; box.classList.add('hide'); inp.focus(); };
  inp.addEventListener('input', debounce(render, 120));
