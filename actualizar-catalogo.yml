name: Actualizar catálogo diario

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Correr el scraper (catálogo completo)
        run: node scraper.js

      - name: Guardar productos.json y categorias.json si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add productos.json categorias.json
          git diff --staged --quiet || git commit -m "Actualización automática del catálogo $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Por si alguien (tú, u otra corrida) subió cambios mientras el
          # scraper trabajaba: traemos lo nuevo y reacomodamos nuestro
          # commit encima, en vez de pisarlo o que el push sea rechazado.
          git pull --rebase origin main
          git push
